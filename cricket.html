const REST_DAY_SUGGESTIONS = ["Light mobility or stretching session.", "Prioritise sleep and hydration today."];

function matchedFocuses(sport, focusText) {
  const library = DRILL_LIBRARY[sport];
  if (!library) return [];
  const defaultOrder = Object.keys(library);
  if (!focusText) return defaultOrder;
  const text = focusText.toLowerCase();
  const map = FOCUS_MAPS[sport] || [];
  const hits = map.filter((m) => m.keys.some((k) => text.includes(k))).map((m) => m.focus);
  const uniqueHits = hits.filter((h, i) => hits.indexOf(h) === i && library[h]);
  return uniqueHits.length > 0 ? uniqueHits : defaultOrder;
}

// Training-only: "did you work on one of your goals?" Picking a goal offers
// drill options matched to that goal's wording (via the same focus map the
// Weekly Plan uses), plus a free-text box for anything else. Returns a plain
// object via onChange so it can be saved straight onto the log.
function GoalWorkCard({ sport, goals, value, onChange }) {
  const [area, setArea] = useState(null);
  const open = goals.filter((g) => !g.completed);
  if (open.length === 0) return null;
  const goal = open.find((g) => g.id === value.goalId) || null;
  const focuses = goal ? matchedFocuses(sport, goal.text) : [];
  const library = DRILL_LIBRARY[sport] || {};
  const activeArea = area && focuses.includes(area) ? area : focuses[0] || null;

  function togglePicked(item) {
    const picked = value.picked.includes(item) ? value.picked.filter((p) => p !== item) : [...value.picked, item];
    onChange({ ...value, picked });
  }

  return (
    <div className="card">
      <h2>Worked on a Goal?</h2>
      <label className="field">
        <span>Which goal did this session work on? (optional)</span>
        <select
          value={value.goalId || ""}
          onChange={(e) => {
            const id = e.target.value ? Number(e.target.value) : null;
            const g = open.find((x) => x.id === id);
            onChange({ goalId: id, goalText: g ? g.text : "", picked: [], notes: value.notes });
            setArea(null);
          }}
        >
          <option value="">Not this time</option>
          {open.map((g) => (
            <option key={g.id} value={g.id}>
              {g.text}
            </option>
          ))}
        </select>
      </label>

      {goal && (
        <>
          <p className="hint" style={{ marginTop: 12 }}>Tap what you worked on:</p>
          {focuses.length > 1 && (
            <div className="entry-filter-strip" style={{ marginBottom: 8 }}>
              {focuses.map((f) => (
                <button key={f} type="button" className={activeArea === f ? "active" : ""} onClick={() => setArea(f)}>
                  {f}
                </button>
              ))}
            </div>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {(library[activeArea] || []).map((d) => {
              const on = value.picked.includes(d);
              return (
                <button
                  key={d}
                  type="button"
                  onClick={() => togglePicked(d)}
                  style={{
                    textAlign: "left",
                    background: on ? "#1B3324" : "transparent",
                    border: "1px solid " + (on ? "#5FBF7F" : "#2A4433"),
                    color: "#EFE9DD",
                    borderRadius: 10,
                    padding: "9px 11px",
                    fontSize: 13,
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  {on ? "✓ " : ""}
                  {d}
                </button>
              );
            })}
          </div>
          <label className="field" style={{ marginTop: 12 }}>
            <span>Anything else you worked on?</span>
            <textarea
              rows={3}
              value={value.notes}
              onChange={(e) => onChange({ ...value, notes: e.target.value })}
              placeholder="In your own words…"
              style={{ width: "100%", background: "#0F1F17", border: "1px solid #2A4433", color: "#F5EFE2", borderRadius: 10, padding: 8, fontFamily: "inherit", fontSize: 13 }}
            />
          </label>
        </>
      )}
    </div>
  );
}

function emptyGoalWork() {
  return { goalId: null, goalText: "", picked: [], notes: "" };
}

function cleanFocusLabel(text) {
  let t = text.trim();
  const fillers = [
    /^i want to work on\s+/i,
    /^i want to improve\s+/i,
    /^i'd like to work on\s+/i,
    /^i'd like to improve\s+/i,
    /^i need to work on\s+/i,
    /^i need to improve\s+/i,
    /^working on\s+/i,
    /^work on\s+/i,
    /^improving\s+/i,
    /^improve\s+/i,
    /^my\s+/i,
  ];
  let changed = true;
  while (changed) {
    changed = false;
    for (const re of fillers) {
      if (re.test(t)) {
        t = t.replace(re, "");
        changed = true;
      }
    }
  }
  t = t.trim();
  return t.length > 0 ? t.charAt(0).toUpperCase() + t.slice(1) : text.trim();
}

function splitFocusItems(focusText) {
  if (!focusText) return [];
  return focusText
    .split(/,|;|&|\band\b/i)
    .map((s) => cleanFocusLabel(s))
    .filter((s) => s.length > 0);
}

function findCategoryForItem(sport, itemText) {
  const map = FOCUS_MAPS[sport] || [];
  const text = itemText.toLowerCase();
  const hit = map.find((m) => m.keys.some((k) => text.includes(k)));
  return hit ? hit.focus : null;
}

function drillsForItem(sport, itemText) {
  const category = findCategoryForItem(sport, itemText);
  if (category && DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][category]) {
    return DRILL_LIBRARY[sport][category];
  }
  // Nothing in the library matched — still give a genuinely usable session
  // structure for whatever they asked for, rather than a vague one-liner.
  return [
    `Warm-up (10 mins): slow, technical reps of ${itemText} — focus purely on getting the movement right.`,
    `Main block (20 mins): ${itemText} in short, specific sets, adding speed or a defender as it gets cleaner.`,
    `Finish (10 mins): ${itemText} under game-like pressure or fatigue, then note one thing to improve next time.`,
  ];
}

function labelAndDrillsForFocus(sport, focus) {
  if (!focus) return { label: null, drills: [] };
  if (DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][focus]) {
    return { label: focus, drills: DRILL_LIBRARY[sport][focus] };
  }
  const category = findCategoryForItem(sport, focus);
  if (category && DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][category]) {
    return { label: category, drills: DRILL_LIBRARY[sport][category] };
  }
  return { label: focus, drills: drillsForItem(sport, focus) };
}

function attributeFocusItems(selectedActivities, focusText) {
  const items = splitFocusItems(focusText);
  const bySport = {};
  selectedActivities.forEach((a) => {
    bySport[a] = [];
  });
  if (items.length === 0) return bySport;

  const realSports = selectedActivities.filter((a) => a !== "Gym");
  if (realSports.length === 1) {
    // Only one real sport picked — nothing ambiguous about who the note is for.
    bySport[realSports[0]] = items;
    return bySport;
  }

  const unmatched = [];
  items.forEach((item) => {
    const text = item.toLowerCase();
    let matchedAny = false;
    realSports.forEach((a) => {
      const map = FOCUS_MAPS[a] || [];
      if (map.some((m) => m.keys.some((k) => text.includes(k)))) {
        bySport[a].push(item);
        matchedAny = true;
      }
    });
    if (!matchedAny) unmatched.push(item);
  });

  // Nothing typed should get silently dropped — spread anything unmatched across the sports picked.
  if (unmatched.length > 0 && realSports.length > 0) {
    unmatched.forEach((item, i) => {
      bySport[realSports[i % realSports.length]].push(item);
    });
  }

  return bySport;
}

function buildWeeklyPlan(selectedDays, selectedActivities, focusText, position) {
  if (selectedDays.length === 0 || selectedActivities.length === 0) return [];

  const wantsRest = selectedDays.length >= 6 ? 1 : 0;
  const restIndexes = new Set();
  if (wantsRest > 0) {
    for (let r = 1; r <= wantsRest; r++) {
      let idx = Math.floor((r * selectedDays.length) / (wantsRest + 1));
      idx = Math.min(selectedDays.length - 1, Math.max(0, idx));
      restIndexes.add(idx);
    }
  }

  const trainingSlots = selectedDays.length - restIndexes.size;
  const maxRepeats = selectedActivities.length === 1 ? Math.max(1, trainingSlots) : 2;

  let queue = [];
  let round = 0;
  while (queue.length < trainingSlots && round < maxRepeats) {
    selectedActivities.forEach((a) => {
      if (queue.length < trainingSlots) queue.push(a);
    });
    round++;
  }
  while (queue.length < trainingSlots) queue.push(selectedActivities[selectedActivities.length - 1]);

  for (let i = 1; i < queue.length; i++) {
    if (queue[i] === queue[i - 1]) {
      const swapIdx = queue.findIndex((a, idx) => idx > i && a !== queue[i]);
      if (swapIdx !== -1) {
        const tmp = queue[i];
        queue[i] = queue[swapIdx];
        queue[swapIdx] = tmp;
      }
    }
  }

  const rawItemsBySport = attributeFocusItems(selectedActivities, focusText);
  const focusCounters = {};
  const focusListsBySport = {};
  selectedActivities.forEach((a) => {
    focusCounters[a] = 0;
    if (a === "Gym") {
      focusListsBySport[a] = GYM_SPLITS;
    } else {
      const typed = rawItemsBySport[a] && rawItemsBySport[a].length > 0 ? rawItemsBySport[a] : [];
      const forPosition = a === ACTIVITY_OPTIONS[0] && position ? positionPlanFocuses(position) : [];
      const combined = [...typed, ...forPosition.filter((f) => !typed.includes(f))];
      focusListsBySport[a] = combined.length > 0 ? combined : matchedFocuses(a, null);
    }
  });

  let qi = 0;
  const plan = [];
  for (let d = 0; d < selectedDays.length; d++) {
    if (restIndexes.has(d)) {
      plan.push({ day: selectedDays[d], activity: "Rest & Recovery", focus: null, drills: REST_DAY_SUGGESTIONS });
    } else {
      const activity = queue[qi];
      qi++;
      if (activity === "Gym") {
        const posGym = position && focusCounters[activity] === 0 ? positionGymSession(position) : null;
        if (posGym) {
          focusCounters[activity]++;
          plan.push({ day: selectedDays[d], activity, focus: posGym.focus, drills: posGym.drills });
          continue;
        }
        const split = GYM_SPLITS[(focusCounters[activity] - (position && positionGymSession(position) ? 1 : 0)) % GYM_SPLITS.length];
        focusCounters[activity]++;
        plan.push({ day: selectedDays[d], activity, focus: split, drills: GYM_SPLIT_DRILLS[split] || [] });
      } else {
        const focusList = focusListsBySport[activity] || [];
        const rawFocus = focusList.length > 0 ? focusList[focusCounters[activity] % focusList.length] : null;
        focusCounters[activity]++;
        const { label, drills } = labelAndDrillsForFocus(activity, rawFocus);
        plan.push({ day: selectedDays[d], activity, focus: label, drills });
      }
    }
  }
  return plan;
}

// The second Weekly Plan mode: rather than picking free days from scratch,
// the person marks which days are already taken up by their sport, and this
// fills in the rest of the week around that — alternating Gym sessions with
// rest days on whatever's left over, so nothing gets double-booked.
function buildWeekAroundCommitments(busyDays, position) {
  const busyActivity = ACTIVITY_OPTIONS[0];
  const gymFocusList = GYM_SPLITS;
  let gymCounter = 0;
  let freeIndex = 0;
  return DAYS_OF_WEEK.map((day) => {
    if (busyDays.includes(day)) {
      return { day, activity: busyActivity, focus: "Already on your calendar", drills: [], alreadyBusy: true };
    }
    const isRestDay = freeIndex % 3 === 2;
    freeIndex++;
    if (isRestDay) {
      return { day, activity: "Rest & Recovery", focus: null, drills: REST_DAY_SUGGESTIONS };
    }
    const posGym = position && gymCounter === 0 ? positionGymSession(position) : null;
    if (posGym) {
      gymCounter++;
      return { day, activity: "Gym", focus: posGym.focus, drills: posGym.drills };
    }
    const split = gymFocusList[(gymCounter - (position && positionGymSession(position) ? 1 : 0)) % gymFocusList.length];
    gymCounter++;
    return { day, activity: "Gym", focus: split, drills: GYM_SPLIT_DRILLS[split] || [] };
  });
}

// Coach view: every player account on this device, filterable by team.
// Read-only — it pulls each player's own cricket logs straight from their
// storage space and runs the same analysis the player sees.
function CoachDashboard({ onExit, profile, gymView }) {
  const [copiedCode, setCopiedCode] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [teams, setTeams] = useState([]);
  const [newTeamName, setNewTeamName] = useState("");
  const [teamError, setTeamError] = useState("");
  const [teamFilter, setTeamFilter] = useState("all");
  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [playerData, setPlayerData] = useState(null); // { byPosition: {pos: entries[]}, matches: [] }
  const [selectedPos, setSelectedPos] = useState(null);
  const [playerTab, setPlayerTab] = useState("stats");
  const [overview, setOverview] = useState({}); // username -> { logs, lastDate }
  const [loaded, setLoaded] = useState(false);

  const allPositions = CRICKET_POSITIONS.flatMap((p) => CRICKET_SUB_POSITIONS[p] || [p]);

  async function loadPlayer(username) {
    if (CLOUD.enabled) return cloudLoadPlayer(username);
    const prefix = cricketUserPrefix(username);
    const byPosition = {};
    for (const pos of allPositions) {
      try {
        const res = await safeGet(`${prefix}cricket:${slugify(pos)}`);
        const list = (res ? JSON.parse(res.value) : []).filter((e) => e.sharedWithTeam !== false);
        if (list.length) byPosition[pos] = list;
      } catch (e) {
        // nothing logged at this position
      }
    }
    let matches = [];
    try {
      const m = await safeGet(`${prefix}cricket:matches`);
      if (m) matches = JSON.parse(m.value);
    } catch (e) {
      // no matches
    }
    const extras = {};
    for (const kind of ["plan", "nutrition", "recovery", "gym", "trophies"]) {
      try {
        const r = await safeGet(`${prefix}shared:${kind}`);
        if (r) extras[kind] = JSON.parse(r.value);
      } catch (e) {
        // nothing shared
      }
    }
    return { byPosition, matches, extras };
  }

  useEffect(() => {
    async function load() {
      let list = [];
      const loadedTeams = await loadCricketTeams();
      if (CLOUD.enabled) {
        list = await cloudTeamAccounts();
      } else {
        try {
          const res = await safeGet("accounts:list");
          list = res ? JSON.parse(res.value) : [];
        } catch (e) {
          list = [];
        }
      }
      setAccounts(list);
      setTeams(loadedTeams);
      const ov = {};
      const loaded = await Promise.all(list.map((a) => loadPlayer(a.username).catch(() => ({ byPosition: {} }))));
      list.forEach((a, i) => {
        const all = Object.values(loaded[i].byPosition).flat();
        const lastDate = all.map((e) => e.date).sort().pop() || null;
        const topPos = Object.keys(loaded[i].byPosition).sort((x, y) => loaded[i].byPosition[y].length - loaded[i].byPosition[x].length)[0] || "";
        ov[a.username] = { logs: all.length, lastDate, topPos, gym: (loaded[i].extras || {}).gym || [] };
      });
      setOverview(ov);
      setLoaded(true);
    }
    load();
  }, []);

  async function openPlayer(a) {
    setSelectedPlayer(a);
    setPlayerData(null);
    setSelectedPos(null);
    setPlayerTab(gymView ? "gym" : "stats");
    const d = await loadPlayer(a.username);
    setPlayerData(d);
    const positions = Object.keys(d.byPosition);
    setSelectedPos(positions.includes(a.mainPosition) ? a.mainPosition : positions[0] || null);
  }

  const me = String((profile && profile.username) || "").toLowerCase();
  const lower = (x) => String(x).toLowerCase();
  const myTeams = teams.filter((t) => lower(t.coach) === me);
  const teamOfPlayer = (username) => myTeams.find((t) => (t.members || []).some((m) => lower(m) === lower(username)));
  // Coaches only see players who've been accepted into one of their teams.
  const visible = accounts.filter((a) => {
    const t = teamOfPlayer(a.username);
    if (!t) return false;
    return teamFilter === "all" || String(t.id) === String(teamFilter);
  });

  async function updateTeams(change) {
    const latest = await loadCricketTeams();
    const next = change(latest);
    await saveCricketTeams(next);
    setTeams(next);
    if (CLOUD.enabled) {
      // newly accepted players appear straight away
      const list = await cloudTeamAccounts();
      setAccounts(list.map((a) => ({ ...a, username: a.username || a.uid })));
    }
  }

  function createTeam() {
    const name = newTeamName.trim();
    if (!name) return;
    if (isOffensive(name)) {
      setTeamError(OFFENSIVE_MSG);
      return;
    }
    setTeamError("");
    const id = `${Date.now()}${Math.floor(Math.random() * 1000)}`;
    updateTeams((list) => [...list, { id, name, code: newTeamCode(), coach: profile.username, coachUid: CLOUD.uid || null, members: [], pending: [], declined: [], verified: false }]);
    setNewTeamName("");
  }

  function acceptRequest(teamId, username) {
    updateTeams((list) =>
      list.map((t) =>
        t.id === teamId
          ? {
              ...t,
              pending: (t.pending || []).filter((p) => p !== username),
              declined: (t.declined || []).filter((p) => p !== username),
              members: [...(t.members || []), username],
            }
          : { ...t, pending: (t.pending || []).filter((p) => p !== username) }
      )
    );
  }

  function declineRequest(teamId, username) {
    updateTeams((list) =>
      list.map((t) =>
        t.id === teamId
          ? { ...t, pending: (t.pending || []).filter((p) => p !== username), declined: [...(t.declined || []), username] }
          : t
      )
    );
  }

  function removeMember(teamId, username) {
    if (!window.confirm(`Remove ${username} from the team? They'll need to ask to join again.`)) return;
    updateTeams((list) => list.map((t) => (t.id === teamId ? { ...t, members: (t.members || []).filter((m) => m !== username) } : t)));
  }

  const shell = (children) => (
    <div className="app">
      <header className="header">
        <div className="header-inner">
          {selectedPlayer ? (
            <button className="back-btn" onClick={() => { setSelectedPlayer(null); setPlayerData(null); }}>
              ← Players
            </button>
          ) : (
            <button className="back-btn" onClick={onExit}>
              ← Sports
            </button>
          )}
          <div className="crest">CO</div>
          <div>
            <h1>{selectedPlayer ? selectedPlayer.username : gymView ? "Team Gym" : "Coach Dashboard"}</h1>
            <p className="tagline">
              {selectedPlayer
                ? [(teamOfPlayer(selectedPlayer.username) || {}).name, selectedPlayer.mainPosition].filter(Boolean).join(" · ") || "Cricket"
                : gymView ? "Your players' shared workouts." : "Your players' stats, plans, food, recovery, gym and trophies."}
            </p>
          </div>
        </div>
      </header>
      <main className="main">{children}</main>
    </div>
  );

  if (!loaded) return shell(<LoadingSkeleton label="Loading players" />);
  if (!selectedPlayer && gymView) {
    return shell(
      <section>
        <div className="card">
          <h2>🏋️ Team Gym</h2>
          <p className="hint">What your players have shared from the gym. Tap a player to see every workout and their best lifts. You can't log gym sessions as a coach.</p>
          {visible.length === 0 && <EmptyState icon="👥" text="No players in your teams yet. Give players your team's join code — once you accept them, their shared workouts show here." />}
          <div className="entry-list">
            {visible.map((a) => {
              const g = (overview[a.username] || {}).gym || [];
              const last = g.map((w) => w.date).sort().pop();
              return (
                <div className="entry-row" key={a.username} onClick={() => openPlayer(a)} style={{ cursor: "pointer" }}>
                  <span>
                    <strong style={{ color: "#F5EFE2" }}>{a.username}</strong>
                    {teamOfPlayer(a.username) ? <span style={{ color: "#9FB3A4" }}> · {teamOfPlayer(a.username).name}</span> : null}
                  </span>
                  <span className="hint" style={{ margin: 0 }}>
                    {g.length ? `${g.length} workout${g.length === 1 ? "" : "s"} · last ${last}` : "Nothing shared yet"} ›
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </section>
    );
  }
  if (!selectedPlayer) {
    return shell(
      <section>
        <div className="card">
          <h2>Your Teams</h2>
          {myTeams.length === 0 && (
            <p className="hint">Create your team and you'll get a join code. Give it to your players (at training or in your team chat) — they tap "With a team", enter it, and you accept them here.</p>
          )}
          {myTeams.map((t) => (
            <div key={t.id} style={{ borderTop: "1px solid #2A4433", padding: "12px 0" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <strong style={{ color: "#F5EFE2", fontSize: 16 }}>
                  {t.name} {t.verified && <span style={{ fontSize: 12, color: "#8FD9A0" }}>✔ Verified</span>}
                </strong>
                <span className="hint" style={{ margin: 0 }}>
                  {(t.members || []).length} player{(t.members || []).length === 1 ? "" : "s"}
                </span>
              </div>
              {t.code && (
                <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 10, background: "#0F1F17", border: "1px dashed #3A5C46", borderRadius: 10, padding: "8px 12px", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, color: "#9FB3A4" }}>Join code</span>
                  <strong style={{ fontSize: 20, letterSpacing: 2, color: "#F5EFE2", fontFamily: "ui-monospace, Menlo, monospace" }}>{fmtTeamCode(t.code)}</strong>
                  <button
                    type="button"
                    onClick={() => {
                      const done = () => setCopiedCode(t.code);
                      if (navigator.clipboard) navigator.clipboard.writeText(fmtTeamCode(t.code)).then(done, done);
                      else done();
                    }}
                    style={{ marginLeft: "auto", fontSize: 12.5 }}
                  >
                    {copiedCode === t.code ? "Copied ✓" : "Copy"}
                  </button>
                </div>
              )}
              {(t.pending || []).length > 0 && (
                <div style={{ marginTop: 10, background: "#1B2A20", border: "1px solid #3B82F6", borderRadius: 10, padding: 10 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#E0B34A", marginBottom: 6 }}>
                    {(t.pending || []).length} request{(t.pending || []).length === 1 ? "" : "s"} to join
                  </div>
                  {(t.pending || []).map((u) => (
                    <div key={u} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 0" }}>
                      <span style={{ color: "#EFE9DD" }}>{u}</span>
                      <span style={{ display: "flex", gap: 6 }}>
                        <button type="button" className="save-btn" style={{ padding: "6px 12px", fontSize: 13, margin: 0 }} onClick={() => acceptRequest(t.id, u)}>
                          Accept
                        </button>
                        <button
                          type="button"
                          onClick={() => declineRequest(t.id, u)}
                          style={{ background: "transparent", border: "1px solid #3A5C46", color: "#EFE9DD", borderRadius: 10, padding: "6px 12px", fontSize: 13, cursor: "pointer" }}
                        >
                          Decline
                        </button>
                      </span>
                    </div>
                  ))}
                </div>
              )}
              {(t.members || []).length > 0 && (
                <div style={{ marginTop: 8, fontSize: 12.5, color: "#9FB3A4" }}>
                  {(t.members || []).map((m) => (
                    <span key={m} style={{ display: "inline-flex", alignItems: "center", gap: 4, marginRight: 10 }}>
                      {m}
                      <button
                        type="button"
                        aria-label={`Remove ${m}`}
                        onClick={() => removeMember(t.id, m)}
                        style={{ background: "none", border: "none", color: "#7C9284", cursor: "pointer", fontSize: 12, padding: 0 }}
                      >
                        ✕
                      </button>
                    </span>
                  ))}
                </div>
              )}
            </div>
          ))}
          <div className="new-match-row" style={{ marginTop: 12 }}>
            <input type="text" placeholder={`Team name, ${CRICKET_UI.teamExample}`} value={newTeamName} onChange={(e) => setNewTeamName(e.target.value)} />
            <button type="button" onClick={createTeam}>
              Create Team
            </button>
          </div>
          {teamError && <p className="hint" style={{ color: "#F87171" }}>{teamError}</p>}
        </div>

        <div className="card">
          <h2>Players</h2>
          {myTeams.length > 1 && (
            <label className="field" style={{ maxWidth: 260, marginBottom: 12 }}>
              <span>Team</span>
              <select value={teamFilter} onChange={(e) => setTeamFilter(e.target.value)}>
                <option value="all">All my teams</option>
                {myTeams.map((t) => (
                  <option key={t.id} value={t.id}>
                    {t.name}
                  </option>
                ))}
              </select>
            </label>
          )}
          {visible.length === 0 && (
            <EmptyState icon="👥" text={'No players yet. Share your join code above — once you accept a player, they appear here (you only see logs they mark "My team").'} />
          )}
          <div className="entry-list">
            {visible.map((a) => (
              <div
                className="entry-row"
                key={a.username}
                onClick={() => openPlayer(a)}
                style={{ cursor: "pointer" }}
              >
                <span>
                  <strong style={{ color: "#F5EFE2" }}>{a.username}</strong>
                  <span style={{ color: "#9FB3A4" }}>
                    {" "}
                    · {a.mainPosition || (overview[a.username] || {}).topPos || "No position yet"}
                    {teamOfPlayer(a.username) ? ` · ${teamOfPlayer(a.username).name}` : ""}
                  </span>
                </span>
                <span className="hint" style={{ margin: 0 }}>
                  {(overview[a.username] || {}).logs || 0} {((overview[a.username] || {}).logs || 0) === 1 ? "log" : "logs"}
                  {(overview[a.username] || {}).lastDate ? ` · last ${(overview[a.username] || {}).lastDate}` : ""} ›
                </span>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }

  if (!playerData) return shell(<LoadingSkeleton label="Loading stats" />);

  const positions = Object.keys(playerData.byPosition);
  const extras = playerData.extras || {};
  const tabStrip = (
    <div className="entry-filter-strip" style={{ marginBottom: 12 }}>
      {COACH_EXTRA_TABS.map(([key, label]) => (
        <button key={key} className={playerTab === key ? "active" : ""} onClick={() => setPlayerTab(key)}>
          {label}
          {key !== "stats" && (extras[key] || []).length ? ` (${(extras[key] || []).length})` : ""}
        </button>
      ))}
    </div>
  );
  if (playerTab === "goals") {
    return shell(
      <section>
        {tabStrip}
        {teamOfPlayer(selectedPlayer.username) ? (
          <CoachGoalsEditor team={teamOfPlayer(selectedPlayer.username)} username={selectedPlayer.username} coachName={profile && profile.username} />
        ) : (
          <EmptyState icon="🔒" text="This player isn't in one of your teams." />
        )}
      </section>
    );
  }
  if (playerTab !== "stats") {
    return shell(
      <section>
        {tabStrip}
        <CoachExtraView kind={playerTab} items={extras[playerTab]} name={selectedPlayer.username} />
      </section>
    );
  }
  if (positions.length === 0) {
    return shell(
      <section>
        {tabStrip}
        <EmptyState icon="📭" text={`${selectedPlayer.username} hasn\'t logged any cricket stats yet.`} />
      </section>
    );
  }

  const roleKey = CRICKET_POSITION_TO_ROLE[selectedPos];
  const entries = playerData.byPosition[selectedPos] || [];
  const statEntries = entries.filter((e) => !e.category || e.category === "matchPractice");
  const analysis = roleKey ? analyseCricketRole(roleKey, statEntries) : null;
  const tips = buildTipCards("Cricket", analysis, null);
  const meta = CRICKET_ROLE_META[roleKey];
  const summary = (e) => {
    const goalNote = e.goalWork && e.goalWork.goalText ? ` · Goal: ${e.goalWork.goalText}` : "";
    if (e.category && CRICKET_CATEGORY_FIELDS[e.category]) return genericFieldsSummary(e, CRICKET_CATEGORY_FIELDS[e.category]) + goalNote;
    return logSummary(meta, e) + goalNote;
  };
  const matchResult = (e) => (e.matchId ? (playerData.matches.find((m) => m.id === e.matchId) || {}).result : null);

  return shell(
    <section>
      {tabStrip}
      {positions.length > 1 && (
        <div className="entry-filter-strip">
          {positions.map((p) => (
            <button key={p} className={selectedPos === p ? "active" : ""} onClick={() => setSelectedPos(p)}>
              {p} ({playerData.byPosition[p].length})
            </button>
          ))}
        </div>
      )}

      {!analysis && <EmptyState icon="📊" text={`No match stats at ${selectedPos} yet — only training sessions.`} />}
      {analysis && (
        <div className="card">
          <h2>{selectedPos} Analysis</h2>
          <div className="stat-row">
            {analysis.statCards.map((s, i) => (
              <Stat key={i} label={s.label} value={s.value} />
            ))}
          </div>
          <VerdictLists analysis={analysis} />
        </div>
      )}
      {analysis && <StatRingsCard rings={buildRings(CRICKET_RING_METRICS, analysis.totals)} />}
      {analysis && roleKey && <PerMatchAveragesCard fields={CRICKET_ROLE_FIELDS[roleKey]} totals={analysis.totals} count={statEntries.filter((e) => e.logStyle !== "rate").length} />}
      {roleKey && <AreaRatingsCard items={statEntries} areas={gameAreasFor(roleKey)} />}

      <div className="card">
        <h2>Suggested Drills</h2>
        {tips.map((t, i) => (
          <div key={i}>
            <h3 style={{ margin: "8px 0 4px" }}>{t.title}</h3>
            <ul className="drills">
              {t.drills.map((d, j) => (
                <li key={j}>{d}</li>
              ))}
            </ul>
          </div>
        ))}
        {roleKey && CRICKET_POSITION_DRILLS[roleKey] && (
          <>
            <h3 style={{ margin: "8px 0 4px" }}>Core {selectedPos} drills</h3>
            <ul className="drills">
              {CRICKET_POSITION_DRILLS[roleKey].map((d, j) => (
                <li key={j}>{d}</li>
              ))}
            </ul>
          </>
        )}
      </div>

      <div className="card">
        <div className="entry-list">
          <h3>All logs at {selectedPos} ({entries.length})</h3>
          {entries
            .slice()
            .reverse()
            .map((e) => (
              <div className="entry-row" key={e.id} style={{ flexDirection: "column", alignItems: "flex-start", gap: 3 }}>
                <span>
                  <strong style={{ color: "#F5EFE2" }}>{e.date}</strong> · {e.mode === "training" ? "Training" : "Match"}
                  {matchResult(e) ? ` · ${matchResult(e)}` : ""}
                </span>
                <span style={{ color: "#9FB3A4" }}>{summary(e)}</span>
                {e.goalWork && (e.goalWork.picked.length > 0 || e.goalWork.notes) && (
                  <span style={{ color: "#7C9284", fontSize: 12 }}>
                    Worked on: {[...e.goalWork.picked, e.goalWork.notes].filter(Boolean).join(" · ")}
                  </span>
                )}
              </div>
            ))}
        </div>
      </div>
    </section>
  );
}

// ---- Sharing plan, nutrition, recovery and trophies with your coach ----
// Players choose "Just me" or "My team" on each. Only "My team" items are
// copied to the coach (cloud: sharedLogs, one doc per kind; this phone only:
// a per-player key the coach dashboard reads).
function useMyTeam() {
  const [team, setTeam] = useState(null);
  useEffect(() => {
    let live = true;
    (async () => {
      try {
        const r = await safeGet("profile:data");
        const p = r ? JSON.parse(r.value) : null;
        if (!p || !p.username) return;
        const t = cricketTeamFor(await loadCricketTeams(), p.username);
        if (live) setTeam(t || null);
      } catch (e) {
        // no team
      }
    })();
    return () => {
      live = false;
    };
  }, []);
  return team;
}

async function shareWithCoach(kind, items) {
  try {
    const r = await safeGet("profile:data");
    const p = r ? JSON.parse(r.value) : null;
    if (!p || !p.username) return;
    const team = cricketTeamFor(await loadCricketTeams(), p.username);
    if (!team || team.status !== "member") return;
    const clean = cleanDeep(items || []);
    if (CLOUD.enabled && CLOUD.uid) {
      await cloudDb
        .collection("sharedLogs")
        .doc(`${CLOUD.uid}__${team.id}__x-${kind}`)
        .set({ uid: CLOUD.uid, username: p.username, teamId: String(team.id), sport: "cricket", kind, entries: clean, updatedAt: Date.now() });
    } else {
      await window.storage.set(`${cricketUserPrefix(p.username)}shared:${kind}`, JSON.stringify(clean));
    }
  } catch (e) {
    console.warn("Couldn't share with coach", e);
  }
}

async function shareTrophiesIfOn(unlocked) {
  try {
    const on = await safeGet("achievements:shareTeam");
    if (!on || on.value !== "team") return;
    shareWithCoach(
      "trophies",
      (unlocked || [])
        .map((u) => {
          const t = TROPHIES.find((x) => x.id === u.id);
          return t ? { id: t.id, name: t.name, tier: t.tier, description: t.description, date: u.date } : null;
        })
        .filter(Boolean)
    );
  } catch (e) {
    // not shared
  }
}

// ---- Goals a coach sets for one player ----
// Cloud: coachGoals/{teamId}__{playerUid} — only that coach and that player can
// read it; the coach adds/removes goals, the player can only tick them off.
// Same phone (no internet): a shared key both can read.
function coachGoalsKey(teamId, playerName) {
  return `coachGoals:${teamId}:${String(playerName).toLowerCase()}`;
}
async function coachGoalsLoad(teamId, playerUid, playerName) {
  try {
    if (CLOUD.enabled && CLOUD.uid) {
      const d = await cloudDb.collection("coachGoals").doc(`${teamId}__${playerUid}`).get();
      return d.exists ? d.data().goals || [] : [];
    }
    const r = await safeGet(coachGoalsKey(teamId, playerName));
    return r ? JSON.parse(r.value) : [];
  } catch (e) {
    return [];
  }
}
// Coach saves the whole list for a player.
async function coachGoalsSave(teamId, playerUid, playerName, goals) {
  if (CLOUD.enabled && CLOUD.uid) {
    await cloudDb
      .collection("coachGoals")
      .doc(`${teamId}__${playerUid}`)
      .set({ teamId: String(teamId), playerUid, coachUid: CLOUD.uid, playerName, goals, updatedAt: Date.now() });
    return;
  }
  await window.storage.set(coachGoalsKey(teamId, playerName), JSON.stringify(goals));
}
// Player ticks coach goals off.
async function coachGoalsMarkDone(team, playerName, ids, date) {
  if (!team || team.status !== "member" || !ids.length) return;
  try {
    const goals = await coachGoalsLoad(team.id, CLOUD.uid, playerName);
    const next = goals.map((g) => (ids.includes(g.id) ? { ...g, completed: true, completedDate: date } : g));
    if (CLOUD.enabled && CLOUD.uid) {
      await cloudDb.collection("coachGoals").doc(`${team.id}__${CLOUD.uid}`).update({ goals: next, updatedAt: Date.now() });
    } else {
      await window.storage.set(coachGoalsKey(team.id, playerName), JSON.stringify(next));
    }
  } catch (e) {
    console.warn("Couldn't tell your coach", e);
  }
}
// Bring the coach's goals into the player's own goal list.
function mergeCoachGoals(local, remote, coachName) {
  const ids = new Set(remote.map((r) => r.id));
  let next = (local || []).filter((g) => !g.fromCoach || ids.has(g.id) || g.completed);
  remote.forEach((r) => {
    const ex = next.find((g) => g.id === r.id);
    if (!ex) {
      next = [...next, { id: r.id, text: r.text, source: "coach", coachName: r.coachName || coachName || "your coach", fromCoach: true, completed: !!r.completed, completedDate: r.completedDate || null, date: r.date }];
    } else if (r.completed && !ex.completed) {
      next = next.map((g) => (g.id === r.id ? { ...g, completed: true, completedDate: r.completedDate } : g));
    }
  });
  return next;
}

function CoachGoalsEditor({ team, username, coachName }) {
  const [goals, setGoals] = useState(null);
  const [text, setText] = useState("");
  const [err, setErr] = useState("");
  const uid = CLOUD.enabled ? CLOUD.nameToUid[username] : username;
  useEffect(() => {
    let live = true;
    coachGoalsLoad(team.id, uid, username).then((g) => live && setGoals(g));
    return () => {
      live = false;
    };
  }, [team && team.id, username]);
  async function save(next) {
    setGoals(next);
    try {
      await coachGoalsSave(team.id, uid, username, next);
      setErr("");
    } catch (e) {
      setErr("Couldn't save — check your internet and try again.");
    }
  }
  function add() {
    const t = text.trim();
    if (!t) return;
    if (isOffensive(t)) {
      setErr(OFFENSIVE_MSG.replace("That name", "That goal"));
      return;
    }
    save([...(goals || []), { id: Date.now(), text: t, date: new Date().toISOString().slice(0, 10), coachName, completed: false }]);
    setText("");
  }
  function remove(id) {
    if (!window.confirm("Remove this goal? It'll disappear from the player's app too.")) return;
    save((goals || []).filter((g) => g.id !== id));
  }
  if (!goals) return <LoadingSkeleton label="Loading goals" rows={2} />;
  const open = goals.filter((g) => !g.completed);
  const done = goals.filter((g) => g.completed);
  return (
    <>
      <div className="card">
        <h2>Set a goal for {username}</h2>
        <p className="hint">Only {username} sees it — it appears in their Goals tab as from you, and you'll see here when they tick it off.</p>
        <div className="new-match-row">
          <input type="text" placeholder="e.g. Make 10 tackles a game" value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} />
          <button type="button" onClick={add}>
            Add Goal
          </button>
        </div>
        {err && <p className="hint" style={{ color: "#F87171" }}>{err}</p>}
      </div>
      <div className="card">
        <h2>Working on ({open.length})</h2>
        {open.length === 0 && <EmptyState icon="🎯" text="No open goals — add one above." />}
        <div className="entry-list">
          {open.map((g) => (
            <div className="entry-row" key={g.id}>
              <span>
                {g.text}
                <span className="hint" style={{ margin: 0 }}> · set {g.date}</span>
              </span>
              <button onClick={() => remove(g.id)}>Remove</button>
            </div>
          ))}
        </div>
      </div>
      {done.length > 0 && (
        <div className="card">
          <h2>✅ Completed ({done.length})</h2>
          <div className="entry-list">
            {done
              .slice()
              .reverse()
              .map((g) => (
                <div className="entry-row" key={g.id}>
                  <span style={{ color: "#BFF0CC" }}>{g.text}</span>
                  <span className="hint" style={{ margin: 0 }}>
                    done {g.completedDate}
                  </span>
                </div>
              ))}
          </div>
        </div>
      )}
    </>
  );
}

const COACH_EXTRA_TABS = [
  ["stats", "📊 Stats"],
  ["goals", "🎯 Goals"],
  ["plan", "🗓️ Plan"],
  ["nutrition", "🍽️ Nutrition"],
  ["recovery", "🧘 Recovery"],
  ["gym", "🏋️ Gym"],
  ["trophies", "🏆 Trophies"],
];

function CoachExtraView({ kind, items, name }) {
  const list = items || [];
  const none = (what) => (
    <EmptyState icon="📭" text={`${name} hasn't shared any ${what} with the team yet. Players choose "My team" when they want you to see it.`} />
  );
  if (kind === "plan") {
    if (!list.length) return none("weekly plans");
    return list
      .slice()
      .reverse()
      .map((pl, i) => (
        <div className="card" key={i}>
          <h2>{i === 0 ? "Latest plan" : "Earlier plan"} · {pl.date}</h2>
          {(pl.position || pl.focus) && <p className="hint">{[pl.position, pl.focus && `Working on: ${pl.focus}`].filter(Boolean).join(" · ")}</p>}
          <div className="entry-list">
            {(pl.plan || []).map((d, j) => (
              <div className="entry-row" key={j} style={{ flexDirection: "column", alignItems: "flex-start" }}>
                <span>
                  <strong>{d.day}:</strong> {d.activity}
                  {d.focus ? ` — ${d.focus}` : ""}
                </span>
              </div>
            ))}
          </div>
        </div>
      ));
  }
  if (kind === "nutrition") {
    if (!list.length) return none("meals");
    const byDate = {};
    list.forEach((m) => (byDate[m.date] = byDate[m.date] || []).push(m));
    return Object.keys(byDate)
      .sort()
      .reverse()
      .slice(0, 14)
      .map((d) => {
        const meals = byDate[d];
        const tot = meals.reduce((t, m) => ({ c: t.c + Number(m.calories || 0), p: t.p + Number(m.protein || 0) }), { c: 0, p: 0 });
        return (
          <div className="card" key={d}>
            <h2>{d.split("-").reverse().join("/")}</h2>
            <p className="hint">
              {tot.c} kcal · {tot.p}g protein across {meals.length} meal{meals.length === 1 ? "" : "s"}
            </p>
            <div className="entry-list">
              {meals.map((m, j) => (
                <div className="entry-row" key={j}>
                  <span>
                    <strong>{m.mealType}:</strong> {m.name}
                    {m.plateScore !== null && m.plateScore !== undefined ? ` · plate ${m.plateScore}/3` : ""}
                  </span>
                  <span className="hint" style={{ margin: 0 }}>
                    {m.calories} kcal
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      });
  }
  if (kind === "recovery") {
    if (!list.length) return none("recovery");
    const checks = list.filter((x) => x.type === "checkin").slice(-14);
    const sessions = list.filter((x) => x.type === "session").slice(-14);
    const plans = list.filter((x) => x.type === "plan").slice(-3);
    return (
      <>
        {checks.length > 0 && (
          <div className="card">
            <h2>Readiness check-ins</h2>
            <div className="entry-list">
              {checks
                .slice()
                .reverse()
                .map((c, i) => {
                  const v = readinessVerdict(c.score);
                  return (
                    <div className="entry-row" key={i}>
                      <span>
                        {c.date} · sleep {c.sleep}h · sore {c.soreness}/10 · energy {c.energy}/10
                      </span>
                      <strong style={{ color: v.color }}>
                        {c.score} {v.label}
                      </strong>
                    </div>
                  );
                })}
            </div>
          </div>
        )}
        {sessions.length > 0 && (
          <div className="card">
            <h2>Recovery done</h2>
            <div className="entry-list">
              {sessions
                .slice()
                .reverse()
                .map((s, i) => (
                  <div className="entry-row" key={i}>
                    <span>{s.title}</span>
                    <span className="hint" style={{ margin: 0 }}>
                      {s.date}
                    </span>
                  </div>
                ))}
            </div>
          </div>
        )}
        {plans.length > 0 && (
          <div className="card">
            <h2>Recovery plans built</h2>
            {plans
              .slice()
              .reverse()
              .map((pl, i) => (
                <p className="hint" key={i}>
                  {pl.date} · {pl.when} · {pl.minutes} min{pl.areas ? ` · ${pl.areas}` : ""}
                </p>
              ))}
          </div>
        )}
      </>
    );
  }
  if (kind === "gym") {
    if (!list.length) return none("gym workouts");
    const weekAgo = Date.now() - 7 * 864e5;
    const thisWeek = list.filter((w) => w.date && new Date(w.date).getTime() >= weekAgo).length;
    const best = {};
    list.forEach((w) =>
      (w.exercises || []).forEach((ex) => {
        const e1 = estOneRM(ex.weight, ex.reps);
        if (e1 > 0 && (!best[ex.exercise] || e1 > best[ex.exercise].e1)) best[ex.exercise] = { e1, weight: ex.weight, reps: ex.reps };
      })
    );
    const top = Object.entries(best)
      .sort((a, b) => b[1].e1 - a[1].e1)
      .slice(0, 6);
    return (
      <>
        <div className="card">
          <h2>Gym overview</h2>
          <div className="stat-row">
            <Stat label="Workouts shared" value={list.length} />
            <Stat label="This week" value={thisWeek} />
          </div>
          {top.length > 0 && (
            <>
              <h3 style={{ margin: "10px 0 6px" }}>Best lifts</h3>
              <div className="entry-list">
                {top.map(([name, b]) => (
                  <div className="entry-row" key={name}>
                    <span>{name}</span>
                    <span className="hint" style={{ margin: 0 }}>
                      {b.weight}kg × {b.reps} (est. 1RM {b.e1.toFixed(1)}kg)
                    </span>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        {list
          .slice()
          .reverse()
          .slice(0, 20)
          .map((w, i) => (
            <div className="card" key={i}>
              <h2>
                {w.name} <span className="hint" style={{ margin: 0 }}>· {w.date}{w.split ? ` · ${w.split}` : ""}</span>
              </h2>
              <div className="entry-list">
                {(w.exercises || []).map((e, j) => (
                  <div className="entry-row" key={j}>
                    <span>
                      {e.exercise}
                      {e.muscle ? ` (${e.muscle})` : ""}
                    </span>
                    <span className="hint" style={{ margin: 0 }}>
                      {e.sets} × {e.reps} @ {e.weight}kg
                    </span>
                  </div>
                ))}
              </div>
            </div>
          ))}
      </>
    );
  }
  if (kind === "trophies") {
    if (!list.length) return none("trophies");
    return (
      <div className="card">
        <h2>{list.length} {list.length === 1 ? "trophy" : "trophies"}</h2>
        <div className="entry-list">
          {list
            .slice()
            .reverse()
            .map((t) => (
              <div className="entry-row" key={t.id}>
                <span>
                  {(TIER_META[t.tier] || {}).icon} <strong>{t.name}</strong>
                  <span className="hint" style={{ margin: 0 }}> — {t.description}</span>
                </span>
                <span className="hint" style={{ margin: 0 }}>
                  {t.date}
                </span>
              </div>
            ))}
        </div>
      </div>
    );
  }
  return null;
}

// Asked on every log: keep it to yourself, or share it with your team's coach.
function LogForPicker({ value, onChange, team, onJoinTeam, title }) {
  const isMember = team && team.status === "member";
  const opt = (key, title, sub, disabled) => {
    const on = value === key;
    return (
      <button
        type="button"
        disabled={disabled}
        onClick={() => !disabled && onChange(key)}
        style={{
          flex: 1,
          textAlign: "left",
          background: on ? "#1B3324" : "transparent",
          border: "2px solid " + (on ? "#3B82F6" : "#2A4433"),
          borderRadius: 10,
          padding: "12px 12px",
          cursor: disabled ? "not-allowed" : "pointer",
          opacity: disabled ? 0.45 : 1,
          fontFamily: "inherit",
          color: "#EFE9DD",
        }}
      >
        <div style={{ fontWeight: 700, fontSize: 14 }}>{on ? "✓ " : ""}{title}</div>
        <div style={{ fontSize: 11.5, color: "#9FB3A4", marginTop: 3 }}>{sub}</div>
      </button>
    );
  };
  return (
    <div className="card">
      <h3 style={{ marginTop: 0 }}>{title || "Who is this log for?"}</h3>
      <div style={{ display: "flex", gap: 8 }}>
        {opt("me", "Just me", "Private — only you can see it.")}
        {opt(
          "team",
          "My team",
          isMember
            ? `Shared with ${team.name}'s coach.`
            : team && team.status === "pending"
            ? `Waiting for ${team.name}'s coach to accept you.`
            : "You're not in a team yet.",
          !isMember
        )}
      </div>
      {!team && onJoinTeam && (
        <button type="button" onClick={onJoinTeam} style={{ marginTop: 10, fontSize: 12.5 }}>
          Join a team
        </button>
      )}
    </div>
  );
}

// Teams for this sport: created by coaches, joined by players on request.
// { id, name, coach, members: [username], pending: [username] }
async function loadCricketTeams() {
  if (CLOUD.enabled) return cloudLoadTeams();
  try {
    const res = await safeGet("cricket:teams");
    return res ? JSON.parse(res.value) : [];
  } catch (e) {
    return [];
  }
}

function saveCricketTeams(list) {
  if (CLOUD.enabled) return cloudSaveTeams(list);
  window.storage.set("cricket:teams", JSON.stringify(list)).catch(() => {});
}

// A player's team: the one they're a member of, or else one they've asked to join.
function cricketTeamFor(teams, username) {
  const u = String(username).toLowerCase();
  const has = (arr) => (arr || []).some((x) => String(x).toLowerCase() === u);
  const member = teams.find((t) => has(t.members));
  const info = (t, status) => ({ id: t.id, name: t.name, status, coach: t.coach, coachUid: t.coachUid, verified: !!t.verified, code: t.code });
  if (member) return info(member, "member");
  const pending = teams.find((t) => has(t.pending));
  if (pending) return info(pending, "pending");
  const declined = teams.find((t) => has(t.declined));
  if (declined) return info(declined, "declined");
  return null;
}

function cricketUserPrefix(username) {
  return `u:${String(username).toLowerCase()}:`;
}

// ---------- Cricket ----------
function CricketApp({ onBack, profile, onProfileChange }) {
  // Every player's cricket data lives under their own username, so players only

  const ns = profile && profile.username ? cricketUserPrefix(profile.username) : "";
  const [position, setPosition] = useState(null);
  const [mainPosGroup, setMainPosGroup] = useState(null);

  const [myTeam, setMyTeam] = useState(null); // { name, status: "member" | "pending" | "declined" } or null

  const [joiningTeam, setJoiningTeam] = useState(false);
  const [teamNameDraft, setTeamNameDraft] = useState("");
  const [teamJoinError, setTeamJoinError] = useState("");
  const [teamChoice, setTeamChoice] = useState(null); // null | "team" — shows the team name box
  const [pickingOtherPosition, setPickingOtherPosition] = useState(false);
  const [logFor, setLogFor] = useState(null); // null | "me" | "team" — asked on every log
  const [videoFile, setVideoFile] = useState(null);
  // Sports with a single "position" (e.g. golf) skip the position screens entirely.
  const singlePosition = CRICKET_POSITIONS.length === 1 && !CRICKET_SUB_POSITIONS[CRICKET_POSITIONS[0]];
  const [subPosition, setSubPosition] = useState(null);
  const [mode, setMode] = useState(null);
  const [tab, setTab] = useState("track");
  const [matches, setMatches] = useState([]);
  const [selectedMatchId, setSelectedMatchId] = useState(null);
  const [newOpponent, setNewOpponent] = useState("");
  const [trainingSessions, setTrainingSessions] = useState([]);
  const [selectedTrainingId, setSelectedTrainingId] = useState(null);
  const [draftSkills, setDraftSkills] = useState(emptyFieldsEntry(CRICKET_SKILLS_FIELDS));
  const [draftExtra, setDraftExtra] = useState({});
  const [goalWork, setGoalWork] = useState(emptyGoalWork());
  const [draftFitness, setDraftFitness] = useState(emptyFieldsEntry(FITNESS_FIELDS));
  const [draftRecovery, setDraftRecovery] = useState(emptyFieldsEntry(RECOVERY_FIELDS));
  const [ratings, setRatings] = useState(emptyRatings());
  const [entries, setEntries] = useState([]);
  const [seasons, setSeasons] = useState([]);
  const [activeSeasonId, setActiveSeasonId] = useState(null);
  const [newSeasonName, setNewSeasonName] = useState("");
  const [newYearGroup, setNewYearGroup] = useState("");
  const [focusGoals, setFocusGoals] = useState([]);
  const [newSelfGoal, setNewSelfGoal] = useState("");
  const [newCoachGoal, setNewCoachGoal] = useState("");
  const [newCoachName, setNewCoachName] = useState("");
  const [checkedFocusGoalIds, setCheckedFocusGoalIds] = useState([]);
  const [completedFlash, setCompletedFlash] = useState([]);
  const [flashTrophies, setFlashTrophies] = useState([]);
  const [draft, setDraft] = useState(null);
  const [pbFlash, setPbFlash] = useState([]);
  const [liveTallying, setLiveTallying] = useState(false);
  const [logStyle, setLogStyle] = useState(() => loadLogStyle("cricket"));
  const [showAllStats, setShowAllStats] = useState(false);
  const [showFeel, setShowFeel] = useState(false);
  const [areaRatings, setAreaRatings] = useState({});
  const [fieldGroupTab, setFieldGroupTab] = useState(0);
  const [matchStage, setMatchStage] = useState("setup"); // setup | logging — see saveEntry
  const [loaded, setLoaded] = useState(false);
  const [roleLoaded, setRoleLoaded] = useState(false);

  const roleKey = CRICKET_POSITION_TO_ROLE[subPosition || position] || null;
  const activeLabel = subPosition || position;
  const storageKey = activeLabel ? `${ns}cricket:${slugify(activeLabel)}` : null;

  useEffect(() => {
    async function loadShell() {
      try {
        // Each visit starts fresh (role → position → match/training), so the
        // last-used mode and position aren't restored here on purpose.
        if (profile && profile.username) {
          const teams = await loadCricketTeams();
          setMyTeam(cricketTeamFor(teams, profile.username));
          const sk = await safeGet(ns + "cricket:teamSkipped");
          if (sk && sk.value === "1") setTeamSkipped(true);
        }
        const m = await safeGet(ns + "cricket:matches");
        if (m) setMatches(JSON.parse(m.value));
        const tr = await safeGet(ns + "cricket:training");
        if (tr) setTrainingSessions(JSON.parse(tr.value));
        const fg = await safeGet(ns + "cricket:focusGoals");
        if (fg) setFocusGoals(JSON.parse(fg.value));
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    loadShell();
  }, []);

  useEffect(() => {
    if (role === "player" && loaded && singlePosition && !position) choosePosition(CRICKET_POSITIONS[0]);
  }, [role, position, loaded]);

  useEffect(() => {
    let cancelled = false;
    async function loadRole() {
      if (!storageKey || !roleKey) return;
      setRoleLoaded(false);
      try {
        const res = await safeGet(storageKey);
        if (!cancelled) setEntries(res ? JSON.parse(res.value) : []);
        const s = await safeGet(`${storageKey}:seasons`);
        if (!cancelled) setSeasons(s ? JSON.parse(s.value) : []);
        const a = await safeGet(`${storageKey}:activeSeasonId`);
        if (!cancelled) setActiveSeasonId(a && a.value ? a.value : null);
      } catch (e) {
        if (!cancelled) {
          setEntries([]);
          setSeasons([]);
          setActiveSeasonId(null);
        }
      }
      if (!cancelled) {
        setDraft(makeEmptyCricketRoleEntry(roleKey));
        setRoleLoaded(true);
      }
    }
    loadRole();
    return () => {
      cancelled = true;
    };
  }, [storageKey, roleKey]);

  async function persist(key, data) {
    try {
      await window.storage.set(key, JSON.stringify(data));
    } catch (e) {
      // best effort
    }
  }

  function choosePosition(p) {
    setPosition(p);
    window.storage.set(ns + "cricket:position", p).catch(() => {});
    if (!CRICKET_SUB_POSITIONS[p]) {
      setSubPosition(null);
      window.storage.set(ns + "cricket:subPosition", "").catch(() => {});
    }
  }

  function chooseSubPosition(sp) {
    setSubPosition(sp);
    window.storage.set(ns + "cricket:subPosition", sp).catch(() => {});
  }

  function chooseMainPosition() {
    if (!profile || !profile.mainPosition) return;
    const mp = profile.mainPosition;
    const topLevel = CRICKET_POSITIONS.find((p) => CRICKET_SUB_POSITIONS[p] && CRICKET_SUB_POSITIONS[p].includes(mp)) || mp;
    choosePosition(topLevel);
    if (CRICKET_SUB_POSITIONS[topLevel]) {
      chooseSubPosition(mp);
    }
  }

  function changePosition() {
    setPosition(null);
    setSubPosition(null);
    setPickingOtherPosition(false);
    window.storage.set(ns + "cricket:position", "").catch(() => {});
    window.storage.set(ns + "cricket:subPosition", "").catch(() => {});
  }

  function chooseMode(m) {
    setMode(m);
    window.storage.set(ns + "cricket:mode", m).catch(() => {});
  }

  function switchMode() {
    setMode(null);
    setSelectedMatchId(null);
    setSelectedTrainingId(null);
    setMatchStage("setup");
    setLogFor(null);
    window.storage.set(ns + "cricket:mode", "").catch(() => {});
  }

  function createMatch() {
    if (!newOpponent.trim()) return;
    const m = { ...emptyMatch(), opponent: newOpponent.trim() };
    const next = [...matches, m];
    setMatches(next);
    persist(ns + "cricket:matches", next);
    setSelectedMatchId(m.id);
    setNewOpponent("");
  }

  function updateMatchResult(id, result) {
    const next = matches.map((m) => (m.id === id ? { ...m, result } : m));
    setMatches(next);
    persist(ns + "cricket:matches", next);
  }

  function updateMatchField(id, field, value) {
    const next = matches.map((m) => (m.id === id ? { ...m, [field]: value } : m));
    setMatches(next);
    persist(ns + "cricket:matches", next);
  }

  function matchLabel(m) {
    return `${m.opponent || "Unnamed"} — ${m.result}`;
  }

  // Fully abandons the round in progress: deletes the match record itself
  // (not just the tally screen), discards whatever's been tapped in so far,
  // and drops back to "no match selected" — for when a game is genuinely off,
  // not just a typo you want to back out of.
  function cancelRound() {
    if (!window.confirm("Cancel this round? The match record and anything tapped in so far will be discarded.")) return;
    if (selectedMatchId) {
      const next = matches.filter((m) => m.id !== selectedMatchId);
      setMatches(next);
      persist(ns + "cricket:matches", next);
    }
    setSelectedMatchId(null);
    setMatchStage("setup");
    setLiveTallying(false);
    setLogFor(null);
    setDraft(makeEmptyCricketRoleEntry(roleKey));
  }

  // Marks the round as stopped partway through (rained off, injury, etc.)
  // without losing whatever's already been logged — keeps the match record
  // and tags its result, but exits live tallying.
  function callOffRound() {
    if (selectedMatchId) {
      updateMatchField(selectedMatchId, "result", "Abandoned");
    }
    setLiveTallying(false);
  }

  function createTrainingWithCategory(cat) {
    const t = { ...emptyTraining(), type: cat.label, category: cat.key };
    const next = [...trainingSessions, t];
    setTrainingSessions(next);
    persist(ns + "cricket:training", next);
    setSelectedTrainingId(t.id);
  }

  function startSeason() {
    if (!storageKey) return;
    if (USES_YEAR_GROUP && !newYearGroup) return;
    const s = { ...emptySeason(newSeasonName), yearGroup: newYearGroup };
    const next = [...seasons, s];
    setSeasons(next);
    persist(`${storageKey}:seasons`, next);
    setActiveSeasonId(s.id);
    window.storage.set(`${storageKey}:activeSeasonId`, s.id).catch(() => {});
    setNewSeasonName("");
  }

  function setSeasonYearGroup(y) {
    if (!storageKey || !activeSeasonId) return;
    const next = seasons.map((x) => (x.id === activeSeasonId ? { ...x, yearGroup: y } : x));
    setSeasons(next);
    persist(`${storageKey}:seasons`, next);
  }

  function endSeason() {
    if (!storageKey || !activeSeasonId) return;
    const today = new Date().toISOString().slice(0, 10);
    const next = seasons.map((s) => (s.id === activeSeasonId ? { ...s, endDate: today } : s));
    setSeasons(next);
    persist(`${storageKey}:seasons`, next);
    setActiveSeasonId(null);
    window.storage.set(`${storageKey}:activeSeasonId`, "").catch(() => {});
    trackAchievement("seasonCompleted", "cricket").then((u) => {
      if (u.length) setFlashTrophies((prev) => [...prev, ...u]);
    });
  }

  function deleteSeasonHistory(seasonId) {
    if (!window.confirm("Delete this season and every log in it? This can't be undone.")) return;
    const nextSeasons = seasons.filter((s) => s.id !== seasonId);
    setSeasons(nextSeasons);
    persist(`${storageKey}:seasons`, nextSeasons);
    const nextEntries = entries.filter((e) => e.seasonId !== seasonId);
    setEntries(nextEntries);
    persist(storageKey, nextEntries);
  }

  function addSelfGoal() {
    if (!newSelfGoal.trim()) return;
    const g = emptyFocusGoal(newSelfGoal, "self");
    const next = [...focusGoals, g];
    setFocusGoals(next);
    persist(ns + "cricket:focusGoals", next);
    setNewSelfGoal("");
    trackAchievement("selfGoalAdded", "cricket").then((u) => {
      if (u.length) setFlashTrophies((prev) => [...prev, ...u]);
    });
  }

  function addCoachGoal() {
    if (!newCoachGoal.trim()) return;
    const g = emptyFocusGoal(newCoachGoal, "coach", newCoachName);
    const next = [...focusGoals, g];
    setFocusGoals(next);
    persist(ns + "cricket:focusGoals", next);
    setNewCoachGoal("");
    setNewCoachName("");
    trackAchievement("coachGoalAdded", "cricket").then((u) => {
      if (u.length) setFlashTrophies((prev) => [...prev, ...u]);
    });
  }

  function deleteFocusGoal(id) {
    const next = focusGoals.filter((g) => g.id !== id);
    setFocusGoals(next);
    persist(ns + "cricket:focusGoals", next);
  }

  useEffect(() => {
    if (!loaded || !myTeam || myTeam.status !== "member" || !profile || !profile.username) return;
    let live = true;
    coachGoalsLoad(myTeam.id, CLOUD.uid, profile.username).then((remote) => {
      if (!live) return;
      setFocusGoals((prev) => {
        const next = mergeCoachGoals(prev, remote, myTeam.coach);
        if (JSON.stringify(next) !== JSON.stringify(prev)) persist(ns + "cricket:focusGoals", next);
        return next;
      });
    });
    return () => {
      live = false;
    };
  }, [loaded, myTeam && myTeam.id, myTeam && myTeam.status]);

  function completeFocusGoal(id) {
    const today = new Date().toISOString().slice(0, 10);
    const next = focusGoals.map((g) => (g.id === id ? { ...g, completed: true, completedDate: today } : g));
    nlCelebrate("goal", "🎯 Goal done!");
    setFocusGoals(next);
    persist(ns + "cricket:focusGoals", next, next);
    setCheckedFocusGoalIds((ids) => ids.filter((x) => x !== id));
    const g = focusGoals.find((x) => x.id === id);
    if (g && g.fromCoach && profile) coachGoalsMarkDone(myTeam, profile.username, [id], today);
  }

  function toggleFocusGoalChecked(id) {
    setCheckedFocusGoalIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  }

  function removeEntry(id) {
    const next = entries.filter((e) => e.id !== id);
    setEntries(next);
    persist(storageKey, next);
  }

  const roleFieldsAll = CRICKET_ROLE_FIELDS[roleKey] || [];
  const quickKeyList = quickStatKeys(roleFieldsAll, CRICKET_ROLE_CARDS[roleKey], CRICKET_ROLE_CHART_CONFIG[roleKey], CRICKET_RING_METRICS);
  const quickFields = roleFieldsAll.filter((f) => quickKeyList.includes(f.key));
  const moreFields = roleFieldsAll.filter((f) => !quickKeyList.includes(f.key));
  const quickView = mode === "match" && !showAllStats;
  const activeYearGroup = (seasons.find((x) => x.id === activeSeasonId) || {}).yearGroup || "";
  MATCH_MINUTES = matchMinutesFor(activeYearGroup);
  useEffect(() => {
    const m = matchMinutesFor(activeYearGroup);
    if (m) setDraft((d) => (d && "minutesPlayed" in d ? { ...d, minutesPlayed: m } : d));
  }, [activeYearGroup, activeSeasonId, roleKey]);
  const gameAreas = gameAreasFor(roleKey);
  function chooseLogStyle(next) {
    if (next === logStyle) return;
    setLogStyle(next);
    saveLogStyle("cricket", next);
    setShowAllStats(false);
    setLiveTallying(next === "live");
  }
  useEffect(() => {
    if (mode === "match" && matchStage === "logging") setLiveTallying(logStyle === "live");
  }, [mode, matchStage]);

  function saveEntry() {
    if (mode === "training" && !selectedTrainingId) return;
    if (!logFor) {
      window.alert("Choose who this log is for — Just me or My team — before saving.");
      return;
    }
    if (mode === "match" && logStyle === "rate" && !Object.values(areaRatings).some((v) => typeof v === "number")) {
      window.alert("Tap a score for at least one part of your game before saving.");
      return;
    }
    const activeSession = trainingSessions.find((t) => t.id === selectedTrainingId);
    const category = mode === "training" ? activeSession && activeSession.category : null;

    let entryData = null;
    if (mode === "match" || category === "matchPractice" || (mode === "training" && !category)) {
      if (!draft || !roleKey) return;
      entryData = { ...draft };
    } else if (category === "skills") {
      entryData = { ...draftSkills };
    } else if (category === "fitness") {
      entryData = { ...draftFitness };
    } else if (category === "recovery") {
      entryData = { ...draftRecovery };
    } else if (CRICKET_EXTRA_TRAINING_FIELDS[category]) {
      entryData = { ...emptyFieldsEntry(CRICKET_EXTRA_TRAINING_FIELDS[category]), ...(draftExtra[category] || {}) };
    }
    if (!entryData) return;

    const entryId = entryData.id || Date.now() + Math.random();
    const next = [
      ...entries,
      {
        ...entryData,
        id: entryId,
        matchId: mode === "match" ? selectedMatchId : null,
        trainingId: mode === "training" ? selectedTrainingId : null,
        mode,
        category,
        ratings,
        logStyle: mode === "match" ? logStyle : null,
        areaRatings: mode === "match" && logStyle === "rate" ? areaRatings : null,
        seasonId: activeSeasonId || null,
        goalWork: mode === "training" && goalWork.goalId ? goalWork : null,
        sharedWithTeam: logFor === "team",
        video: videoFile ? { local: true, name: videoFile.name || "Video", size: videoFile.size, addedAt: Date.now() } : null,
        team: logFor === "team" && myTeam ? myTeam.name : "",
        teamId: logFor === "team" && myTeam ? String(myTeam.id) : null,
      },
    ];
    {
      const saved = next[next.length - 1];
      const isStat = mode === "match" || category === "matchPractice" || (mode === "training" && !category);
      const sameKind = entries.filter((e) =>
        mode === "match" ? e.mode !== "training" : e.mode === "training" && (e.category || null) === (category || null)
      );
      const pbFields = isStat ? CRICKET_ROLE_FIELDS[roleKey] : CRICKET_CATEGORY_FIELDS[category];
      const pbMetrics = isStat ? CRICKET_RING_METRICS : CRICKET_TRAINING_METRICS[category] || [];
      const wins = newPersonalBests(pbFields, pbMetrics, sameKind, saved);
      setPbFlash(wins);
    }
    setEntries(next);
    persist(storageKey, next);
    if (videoFile && profile) storeClip(entryId, videoFile);
    setVideoFile(null);
    setGoalWork(emptyGoalWork());
    setLogFor(null);

    if (mode === "match" || category === "matchPractice" || (mode === "training" && !category)) {
      setDraft(makeEmptyCricketRoleEntry(roleKey));
    } else if (category === "skills") {
      setDraftSkills(emptyFieldsEntry(CRICKET_SKILLS_FIELDS));
    } else if (category === "fitness") {
      setDraftFitness(emptyFieldsEntry(FITNESS_FIELDS));
    } else if (category === "recovery") {
      setDraftRecovery(emptyFieldsEntry(RECOVERY_FIELDS));
    } else if (CRICKET_EXTRA_TRAINING_FIELDS[category]) {
      setDraftExtra((d) => ({ ...d, [category]: emptyFieldsEntry(CRICKET_EXTRA_TRAINING_FIELDS[category]) }));
    }
    setRatings(emptyRatings());
    setAreaRatings({});
    setShowFeel(false);
    setShowAllStats(false);

    // Reset every staged-entry option back to a clean slate for the next log,
    // rather than leaving the previous match/conditions choices in place.
    if (mode === "match") {
      setSelectedMatchId(null);
      setMatchStage("setup");
      setNewOpponent("");
    }

    trackAchievement(mode, "cricket").then((u) => {
      if (u.length) setFlashTrophies((prev) => [...prev, ...u]);
    });

    if (checkedFocusGoalIds.length > 0) {
      const today = new Date().toISOString().slice(0, 10);
      const completedTexts = focusGoals.filter((g) => checkedFocusGoalIds.includes(g.id)).map((g) => g.text);
      const nextGoals = focusGoals.map((g) => (checkedFocusGoalIds.includes(g.id) ? { ...g, completed: true, completedDate: today } : g));
      setFocusGoals(nextGoals);
      persist(ns + "cricket:focusGoals", nextGoals);
      if (profile)
        coachGoalsMarkDone(
          myTeam,
          profile.username,
          focusGoals.filter((g) => g.fromCoach && checkedFocusGoalIds.includes(g.id)).map((g) => g.id),
          today
        );
      setCompletedFlash(completedTexts);
      checkedFocusGoalIds.forEach(() => {
        trackAchievement("goalCompleted", "cricket").then((u) => {
          if (u.length) setFlashTrophies((prev) => [...prev, ...u]);
        });
      });
      setCheckedFocusGoalIds([]);
    }

    nlToast("Saved ✓");
    if (mode === "match") {
      setAnalysisKind("match");
      setAnalysisEntryFilter("all");
      setTab("analysis");
    } else {
      setTab("history");
    }
    window.scrollTo(0, 0);
    setTimeout(() => nlStreakCheck(), 300);
  }

  const [analysisEntryFilter, setAnalysisEntryFilter] = useState("all");
  const [analysisKind, setAnalysisKind] = useState(null); // null | "match" | "training"
  const [trainingCat, setTrainingCat] = useState(null);
  const matchLogs = useMemo(() => entries.filter((e) => e.mode !== "training"), [entries]);
  const trainingLogs = useMemo(() => entries.filter((e) => e.mode === "training"), [entries]);
  const kind =
    analysisKind ||
    (matchLogs.length && !trainingLogs.length ? "match" : trainingLogs.length && !matchLogs.length ? "training" : null);
  const needsKindChoice = kind === null && matchLogs.length > 0 && trainingLogs.length > 0;
  const trainingCats = CRICKET_TRAINING_CATEGORIES.filter((c) => trainingLogs.some((e) => (e.category || "matchPractice") === c.key));
  const cat = trainingCats.some((c) => c.key === trainingCat) ? trainingCat : (trainingCats[0] || {}).key || null;
  const roleScope = kind === "match" || (kind === "training" && cat === "matchPractice");
  const statEntries = useMemo(
    () => (kind === "match" ? matchLogs : kind === "training" ? trainingLogs.filter((e) => (e.category || "matchPractice") === cat) : []),
    [kind, cat, matchLogs, trainingLogs]
  );
  const analysisEntries = useMemo(
    () => (analysisEntryFilter === "all" ? statEntries : statEntries.filter((e) => e.id === analysisEntryFilter)),
    [analysisEntryFilter, statEntries]
  );
  const scopeFields = roleScope ? CRICKET_ROLE_FIELDS[roleKey] || [] : CRICKET_CATEGORY_FIELDS[cat] || [];
  const scopeMetrics = roleScope ? CRICKET_RING_METRICS : CRICKET_TRAINING_METRICS[cat] || [];
  const analysis = useMemo(
    () => (roleScope ? analyseCricketRole(roleKey, analysisEntries) : cat ? analyseCricketTraining(cat, analysisEntries) : null),
    [roleScope, roleKey, cat, analysisEntries]
  );
  const scopeLabel = kind === "match" ? activeLabel : (CRICKET_TRAINING_CATEGORIES.find((c) => c.key === cat) || {}).label || "Training";
  const focusEntry = analysisEntryFilter !== "all" ? analysisEntries[0] : statEntries[statEntries.length - 1];
  const comparison = useMemo(() => compareToAverage(scopeFields, statEntries, focusEntry), [scopeFields, statEntries, focusEntry]);
  const tipCards = useMemo(
    () => [...buildTipCards("Cricket", analysis, comparison), ...(kind === "match" ? areaTipCards("Cricket", statEntries, gameAreas) : [])],
    [analysis, comparison, kind, statEntries, gameAreas]
  );
  // Videos live only on this phone; the log just remembers that one is attached.
  function storeClip(entryId, file) {
    putClip(clipKey(profile.username, entryId), file).catch(() =>
      window.alert("Couldn't save the video on this phone — it may be out of space.")
    );
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  function updateEntry(entryId, change) {
    setEntries((cur) => {
      const next = cur.map((e) => (e.id === entryId ? { ...e, ...change } : e));
      persist(storageKey, next);
      return next;
    });
  }
  function attachVideo(entryId, file) {
    storeClip(entryId, file);
    updateEntry(entryId, { video: { local: true, name: file.name || "Video", size: file.size, addedAt: Date.now() }, videoAnalysis: null });
  }
  function removeVideo(entryId) {
    deleteClip(clipKey(profile.username, entryId)).catch(() => {});
    updateEntry(entryId, { video: null, videoAnalysis: null });
  }

  // Tab label for one log: the opponent/course if it has one, plus a short date.
  function logTabLabel(e) {
    const m = e.matchId ? matches.find((x) => x.id === e.matchId) : null;
    const d = e.date ? e.date.slice(5).split("-").reverse().join("/") : "";
    const label = m && m.opponent ? `${CRICKET_UI.vsPrefix} ${m.opponent} · ${d}` : d;
    return e.video ? `🎥 ${label}` : label;
  }
  function chooseKind(k) {
    setAnalysisKind(k);
    setAnalysisEntryFilter("all");
  }
  function chooseCat(c) {
    setTrainingCat(c);
    setAnalysisEntryFilter("all");
  }
  const meta = roleKey ? CRICKET_ROLE_META[roleKey] : null;
  const activeTrainingSession = trainingSessions.find((t) => t.id === selectedTrainingId);
  const activeCategory = activeTrainingSession ? activeTrainingSession.category : null;

  function cricketEntrySummary(e) {
    const goalNote = e.goalWork && e.goalWork.goalText ? ` · Goal: ${e.goalWork.goalText}` : "";
    if (e.category && CRICKET_CATEGORY_FIELDS[e.category]) {
      return genericFieldsSummary(e, CRICKET_CATEGORY_FIELDS[e.category]) + goalNote;
    }
    return logSummary(meta, e) + goalNote;
  }

  // First time into Cricket: record the player's main position on their
  // profile (and the matching login account) so it's remembered from then on.
  // Saves fields onto the player's profile and their login account record.
  async function saveProfileFields(fields) {
    const next = { ...(profile || {}), ...fields };
    window.storage.set("profile:data", JSON.stringify(next)).catch(() => {});
    try {
      const res = await safeGet("accounts:list");
      const accounts = res ? JSON.parse(res.value) : [];
      const updated = accounts.map((a) => (a.username === next.username ? { ...a, ...fields } : a));
      window.storage.set("accounts:list", JSON.stringify(updated)).catch(() => {});
    } catch (e) {
      // best effort
    }
    if (onProfileChange) onProfileChange(next);
  }

  async function requestToJoin() {
    const code = cleanTeamCode(teamNameDraft);
    if (code.length !== 6) {
      setTeamJoinError("Team codes have 6 letters and numbers, like HQ7-4KD — ask your coach for yours.");
      return;
    }
    if (CLOUD.enabled && CLOUD.uid) {
      let team = null;
      try {
        team = await cloudFindTeamByCode(code);
      } catch (e) {
        setTeamJoinError("Couldn't check that code — are you online?");
        return;
      }
      if (!team) {
        setTeamJoinError("No team has that code — check it with your coach.");
        return;
      }
      if (team.wrongSport) {
        const other = team.wrongSport.charAt(0).toUpperCase() + team.wrongSport.slice(1);
        setTeamJoinError(`That code is for a ${other} team — open ${other} from All Sports to join it.`);
        return;
      }
      if (team.coachUid === CLOUD.uid) {
        setTeamJoinError("That's your own team's code — give it to your players.");
        return;
      }
      try {
        await cloudRequestJoin(team, profile.mainPosition);
      } catch (e) {
        setTeamJoinError("Couldn't send your request — try again in a moment.");
        return;
      }
      const teams = await loadCricketTeams();
      setMyTeam(cricketTeamFor(teams, profile.username));
    } else {
      const teams = await loadCricketTeams();
      const team = teams.find((t) => t.code === code);
      if (!team) {
        setTeamJoinError("No team has that code — check it with your coach.");
        return;
      }
      const me = profile.username;
      const next = teams.map((t) => {
        const clean = { ...t, pending: (t.pending || []).filter((p) => p !== me), declined: (t.declined || []).filter((p) => p !== me) };
        return t.id === team.id ? { ...clean, pending: [...clean.pending, me] } : clean;
      });
      saveCricketTeams(next);
      setMyTeam(cricketTeamFor(next, me));
    }
    setTeamJoinError("");
    setTeamNameDraft("");
    setJoiningTeam(false);
  }

  function skipTeam() {
    setTeamSkipped(true);
    setJoiningTeam(false);
    setTeamChoice(null);
    window.storage.set(ns + "cricket:teamSkipped", "1").catch(() => {});
  }

              <div style={{ fontSize: 20, fontWeight: 800, color: "#F5EFE2" }}>⭐ Pick your main position</div>
              <div style={{ fontSize: 13, color: "#9FB3A4", marginTop: 4 }}>The position you play most. You can change it anytime in Settings.</div>

          <div className="sport-grid">

        </button>
        <button className={tab === "tips" ? "active" : ""} onClick={() => setTab("tips")}>
          Drills &amp; Tips
        </button>
        {mode === "match" && (

        <button className={tab === "history" ? "active" : ""} onClick={() => setTab("history")}>

      <main className="main">

              </>

        {tab === "analysis" && (
          <section>

            {!needsKindChoice && analysis && (

                username={profile.username}
