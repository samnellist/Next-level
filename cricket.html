};

function subDocId(uid, plan) {
  return plan === "all" ? `${uid}__all` : plan === "team" ? `${uid}__team-cricket` : `${uid}__sport-cricket`;
}
async function subsLoad() {
  try {
    if (CLOUD.enabled && CLOUD.uid) {
      const s = await cloudDb.collection("subscriptions").where("uid", "==", CLOUD.uid).get();
      return s.docs.map((d) => ({ id: d.id, ...d.data() }));
    }
    const r = await safeGet("subscriptions:list");
    return r ? JSON.parse(r.value) : [];
  } catch (e) {
    return [];
  }
}
function subIsLive(s, now) {
  if (!s) return false;
  if (s.status === "active") return true;
  if (s.status === "trial") return now < (s.trialEnds || 0) + GRACE_DAYS * 864e5;
  return false;
}
// Does this person have access to this sport in this role?
function subAccess(subs, role, now) {
  const t = now || Date.now();
  return (subs || []).find((s) => subIsLive(s, t) && (role === "coach" ? s.plan === "team" && s.sport === "cricket" : s.plan === "all" || (s.plan === "sport" && s.sport === "cricket")));
}
async function subsCreate(profile, plan, period, paypalId) {
  const uid = CLOUD.enabled && CLOUD.uid ? CLOUD.uid : profile.username;
  const now = Date.now();
  const sub = {
    uid,
    username: profile.username,
    email: profile.email || "",
    plan,
    period,
    sport: plan === "all" ? "all" : "cricket",
    paypalId,
    status: "trial",
    startedAt: now,
    trialEnds: trialEndFrom(now),
  };
  const id = subDocId(uid, plan);
  if (CLOUD.enabled && CLOUD.uid) {
    await cloudDb.collection("subscriptions").doc(id).set(sub);
  } else {
    const list = (await subsLoad()).filter((x) => x.id !== id);
    await window.storage.set("subscriptions:list", JSON.stringify([...list, { id, ...sub }]));
  }
  return { id, ...sub };
}
// Cancelling: we keep only what's needed for you to stop it in PayPal.
async function subsCancel(sub) {
  const keep = { uid: sub.uid, username: sub.username, plan: sub.plan, period: sub.period, sport: sub.sport, paypalId: sub.paypalId, status: "cancelled", cancelledAt: Date.now() };
  if (CLOUD.enabled && CLOUD.uid) {
    await cloudDb.collection("subscriptions").doc(sub.id).set(keep);
  } else {
    const list = (await subsLoad()).map((x) => (x.id === sub.id ? { id: sub.id, ...keep } : x));
    await window.storage.set("subscriptions:list", JSON.stringify(list));
  }
}
function fmtDay(ms) {
  return ms ? new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
}

let PAYPAL_SDK = null;
function loadPayPal() {
  if (window.paypal && window.paypal.Buttons) return Promise.resolve(window.paypal);
  if (PAYPAL_SDK) return PAYPAL_SDK;
  PAYPAL_SDK = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(PAYPAL_CFG.clientId)}&vault=true&intent=subscription&currency=GBP`;
    s.setAttribute("data-namespace", "paypal");
    s.onload = () => resolve(window.paypal);
    s.onerror = () => {
      PAYPAL_SDK = null;
      reject(new Error("PayPal didn't load"));
    };
    document.head.appendChild(s);
  });
  return PAYPAL_SDK;
}

function LoginGate({ onComplete, notice, prefill }) {
  const [mode, setMode] = useState("choose"); // choose | signup-account | login
  const [draft, setDraft] = useState(() => ({ ...emptyAccountDraft(), ...(prefill || {}) }));
  const [signupRole, setSignupRole] = useState("player"); // player | coach
  const [coachCode, setCoachCode] = useState("");
  const [loginUsername, setLoginUsername] = useState("");
  const [loginPassword, setLoginPassword] = useState("");
  const [roleChoice, setRoleChoice] = useState(null); // { profile, regs } when this email is both player and coach here
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  async function cloudSignup(username, email) {
    if (draft.password.length < 6) {
      setError("Pick a password with at least 6 characters.");
      return;
    }
    setBusy(true);
    setError("");
    const role = (draft.roles && draft.roles.cricket) || "player";
    let cred;
    try {
      cred = await cloudAuth.createUserWithEmailAndPassword(email, draft.password);
    } catch (e) {
      if (String((e && e.code) || "").includes("email-already-in-use")) return cloudAddSport(username, email, role);
      setBusy(false);
      setError(cloudAuthError(e));
      return;
    }
    const uid = cred.user.uid;
    CLOUD.uid = uid;
    try {
      await cloudDb.collection("usernames").doc(username.toLowerCase()).set({ uid });
    } catch (e) {
      try {
        await cred.user.delete();
      } catch (x) {
        // already gone
      }
      CLOUD.uid = null;
      setBusy(false);
      setError("That username is already taken.");
      return;
    }
    try {
      await cloudUseAccount(uid);
      // Bring over anything this person already logged on this phone.
      const local = await localStore.list("u:" + username.toLowerCase() + ":");
      for (const key of (local && local.keys) || []) {
        const v = localStorage.getItem(key);
        if (v !== null) await window.storage.set(key, v);
      }
    } catch (e) {
      // nothing to bring over
    }
    const publicProfile = { username, email, nationality: draft.nationality, age: Number(draft.age), sex: draft.sex, mainPosition: "", joinedAt: Date.now(), roles: { cricket: role }, role, registrations: { cricket: [role] } };
    await window.storage.set("profile:data", JSON.stringify(publicProfile));
    setBusy(false);
    onComplete(withActiveRole(profileView(publicProfile)));
  }

  // This email already has a Next Level account (another sport, or the other
  // role here). Same password proves it's them; then add this sport/role.
  async function cloudAddSport(username, email, role) {
    let cred;
    try {
      cred = await cloudAuth.signInWithEmailAndPassword(email, draft.password);
    } catch (e) {
      setBusy(false);
      setError("This email is already signed up to Next Level (maybe for another sport). To use it here too, enter the same password you used before — or use a different email.");
      return;
    }
    await cloudUseAccount(cred.user.uid);
    const raw = cloudMyProfile() || {};
    const regs = (raw.registrations && raw.registrations.cricket) || [];
    const bail = (msg) => {
      cloudAuth.signOut().catch(() => {});
      CLOUD.uid = null;
      CLOUD.cache = new Map();
      setBusy(false);
      setError(msg);
    };
    if (raw.username && raw.username.toLowerCase() !== username.toLowerCase())
      return bail(`This email is already signed up with the username "${raw.username}". Use that username, or use a different email for a new account.`);
    if (regs.includes(role)) return bail(`You're already signed up for Cricket as a ${ROLE_WORD[role]} with this email — go back and tap Log In.`);
    const next = {
      ...raw,
      username: raw.username || username,
      email,
      nationality: draft.nationality,
      age: Number(draft.age),
      sex: draft.sex,
      joinedAt: raw.joinedAt || Date.now(),
      registrations: { ...(raw.registrations || {}), cricket: [...regs, role] },
      roles: { ...(raw.roles || {}), cricket: role },
    };
    if (!raw.username) {
      try {
        await cloudDb.collection("usernames").doc(username.toLowerCase()).set({ uid: cred.user.uid });
      } catch (e) {
        return bail("That username is already taken.");
      }
    }
    await window.storage.set("profile:data", JSON.stringify(next));
    setBusy(false);
    onComplete(withActiveRole(profileView(next)));
  }

  async function cloudLogin() {
    const email = loginUsername.trim();
    if (!email || !loginPassword) {
      setError("Enter your email and password.");
      return;
    }
    setBusy(true);
    setError("");
    try {
      const cred = await cloudAuth.signInWithEmailAndPassword(email, loginPassword);
      await cloudUseAccount(cred.user.uid);
      let profile = cloudMyProfile();
      if (!profile) {
        profile = { username: email.split("@")[0], email, mainPosition: "" };
        await window.storage.set("profile:data", JSON.stringify(profile));
      }
      const regs = sportRegistrations(profile);
      if (!regs.length) {
        cloudAuth.signOut().catch(() => {});
        CLOUD.uid = null;
        CLOUD.cache = new Map();
        setBusy(false);
        setError("This account isn't signed up for Cricket yet. Tap Back, then Sign Up — you can use the same email and username.");
        return;
      }
      setBusy(false);
      if (regs.length > 1) {
        setRoleChoice({ profile, regs });
        return;
      }
      finishLogin(profile, regs[0]);
    } catch (e) {
      setBusy(false);
      setError(cloudAuthError(e));
    }
  }

  async function finishLogin(profile, role) {
    const view = { ...profileView(profile), role, roles: { ...(profile.roles || {}), cricket: role } };
    await window.storage.set("profile:data", JSON.stringify(view));
    if (!CLOUD.enabled) {
      const accounts = await getAccounts();
      saveAccounts(accounts.map((a) => (a.username.toLowerCase() === view.username.toLowerCase() ? { ...a, roles: view.roles } : a)));
    }
    setRoleChoice(null);
    onComplete(view);
  }

  async function resetPassword() {
    const email = loginUsername.trim();
    if (!email) {
      setError("Type your email above first, then tap Forgot password.");
      return;
    }
    try {
      await cloudAuth.sendPasswordResetEmail(email);
      setError("");
      setInfo(`If there's an account for ${email}, a reset link is on its way — check your inbox (and junk folder).`);
    } catch (e) {
      setError(cloudAuthError(e));
    }
  }

  async function getAccounts() {
    try {
      const res = await safeGet("accounts:list");
      return res ? JSON.parse(res.value) : [];
    } catch (e) {
      return [];
    }
  }
  async function saveAccounts(list) {
    window.storage.set("accounts:list", JSON.stringify(list)).catch(() => {});
  }

  async function goToPosition() {
    const username = draft.username.trim();
    if (!username) {
      setError("Enter a username.");
      return;
    }
    if (isOffensive(username)) {
      setError(OFFENSIVE_MSG);
      return;
    }
    const email = draft.email.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError("Enter a valid email address.");
      return;
    }
    if (!draft.password) {
      setError("Enter a password.");
      return;
    }
    if (!draft.nationality) {
      setError("Select your nationality.");
      return;
    }
    if (!draft.age || Number(draft.age) <= 0) {
      setError("Enter a valid age.");
      return;
    }
    if (Number(draft.age) < 13) {
      setError("You need to be 13 or over to use Next Level.");
      return;
    }
    if (!draft.sex) {
      setError("Choose your sex.");
      return;
    }
    if (CLOUD.enabled) return cloudSignup(username, email);
    const accounts = await getAccounts();
    const role = (draft.roles && draft.roles.cricket) || "player";
    const byEmail = accounts.find((a) => String(a.email || "").toLowerCase() === email.toLowerCase());
    const byName = accounts.find((a) => a.username.toLowerCase() === username.toLowerCase());
    const existing = byEmail || byName;
    if (existing) {
      if (byName && byEmail && byName !== byEmail) {
        setError("That username is already taken.");
        return;
      }
      if (String(existing.email || "").toLowerCase() !== email.toLowerCase()) {
        setError("That username is already taken.");
        return;
      }
      if (existing.username.toLowerCase() !== username.toLowerCase()) {
        setError(`This email is already signed up with the username "${existing.username}". Use that username, or use a different email for a new account.`);
        return;
      }
      if (existing.password !== draft.password) {
        setError("This email is already signed up to Next Level (maybe for another sport). To use it here too, enter the same password you used before — or use a different email.");
        return;
      }
      const regs = (existing.registrations && existing.registrations.cricket) || [];
      if (regs.includes(role)) {
        setError(`You're already signed up for Cricket as a ${ROLE_WORD[role]} with this email — go back and tap Log In.`);
        return;
      }
      const updated = {
        ...existing,
        nationality: draft.nationality,
        age: Number(draft.age),
        sex: draft.sex,
        registrations: { ...(existing.registrations || {}), cricket: [...regs, role] },
        roles: { ...(existing.roles || {}), cricket: role },
      };
      await saveAccounts(accounts.map((a) => (a === existing ? updated : a)));
      setError("");
      const pub = { ...updated };
      delete pub.password;
      window.storage.set("profile:data", JSON.stringify(pub)).catch(() => {});
      onComplete(withActiveRole(profileView(pub)));
      return;
    }
    setError("");
    finishSignup("");
  }

  async function finishSignup(mainPosition) {
    const accounts = await getAccounts();
    const account = {
      username: draft.username.trim(),
      email: draft.email.trim(),
      password: draft.password,
      nationality: draft.nationality,
      age: Number(draft.age),
      sex: draft.sex,
      mainPosition: mainPosition || "",
      joinedAt: Date.now(),
      roles: { cricket: (draft.roles && draft.roles.cricket) || "player" },
      role: (draft.roles && draft.roles.cricket) || "player",
      registrations: { cricket: [(draft.roles && draft.roles.cricket) || "player"] },
    };
    await saveAccounts([...accounts, account]);
    const publicProfile = { username: account.username, email: account.email, nationality: account.nationality, age: account.age, sex: account.sex, mainPosition: account.mainPosition, role: account.role, roles: account.roles, registrations: account.registrations };
    window.storage.set("profile:data", JSON.stringify(publicProfile)).catch(() => {});
    onComplete(withActiveRole(profileView(publicProfile)));
  }

  async function login() {
    if (CLOUD.enabled) return cloudLogin();
    if (!loginUsername.trim() || !loginPassword) {
      setError("Enter your username and password.");
      return;
    }
    const accounts = await getAccounts();
    const account = accounts.find(
      (a) => a.username.toLowerCase() === loginUsername.trim().toLowerCase() && a.password === loginPassword
    );
    if (!account) {
      setError("Incorrect username or password.");
      return;
    }
    setError("");
    const pub = { ...account };
    delete pub.password;
    const regs = sportRegistrations(pub);
    if (!regs.length) {
      setError("This account isn't signed up for Cricket yet. Tap Back, then Sign Up — you can use the same email and username.");
      return;
    }
    if (regs.length > 1) {
      setRoleChoice({ profile: pub, regs });
      return;
    }
    finishLogin(pub, regs[0]);
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0F1F17", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <style>{css}</style>
      <div className="card" style={{ maxWidth: 420, width: "100%" }}>
        <div style={{ textAlign: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 44, lineHeight: 1 }}>{CRICKET_UI.emoji}</div>
          <h1 style={{ margin: "8px 0 2px", color: "#F5EFE2" }}>Next Level Cricket</h1>
          <div style={{ fontSize: 13, color: "#9FB3A4" }}>Sign up separately for each sport — you can use the same email and username.</div>
          {notice && <div style={{ fontSize: 13, color: "#E0B34A", marginTop: 10 }}>{notice}</div>}
        </div>

        {mode === "choose" && (
          <>
            <p className="hint">Already signed up for Cricket? Log in. New to Cricket (even if you use another Next Level sport)? Sign up.</p>
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button className="save-btn" style={{ flex: 1 }} onClick={() => { setError(""); setMode("login"); }}>
                Log In
              </button>
              <button
                style={{ flex: 1, background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, cursor: "pointer" }}
                onClick={() => { setError(""); setMode("signup-account"); }}
              >
                Sign Up
              </button>
            </div>
          </>
        )}

        {mode === "login" && roleChoice && (
          <>
            <p className="hint">You're signed up for Cricket as both a player and a coach with this email. Which one are you logging in as?</p>
            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              {roleChoice.regs.map((r) => (
                <button key={r} className="save-btn" style={{ flex: 1 }} onClick={() => finishLogin(roleChoice.profile, r)}>
                  {r === "coach" ? "📋 Coach" : "🏃 Player"}
                </button>
              ))}
            </div>
          </>
        )}
        {mode === "login" && !roleChoice && (
          <>
            <p className="hint">{CLOUD.enabled ? "Enter your email and password." : "Enter your username and password."}</p>
            <label className="field">
              <span>{CLOUD.enabled ? "Email" : "Username"}</span>
              <input
                type={CLOUD.enabled ? "email" : "text"}
                value={loginUsername}
                onChange={(e) => setLoginUsername(e.target.value)}
                autoFocus
                autoCapitalize="none"
              />
            </label>
            <label className="field" style={{ marginTop: 12 }}>
              <span>Password</span>
              <input
                type="password"
                value={loginPassword}
                onChange={(e) => setLoginPassword(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") login(); }}
              />
            </label>
            {error && <p className="hint" style={{ color: "#F87171" }}>{error}</p>}
            {info && <p className="hint" style={{ color: "#8FD9A0" }}>{info}</p>}
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <button
                onClick={() => { setError(""); setInfo(""); setMode("choose"); }}
                style={{ background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
              >
                Back
              </button>
              <button className="save-btn" onClick={login} disabled={busy}>
                {busy ? "Logging in…" : "Log In"}
              </button>
            </div>
            {CLOUD.enabled && (
              <button type="button" onClick={resetPassword} style={{ marginTop: 12, background: "none", border: "none", color: "#9FB3A4", fontSize: 13, cursor: "pointer", padding: 0 }}>
                Forgot password?
              </button>
            )}
          </>
        )}

        {mode === "signup-account" && (
          <>
            <div style={{ background: "#1B2A20", border: "2px solid #3B82F6", borderRadius: 10, padding: "10px 12px", marginBottom: 12, color: "#F5EFE2", fontWeight: 700, textAlign: "center" }}>
              {CRICKET_UI.emoji} You're signing up for Cricket
            </div>
            <p className="hint">Are you signing up as a player or a coach?</p>
            <div style={{ display: "flex", gap: 6, marginBottom: 14, background: "#0F1F17", borderRadius: 10, padding: 4 }}>
              {[
                ["player", "Player"],
                ["coach", "Coach"],
              ].map(([r, label]) => (
                <button
                  key={r}
                  type="button"
                  aria-pressed={(draft.roles || {}).cricket === r}
                  onClick={() => { setDraft({ ...draft, roles: { cricket: r } }); setError(""); }}
                  style={{
                    flex: 1,
                    padding: "9px 0",
                    borderRadius: 10,
                    border: "none",
                    cursor: "pointer",
                    fontFamily: "inherit",
                    fontWeight: 600,
                    fontSize: 14,
                    background: (draft.roles || {}).cricket === r ? "#3B82F6" : "transparent",
                    color: (draft.roles || {}).cricket === r ? "#0F1F17" : "#9FB3A4",
                  }}
                >
                  {label}
                </button>
              ))}
            </div>
            <p className="hint" style={{ marginTop: 0, marginBottom: 6 }}>
              You need to be 13 or over. By creating an account you agree to our{" "}
              <a href="terms.html" target="_blank" rel="noopener" style={{ color: "#8CB4FF" }}>Terms</a> and{" "}
              <a href="privacy.html" target="_blank" rel="noopener" style={{ color: "#8CB4FF" }}>Privacy Policy</a>.
            </p>
            <p className="hint">Choose a username, add your email and a password, and tell us a bit about you.</p>
            <label className="field">
              <span>Username</span>
              <input type="text" value={draft.username} onChange={(e) => setDraft({ ...draft, username: e.target.value })} autoFocus autoCapitalize="none" />
            </label>
            <label className="field" style={{ marginTop: 12 }}>
              <span>Email address</span>
              <input type="email" placeholder="you@example.com" value={draft.email} onChange={(e) => setDraft({ ...draft, email: e.target.value })} autoCapitalize="none" />
            </label>
            <label className="field" style={{ marginTop: 12 }}>
              <span>Password</span>
              <input type="password" value={draft.password} onChange={(e) => setDraft({ ...draft, password: e.target.value })} />
            </label>
            <label className="field" style={{ marginTop: 12 }}>
              <span>Nationality</span>
              <select value={draft.nationality} onChange={(e) => setDraft({ ...draft, nationality: e.target.value })}>
                <option value="">Select a country</option>
                {COUNTRIES.map((c) => (
                  <option key={c} value={c}>
                    {c}
                  </option>
                ))}
              </select>
            </label>
            <div style={{ marginTop: 12, maxWidth: 160 }}>
              <NumberField label="Age" value={draft.age === "" ? 0 : draft.age} onChange={(v) => setDraft({ ...draft, age: v })} min={1} />
            </div>
            <div style={{ marginTop: 12 }}>
              <span style={{ display: "block", fontSize: 13, color: "#9FB3A4", marginBottom: 6 }}>Sex</span>
              <div style={{ display: "flex", gap: 6, background: "#0F1F17", borderRadius: 10, padding: 4 }}>
                {SEX_OPTIONS.map(([v, label]) => (
                  <button
                    key={v}
                    type="button"
                    aria-pressed={draft.sex === v}
                    onClick={() => setDraft({ ...draft, sex: v })}
                    style={{ flex: 1, padding: "9px 0", borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "inherit", fontWeight: 600, fontSize: 13, background: draft.sex === v ? "#3B82F6" : "transparent", color: draft.sex === v ? "#0F1F17" : "#9FB3A4" }}
                  >
                    {label}
                  </button>
                ))}
              </div>
            </div>

            {error && <p className="hint" style={{ color: "#F87171" }}>{error}</p>}

            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <button
                onClick={() => { setError(""); setMode("choose"); }}
                style={{ background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
              >
                Back
              </button>
              <button className="save-btn" onClick={goToPosition}>
                Continue
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [tour, setTour] = useState(() => {
    try {
      return !localStorage.getItem("nlx:tourDone");
    } catch (e) {
      return false;
    }
  });
  const [lastTab, setLastTab] = useState({ progress: "streak", fitness: "nutrition" });
  const [sport, setSport] = useState(null);
  const [profile, setProfile] = useState(null);
  const [profileLoaded, setProfileLoaded] = useState(false);
  const [blocked, setBlocked] = useState(null);
  const [subs, setSubs] = useState(null);
  const subsKey = profile ? `${profile.username}|${profile.role}` : "";
  useEffect(() => {
    if (!PAYWALL_ON || !profile) return;
    setSubs(null);
    subsLoad().then(setSubs);
  }, [subsKey]);
  useEffect(() => {
    if (profile && CLOUD.enabled && CLOUD.uid) cloudCheckBlocked().then(setBlocked);
  }, [profile && profile.username]);

  useEffect(() => {
    async function loadProfile() {
      await CLOUD.ready;
      if (CLOUD.enabled && !CLOUD.uid) {
        setProfileLoaded(true);
        return;
      }
      try {
        const res = await safeGet("profile:data");
        if (res) setProfile(withActiveRole(profileView(JSON.parse(res.value))));
      } catch (e) {
        // no profile saved yet
      }
      setProfileLoaded(true);
    }
    loadProfile();
  }, []);
  useEffect(() => {
    if (!profile || !profile.username || profile.role === "coach") return;
    NL.ns = cricketUserPrefix(profile.username);
    nlStreakCheck(true);
  }, [profile && profile.username, profile && profile.role]);

  if (!profileLoaded) {
    return (
      <div style={{ minHeight: "100vh", background: "#0F1F17" }}>
        <style>{css}</style>
        <LoadingSkeleton pad />
      </div>
    );
  }

  if (blocked && profile) {
    return (
      <SuspendedScreen
        onLogout={() => {
          if (CLOUD.enabled) cloudAuth.signOut().catch(() => {});
          setBlocked(null);
          setProfile(null);
        }}
      />
    );
  }

  if (!profile || profile.coach || !sportRegistrations(profile).length) {
    return (
      <LoginGate
        onComplete={setProfile}
        notice={profile && profile.username ? `You're signed in as ${profile.username}, but you haven't signed up for Cricket yet. Sign up below (same email and username is fine), or log in with another account.` : null}
        prefill={profile && profile.username ? { username: profile.username, email: profile.email || "" } : null}
      />
    );
  }

  if (PAYWALL_ON && subs === null) {
    return (
      <div style={{ minHeight: "100vh", background: "#0F1F17" }}>
        <style>{css}</style>
        <p className="hint" style={{ padding: 20, color: "#EFE9DD" }}>
          Checking your plan…
        </p>
      </div>
    );
  }
  if (PAYWALL_ON && !subAccess(subs, profile.role)) {
    return (
      <Paywall
        profile={profile}
        ended={subs.some((x) => x.status === "ended" || (x.status === "trial" && Date.now() > x.trialEnds + GRACE_DAYS * 864e5))}
        onDone={() => subsLoad().then(setSubs)}
        onLogout={() => {
          if (CLOUD.enabled) cloudAuth.signOut().catch(() => {});
          CLOUD.uid = null;
          CLOUD.cache = new Map();
          if (!CLOUD.enabled) window.storage.delete("profile:data").catch(() => {});
          setSubs(null);
          setProfile(null);
        }}
      />
    );
  }

  const isCoach = profile.role === "coach";
  NL.ns = cricketUserPrefix(profile.username);

  // The bottom bar stays on every screen (hidden only while a live tally,
  // scorecard or guided timer is running — see useFocusMode).
  function goPage(p) {
    if (p === "streak" || p === "trophies") setLastTab((t) => ({ ...t, progress: p }));
    if (p === "nutrition" || p === "recovery") setLastTab((t) => ({ ...t, fitness: p }));
    setSport(null);
    setPage(p);
    window.scrollTo(0, 0);
  }
  const bottomNav = (
    <nav className="bottom-nav">
      <button className={page === "home" || sport ? "active" : ""} onClick={() => goPage("home")}>
        <span className="nav-icon">🏠</span>
        Home
      </button>
      {!isCoach && (
        <button className={!sport && ["streak", "trophies"].includes(page) ? "active" : ""} onClick={() => goPage(lastTab.progress)}>
          <span className="nav-icon">🔥</span>
          Progress
        </button>
      )}
      {!isCoach && (
        <button className={!sport && page === "plan" ? "active" : ""} onClick={() => goPage("plan")}>
          <span className="nav-icon">🗓️</span>
          Plan
        </button>
      )}
      {!isCoach && (
        <button className={!sport && ["nutrition", "recovery"].includes(page) ? "active" : ""} onClick={() => goPage(lastTab.fitness)}>
          <span className="nav-icon">💪</span>
          Fitness
        </button>
      )}
      <button
        className={!sport && ["settings", "profile", "account", "about", "help"].includes(page) ? "active" : ""}
        onClick={() => goPage("settings")}
      >
        <span className="nav-icon">⚙️</span>
        Settings
      </button>
    </nav>
  );

  function handleLogout() {
    if (CLOUD.enabled) {
      // Your data stays safe online — just sign this phone out.
      cloudAuth.signOut().catch(() => {});
      CLOUD.uid = null;
      CLOUD.cache = new Map();
    } else {
      window.storage.delete("profile:data").catch(() => {});
    }
    setProfile(null);
    setSport(null);
    setPage("home");
  }


  if (sport === "cricket") {
    return (
      <>
        <style>{css}</style>
        <div className="with-nav nl-page">
          <CricketApp onBack={() => setSport(null)} profile={profile} onProfileChange={setProfile} />
          <CoachBot />
        </div>
        {bottomNav}
      </>
    );
  }

  if (sport === "gym" && isCoach) {
    return (
      <>
        <style>{css}</style>
        <div className="with-nav nl-page">
          <CoachDashboard onExit={() => setSport(null)} profile={profile} gymView />
        </div>
        {bottomNav}
      </>
    );
  }

  if (sport === "gym" && !isCoach) {
    return (
      <>
        <style>{css}</style>
        <div className="with-nav nl-page">
          <GymApp onBack={() => setSport(null)} />
          <CoachBot />
        </div>
        {bottomNav}
      </>
    );
  }

  return (
    <div className="landing">
      <style>{css}</style>
      {!isCoach && ["streak", "trophies"].includes(page) && (
        <SubTabs tabs={[["streak", "🔥 Streak"], ["trophies", "🏆 Trophies"]]} page={page} onPick={goPage} />
      )}
      {!isCoach && ["nutrition", "recovery"].includes(page) && (
        <SubTabs tabs={[["nutrition", "🍽️ Nutrition"], ["recovery", "🧘 Recovery"]]} page={page} onPick={goPage} />
      )}
      <div key={page} className="nl-page">
      {page === "home" && <SportHome onSelect={(key) => (key === "streak" ? goPage("streak") : setSport(key))} isCoach={isCoach} />}
      {!isCoach && page === "streak" && <StreakPage profile={profile} />}
      {isCoach && page === "home" && (
        <p className="hint" style={{ textAlign: "center", padding: "0 20px" }}>
          As a coach you see what your players share — open {ACTIVITY_OPTIONS[0]} for your teams, or Gym for their workouts.
        </p>
      )}
      {page === "profile" && <ProfilePage />}
      {page === "account" && <AccountSettingsPage onProfileChange={setProfile} />}
      {page === "about" && <AboutUs />}
      {!isCoach && page === "plan" && <WeeklyPlanner />}
      {!isCoach && page === "nutrition" && <NutritionApp />}
      {!isCoach && page === "recovery" && <RecoveryApp />}
      {!isCoach && page === "trophies" && <AchievementsPage onLog={() => goPage("streak")} />}
      {page === "help" && <HelpPage />}
      {page === "settings" && <SettingsPage onNavigate={setPage} onLogout={handleLogout} />}
      </div>
      {tour && !isCoach && (
        <WelcomeTour
          onClose={(go) => {
            try {
              localStorage.setItem("nlx:tourDone", "1");
            } catch (e) {}
            setTour(false);
            if (go) goPage("streak");
          }}
        />
      )}
      <CoachBot />
      {bottomNav}
    </div>
  );
}

/* ===== Next Level brand look (blue accent, sporty headings, 44px taps) ===== */
:root {
  --nl-accent: #3B82F6;
  --nl-accent-press: #2563EB;
  --nl-accent-text: #60A5FA;
  --nl-on-accent: #0F1F17;
  --nl-radius: 10px;
  --nl-radius-card: 14px;
  --nl-tap: 44px;
  --nl-font-head: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
}
h1, h2, h3, .stat-num, .crest { font-family: var(--nl-font-head); letter-spacing: 0.3px; }
h1, h2 { font-weight: 700; line-height: 1.1; }
.card h2 { font-size: 23px; }
.card h3 { font-weight: 700; font-size: 15px; letter-spacing: 0.8px; }
.about-page h1 { font-size: 32px; }
.stat-num { font-size: 26px; font-weight: 700; }
.home-header h1 { font-size: 44px; text-transform: uppercase; letter-spacing: 1px; }
/* Every button, field and tap area is at least 44px tall */
button, select, textarea,
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]) { min-height: var(--nl-tap); }
button { touch-action: manipulation; }
.checkbox-row { min-height: var(--nl-tap); }
.field input, .match-select, .new-match-row input, .sk-notes, select, textarea { font-size: 16px; border-radius: var(--nl-radius); }
.new-match-row input { min-width: 0; }
.save-btn { min-height: 48px; font-size: 15px; font-weight: 700; border-radius: var(--nl-radius); }
.save-btn:hover { background: var(--nl-accent); }
.save-btn:active, .nl-btn:active, .sub-tabs button.active:active, .sk-pick button.active:active, .amount-row .amount-done:active { background: var(--nl-accent-press); color: #FFFFFF; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--nl-accent-text); outline-offset: 2px; }
.tiny-btn, .sk-del, .entry-row button { padding: 6px 12px; font-size: 12px; }
.card { border-radius: var(--nl-radius-card); }
/* Empty states */
.nl-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 28px 16px; margin-top: 12px; }
.nl-empty-icon { width: 72px; height: 72px; border-radius: 50%; background: #0F1F17; border: 1px solid #2A4433; display: flex; align-items: center; justify-content: center; font-size: 34px; line-height: 1; }
.nl-empty-text { margin: 0; max-width: 320px; color: #C8D6CC; font-size: 14px; line-height: 1.5; }
.nl-btn { min-height: var(--nl-tap); padding: 0 22px; border: none; border-radius: var(--nl-radius); background: var(--nl-accent); color: var(--nl-on-accent); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
/* Loading placeholders */
.nl-skel-wrap { display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; padding: 4px 0; }
.nl-skel { border-radius: var(--nl-radius); background: #1B2A20; background-image: linear-gradient(90deg, #1B2A20 0%, #26392C 50%, #1B2A20 100%); background-size: 200% 100%; animation: nl-shimmer 1.2s ease-in-out infinite; }
.nl-skel-title { height: 28px; width: 55%; }
.nl-skel-line { height: 14px; }
.nl-skel-block { height: 120px; border-radius: var(--nl-radius-card); }
@keyframes nl-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .nl-skel { animation: none; } }
/* ===== Part 2: feel — transitions, toasts, confetti, welcome tour ===== */
.nl-page, .main > section, .tabs ~ .card { animation: nl-in 0.18s ease-out both; }
@keyframes nl-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bottom-nav button, .sub-tabs button, .tabs button, .sk-pick button, .entry-filter-strip button, .nl-btn, .save-btn { transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
.save-btn:active, .nl-btn:active { transform: scale(0.98); }
.nl-toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: #F5EFE2; color: #0F1F17; padding: 12px 22px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 15px; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); z-index: 90; pointer-events: none; animation: nl-toast-in 0.18s ease-out both; transition: opacity 0.2s ease; }
.nl-toast.out { opacity: 0; }
@keyframes nl-toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.nl-burst { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 95; }
.nl-tour { position: fixed; inset: 0; z-index: 100; background: rgba(5, 10, 8, 0.92); display: flex; align-items: center; justify-content: center; padding: 16px; }
.nl-tour-card { position: relative; width: 100%; max-width: 360px; background: #16261C; border: 1px solid #2A4433; border-radius: var(--nl-radius-card); padding: 40px 24px 24px; text-align: center; animation: nl-in 0.18s ease-out both; }
.nl-tour-skip { position: absolute; top: 6px; right: 6px; background: transparent; border: none; color: #C8D6CC; font-family: inherit; font-size: 14px; font-weight: 600; padding: 0 14px; border-radius: var(--nl-radius); cursor: pointer; }
.nl-tour-icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
.nl-tour-step { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: #9FB3A4; }
.nl-tour h2 { margin: 0 0 10px; font-size: 32px; color: #F5EFE2; }
.nl-tour-text { margin: 0 0 18px; color: #DCE5DE; font-size: 15px; line-height: 1.5; }
.nl-tour-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
.nl-tour-dots span { width: 8px; height: 8px; border-radius: 50%; background: #2A4433; }
.nl-tour-dots span.on { background: var(--nl-accent); width: 22px; border-radius: 999px; }
.nl-tour-next { width: 100%; min-height: 48px; }
@media (prefers-reduced-motion: reduce) {
  .nl-page, .main > section, .tabs ~ .card, .nl-toast, .nl-tour-card { animation: none !important; }
  .bottom-nav button, .sub-tabs button, .tabs button, .sk-pick button, .entry-filter-strip button, .nl-btn, .save-btn { transition: none; }
  .save-btn:active, .nl-btn:active { transform: none; }
}
`;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
