const { useState, useEffect, useMemo, useRef } = React;

// window.storage only exists inside Claude's own artifact preview. When this file
// is hosted anywhere else (Netlify, etc.), fall back to the browser's own
// localStorage so every feature that saves data keeps working.
if (!window.storage) {
  window.storage = {
    async get(key) {
      try {
        const raw = localStorage.getItem("nl:" + key);
        if (raw === null) return null;
        return { key, value: raw };
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem("nl:" + key, value);
        return { key, value };
      } catch (e) {
        return null;
      }
    },
    async delete(key) {
      try {
        localStorage.removeItem("nl:" + key);
        return { key, deleted: true };
      } catch (e) {
        return null;
      }
    },
    async list(prefix) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("nl:")) {
            const stripped = k.slice(3);
            if (!prefix || stripped.startsWith(prefix)) keys.push(stripped);
          }
        }
        return { keys, prefix };
      } catch (e) {
        return { keys: [], prefix };
      }
    },
  };
}

window.storage = {
  get: async (key, shared) => {
    const k = shared ? "shared:" + key : key;
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("not found");
    return { key, value: v, shared: !!shared };
  },
  set: async (key, value, shared) => {
    const k = shared ? "shared:" + key : key;
    localStorage.setItem(k, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    const k = shared ? "shared:" + key : key;
    localStorage.removeItem(k);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    const p = shared ? "shared:" + (prefix || "") : (prefix || "");
    const keys = Object.keys(localStorage).filter((k) => k.startsWith(p));
    return { keys, prefix, shared: !!shared };
  },
};

// ---------- Cloud sync (Firebase) ----------
// When Firebase loads, everything a signed-in player saves goes to their own
// private space online (users/{uid}/kv), so it follows them to any phone.
// "My team" logs are also copied to sharedLogs so their coach can read them,
// and teams + join requests live online so coach and players can be on
// different phones. If Firebase can't load, the app falls back to this phone.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDBxWSu4RMjYC_EQsDvHPepJXtfhiAIQII",
  authDomain: "next-level-75393.firebaseapp.com",
  projectId: "next-level-75393",
  storageBucket: "next-level-75393.firebasestorage.app",
  messagingSenderId: "1038931274305",
  appId: "1:1038931274305:web:9dfc554eacd086ba0f34c0",
};
const CLOUD = { enabled: false, uid: null, cache: new Map(), ready: null, teamsSnapshot: [], nameToUid: {} };
let cloudAuth = null;
let cloudDb = null;
if (window.firebase && window.firebase.initializeApp) {
  try {
    if (!window.firebase.apps || !window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
    cloudAuth = window.firebase.auth();
    cloudDb = window.firebase.firestore();
    if (cloudDb.enablePersistence) cloudDb.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    CLOUD.enabled = true;
  } catch (e) {
    console.warn("Cloud sync unavailable — saving on this phone only.", e);
  }
}
const localStore = window.storage;

function cloudKvDoc(uid, key) {
  return cloudDb.collection("users").doc(uid).collection("kv").doc(encodeURIComponent(key));
}

async function cloudLoadCache(uid) {
  const cache = new Map();
  const prev = CLOUD.uid === uid ? CLOUD.cache : new Map();
  const snap = await cloudDb.collection("users").doc(uid).collection("kv").get();
  snap.forEach((d) => {
    const v = d.data();
    if (v && v.value !== undefined && v.value !== null) cache.set(decodeURIComponent(d.id), String(v.value));
  });
  prev.forEach((v, key) => {
    if (!cache.has(key)) cache.set(key, v);
  });
  CLOUD.cache = cache;
}

// Signing in on this phone: point storage at this account's cloud space.
async function cloudUseAccount(uid) {
  CLOUD.uid = uid;
  await cloudLoadCache(uid);
}

CLOUD.ready = new Promise((resolve) => {
  if (!CLOUD.enabled) return resolve();
  let first = true;
  cloudAuth.onAuthStateChanged(async (user) => {
    if (user && CLOUD.uid !== user.uid) {
      try {
        await cloudUseAccount(user.uid);
      } catch (e) {
        console.warn("Couldn't load your saved data", e);
      }
    }
    if (!user) {
      CLOUD.uid = null;
      CLOUD.cache = new Map();
    }
    if (first) {
      first = false;
      resolve();
    }
  });
});

window.storage = {
  get: async (key, shared) => {
    if (CLOUD.enabled && CLOUD.uid && !shared) {
      if (!CLOUD.cache.has(key)) throw new Error("not found");
      return { key, value: CLOUD.cache.get(key), shared: false };
    }
    return localStore.get(key, shared);
  },
  set: async (key, rawValue, shared) => {
    const value = String(rawValue);
    if (CLOUD.enabled && CLOUD.uid && !shared) {
      CLOUD.cache.set(key, value);
      cloudKvDoc(CLOUD.uid, key)
        .set({ value, updatedAt: Date.now() })
        .catch((e) => console.warn("Couldn't save", key, e));
      cloudAfterSave(key, value);
      return { key, value, shared: false };
    }
    return localStore.set(key, value, shared);
  },
  delete: async (key, shared) => {
    if (CLOUD.enabled && CLOUD.uid && !shared) {
      CLOUD.cache.delete(key);
      cloudKvDoc(CLOUD.uid, key).delete().catch(() => {});
      return { key, deleted: true, shared: false };
    }
    return localStore.delete(key, shared);
  },
  list: async (prefix, shared) => {
    if (CLOUD.enabled && CLOUD.uid && !shared) {
      return { keys: [...CLOUD.cache.keys()].filter((k) => k.startsWith(prefix || "")), prefix, shared: false };
    }
    return localStore.list(prefix, shared);
  },
};

function cloudPositionSlugs() {
  return CRICKET_POSITIONS.flatMap((p) => CRICKET_SUB_POSITIONS[p] || [p]).map((p) => ({ slug: slugify(p), label: p }));
}

function cloudMyProfile() {
  try {
    return JSON.parse(CLOUD.cache.get("profile:data") || "null");
  } catch (e) {
    return null;
  }
}

// After a save: keep the public profile and the coach's shared copy up to date.
function cloudAfterSave(key, value) {
  try {
    const profile = cloudMyProfile();
    if (key === "profile:data" && profile) {
      cloudDb
        .collection("publicProfiles")
        .doc(CLOUD.uid)
        .set({ username: profile.username, usernameLower: String(profile.username).toLowerCase(), positions: profile.positions || {}, roles: profile.roles || {}, registrations: profile.registrations || {}, joinedAt: profile.joinedAt || null })
        .catch(() => {});
      return;
    }
    if (!profile || !profile.username) return;
    const prefix = cricketUserPrefix(profile.username) + "cricket:";
    if (!key.startsWith(prefix)) return;
    const rest = key.slice(prefix.length);
    if (rest === "matches") {
      cloudPositionSlugs().forEach((p) => {
        const v = CLOUD.cache.get(prefix + p.slug);
        if (v) cloudSyncShared(p, v, profile, prefix);
      });
      return;
    }
    const pos = cloudPositionSlugs().find((p) => p.slug === rest);
    if (pos) cloudSyncShared(pos, value, profile, prefix);
  } catch (e) {
    console.warn("Shared sync skipped", e);
  }
}

// Only "My team" logs are copied — "Just me" logs never leave the player's private space.
function cloudSyncShared(pos, value, profile, prefix) {
  let entries = [];
  try {
    entries = JSON.parse(value) || [];
  } catch (e) {
    return;
  }
  let matches = [];
  try {
    matches = JSON.parse(CLOUD.cache.get(prefix + "matches") || "[]");
  } catch (e) {
    matches = [];
  }
  const byTeam = {};
  entries
    .filter((e) => e.sharedWithTeam && e.teamId)
    .forEach((e) => {
      const m = e.matchId ? matches.find((x) => x.id === e.matchId) : null;
      const { video, videoAnalysis, ...rest } = e;
      (byTeam[e.teamId] = byTeam[e.teamId] || []).push({ ...rest, result: m ? m.result : null, opponent: m ? m.opponent : null });
    });
  // If a shared log was removed, the coach's copy needs emptying too — but only
  // for teams this player has shared with before (members only can write).
  let sharedBefore = [];
  try {
    sharedBefore = JSON.parse(CLOUD.cache.get(`cricket:sharedTeams:${pos.slug}`) || "[]");
  } catch (e) {
    sharedBefore = [];
  }
  sharedBefore.forEach((t) => {
    if (!byTeam[t]) byTeam[t] = [];
  });
  const nowShared = Object.keys(byTeam).filter((t) => byTeam[t].length);
  if (JSON.stringify(nowShared.sort()) !== JSON.stringify(sharedBefore.slice().sort())) {
    CLOUD.cache.set(`cricket:sharedTeams:${pos.slug}`, JSON.stringify([...new Set([...sharedBefore, ...nowShared])]));
    cloudKvDoc(CLOUD.uid, `cricket:sharedTeams:${pos.slug}`).set({ value: CLOUD.cache.get(`cricket:sharedTeams:${pos.slug}`), updatedAt: Date.now() }).catch(() => {});
  }
  Object.entries(byTeam).forEach(([teamId, list]) => {
    cloudDb
      .collection("sharedLogs")
      .doc(`${CLOUD.uid}__${teamId}__${pos.slug}`)
      .set({ uid: CLOUD.uid, username: profile.username, teamId: String(teamId), sport: "cricket", pos: pos.label, entries: cleanDeep(list), updatedAt: Date.now() })
      .catch((e) => console.warn("Couldn't share with coach", e));
  });
}

// ---- Teams online ----
// Teams are private: only the coach, the team's players and anyone who has
// asked to join can see one. Players find a team with its join code, which the
// coach hands out in person, so nobody can join a team just by knowing its name.
// Screen shape: { id, name, code, verified, coach, coachUid, members: [username],
//                 pending: [username], declined: [username], memberPos: {username: position} }
async function cloudLoadTeams() {
  if (!CLOUD.uid) return [];
  const col = cloudDb.collection("teams");
  const none = { docs: [] };
  const [asCoach, asMember] = await Promise.all([
    col.where("coachUid", "==", CLOUD.uid).get().catch(() => none),
    col.where("members", "array-contains", CLOUD.uid).get().catch(() => none),
  ]);
  const found = new Map();
  [...asCoach.docs, ...asMember.docs].forEach((d) => {
    if (d.data().sport === "cricket") found.set(d.id, d.data());
  });
  const myReqTeam = CLOUD.cache.get("cricket:myTeamId");
  let myReq = null;
  if (myReqTeam && !found.has(String(myReqTeam))) {
    try {
      const r = await col.doc(String(myReqTeam)).collection("requests").doc(CLOUD.uid).get();
      if (r.exists) {
        myReq = r.data();
        const t = await col.doc(String(myReqTeam)).get();
        if (t.exists) found.set(String(myReqTeam), t.data());
      }
    } catch (e) {
      // the team was removed, or the request withdrawn
    }
  }
  CLOUD.reqInfo = CLOUD.reqInfo || {};
  const teams = await Promise.all(
    [...found.entries()].map(async ([id, t]) => {
      const names = t.memberNames || {};
      const pos = t.memberPos || {};
      const team = {
        id,
        name: t.name,
        code: t.code || "",
        verified: !!t.verified,
        coach: t.coachName,
        coachUid: t.coachUid,
        members: (t.members || []).map((u) => names[u] || u),
        pending: [],
        declined: [],
        memberPos: {},
      };
      (t.members || []).forEach((u) => {
        CLOUD.nameToUid[names[u] || u] = u;
        team.memberPos[names[u] || u] = pos[u] || "";
      });
      if (t.coachUid === CLOUD.uid) {
        const reqs = await col.doc(id).collection("requests").get().catch(() => none);
        reqs.docs.forEach((r) => {
          const q = r.data();
          CLOUD.nameToUid[q.username] = r.id;
          CLOUD.reqInfo[r.id] = q;
          if (q.status === "pending") team.pending.push(q.username);
          if (q.status === "declined") team.declined.push(q.username);
        });
      } else if (myReq && String(myReqTeam) === id) {
        if (myReq.status === "pending") team.pending.push(myReq.username);
        if (myReq.status === "declined") team.declined.push(myReq.username);
      }
      return team;
    })
  );
  CLOUD.teamsSnapshot = JSON.parse(JSON.stringify(teams));
  return teams;
}

// Coach changes: works out what changed since the last load and makes just
// those changes online (new team + its code, accept, decline, remove, delete).
function cloudSaveTeams(next) {
  const before = CLOUD.teamsSnapshot || [];
  const me = cloudMyProfile();
  const myName = me ? me.username : null;
  const FV = window.firebase.firestore.FieldValue;
  const ops = [];
  next.forEach((t) => {
    const id = String(t.id);
    const old = before.find((b) => String(b.id) === id);
    const ref = cloudDb.collection("teams").doc(id);
    if (!old) {
      if (!t.code) return;
      ops.push(
        ref
          .set({ name: t.name, nameLower: String(t.name).toLowerCase(), sport: "cricket", coachUid: CLOUD.uid, coachName: myName, code: t.code, members: [], memberNames: {}, memberPos: {}, verified: false, createdAt: Date.now() })
          .then(() => cloudDb.collection("teamCodes").doc(t.code).set({ teamId: id, teamName: t.name, coachName: myName, coachUid: CLOUD.uid, sport: "cricket", verified: false }))
      );
      return;
    }
    if (old.coachUid !== CLOUD.uid) return;
    const added = (t.members || []).filter((m) => !(old.members || []).includes(m));
    const removed = (old.members || []).filter((m) => !(t.members || []).includes(m));
    added.forEach((name) => {
      const uid = CLOUD.nameToUid[name];
      if (!uid) return;
      const position = (CLOUD.reqInfo[uid] || {}).position || "";
      ops.push(ref.update({ members: FV.arrayUnion(uid), [`memberNames.${uid}`]: name, [`memberPos.${uid}`]: position }).then(() => ref.collection("requests").doc(uid).delete()));
    });
    removed.forEach((name) => {
      const uid = CLOUD.nameToUid[name];
      if (!uid) return;
      ops.push(ref.update({ members: FV.arrayRemove(uid), [`memberNames.${uid}`]: FV.delete(), [`memberPos.${uid}`]: FV.delete() }));
    });
    const newlyDeclined = (t.declined || []).filter((n) => !(old.declined || []).includes(n));
    newlyDeclined.forEach((name) => {
      const uid = CLOUD.nameToUid[name];
      if (uid && uid !== CLOUD.uid) ops.push(ref.collection("requests").doc(uid).set({ username: name, status: "declined", position: (CLOUD.reqInfo[uid] || {}).position || "", at: Date.now() }));
    });
  });
  before.forEach((b) => {
    if (b.coachUid !== CLOUD.uid || next.some((t) => String(t.id) === String(b.id))) return;
    ops.push(cloudDeleteTeam(b));
  });
  CLOUD.teamsSnapshot = JSON.parse(JSON.stringify(next));
  return Promise.all(ops).catch((e) => console.warn("Team change failed", e));
}

async function cloudDeleteTeam(team) {
  const ref = cloudDb.collection("teams").doc(String(team.id));
  const reqs = await ref.collection("requests").get().catch(() => ({ docs: [] }));
  await Promise.all(reqs.docs.map((r) => r.ref.delete().catch(() => {})));
  if (team.code) await cloudDb.collection("teamCodes").doc(team.code).delete().catch(() => {});
  await ref.delete();
}

async function cloudFindTeamByCode(code) {
  const d = await cloudDb.collection("teamCodes").doc(code).get();
  if (!d.exists) return null;
  const t = d.data();
  if (t.sport !== "cricket") return { wrongSport: t.sport };
  return { id: t.teamId, name: t.teamName, coach: t.coachName, coachUid: t.coachUid, verified: !!t.verified };
}

async function cloudRequestJoin(team, position) {
  const me = cloudMyProfile();
  const prev = CLOUD.cache.get("cricket:myTeamId");
  if (prev && prev !== String(team.id)) {
    await cloudDb.collection("teams").doc(prev).collection("requests").doc(CLOUD.uid).delete().catch(() => {});
  }
  await cloudDb.collection("teams").doc(String(team.id)).collection("requests").doc(CLOUD.uid).set({ username: me.username, status: "pending", position: position || "", at: Date.now() });
  await window.storage.set("cricket:myTeamId", String(team.id));
}

async function cloudLeaveTeam(teamId) {
  const FV = window.firebase.firestore.FieldValue;
  const ref = cloudDb.collection("teams").doc(String(teamId));
  await ref.update({ members: FV.arrayRemove(CLOUD.uid), [`memberNames.${CLOUD.uid}`]: FV.delete(), [`memberPos.${CLOUD.uid}`]: FV.delete() }).catch(() => {});
  await ref.collection("requests").doc(CLOUD.uid).delete().catch(() => {});
  await window.storage.delete("cricket:myTeamId").catch(() => {});
}

// Coach dashboard: the players in this coach's teams.
async function cloudTeamAccounts() {
  const mine = (CLOUD.teamsSnapshot || []).filter((t) => t.coachUid === CLOUD.uid);
  const seen = new Set();
  const out = [];
  mine.forEach((t) =>
    t.members.forEach((n) => {
      const uid = CLOUD.nameToUid[n];
      if (!uid || seen.has(uid)) return;
      seen.add(uid);
      out.push({ username: n, uid, mainPosition: (t.memberPos || {})[n] || "" });
    })
  );
  return out;
}

// ---- Bad-word filter ----
// Stops offensive usernames and team names, and blanks out bad words in notes
// before they are shared with a coach. Letters are "un-disguised" first, so
// tricks like "sh1t", "f.u.c.k" or "fuuuck" are still caught. A short list of
// real words that happen to contain a bad word (Scunthorpe, Peacock, Titans,
// Grapes...) is let through.
const NLS_STRONG = ["fuck", "fuk", "fck", "shit", "cunt", "nigg", "nigga", "fagg", "faggot", "wank", "twat", "bitch", "whore", "slut", "bollock", "motherf", "retard", "spastic", "dickhead", "knobhead", "bellend", "arsehole", "asshole", "dickface", "cocksuck", "jizz", "pedophile", "paedophile", "kkk", "heilhitler", "sieg", "porn", "pussy", "nonce"];
const NLS_WORDS = ["ass", "arse", "arses", "dick", "dicks", "cock", "cocks", "tit", "tits", "titty", "piss", "prick", "pricks", "rape", "raped", "rapist", "paki", "pakis", "chink", "spic", "kike", "dyke", "homo", "tranny", "sex", "sexy", "nazi", "nazis", "hitler", "pedo", "paedo", "coon", "wog", "slag", "minge", "knob", "boob", "boobs", "anal", "cum", "nob", "shag", "gay", "lesbo", "skank", "tosser", "wanker", "bastard", "damn", "crap", "isis", "terrorist"];
const NLS_ALLOW = ["scunthorpe", "swank", "shiitake", "shitake", "cockerel", "peacock", "hancock", "babcock", "cockburn", "dickens", "dickson", "dickinson", "titans", "titan", "title", "hitchcock", "therapist", "grape", "drape", "scrape", "cumbria", "cumberland", "document", "circumference", "assist", "assists", "assistant", "bass", "class", "grass", "pass", "passing", "mass", "glass", "brass", "lass", "sussex", "essex", "middlesex", "wessex", "analysis", "analyst", "canal", "pistol", "spice", "nobby", "knobbly", "hellas", "cocktail", "shitzu", "matsushita", "pussycat", "cockermouth", "shitterton", "penistone", "cockfosters", "titchfield", "sextons", "wankie", "arsenal", "assington", "cockington", "middlesbrough"];
const NLS_LEET = { "0": "o", "1": "i", "!": "i", "|": "i", "3": "e", "4": "a", "@": "a", "5": "s", "$": "s", "7": "t", "+": "t", "8": "b", "9": "g", "6": "g", "2": "z", "€": "e", "£": "l" };

function nlsPlain(s) {
  let t = String(s || "").toLowerCase();
  t = t.normalize ? t.normalize("NFKD").replace(/[̀-ͯ]/g, "") : t;
  return t.replace(/[0-9!|@$+€£]/g, (c) => NLS_LEET[c] || c);
}
function nlsSquash(s) {
  return s.replace(/[^a-z]/g, "").replace(/(.)\1+/g, "$1");
}
function nlsStrip(letters) {
  let t = letters;
  NLS_ALLOW.forEach((w) => {
    t = t.split(w).join("_");
  });
  return t;
}
function nlsHasStrong(letters) {
  const raw = nlsStrip(letters);
  const sq = raw.split("_").map(nlsSquash).join("_");
  return NLS_STRONG.some((w) => raw.includes(w) || (nlsSquash(w).length >= 4 && sq.includes(nlsSquash(w))));
}
function nlsBadWord(word) {
  const letters = nlsPlain(word).replace(/[^a-z]/g, "");
  if (!letters || NLS_ALLOW.includes(letters)) return false;
  if (NLS_WORDS.includes(letters) || NLS_WORDS.includes(nlsSquash(letters))) return true;
  if (/s$/.test(letters) && NLS_WORDS.includes(letters.slice(0, -1))) return true;
  return nlsHasStrong(letters);
}

// True if a name (username, team name) is offensive anywhere inside it,
// including words run together ("BigDickDave", "f_u_c_k_u").
function isOffensive(text) {
  const plain = nlsPlain(text);
  if (nlsHasStrong(plain.replace(/[^a-z]/g, ""))) return true;
  // split on spaces/symbols and on camelCase so "TheRapeGang" style names are caught
  const words = String(text || "")
    .replace(/([a-z])([A-Z])/g, "$1 $2")
    .split(/[^A-Za-z0-9!|@$+€£]+/)
    .filter(Boolean);
  if (words.some(nlsBadWord)) return true;
  // single letters spaced out: "f u c k"
  const singles = String(text || "").split(/[\s._\-*]+/);
  if (singles.length >= 3 && singles.every((w) => w.length <= 1)) return nlsHasStrong(nlsPlain(singles.join("")));
  return false;
}

// Replaces bad words in free text with asterisks, keeping everything else.
function cleanText(text) {
  if (typeof text !== "string" || !text) return text;
  return text.replace(/[A-Za-z0-9!|@$+€£*.\-_]+/g, (w) => {
    const core = w.replace(/^[.\-_*]+|[.\-_*]+$/g, "");
    return core && nlsBadWord(core) ? w.replace(core, "*".repeat(core.length)) : w;
  });
}
// Cleans every piece of text inside a saved log before a coach can see it.
function cleanDeep(v) {
  if (typeof v === "string") return cleanText(v);
  if (Array.isArray(v)) return v.map(cleanDeep);
  if (v && typeof v === "object") {
    const o = {};
    Object.keys(v).forEach((k) => {
      o[k] = cleanDeep(v[k]);
    });
    return o;
  }
  return v;
}

async function cloudDeleteAccount(password) {
  const user = cloudAuth.currentUser;

  const uid = user.uid;
  const me = cloudMyProfile() || {};
  const db = cloudDb;
  const FV = window.firebase.firestore.FieldValue;
  const del = (ref) => ref.delete().catch(() => {});
  const none = { docs: [] };
  const coached = await db.collection("teams").where("coachUid", "==", uid).get().catch(() => none);
  for (const t of coached.docs) await cloudDeleteTeam({ id: t.id, code: t.data().code }).catch(() => {});
  const playing = await db.collection("teams").where("members", "array-contains", uid).get().catch(() => none);
  await Promise.all(playing.docs.map((t) => t.ref.update({ members: FV.arrayRemove(uid), [`memberNames.${uid}`]: FV.delete(), [`memberPos.${uid}`]: FV.delete() }).catch(() => {})));
  for (const [key, val] of CLOUD.cache) {
    if (/:myTeamId$/.test(key) && val) await del(db.collection("teams").doc(String(val)).collection("requests").doc(uid));
  }
  {
    const subsSnap = await db.collection("subscriptions").where("uid", "==", uid).get().catch(() => none);
    await Promise.all(
      subsSnap.docs
        .filter((d) => d.data().status !== "cancelled")
        .map((d) => subsCancel({ id: d.id, ...d.data() }).catch(() => {}))
    );
  }
  for (const [col, field] of [["sharedLogs", "uid"], ["helpTickets", "uid"], ["reports", "reporterUid"], ["coachGoals", "playerUid"], ["coachGoals", "coachUid"]]) {
    const s = await db.collection(col).where(field, "==", uid).get().catch(() => none);
    await Promise.all(s.docs.map((d) => del(d.ref)));
  }
  const kv = await db.collection("users").doc(uid).collection("kv").get().catch(() => none);
  await Promise.all(kv.docs.map((d) => del(d.ref)));
  await del(db.collection("publicProfiles").doc(uid));
  if (me.username) await del(db.collection("usernames").doc(String(me.username).toLowerCase()));
  await user.delete();
  CLOUD.uid = null;

{

// ---------- Celebrations, "Saved ✓" toasts, vibration, welcome tour ----------
// Plain DOM (no React) so any screen can call them. Confetti is skipped when the
// phone has "reduce motion" on; vibration only runs where the phone supports it.
const NL = { ns: "", lastBurst: 0, toastQ: [], toastOn: false };
function nlReduceMotion() {
  try {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) {
    return false;
  }
}
function nlVibrate(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}
function nlToast(msg) {
  if (!msg) return;
  NL.toastQ.push(msg);
  if (!NL.toastOn) nlNextToast();
}
function nlNextToast() {
  const msg = NL.toastQ.shift();
  if (!msg) {
    NL.toastOn = false;
    return;
  }
  NL.toastOn = true;
  const el = document.createElement("div");
  el.className = "nl-toast";
  el.setAttribute("role", "status");
  el.setAttribute("aria-live", "polite");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("out"), 1700);
  setTimeout(() => {
    el.remove();
    nlNextToast();
  }, 1900);
}
function nlBurst() {
  if (nlReduceMotion()) return;
  const c = document.createElement("canvas");
  const ctx = c.getContext && c.getContext("2d");
  if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth;
  const h = window.innerHeight;
  c.width = w * dpr;
  c.height = h * dpr;
  c.className = "nl-burst";
  c.setAttribute("aria-hidden", "true");
  document.body.appendChild(c);
  ctx.scale(dpr, dpr);
  const colors = ["#3B82F6", "#60A5FA", "#93C5FD", "#F5EFE2", "#F5D97A"];
  const parts = Array.from({ length: 70 }, () => {
    const a = Math.random() * Math.PI * 2;
    const s = 4 + Math.random() * 7;
    return { x: w / 2, y: h * 0.38, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, r: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0] };
  });
  const start = performance.now();
  const dur = 1100;
  function frame(t) {
    const k = (t - start) / dur;
    ctx.clearRect(0, 0, w, h);
    if (k >= 1) return c.remove();
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    parts.forEach((p) => {
      p.vy += 0.25;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

}

function NumberField({ label, value, onChange, min = 0 }) {
  const [text, setText] = useState(value === undefined || value === null ? "" : String(value));
  const [focused, setFocused] = useState(false);

  useEffect(() => {
    if (!focused) setText(value === undefined || value === null ? "" : String(value));
  }, [value, focused]);

  function handleChange(e) {
    const raw = e.target.value;
    setText(raw);
    if (raw === "" || raw === "-") return;
    const num = Number(raw);
    if (!Number.isNaN(num)) onChange(num);
  }

  function handleBlur() {
    setFocused(false);
    if (text === "" || text === "-") {
      setText(String(min));
      onChange(min);
    }
  }

  return (
    <label className="field">
      <span>{label}</span>
      <input
        type="number"
        inputMode="numeric"
        value={text}
        min={min}
        onFocus={() => setFocused(true)}
        onChange={handleChange}
        onBlur={handleBlur}
      />
    </label>
  );
}

// Trend charts reuse entryPct (a percentage); stats like economy rate or
// strike rate carry a `scale` so the chart shows the real number, not x100.
function chartScale(pct, cfg) {
  if (pct === null || pct === undefined) return pct;
  return cfg && cfg.scale !== undefined ? Number((pct * cfg.scale).toFixed(2)) : pct;
}

function entryPct(e, numKey, denKeys) {
  const num = Number(e[numKey] || 0);
  const den = denKeys.length === 1 ? Number(e[denKeys[0]] || 0) : denKeys.reduce((s, k) => s + Number(e[k] || 0), 0);
  return den > 0 ? Number(((num / den) * 100).toFixed(1)) : null;
}

const CRICKET_FIELD_DEFAULTS = {};

function makeEmptyCricketRoleEntry(roleKey) {
  const entry = { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), matchId: null };
  (CRICKET_ROLE_FIELDS[roleKey] || []).forEach((f) => {
    entry[f.key] = CRICKET_FIELD_DEFAULTS[f.key] !== undefined ? CRICKET_FIELD_DEFAULTS[f.key] : 0;
  });
  if (MATCH_MINUTES && "minutesPlayed" in entry) entry.minutesPlayed = MATCH_MINUTES;
  return entry;
}

function sumCricketRoleEntries(roleKey, entries) {
  const totals = {};
  (CRICKET_ROLE_FIELDS[roleKey] || []).forEach((f) => {
    totals[f.key] = 0;
  });
  entries.forEach((e) => {
    (CRICKET_ROLE_FIELDS[roleKey] || []).forEach((f) => {
      totals[f.key] += Number(e[f.key] || 0);
    });
  });
  return totals;
}

function analyseCricketRole(roleKey, entries) {
  entries = (entries || []).filter((e) => e.logStyle !== "rate");
  if (!roleKey || entries.length === 0) return null;
  const totals = sumCricketRoleEntries(roleKey, entries);
  return analyseTotals(CRICKET_RING_METRICS, CRICKET_COUNT_RULES, totals, entries.length, CRICKET_ROLE_CARDS[roleKey], CRICKET_ROLE_FIELDS[roleKey]);
}

function analyseCricketTraining(cat, entries) {
  const fields = CRICKET_CATEGORY_FIELDS[cat];
  if (!fields || entries.length === 0) return null;
  const totals = {};
  fields.forEach((f) => (totals[f.key] = 0));
  entries.forEach((en) => fields.forEach((f) => (totals[f.key] += Number(en[f.key] || 0))));
  return analyseTotals(CRICKET_TRAINING_METRICS[cat] || [], [], totals, entries.length, null, fields);
}

// ---------- Coach Bot brain ----------
// Understands questions in plain English and answers from everything the app
// knows: the drill library, the player's own logs, positions, stats, food
// plans, gym exercises and the help topics below. Falls back to its best
// guesses rather than a dead end.
const BOT_SPORT = "Cricket";
const BOT_STOP = new Set("a an the i me my mine im i'm is are am be do does did can could would should will how what why when where which who to of in on at for with and or it its this that these those you your yours about get got give tell show please there any some more most much many just really very".split(" "));

function botNorm(text) {
  return " " + String(text).toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9%+\s-]/g, " ").replace(/\s+/g, " ").trim() + " ";
}
function botStem(w) {
  if (w.length <= 4) return w;
  return w.replace(/(ings|ing|ers|er|ies|es|s|ed|ly)$/, "");
}
function botTokens(text) {
  return botNorm(text).trim().split(" ").filter((w) => w && !BOT_STOP.has(w)).map(botStem);
}
function botHas(q, phrase) {
  return botNorm(q).includes(botNorm(phrase));
}
function botList(items) {
  return items.map((d, i) => `${i + 1}. ${d}`).join("\n");
}
function botAllPositions() {
  return CRICKET_POSITIONS.flatMap((p) => CRICKET_SUB_POSITIONS[p] || [p]);
}
function botFieldLabel(key) {
  const all = [...Object.values(CRICKET_ROLE_FIELDS).flat(), ...Object.values(CRICKET_CATEGORY_FIELDS).flat()];
  const f = all.find((x) => x.key === key);
  return f ? f.label.toLowerCase() : key;
}
function botAllMetrics() {
  return [...CRICKET_RING_METRICS, ...Object.values(CRICKET_TRAINING_METRICS).flat()];
}

// Help-topic matching: whole words/phrases score highest, partial word overlap a little.
function botScoreEntry(entry, q, qTokens) {
  let score = 0;
  entry.keywords.forEach((k) => {
    const kn = botNorm(k).trim();
    if (!kn) return;
    if (botNorm(q).includes(" " + kn + " ")) score += 3 * kn.split(" ").length;
    else {
      const kt = botTokens(k);
      if (kt.length > 1) {
        const hit = kt.filter((t) => t.length > 2 && qTokens.includes(t)).length;
        if (hit === kt.length) score += 2 * hit;
        else if (hit >= 1) score += hit * 0.5;
      }
    }
  });
  return score;
}
function botRankKB(q) {
  const qTokens = botTokens(q);
  return COACH_KB.map((e) => ({ e, s: botScoreEntry(e, q, qTokens) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s);
}

const BOT_IMPROVE_RE = /\b(improve|improving|better|get good|work on|practi[cs]e|train|training for|drills?|tips?|help (me )?with|struggl\w*|bad at|weak at|rubbish at|terrible at|fix|sharpen|develop|increase|boost|stop (missing|dropping|losing)|more consistent|get (faster|quicker|stronger|fitter|bigger|more powerful|more accurate))\b/;
const BOT_DEFINE_RE = /\b(what is|whats|what are|what does|meaning|mean|means|define|explain|how is .* (worked out|calculated)|how do you (work out|calculate))\b/;

function botSafety(q) {
  const n = botNorm(q);
  if (/\b(suicid\w*|kill myself|end my life|self harm|self-harm|hurt myself|want to die)\b/.test(n)) {
    return "I'm really sorry you're feeling like this — please don't keep it to yourself. Talk to someone you trust right now, like a parent, coach or friend. In the UK you can call Samaritans free, any time, on 116 123, or text SHOUT to 85258. If you're in danger right now, call 999.";
  }
  if (/\b(concuss\w*|head injury|hit (my|his|her) head|knocked out|blacked out)\b/.test(n)) {
    return "Concussion needs taking seriously. Stop playing straight away — don't go back on the same day. Get checked by a doctor (NHS 111, or A&E if symptoms are bad: repeated vomiting, worsening headache, confusion, drowsiness). Return to sport gradually, only once symptom-free and cleared. If in doubt, sit it out.";
  }
  if (/\b(injur\w*|hurts?|hurting|pain\w*|sprain\w*|strain\w*|pulled|torn|tear|swollen|swelling|twisted|ache\w*)\b/.test(n)) {
    return "Sorry to hear that. For a fresh knock or strain: stop the activity, rest it, ice for 15–20 minutes at a time, and keep it raised. Don't train through sharp pain. If it's not improving after a couple of days, is very swollen, or you can't put weight on it, see a physio or doctor (NHS 111 can help). The Recovery training type is there for logging rehab sessions.";
  }
  if (/\b(steroid\w*|sarm\w*|fat burner\w*|diet pills?|starv\w*|not eating|stop eating|skip meals?|crash diet)\b/.test(n)) {
    return "I'd steer well clear of that — it can seriously harm your health and performance, especially if you're still growing. If you want to change your body shape, the safe way is regular meals, plenty of protein, good sleep and steady training. A doctor, dietitian or your coach can help you make a plan that's right for you.";
  }
  if (/\b(creatine|protein shake|protein powder|supplement\w*|pre-?workout|caffeine)\b/.test(n)) {
    return "Most of what you need comes from normal food — regular meals with protein, carbs, fruit and veg. Supplements are optional extras, not shortcuts. If you're under 18, talk to a parent and a doctor or qualified coach before taking any (including creatine or pre-workout). If you do use them as an adult, choose batch-tested brands (Informed Sport) and follow the label.";
  }
  return null;
}

function botSmallTalk(q) {
  const n = botNorm(q).trim();
  if (/^(hi|hey|hello|hiya|yo|sup|good (morning|afternoon|evening))\b/.test(n) && n.split(" ").length <= 4) {
    return `Hi! Ask me anything about ${BOT_SPORT.toLowerCase()} or the app — e.g. "how do I improve my ${(Object.keys(DRILL_LIBRARY[BOT_SPORT] || {})[0] || "game").toLowerCase()}?", "how am I doing?", "what should I eat before a game?" or "exercises for legs".`;
  }
  if (/\b(thanks|thank you|cheers|ta|nice one|great|brilliant|legend)\b/.test(n) && n.split(" ").length <= 6) return "Any time — good luck with your training!";
  if (/^(help|help me|help please|who are you|what are you|what can you do|what can i ask( you)?|what do you do)$/.test(n.replace(/\?$/, "").trim())) {
    return `I'm your Coach Bot. I can:\n• give drills to improve any part of your ${BOT_SPORT.toLowerCase()}\n• tell you how you're doing from your own logs\n• explain any stat, term or position\n• suggest what to eat for match and training days\n• suggest gym exercises and how to do them\n• explain how anything in the app works.`;
  }
  if (/\b(motivat\w*|cant be bothered|can't be bothered|lazy|give up|giving up|no point)\b/.test(n)) {
    return "Everyone has flat spells. Set one small goal for this week (in the Goals tab), log every session — even short ones — and look back at your progress in Analysis. Training with a mate or picking one drill you enjoy makes it easier to keep going. Small, consistent sessions beat the odd big one.";
  }
  return null;
}

async function botMyLogs(profile) {
  if (!profile || !profile.username) return null;
  const prefix = cricketUserPrefix(profile.username);
  let best = null;
  for (const pos of botAllPositions()) {
    try {
      const res = await safeGet(`${prefix}cricket:${slugify(pos)}`);
      const list = res ? JSON.parse(res.value) : [];
      if (!list.length) continue;
      const score = (pos === profile.mainPosition ? 1000 : 0) + list.length;
      if (!best || score > best.score) best = { pos, list, score };
    } catch (e) {
      // nothing at this position
    }
  }
  return best;
}

async function botPersonal(q, profile) {
  const n = botNorm(q);
  if (!/\b(how am i doing|how (have|did) i (done|do|been)|my (stats|progress|form|numbers|performance|game|analysis|weakness\w*|strength\w*|best|worst)|am i (improving|getting better|any good|good)|what should i (work|focus) on|where (am i|do i) (weak|need)|what am i (bad|good) at|my last (game|match|round|log))\b/.test(n)) return null;
  if (profile && profile.role === "coach") return "As a coach you can see each player's analysis on your Coach Dashboard — open the sport and tap a player.";
  const mine = await botMyLogs(profile);
  if (!mine) return `You haven't logged any ${BOT_SPORT.toLowerCase()} yet — log a ${CRICKET_UI.matchWord.toLowerCase()} or training session and ask me again. I'll tell you what's going well and what to work on.`;
  const roleKey = CRICKET_POSITION_TO_ROLE[mine.pos];
  const statLogs = mine.list.filter((e) => (!e.category || e.category === "matchPractice") && e.logStyle !== "rate");
  const trainingCount = mine.list.filter((e) => e.category && e.category !== "matchPractice").length;
  if (!statLogs.length || !roleKey) {
    return `You've logged ${trainingCount} training session${trainingCount === 1 ? "" : "s"} as a ${mine.pos} — log a ${CRICKET_UI.matchWord.toLowerCase()} too and I can break down your game. Your training analysis is on the Analysis tab under Training logs.`;
  }
  const a = analyseCricketRole(roleKey, statLogs);
  const parts = [`From your ${statLogs.length} ${CRICKET_UI.matchWord.toLowerCase()} log${statLogs.length === 1 ? "" : "s"} as a ${mine.pos}:`];
  if (a.good.length) parts.push("✅ Going well:\n" + a.good.slice(0, 3).map((g) => "• " + g).join("\n"));
  if (a.steady.length) parts.push("🟡 Solid:\n" + a.steady.slice(0, 2).map((g) => "• " + g).join("\n"));
  if (a.bad.length) parts.push("🔴 Work on:\n" + a.bad.slice(0, 3).map((g) => "• " + g).join("\n"));
  const issue = a.issues[0] || a.pushOn[0];
  if (issue) {
    const drills = issue.drills && issue.drills.length ? issue.drills : drillsForItem(BOT_SPORT, issue.text);
    parts.push(`Top focus — ${issue.title || "this"}:\n${botList(drills.slice(0, 2))}`);
  }
  parts.push("Full breakdown: Analysis tab. All the drills: Drills & Tips.");
  return parts.join("\n\n");
}

function botPosition(q) {
  const n = botNorm(q);
  const positions = [...botAllPositions()].sort((x, y) => y.length - x.length);
  const pos = positions.find((p) => n.includes(" " + botNorm(p).trim() + " ") || n.includes(" " + botNorm(p).trim() + "s "));
  if (!pos || botAllPositions().length < 2) return null;
  const role = CRICKET_POSITION_TO_ROLE[pos];
  const cards = (CRICKET_ROLE_CARDS[role] || []).map((c) => c.label);
  const fields = (CRICKET_ROLE_FIELDS[role] || []).filter((f) => f.key !== "minutesPlayed").map((f) => f.label.toLowerCase());
  const drills = CRICKET_POSITION_DRILLS[role] || [];
  const group = typeof CRICKET_POSITION_GROUPS !== "undefined" ? CRICKET_POSITION_NUTRITION[CRICKET_POSITION_GROUPS[pos]] : null;
  const parts = [`${pos}:`];
  if (group) parts.push(group.focus);
  if (cards.length) parts.push(`The key numbers for a ${pos} are ${cards.join(", ")}.`);
  parts.push(`You log things like ${fields.slice(0, 8).join(", ")}${fields.length > 8 ? " and more" : ""}.`);
  if (drills.length) parts.push("Core drills:\n" + botList(drills));
  return parts.join("\n\n");
}

function botDefine(q) {
  const n = botNorm(q);
  // Only "what is / explain / how is it worked out" questions — or the stat name on
  // its own. Anything asking to improve something goes to the drills instead.
  if (BOT_IMPROVE_RE.test(n)) return null;
  const bare = n.trim().replace(/\?$/, "").trim();
  const asksDef = BOT_DEFINE_RE.test(n) || botAllMetrics().some((x) => botNorm(x.label).trim() === bare || botNorm(x.label.replace("%", "")).trim() === bare);
  if (!asksDef) return null;
  const metrics = botAllMetrics().slice().sort((x, y) => y.label.length - x.label.length);
  const m = metrics.find((x) => {
    const label = botNorm(x.label.replace("%", "")).trim();
    return label.length > 2 && n.includes(" " + label);
  });
  if (!m) return null;
  const nums = (Array.isArray(m.num) ? m.num : [m.num]).map(botFieldLabel).join(" + ");
  const dens = m.den.map(botFieldLabel).join(" + ");
  const pct = m.mult === undefined;
  const better = m.lowerBetter ? "Lower is better" : "Higher is better";
  const g = m.lowerBetter ? `${m.good}${pct ? "%" : ""} or below` : `${m.good}${pct ? "%" : ""}+`;
  return `${m.label} = ${nums} ÷ ${m.den.length > 1 ? "(" + dens + ")" : dens}${pct ? " × 100" : m.mult !== 1 ? " (scaled)" : ""}. ${better} — the app counts ${g} as good. You'll see it as a coloured ring in Analysis whenever you've logged both numbers.`;
}

function botGym(q) {
  const n = botNorm(q);
  const exNames = Object.values(EXERCISES_BY_MUSCLE).flat();
  const allEx = [...new Set([...exNames, ...Object.keys(EXERCISE_TUTORIALS)])].sort((a, b) => b.length - a.length);
  const ex = allEx.find((e) => n.includes(" " + botNorm(e).trim() + " ") || n.includes(" " + botNorm(e).trim() + "s "));
  if (ex && /\b(how|form|technique|do (a|an)?|perform|tutorial|what is|whats)\b/.test(n)) {
    const tut = EXERCISE_TUTORIALS[ex];
    return tut
      ? `${ex}: ${tut}\n\nStart light, keep it controlled, and add weight only when every rep looks the same.`
      : `${ex}: use a weight you can control for 8–12 clean reps, move through a full range of motion, keep your core braced, and lower slowly rather than dropping the weight. If you're unsure on form, ask a coach or gym instructor to watch a set — and film yourself to check.`;
  }
  const isGym = /\b(gym|exercise\w*|workout\w*|lift\w*|weights?|muscle\w*|reps?|sets?|strength|bulk\w*|tone|toning|build)\b/.test(n);
  const muscles = Object.keys(EXERCISES_BY_MUSCLE).sort((a, b) => b.length - a.length);
  const muscle = muscles.find((m) => n.includes(" " + botNorm(m).trim() + " "));
  const groupAlias = { chest: "Chest", pecs: "Chest", back: "Back", shoulder: "Shoulders", shoulders: "Shoulders", delts: "Shoulders", arm: "Arms", arms: "Arms", leg: "Legs", legs: "Legs", core: "Core", abs: "Core", stomach: "Core", glutes: "Legs", bum: "Legs", hamstring: "Legs", hamstrings: "Legs", quads: "Legs", calves: "Legs", biceps: "Arms", triceps: "Arms" };
  const word = Object.keys(groupAlias).find((w) => n.includes(" " + w + " "));
  if (muscle && (isGym || /\b(for|train|work|grow|bigger|stronger)\b/.test(n))) {
    return `Exercises for ${muscle.toLowerCase()}:\n${botList(EXERCISES_BY_MUSCLE[muscle].slice(0, 6))}\n\nPick 2–3, do 3–4 sets of 8–12 reps, and log them on the Gym page to track your personal bests.`;
  }
  if (word && (isGym || /\b(for|train|work|grow|bigger|stronger)\b/.test(n))) {
    const group = groupAlias[word];
    const lines = (MUSCLES_BY_GROUP[group] || []).map((m) => `• ${m}: ${(EXERCISES_BY_MUSCLE[m] || []).slice(0, 3).join(", ")}`);
    return `Exercises for ${group.toLowerCase()}:\n${lines.join("\n")}\n\nPick 2–3, do 3–4 sets of 8–12 reps, and log them on the Gym page to track your personal bests.`;
  }
  if (isGym && /\b(for (rugby|football|hockey|cricket|golf|my sport|sport)|programme|program|plan|routine|split)\b/.test(n)) {
    const tips = typeof GYM_CRICKET_STRENGTH !== "undefined" ? GYM_CRICKET_STRENGTH : [];
    return `Gym work for ${BOT_SPORT.toLowerCase()}:\n${botList(tips)}\n\nThe Gym page has the full exercise list, and its Drills & Tips tab shows which body parts you've been neglecting.`;
  }
  return null;
}

function botNutrition(q, profile) {
  const n = botNorm(q);
  if (!/\b(eat\w*|food|meal\w*|diet|protein|carb\w*|nutrition|hydrat\w*|drink\w*|water|breakfast|lunch|dinner|tea|snack\w*|fuel\w*|calorie\w*|recover\w* food|before (a |the )?(game|match|round)|after (a |the )?(game|match|round))\b/.test(n)) return null;
  const ctxKey = /\b(train\w*|practi[cs]e|session|gym)\b/.test(n) ? 1 : 0;
  const meals = Object.values(CRICKET_MEAL_SUGGESTIONS)[ctxKey] || {};
  const fuel = Object.values(CRICKET_FUELING_NOTES)[ctxKey] || "";
  const dayLabel = ctxKey ? "training day" : `${CRICKET_UI.matchWord.toLowerCase()} day`;
  const parts = [];
  if (/\b(drink\w*|water|hydrat\w*)\b/.test(n)) parts.push("Hydration: drink regularly through the day (pale-yellow pee is the target), have 400–600ml in the 2 hours before playing, sip during breaks, and replace what you've sweated out afterwards — water is fine for most sessions; add electrolytes in heat or long sessions.");
  if (/\bbefore\b/.test(n)) parts.push(`Before: ${meals.Lunch || meals.Breakfast || ""} Keep your last proper meal 3–4 hours before, and a light snack (e.g. a banana) 30–60 minutes before if you're hungry.`);
  if (/\b(after|recover\w*)\b/.test(n)) parts.push(`After: within an hour, have carbs plus protein — e.g. ${meals.Snack ? meals.Snack.charAt(0).toLowerCase() + meals.Snack.slice(1) : "a protein shake or yoghurt and fruit"} Then a proper meal: ${meals.Dinner || ""}`);
  if (/\bprotein\b/.test(n)) parts.push("Protein: aim for a palm-sized portion at every meal (meat, fish, eggs, dairy, beans or tofu) — roughly 1.4–2g per kg of bodyweight a day for active athletes. Spreading it across the day works better than one big serving.");
  if (/\bcarb\w*\b/.test(n)) parts.push("Carbs are your main fuel for training and games — rice, pasta, potatoes, oats, bread and fruit. Eat more on heavy days and the day before a game, a bit less on rest days.");
  if (!parts.length) {
    parts.push(`A good ${dayLabel}:\n• Breakfast: ${meals.Breakfast}\n• Lunch: ${meals.Lunch}\n• Dinner: ${meals.Dinner}\n• Snack: ${meals.Snack}`);
    if (fuel) parts.push(fuel);
  }
  const pos = profile && profile.mainPosition;
  if (pos && typeof CRICKET_POSITION_GROUPS !== "undefined" && CRICKET_POSITION_GROUPS[pos]) {
    const g = CRICKET_POSITION_NUTRITION[CRICKET_POSITION_GROUPS[pos]];
    parts.push(`For ${g.label.toLowerCase()} like you: ${g.tips[0]}`);
  }
  parts.push("The Nutrition page has full meal plans and lets you track what you eat.");
  return parts.join("\n\n");
}

function botImprove(q) {
  const n = botNorm(q);
  const focus = findCategoryForItem(BOT_SPORT, n);
  const wants = BOT_IMPROVE_RE.test(n);
  if (!focus && !wants) return null;
  if (focus && (wants || /\b(how|my|help|get|be)\b/.test(n))) {
    const drills = (DRILL_LIBRARY[BOT_SPORT] || {})[focus] || [];
    return `To improve your ${focus.toLowerCase()}:\n${botList(drills)}\n\nDo 2–3 short sessions a week, log them as training, and check your progress in Analysis. The Weekly Plan can build these into your week for you.`;
  }
  if (wants) {
    const m = n.match(/\b(?:improve|better at|work on|practi[cs]e|train|drills? for|tips? for|help (?:me )?with|struggling with|bad at|weak at|fix|sharpen|increase|boost|get)\s+(?:my |me |the |on )?([a-z0-9 %-]{3,40})/);
    const topic = m ? m[1].trim().replace(/\s+(please|thanks|quickly|fast)$/, "") : null;
    if (!topic) return null;
    const drills = drillsForItem(BOT_SPORT, topic);
    return `Here's a session to work on ${topic}:\n${botList(drills)}\n\nRepeat it 2–3 times a week and log it as training so you can see it improve.`;
  }
  return null;
}

function botFallback(q) {
  const ranked = botRankKB(q).slice(0, 3);
  const areas = Object.keys(DRILL_LIBRARY[BOT_SPORT] || {});
  const ideas = [`"how do I improve my ${(areas[0] || "game").toLowerCase()}?"`, '"how am I doing?"', '"what should I eat before a game?"', '"exercises for legs"'];
  if (ranked.length) {
    return `I'm not 100% sure what you mean, but this might help:\n\n${ranked[0].e.answer}${ranked.length > 1 ? `\n\nOr did you mean something about "${ranked[1].e.keywords[0]}"?` : ""}`;
  }
  return `I didn't quite catch that. Try asking it a different way — for example ${ideas.join(", ")}. You can ask about any part of ${BOT_SPORT.toLowerCase()}, any stat, position, food, the gym, or how the app works. For anything else, Settings → Help lets you message an admin.`;
}

async function coachBotReply(query) {
  let profile = null;
  try {
    const p = await safeGet("profile:data");
    if (p) profile = JSON.parse(p.value);
  } catch (e) {
    profile = null;
  }
  const q = String(query);
  const steps = [
    () => botSafety(q),
    () => botSmallTalk(q),
    () => botPersonal(q, profile),
    () => botGym(q),
    () => botNutrition(q, profile),
    () => botDefine(q),
    () => botPosition(q),
  ];
  for (const s of steps) {
    const r = await s();
    if (r) return r;
  }
  // Asking to improve a specific part of the game always gets drills for it.
  const nq = botNorm(q);
  if (BOT_IMPROVE_RE.test(nq) && findCategoryForItem(BOT_SPORT, nq)) {
    const direct = botImprove(q);
    if (direct) return direct;
  }
  // Strong help-topic match beats generic drills; otherwise drills, then best guess.
  const ranked = botRankKB(q);
  if (ranked.length && ranked[0].s >= 3) return ranked[0].e.answer;
  const imp = botImprove(q);
  if (imp) return imp;
  if (ranked.length && ranked[0].s >= 1.5) return ranked[0].e.answer;
  return botFallback(q);
}

function findCoachAnswer(query) {
  const q = query.toLowerCase();
  let best = null;
  let bestScore = 0;
  COACH_KB.forEach((entry) => {
    let score = 0;
    entry.keywords.forEach((k) => {
      if (q.includes(k)) score += k.split(" ").length;
    });
    if (score > bestScore) {
      bestScore = score;
      best = entry;
    }
  });
  if (best) return best.answer;
  return "I'm not sure about that one yet. Try asking about a specific stat (like \"what is strike rate\") or something like \"why is my analysis empty\" — or head to the Help page to message an admin directly.";
}

// ---------- 🔥 Streak (modelled on The Comeback) ----------
// One place that counts EVERY session: quick logs made here (Training,
// Fitness, Gym), plus training and matches logged in the Cricket section and
// workouts saved in Gym. A day with 1+ session keeps the streak going; miss a
// whole day and it resets. 2+ sessions on a day = a ×2 double day.
// Quick logs are saved per player per sport (ns + "cricket:streakLog"), in the
// cloud like the rest of the app.
const STREAK_TYPES = { training: "Training", fitness: "Fitness", gym: "Gym" };
const skPad = (n) => String(n).padStart(2, "0");
const skYmd = (d) => d.getFullYear() + "-" + skPad(d.getMonth() + 1) + "-" + skPad(d.getDate());
const skParse = (s) => {
  const [y, m, d] = String(s).split("-").map(Number);
  return new Date(y, m - 1, d);
};
const skAddDays = (s, n) => {
  const d = skParse(s);
  d.setDate(d.getDate() + n);
  return skYmd(d);
};
const skHrs = (m) => {
  const h = (m || 0) / 60;
  return h === 0 ? "0" : h < 10 ? String(Math.round(h * 10) / 10) : String(Math.round(h));
};
const skNice = (s) => skParse(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const skShort = (s) => skParse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const skOk = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
function skMonday() {
  const now = new Date();
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  return skYmd(mon);
}
function streakLogKey(ns) {
  return ns + "cricket:streakLog";
}

// Gather every session: this page's own logs + Cricket training/matches + Gym.
async function loadAllStreakSessions(ns) {
  const out = [];
  const read = async (key) => {
    const r = await safeGet(key);
    if (!r) return [];
    try {
      const v = JSON.parse(r.value);
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  };
  (await read(streakLogKey(ns))).forEach((s) => skOk(s.date) && out.push({ ...s, source: "streak" }));
  // Cricket section — logs live under each position the player has used.
  const labels = [...(typeof CRICKET_POSITIONS !== "undefined" ? CRICKET_POSITIONS : []), ...Object.values(typeof CRICKET_SUB_POSITIONS !== "undefined" ? CRICKET_SUB_POSITIONS : {}).flat()];
  const slugs = [...new Set(labels.map(slugify))];
  const cats = typeof CRICKET_TRAINING_CATEGORIES !== "undefined" ? CRICKET_TRAINING_CATEGORIES : [];
  const seenMatch = new Set();
  for (const sl of slugs) {
    (await read(`${ns}cricket:${sl}`)).forEach((e) => {
      if (!e || !skOk(e.date)) return;
      if (e.mode === "training") {
        const cat = cats.find((c) => c.key === e.category);
        out.push({
          id: "sp-" + e.id,
          source: "cricket",
          type: e.category === "fitness" ? "fitness" : "training",
          date: e.date,
          mins: Number(e.duration) || 0,
          km: Number(e.distance) || 0,
          work: (cat && cat.label) || "Cricket training",
          notes: e.notes || "",
        });
      } else {
        const mk = (e.matchId || e.id) + "|" + e.date;
        if (seenMatch.has(mk)) return;
        seenMatch.add(mk);
        out.push({ id: "sp-" + e.id, source: "cricket", type: "training", match: true, date: e.date, mins: Number(e.minutesPlayed) || 0, work: "Cricket match", notes: e.notes || "" });
      }
    });
  }
  (await read("gym:workouts")).forEach((w) => {
    if (!w || !skOk(w.date)) return;
    out.push({ id: "gym-" + w.id, source: "gym", type: "gym", date: w.date, mins: Number(w.mins) || 0, work: w.name || "Workout", notes: "" });
  });
  return out;
}

function streakStats(sessions) {
  const minsByDay = {};
  const count = {};
  sessions.forEach((s) => {
    minsByDay[s.date] = (minsByDay[s.date] || 0) + (Number(s.mins) || 0);
    count[s.date] = (count[s.date] || 0) + 1;
  });
  const runs = [];
  Object.keys(minsByDay)
    .sort()
    .forEach((d) => {
      const last = runs[runs.length - 1];
      if (last && skAddDays(last.end, 1) === d) {
        last.end = d;
        last.days.push(d);
      } else runs.push({ start: d, end: d, days: [d] });
    });
  runs.forEach((r) => {
    r.mins = r.days.reduce((a, d) => a + minsByDay[d], 0);
    r.doubles = r.days.filter((d) => count[d] >= 2).length;
  });
  const today = skYmd(new Date());
  const yest = skAddDays(today, -1);
  const last = runs[runs.length - 1];
  const current = last && (last.end === today || last.end === yest) ? last : null;
  const best = runs.reduce((m, r) => Math.max(m, r.days.length), 0);
  return { runs, current, best, today, dbl: current ? current.doubles : 0, todayCount: count[today] || 0, minsByDay };
}

  const [err, setErr] = useState("");

  async function reload() {
    const list = await loadAllStreakSessions(ns);
    setOwn(list.filter((s) => s.source === "streak").map(({ source, ...s }) => s));
    setAll(list);
  }
  useEffect(() => {
    reload();
  }, []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 1800);

  }, [toast]);

    setOwn(next);

// ---------- Simple self-contained SVG charts (no external library) ----------
function SimpleBarChart({ data, height = 140, color = "#3B82F6", suffix = "" }) {
  if (!data || data.length === 0) return null;
  const width = 320;
  const max = Math.max(1, ...data.map((d) => Math.abs(d.value)));
  const barWidth = (width - 20) / data.length;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height + 30}`} style={{ overflow: "visible" }} preserveAspectRatio="xMidYMid meet">
      {data.map((d, i) => {
        const barHeight = (Math.abs(d.value) / max) * height;
        const x = 10 + i * barWidth;
        const y = height - barHeight;
        return (
          <g key={i}>
            <rect x={x + barWidth * 0.15} y={y} width={Math.max(2, barWidth * 0.7)} height={Math.max(1, barHeight)} fill={color} rx={3} />
            <text x={x + barWidth * 0.5} y={height + 14} textAnchor="middle" fontSize="9" fill="#9FB3A4">
              {d.label}
            </text>
            <text x={x + barWidth * 0.5} y={y - 4} textAnchor="middle" fontSize="9" fill="#EFE9DD">
              {d.value}
              {suffix}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function SimpleLineChart({ data, height = 140, color = "#3B82F6", suffix = "" }) {
  if (!data || data.length === 0) return null;
  const width = 320;
  const values = data.map((d) => d.value);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const stepX = data.length > 1 ? (width - 20) / (data.length - 1) : 0;
  const points = data.map((d, i) => ({
    x: 10 + i * stepX,
    y: height - ((d.value - min) / range) * height,
  }));
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const labelEvery = Math.max(1, Math.ceil(data.length / 6));
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height + 24}`} style={{ overflow: "visible" }} preserveAspectRatio="xMidYMid meet">
      <path d={pathD} fill="none" stroke={color} strokeWidth="2" />
      {points.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />
      ))}
      {points.map((p, i) => (
        <text key={i} x={p.x} y={p.y - 8} textAnchor="middle" fontSize="8" fill="#EFE9DD">
          {i % labelEvery === 0 ? `${data[i].value}${suffix}` : ""}
        </text>
      ))}
      {data.map((d, i) => (
        <text key={i} x={points[i].x} y={height + 16} textAnchor="middle" fontSize="8" fill="#9FB3A4">
          {i % labelEvery === 0 ? d.label : ""}
        </text>
      ))}
    </svg>
  );
}

// Live event tally: instead of trying to recall exact numbers after a full
// match, tap a stat every time it happens during the game. Works for any
// position, since it just reads whatever fields that role tracks (minutes
// played is skipped here — that gets filled in on the review form).
// Finishing hands the tallied numbers back to the normal form to review and
// save as usual.
// Keys that represent a "setup" value entered once (duration, par, a final
// score) rather than an event you'd tap as it happens — excluded from the
// Live Tally screen for every sport that uses it.
const LIVE_TALLY_EXCLUDED_KEYS = ["minutesPlayed", "sinBinMinutes", "holesPlayed", "par", "score"];

// Colour-coded ring for one on-pitch percentage: green = good, amber = OK,
// red = needs work, judged against the thresholds passed in.
// Colour-coded ring for one on-pitch stat. `status` is good / ok / bad,
// `fill` is 0–100 for how full the ring is, `display` is the text in the middle.
function StatRing({ label, display, fill, status, detail }) {
  const size = 84;
  const stroke = 9;
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, fill));
  const color = status === "good" ? "#5FBF7F" : status === "ok" ? "#E0B34A" : "#D9694A";
  const verdict = status === "good" ? "Good" : status === "ok" ? "OK" : "Work on it";
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 104 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`${label} ${display}`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#1F3527" strokeWidth={stroke} />
        <circle
          cx={size / 2}
          cy={size / 2}
          r={r}
          fill="none"
          stroke={color}
          strokeWidth={stroke}
          strokeLinecap="round"
          strokeDasharray={`${(clamped / 100) * circ} ${circ}`}
          transform={`rotate(-90 ${size / 2} ${size / 2})`}
        />
        <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central" fill="#F5EFE2" fontSize="17" fontWeight="700">
          {display}
        </text>
      </svg>
      <div style={{ fontSize: 12, color: "#EFE9DD", marginTop: 6, textAlign: "center", fontWeight: 600 }}>{label}</div>
      <div style={{ fontSize: 11, color, marginTop: 2, fontWeight: 600 }}>{verdict}</div>
      {detail && <div style={{ fontSize: 10.5, color: "#7C9284", marginTop: 1 }}>{detail}</div>}
    </div>
  );
}

// Works out a metric's value from summed totals. Metrics are percentages by
// default; `mult` rescales (e.g. strike rate), `unit` changes the suffix,
// `max` sets what counts as a full ring and `lowerBetter` flips the scale
// (e.g. economy rate, where fewer runs per over is better).
function metricValue(m, totals) {
  const numKeys = Array.isArray(m.num) ? m.num : [m.num];
  if (totals[numKeys[0]] === undefined) return null;
  const den = m.den.reduce((s, k) => s + Number(totals[k] || 0), 0);
  if (!den) return null;
  const numTotal = numKeys.reduce((s, k) => s + Number(totals[k] || 0), 0);
  const value = (numTotal / den) * (m.mult === undefined ? 100 : m.mult);
  const status = m.lowerBetter
    ? value <= m.good ? "good" : value <= m.ok ? "ok" : "bad"
    : value >= m.good ? "good" : value >= m.ok ? "ok" : "bad";
  return { value, den, num: numTotal, status };
}

// A zero we can't trust: the stat was probably just left blank. If lower is
// better, a blank 0 would read as perfect; if the bottom of the sum is only a
// pre-filled default (e.g. 18 holes), a blank 0 would read as a disaster.
const DEFAULTED_STAT_KEYS = new Set(["holesPlayed", "par", "minutesPlayed"]);
function metricUnlogged(m, v) {
  return v.num === 0 && (m.lowerBetter || m.den.every((k) => DEFAULTED_STAT_KEYS.has(k)));
}

function formatMetric(m, value) {
  const unit = m.unit === undefined ? "%" : m.unit;
  const dp = m.dp === undefined ? 0 : m.dp;
  return `${value.toFixed(dp)}${unit}`;
}

// Builds the ring list from summed totals: only metrics whose fields exist
// for this position and actually have attempts logged are shown.
function buildRings(metrics, totals) {
  return metrics
    .map((m) => {
      const v = metricValue(m, totals);
      if (!v || metricUnlogged(m, v)) return null;
      const max = m.max === undefined ? 100 : m.max;
      const fill = m.lowerBetter ? Math.max(0, 100 - (v.value / max) * 100) : (v.value / max) * 100;
      const detail = m.mult === undefined ? `${v.num} of ${v.den}` : m.detail || null;
      return { label: m.label, display: formatMetric(m, v.value), fill, status: v.status, detail };
    })
    .filter(Boolean);
}

function StatRingsCard({ rings }) {

// ---------- Analysis engine (shared by every sport) ----------
// Turns summed stats into verdicts for EVERY measured stat (good / solid /
// work on it), flags small samples rather than hiding them, and records an
// "issue" for anything to work on so Drills & Tips can answer each one.
function analyseTotals(metrics, rules, totals, count, cards, fields) {
  const pcts = {};
  const attempts = {};
  const good = [];
  const steady = [];
  const bad = [];
  const issues = [];
  const pushOn = [];
  (metrics || []).forEach((m) => {
    const v = metricValue(m, totals);
    if (!v || metricUnlogged(m, v)) return;
    pcts[m.label] = v.value;
    attempts[m.label] = v.den;
    const shown = formatMetric(m, v.value);
    const early = v.den < (m.minN || 5) ? ` (early days — only ${v.den} to go on)` : "";
    const fill = (tpl, fallback) => (tpl ? tpl.replace("{v}", shown) : fallback) + early;
    if (v.status === "good") {
      good.push(fill(m.goodMsg, `${m.label} at ${shown} — that's strong.`));
    } else if (v.status === "ok") {
      const text = fill(m.okMsg, `${m.label} at ${shown} — solid, with room to push on.`);
      steady.push(text);
      pushOn.push({ text, title: m.lowerBetter ? `Bring your ${m.label} down` : `Push your ${m.label} higher`, drills: m.tipDrills || [] });
    } else {
      const text = fill(m.badMsg, `${m.label} at ${shown} — one to work on.`);
      bad.push(text);
      issues.push({ text, title: m.tipTitle || `Improve your ${m.label}`, drills: m.tipDrills || [] });
    }
  });
  (rules || []).forEach((r) => {
    if (totals[r.key] === undefined) return;
    if (r.minLogs && count < r.minLogs) return;
    const v = r.perLog ? totals[r.key] / count : totals[r.key];
    const hit = r.below !== undefined ? v <= r.below : v >= r.min;
    if (!hit) return;
    const text = r.msg.replace("{v}", r.perLog ? v.toFixed(1) : String(v));
    if (r.kind === "good") {
      good.push(text);
    } else {
      bad.push(text);
      issues.push({ text, title: r.tipTitle || null, drills: r.tipDrills || [] });
    }
  });
  if (!good.length && !steady.length && !bad.length) {
    steady.push("Not enough paired numbers to judge yet — fill in both sides of a stat (e.g. made and missed) for a full breakdown. Your numbers are compared with your average below.");
  }
  let statCards;
  if (cards && cards.length) {
    statCards = cards.map((c) => {
      if (c.metric) {
        const m = (metrics || []).find((x) => x.label === c.metric);
        return { label: c.label, value: m && pcts[c.metric] !== undefined ? formatMetric(m, pcts[c.metric]) : "-" };
      }
      if (c.avg) return { label: c.label, value: (Number(totals[c.key] || 0) / count).toFixed(1) };
      return { label: c.label, value: totals[c.key] !== undefined ? totals[c.key] : "-" };
    });
  } else {
    statCards = (metrics || [])
      .filter((m) => pcts[m.label] !== undefined)
      .slice(0, 4)
      .map((m) => ({ label: m.label, value: formatMetric(m, pcts[m.label]) }));
    (fields || []).forEach((f) => {
      if (statCards.length >= 4 || f.key === "duration" || !Number(totals[f.key] || 0)) return;
      const val = count > 1 ? (Number(totals[f.key] || 0) / count).toFixed(1) : totals[f.key];
      statCards.push({ label: count > 1 ? `${f.label} (avg)` : f.label, value: val });
    });
  }
  return { totals, pcts, attempts, statCards, good, steady, bad, issues, pushOn };
}

// Whether more of a stat is better (1), worse (-1) or just volume (0).
const LOWER_STAT_RE = /Lost|lost|Missed|missed|Failed|failed|Dropped|dropped|Conceded|conceded|Errors|errors|^penalties$|wides|noBalls|byes|foulsCommitted|Cards$|offsides|carriesStopped|kicksPoor|threePutts|^bogeys$|^doubleBogeyPlus$|^score$|^putts$|dotBallsFaced|misfields|edges|timesOut|rebounds|Fumbles|bigChances|possessionLost|keeperDrops/;
const NEUTRAL_STAT_RE = /^(minutesPlayed|holesPlayed|par|duration|rpe|oversBowled|ballsFaced|fairwaysTotal|mobilityMins|clipsReviewed|takeaways|ballsHit|driversHit|chipsAttempted|injections|throwsAtStumps|scrumsPacked|padHits|dragFlicks|headersPractised|ballsFacedNets|ballsBowledNets|penaltiesFaced)$|Attempt|attempted|Taken$|Thrown$|Reps$|reps$|Rounds$/;
function statDirection(key) {
  if (LOWER_STAT_RE.test(key)) return -1;
  if (NEUTRAL_STAT_RE.test(key)) return 0;
  return 1;
}

function fmtNum(v) {
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

// Compares one log with the average of the player's other logs of the same kind.
function compareToAverage(fields, logs, focus) {
  if (!focus || !fields || !fields.length) return null;
  if (focus.logStyle === "rate") return null;
  logs = logs.filter((e) => e.logStyle !== "rate");
  const others = logs.filter((e) => e.id !== focus.id);
  if (!others.length) return { rows: [], ups: [], downs: [], baseline: 0 };
  const rows = fields
    .map((f) => {
      const dir = statDirection(f.key);
      const value = Number(focus[f.key] || 0);
      const avg = others.reduce((s, e) => s + Number(e[f.key] || 0), 0) / others.length;
      const diff = value - avg;
      const big = Math.abs(diff) >= Math.max(1, Math.abs(avg) * 0.2);
      const better = dir === 0 || diff === 0 ? null : dir * diff > 0;
      return { key: f.key, label: f.label, value, avg, diff, dir, better, big };
    })
    .filter((r) => r.value || r.avg);
  return { rows, ups: rows.filter((r) => r.big && r.better === true), downs: rows.filter((r) => r.big && r.better === false), baseline: others.length };
}

function ComparisonCard({ comparison, focusLabel }) {
  if (!comparison) return null;
  const green = "#5FBF7F";
  const red = "#D9694A";
  return (
    <div className="card">
      <h2>Compared with Your Average</h2>
      {comparison.baseline === 0 ? (
        <p className="hint">Log at least one more to see how this compares with your average.</p>
      ) : (
        <>
          <p className="hint">
            {focusLabel} vs the average of your other {comparison.baseline} log{comparison.baseline === 1 ? "" : "s"}.{" "}
            <span style={{ color: green }}>▲ better</span> · <span style={{ color: red }}>▼ worse</span>
          </p>
          {comparison.rows.map((r) => {
            const color = r.big && r.better === true ? green : r.big && r.better === false ? red : "#EFE9DD";
            const arrow = r.diff === 0 || r.dir === 0 || !r.big ? "" : r.better ? " ▲" : " ▼";
            return (
              <div key={r.key} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #1F3527", fontSize: 13 }}>
                <span style={{ color: "#DCE5DE" }}>{r.label}</span>
                <span>
                  <strong style={{ color }}>{fmtNum(r.value)}</strong>
                  <span style={{ color: "#7C9284" }}> vs {fmtNum(r.avg)}</span>
                  <span style={{ color }}>{arrow}</span>
                </span>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

function VerdictLists({ analysis }) {
  const block = (cls, title, items) =>
    items && items.length > 0 ? (
      <div className={cls}>

          {items.map((t, i) => (

  return (
    <div className="verdict">
      {block("good", "What's going well", analysis.good)}
      {block("steady", "Solid — room to push on", analysis.steady)}
      {block("bad", "What to work on", analysis.bad)}
    </div>
  );
}

// One drill card for every point the analysis raised — things to fix, stats
// that dropped below your average, then things that are solid but could improve.
function buildTipCards(sport, analysis, comparison) {
  const cards = [];
  const seen = new Set();
  const add = (c) => {
    if (seen.has(c.title)) return;
    seen.add(c.title);
    cards.push(c);
  };
  const drillsFor = (given, text) => (given && given.length ? given : drillsForItem(sport, text));
  if (analysis) {
    (analysis.issues || []).forEach((is) =>
      add({ kind: "fix", title: is.title || is.text.split(" — ")[0], reason: is.text, drills: drillsFor(is.drills, is.text) })
    );
  }
  if (comparison) {
    comparison.downs.forEach((r) =>
      add({
        kind: "fix",
        title: r.dir < 0 ? `Bring your ${r.label.toLowerCase()} back down` : `Get your ${r.label.toLowerCase()} back up`,
        reason: `${r.label}: ${fmtNum(r.value)} in this log vs your average of ${fmtNum(r.avg)}.`,
        drills: drillsForItem(sport, r.label),
      })
    );
  }
  if (analysis) {
    (analysis.pushOn || []).forEach((p) => add({ kind: "push", title: p.title, reason: p.text, drills: drillsFor(p.drills, p.text) }));
  }
  return cards;
}

function TipCards({ cards }) {
  return cards.map((t, i) => (
    <div className="card" key={i}>
      <h2>{t.title}</h2>
      <p className="hint" style={{ color: t.kind === "fix" ? "#D9694A" : "#E0B34A" }}>
        {t.kind === "fix" ? "Why: " : "Room to push on: "}
        {t.reason}
      </p>
      <ul className="drills">
        {t.drills.map((d, j) => (
          <li key={j}>{d}</li>
        ))}
      </ul>
    </div>
  ));
}
