// ---------- Videos on this phone + technique analysis ----------
// Clips picked from Photos are stored ONLY on this phone (IndexedDB) — never
// uploaded, so nobody else can see them and they cost nothing. Analysis uses
// MediaPipe's free body tracker, which also runs on the phone: it finds the
// player's joints in each frame and measures their technique for the chosen skill.
const CLIP_DB = "next-level-videos";
function clipDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(CLIP_DB, 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("clips");
      r.result.createObjectStore("poses");
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function clipOp(store, mode, fn) {
  const db = await clipDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
const putClip = (key, blob) => clipOp("clips", "readwrite", (s) => s.put(blob, key));
const getClip = (key) => clipOp("clips", "readonly", (s) => s.get(key));
const putPoses = (key, frames) => clipOp("poses", "readwrite", (s) => s.put(frames, key));
const getPoses = (key) => clipOp("poses", "readonly", (s) => s.get(key));
async function deleteClip(key) {
  await clipOp("clips", "readwrite", (s) => s.delete(key));
  await clipOp("poses", "readwrite", (s) => s.delete(key));
}
function clipKey(username, entryId) {
  return `cricket:${String(username).toLowerCase()}:${entryId}`;
}
function fmtClock(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function fmtSize(bytes) {
  return bytes > 1e9 ? `${(bytes / 1e9).toFixed(1)} GB` : `${Math.max(1, Math.round(bytes / 1e6))} MB`;
}

// ---- Measuring technique from the body tracker's joint positions ----
// Joint numbers from the tracker: 0 nose, 11/12 shoulders, 13/14 elbows,
// 15/16 wrists, 23/24 hips, 25/26 knees, 27/28 ankles.
function poseHelpers(frames) {
  const P = (f, i) => {
    const p = f.lm[i];
    return p && (p[3] === undefined || p[3] > 0.45) ? { x: p[0], y: p[1] } : null;
  };
  const mid = (a, b) => (a && b ? { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } : null);
  const dist = (a, b) => (a && b ? Math.hypot(a.x - b.x, a.y - b.y) : null);
  const angle = (a, b, c) => {
    if (!a || !b || !c) return null;
    const v1 = { x: a.x - b.x, y: a.y - b.y };
    const v2 = { x: c.x - b.x, y: c.y - b.y };
    const d = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);
    if (!d) return null;
    return (Math.acos(Math.max(-1, Math.min(1, (v1.x * v2.x + v1.y * v2.y) / d))) * 180) / Math.PI;
  };
  const median = (arr) => {
    const a = arr.filter((v) => v !== null && !isNaN(v)).sort((x, y) => x - y);
    return a.length ? a[Math.floor(a.length / 2)] : null;
  };
  const shoulders = (f) => mid(P(f, 11), P(f, 12));
  const hips = (f) => mid(P(f, 23), P(f, 24));
  const torso = median(frames.map((f) => dist(shoulders(f), hips(f)))) || 0.25;
  const facing = Math.sign(median(frames.map((f) => (P(f, 0) && shoulders(f) ? P(f, 0).x - shoulders(f).x : null))) || 1) || 1;
  const knee = (f, side) => angle(P(f, side ? 24 : 23), P(f, side ? 26 : 25), P(f, side ? 28 : 27));
  const elbow = (f, side) => angle(P(f, side ? 12 : 11), P(f, side ? 14 : 13), P(f, side ? 16 : 15));
  const lean = (f) => {
    const s = shoulders(f);
    const h = hips(f);
    if (!s || !h) return null;
    return (Math.atan2((s.x - h.x) * facing, h.y - s.y) * 180) / Math.PI;
  };
  return { P, mid, dist, angle, median, shoulders, hips, torso, knee, elbow, lean };
}

// Each measure returns { value, t } — t is the moment in the clip it comes from.
const POSE_METRICS = {
  // How far the head moves around during the skill (% of torso length). Lower = steadier.
  headMove: (frames, H) => {
    const pts = frames.map((f) => ({ t: f.t, p: H.P(f, 0) })).filter((x) => x.p);
    if (pts.length < 3) return null;
    const cx = H.median(pts.map((x) => x.p.x));
    const cy = H.median(pts.map((x) => x.p.y));
    let best = { value: 0, t: pts[0].t };
    pts.forEach((x) => {
      const d = (Math.hypot(x.p.x - cx, x.p.y - cy) / H.torso) * 100;
      if (d > best.value) best = { value: d, t: x.t };
    });
    return best;
  },
  // Side-to-side hip movement (% of torso length). Lower = more stable base.
  hipSway: (frames, H) => {
    const pts = frames.map((f) => ({ t: f.t, p: H.hips(f) })).filter((x) => x.p);
    if (pts.length < 3) return null;
    const cx = H.median(pts.map((x) => x.p.x));
    let best = { value: 0, t: pts[0].t };
    pts.forEach((x) => {
      const d = (Math.abs(x.p.x - cx) / H.torso) * 100;
      if (d > best.value) best = { value: d, t: x.t };
    });
    return best;
  },
  // Lowest knee angle reached (degrees). Smaller = lower, more bent.
  minKnee: (frames, H) => {
    let best = null;
    frames.forEach((f) => {
      [0, 1].forEach((side) => {
        const a = H.knee(f, side);
        if (a !== null && (!best || a < best.value)) best = { value: a, t: f.t };
      });
    });
    return best;
  },
  // Typical forward body lean (degrees; negative = leaning back).
  leanMedian: (frames, H) => {
    const vals = frames.map((f) => ({ t: f.t, v: H.lean(f) })).filter((x) => x.v !== null);
    if (vals.length < 3) return null;
    const m = H.median(vals.map((x) => x.v));
    const near = vals.reduce((a, b) => (Math.abs(b.v - m) < Math.abs(a.v - m) ? b : a));
    return { value: m, t: near.t };
  },
  // Forward lean in the first part of the clip (drive phase of a sprint).
  leanEarly: (frames, H) => POSE_METRICS.leanMedian(frames.slice(0, Math.max(3, Math.ceil(frames.length * 0.4))), H),
  // Most backward lean in the second half (e.g. leaning back when striking a ball).
  leanBackMost: (frames, H) => {
    const half = frames.slice(Math.floor(frames.length * 0.4));
    let best = null;
    half.forEach((f) => {
      const v = H.lean(f);
      if (v !== null && (!best || v < best.value)) best = { value: v, t: f.t };
    });
    return best;
  },
  // Straightest the arm gets (degrees). 180 = fully straight.
  armExt: (frames, H) => {
    let best = null;
    frames.forEach((f) => {
      [0, 1].forEach((side) => {
        const a = H.elbow(f, side);
        if (a !== null && (!best || a > best.value)) best = { value: a, t: f.t };
      });
    });
    return best;
  },
  // Highest knee lift (%): 0 = standing leg, 100 = thigh level with the hip.
  kneeLift: (frames, H) => {
    let best = null;
    frames.forEach((f) => {
      [
        [23, 25],
        [24, 26],
      ].forEach(([hi, ki]) => {
        const h = H.P(f, hi);
        const k = H.P(f, ki);
        const thigh = H.dist(h, k);
        if (!h || !k || !thigh) return;
        const v = Math.max(0, Math.min(150, (1 + (h.y - k.y) / thigh) * 100));
        if (!best || v > best.value) best = { value: v, t: f.t };
      });
    });
    return best;
  },
  // How high the hips rise above standing height (% of leg length).
  jump: (frames, H) => {
    const pts = frames.map((f) => ({ t: f.t, h: H.hips(f), a: H.mid(H.P(f, 27), H.P(f, 28)) })).filter((x) => x.h);
    if (pts.length < 4) return null;
    const leg = H.median(pts.map((x) => (x.a ? x.a.y - x.h.y : null))) || H.torso * 1.6;
    const base = H.median(pts.slice(0, Math.max(2, Math.ceil(pts.length * 0.2))).map((x) => x.h.y));
    let best = { value: 0, t: pts[0].t };
    pts.forEach((x) => {
      const v = ((base - x.h.y) / leg) * 100;
      if (v > best.value) best = { value: v, t: x.t };
    });
    return best;
  },
  // Feet apart compared with shoulders (× shoulder width). Film face-on.
  stanceWidth: (frames, H) => {
    const vals = frames
      .map((f) => {
        const s = H.dist(H.P(f, 11), H.P(f, 12));
        const a = H.dist(H.P(f, 27), H.P(f, 28));
        return s && a ? { t: f.t, v: a / s } : null;
      })
      .filter(Boolean);
    if (vals.length < 3) return null;
    const m = H.median(vals.map((x) => x.v));
    return { value: m, t: vals.reduce((a, b) => (Math.abs(b.v - m) < Math.abs(a.v - m) ? b : a)).t };
  },
  // Front leg at release (degrees, the straighter leg when the hand is highest).
  frontBrace: (frames, H) => {
    let top = null;
    frames.forEach((f) => {
      [15, 16].forEach((wi) => {
        const w = H.P(f, wi);
        if (w && (!top || w.y < top.y)) top = { y: w.y, f };
      });
    });
    if (!top) return null;
    const vals = [H.knee(top.f, 0), H.knee(top.f, 1)].filter((v) => v !== null);
    return vals.length ? { value: Math.max(...vals), t: top.f.t } : null;
  },
  // Golf tempo: backswing time ÷ downswing time.
  tempo: (frames, H) => {
    const pts = frames.map((f) => ({ t: f.t, w: H.mid(H.P(f, 15), H.P(f, 16)) })).filter((x) => x.w);
    if (pts.length < 6) return null;
    let topI = 0;
    pts.forEach((x, i) => {
      if (x.w.y < pts[topI].w.y) topI = i;
    });
    const before = pts.slice(0, topI + 1);
    if (before.length < 2 || topI >= pts.length - 1) return null;
    const lowY = Math.max(...before.map((x) => x.w.y));
    const range = lowY - pts[topI].w.y;
    if (range <= 0) return null;
    let startI = 0;
    for (let i = topI; i >= 0; i--) {
      if (pts[i].w.y >= lowY - range * 0.1) {
        startI = i;
        break;
      }
    }
    let impI = -1;
    for (let i = topI + 1; i < pts.length; i++) {
      if (pts[i].w.y >= lowY - range * 0.1) {
        impI = i;
        break;
      }
    }
    if (impI < 0) return null;
    const back = pts[topI].t - pts[startI].t;
    const down = pts[impI].t - pts[topI].t;
    return back > 0 && down > 0 ? { value: back / down, t: pts[topI].t } : null;
  },
  // Balance at the finish: how far the hips are from over the feet (% of torso).
  finishBalance: (frames, H) => {
    for (let i = frames.length - 1; i >= Math.max(0, frames.length - 6); i--) {
      const f = frames[i];
      const h = H.hips(f);
      const a = H.mid(H.P(f, 27), H.P(f, 28));
      if (h && a) return { value: (Math.abs(h.x - a.x) / H.torso) * 100, t: f.t };
    }
    return null;
  },
};

// A rule turns a measure into a verdict. lowerBetter / range / higher (default).
function judgeRule(rule, value) {
  if (rule.range) {
    const [lo, hi] = rule.range;
    const [olo, ohi] = rule.rangeOk || rule.range;
    if (value >= lo && value <= hi) return "good";
    if (value >= olo && value <= ohi) return "ok";
    return "bad";
  }
  if (rule.lowerBetter) return value <= rule.good ? "good" : value <= rule.ok ? "ok" : "bad";
  return value >= rule.good ? "good" : value >= rule.ok ? "ok" : "bad";
}
function fmtRuleValue(rule, v) {
  if (rule.unit === "ratio") return `${v.toFixed(1)}:1`;
  if (rule.unit === "×") return `${v.toFixed(1)}×`;
  if (rule.unit === "°") return `${Math.round(v)}°`;
  return `${Math.round(v)}%`;
}
function analysePoseFrames(frames, skill) {
  const usable = frames.filter((f) => f.lm && f.lm.length >= 29);
  if (usable.length < 5) return { error: "body" };
  const H = poseHelpers(usable);
  const results = skill.rules.map((rule) => {
    const m = POSE_METRICS[rule.metric](usable, H);
    if (!m || m.value === null || isNaN(m.value)) {
      return { key: rule.metric + rule.label, label: rule.label, status: "none", text: rule.missing || `Couldn't measure ${rule.label.toLowerCase()} — make sure your whole body is in shot.` };
    }
    const status = judgeRule(rule, m.value);
    const text = (status === "good" ? rule.goodMsg : status === "ok" ? rule.okMsg || rule.badMsg : rule.badMsg).replace("{v}", fmtRuleValue(rule, m.value));
    return { key: rule.metric + rule.label, label: rule.label, value: m.value, display: fmtRuleValue(rule, m.value), status, t: m.t, text, tipTitle: rule.tipTitle, drills: rule.drills };
  });
  return { results, frames: usable.length };
}

// ---- Loading the body tracker (only when someone taps Analyse) ----
const POSE_LIB = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const POSE_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const POSE = { tracker: null, clock: 0 };
async function loadPoseTracker() {
  if (POSE.tracker) return POSE.tracker;
  const lib = await new Function("u", "return import(u)")(`${POSE_LIB}/vision_bundle.mjs`);
  const files = await lib.FilesetResolver.forVisionTasks(`${POSE_LIB}/wasm`);
  const make = (delegate) =>
    lib.PoseLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: POSE_MODEL, delegate }, runningMode: "VIDEO", numPoses: 1 });
  try {
    POSE.tracker = await make("GPU");
  } catch (e) {
    POSE.tracker = await make("CPU");
  }
  return POSE.tracker;
}
function seekTo(video, t) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("seeked", finish);
      resolve();
    };
    video.addEventListener("seeked", finish);
    setTimeout(finish, 1500);
    video.currentTime = t;
  });
}
async function trackPoses(video, skill, onProgress) {
  const tracker = await loadPoseTracker();
  try {
    await video.play();
  } catch (e) {
    // fine — some phones need this before seeking works
  }
  video.pause();
  const end = Math.min(video.duration || 0, skill.maxSecs || 20);
  const step = 1 / (skill.fps || 10);
  const frames = [];
  const W = video.videoWidth || 1;
  const Hh = video.videoHeight || 1;
  for (let t = 0; t <= end; t += step) {
    await seekTo(video, Math.min(t, Math.max(0, (video.duration || t) - 0.01)));
    POSE.clock += 40;
    const res = tracker.detectForVideo(video, POSE.clock);
    const lm = res && res.landmarks && res.landmarks[0];
    if (lm) frames.push({ t: Math.round(t * 100) / 100, lm: lm.map((p) => [p.x * W, p.y * Hh, p.z || 0, p.visibility === undefined ? 1 : p.visibility]) });
    onProgress(Math.min(1, t / (end || 1)));
  }
  return { frames, W, H: Hh };
}

function SkeletonOverlay({ videoRef, frames }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    let raf;
    const LINES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
    const draw = () => {
      const v = videoRef.current;
      const c = canvasRef.current;
      if (v && c && frames && frames.length) {
        const w = v.clientWidth;
        const h = v.clientHeight;
        if (c.width !== w) c.width = w;
        if (c.height !== h) c.height = h;
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        const t = v.currentTime;
        let f = frames[0];
        frames.forEach((x) => {
          if (Math.abs(x.t - t) < Math.abs(f.t - t)) f = x;
        });
        if (Math.abs(f.t - t) < 0.4) {
          const sx = w / (v.videoWidth || w);
          const sy = h / (v.videoHeight || h);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#5FBF7F";
          LINES.forEach(([a, b]) => {
            const p = f.lm[a];
            const q = f.lm[b];
            if (!p || !q || p[3] < 0.45 || q[3] < 0.45) return;
            ctx.beginPath();
            ctx.moveTo(p[0] * sx, p[1] * sy);
            ctx.lineTo(q[0] * sx, q[1] * sy);
            ctx.stroke();
          });
          ctx.fillStyle = "#E0B34A";
          f.lm.forEach((p, i) => {
            if (i > 28 || (i > 0 && i < 11) || p[3] < 0.45) return;
            ctx.beginPath();
            ctx.arc(p[0] * sx, p[1] * sy, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => cancelAnimationFrame(raf);
  }, [frames]);
  return <canvas ref={canvasRef} style={{ position: "absolute", left: 0, top: 0, pointerEvents: "none" }} />;
}

  const videoRef = useRef(null);
  const pickRef = useRef(null);
  const key = clipKey(username, entry.id);
  const notesKey = `vnotes:${key}`;
  const skills = VIDEO_SKILLS["cricket"] || [];
  const va = entry.videoAnalysis;

    let url = null;

    setFrames(null);
    setError("");
    if (entry.video && entry.video.local) {
      getClip(key)
        .then((blob) => {
          if (!live) return;
          if (!blob) return setMissing(true);
          url = URL.createObjectURL(blob);
          setSrc(url);
        })
        .catch(() => live && setMissing(true));
      getPoses(key).then((f) => live && f && setFrames(f)).catch(() => {});
    }
    safeGet(notesKey)
      .then((r) => live && setNotes(r ? JSON.parse(r.value) : []))
      .catch(() => live && setNotes([]));
    if (va) {
      const i = skills.findIndex((s) => s.label === va.skill);
      if (i >= 0) setSkillIdx(i);
    }
    return () => {
      live = false;
      if (url) URL.revokeObjectURL(url);
    };
  }, [entry.id, entry.video && entry.video.addedAt]);

  function jump(t) {
    const v = videoRef.current;
    if (!v) return;
    v.currentTime = t;
    v.pause();
  }
  function pinHere() {
    const v = videoRef.current;
    setPinned(v ? v.currentTime : 0);
  }
  async function addNote() {
    if (!text.trim()) return;
    const t = pinned !== null ? pinned : videoRef.current ? videoRef.current.currentTime : 0;
    const next = [...notes, { t, text: text.trim(), at: Date.now() }];
    setNotes(next);
    setText("");
    setPinned(null);
    window.storage.set(notesKey, JSON.stringify(next)).catch(() => {});
  }
  function deleteNote(i) {
    const sorted = notes.slice().sort((a, b) => a.t - b.t);
    const target = sorted[i];
    const next = notes.filter((n) => n !== target);
    setNotes(next);
    window.storage.set(notesKey, JSON.stringify(next)).catch(() => {});
  }
  async function analyse() {
    const v = videoRef.current;
    const skill = skills[skillIdx];
    if (!v || !skill) return;
    setError("");
    setBusy(true);
    setProgress(0);
    try {
      const { frames: found } = await trackPoses(v, skill, setProgress);
      const out = analysePoseFrames(found, skill);
      if (out.error) {
        setError(`Couldn't see a full body clearly enough. ${skill.film} Good light helps, and keep only one person in frame if you can.`);
      } else {
        setFrames(found);
        putPoses(key, found).catch(() => {});
        onAnalysed({ skill: skill.label, at: Date.now(), frames: out.frames, results: out.results });
        v.currentTime = 0;
      }
    } catch (e) {
      setError("The body tracker couldn't load — check your internet connection and try again (it's only needed the first time).");
    }
    setBusy(false);
    setProgress(null);
  }

  if (!entry.video) {
    return (
      <div className="card">
        <h2>🎥 Add a Video</h2>
        <p className="hint">Add a clip to this log to watch it back, add notes and get your technique analysed. It stays on this phone only.</p>
        <input
          ref={pickRef}
          type="file"
          accept="video/*"
          style={{ display: "none" }}
          onChange={(e) => {
            const f = e.target.files && e.target.files[0];
            if (f) onAttach(f);
            e.target.value = "";
          }}
        />
        <button className="save-btn" onClick={() => pickRef.current && pickRef.current.click()}>
          Choose from Photos or Camera
        </button>
      </div>
    );
  }

  const sortedNotes = notes.slice().sort((a, b) => a.t - b.t);
  const rings = va ? va.results.filter((r) => r.status !== "none") : [];
  return (
    <div className="card">
      <h2>🎥 Your Video</h2>
      {missing ? (
        <p className="hint">This video is saved on the phone you added it from, so it can't play here. Your notes and analysis are still below.</p>
      ) : !src ? (
        <LoadingSkeleton label="Loading video" height={200} />
      ) : (
        <div style={{ position: "relative", width: "100%", background: "#000", borderRadius: 10, overflow: "hidden" }}>
          <video ref={videoRef} src={src} controls playsInline preload="auto" muted style={{ width: "100%", display: "block" }} />
          {frames && showLines && <SkeletonOverlay videoRef={videoRef} frames={frames} />}
        </div>
      )}
      {frames && !missing && (
        <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, fontSize: 13, color: "#9FB3A4" }}>
          <input type="checkbox" checked={showLines} onChange={(e) => setShowLines(e.target.checked)} /> Show body lines on the video
        </label>
      )}
      <p className="hint" style={{ marginTop: 6 }}>🔒 Only on this phone — nobody else can see it.</p>

      <h3 style={{ marginBottom: 6 }}>🤖 Technique Analysis</h3>
      {!missing && (
        <>
          <label className="field">
            <span>What does this clip show?</span>
            <select value={skillIdx} onChange={(e) => setSkillIdx(Number(e.target.value))} disabled={busy}>
              {skills.map((s, i) => (
                <option key={s.label} value={i}>
                  {s.label}
                </option>
              ))}
            </select>
          </label>
          {skills[skillIdx] && <p className="hint">📹 Best results: {skills[skillIdx].film}</p>}
          {progress !== null ? (
            <div style={{ margin: "10px 0" }}>
              <div style={{ height: 10, background: "#1F3527", borderRadius: 10, overflow: "hidden" }}>
                <div style={{ width: `${Math.round(progress * 100)}%`, height: "100%", background: "#3B82F6" }} />
              </div>
              <p className="hint">Analysing your technique… {Math.round(progress * 100)}% (stays on your phone)</p>
            </div>
          ) : (
            <button className="save-btn" disabled={!src || busy} onClick={analyse}>
              {va ? "Analyse Again" : "Analyse My Technique"}
            </button>
          )}
        </>
      )}
      {error && <p className="hint" style={{ color: "#D9694A" }}>{error}</p>}
      {va && (
        <div style={{ marginTop: 12 }}>
          <p className="hint" style={{ marginTop: 0 }}>
            {va.skill} · based on {va.frames} frames of your clip
          </p>
          {rings.length > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 12, justifyContent: "center", marginBottom: 10 }}>
              {rings.map((r) => (
                <StatRing key={r.key} label={r.label} display={r.display} fill={r.status === "good" ? 92 : r.status === "ok" ? 62 : 30} status={r.status} detail={r.t !== undefined ? `at ${fmtClock(r.t)}` : null} />
              ))}
            </div>
          )}
          {va.results.map((r) => (
            <div key={r.key} style={{ display: "flex", gap: 10, padding: "8px 0", borderBottom: "1px solid #1F3527", alignItems: "flex-start" }}>
              <span style={{ fontSize: 16 }}>{r.status === "good" ? "✅" : r.status === "ok" ? "🟡" : r.status === "bad" ? "🔴" : "⚪️"}</span>
              <span style={{ flex: 1, fontSize: 13.5, color: "#EFE9DD", lineHeight: 1.4 }}>{r.text}</span>
              {r.t !== undefined && !missing && (
                <button type="button" onClick={() => jump(r.t)} style={{ background: "#1B3324", border: "1px solid #3A5C46", color: "#8FD9A0", borderRadius: 10, padding: "2px 8px", fontFamily: "inherit", fontWeight: 700, cursor: "pointer" }}>
                  📍 {fmtClock(r.t)}
                </button>
              )}
            </div>
          ))}
          <p className="hint">Drills for anything flagged are in Drills & Tips.</p>
        </div>
      )}

      <h3 style={{ marginBottom: 6 }}>📝 Your Notes</h3>
      {sortedNotes.length === 0 && <p className="hint">Pause on a key moment, tap 📍, then write what happened.</p>}
      {sortedNotes.map((n, i) => (
        <div key={i} style={{ display: "flex", gap: 10, padding: "8px 0", borderBottom: "1px solid #1F3527", alignItems: "flex-start" }}>
          <button type="button" onClick={() => jump(n.t)} style={{ background: "#1B3324", border: "1px solid #3A5C46", color: "#8FD9A0", borderRadius: 10, padding: "2px 8px", fontFamily: "inherit", fontWeight: 700, cursor: "pointer" }}>
            {fmtClock(n.t)}
          </button>
          <span style={{ flex: 1, fontSize: 13.5, color: "#EFE9DD", lineHeight: 1.4 }}>{n.text}</span>
          <button type="button" aria-label="Delete note" onClick={() => deleteNote(i)} style={{ background: "none", border: "none", color: "#7C9284", cursor: "pointer" }}>
            ✕
          </button>
        </div>
      ))}
      {!missing && (
        <>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button type="button" onClick={pinHere} title="Use the paused moment" style={{ ...NOTE_INPUT, cursor: "pointer", whiteSpace: "nowrap", color: pinned !== null ? "#8FD9A0" : "#EFE9DD" }}>
              📍 {pinned !== null ? fmtClock(pinned) : "Here"}
            </button>
            <input
              type="text"
              placeholder="What happened at this moment?"
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") addNote();
              }}
              style={{ ...NOTE_INPUT, flex: 1, minWidth: 0 }}
              aria-label="Note"
            />
          </div>
          <button className="save-btn" style={{ marginTop: 8 }} onClick={addNote}>
            Add Note
          </button>
        </>
      )}
      <div>
        <button
          type="button"
          onClick={() => {
            if (window.confirm("Remove this video from the log? It will be deleted from this phone.")) onRemove();
          }}
          style={{ marginTop: 12, background: "transparent", border: "1px solid #2A4433", color: "#9FB3A4", borderRadius: 10, padding: "8px 14px", cursor: "pointer" }}
        >
          Remove video
        </button>
      </div>
    </div>
  );
}

async function deleteUserClips(username) {
  const tag = `:${String(username).toLowerCase()}:`;
  try {
    const db = await clipDb();
    await Promise.all(
      ["clips", "poses"].map(
        (store) =>
          new Promise((resolve) => {
            const tx = db.transaction(store, "readwrite");
            const req = tx.objectStore(store).openCursor();
            req.onsuccess = () => {
              const c = req.result;
              if (!c) return;
              if (String(c.key).includes(tag)) c.delete();
              c.continue();
            };
            tx.oncomplete = resolve;
            tx.onerror = resolve;
          })
      )
    );
  } catch (e) {
    // no videos on this phone
  }
}

async function localDeleteAccount(username) {
  const lower = String(username).toLowerCase();
  try {
    const res = await safeGet("accounts:list");
    const accounts = res ? JSON.parse(res.value) : [];
    await window.storage.set("accounts:list", JSON.stringify(accounts.filter((a) => String(a.username).toLowerCase() !== lower)));
  } catch (e) {
    // no account list
  }
  const keys = await window.storage.list(`u:${lower}:`).catch(() => ({ keys: [] }));
  for (const k of (keys && keys.keys) || []) await window.storage.delete(String(k).replace(/^nl:/, "")).catch(() => {});
  await window.storage.delete("profile:data").catch(() => {});
}

function DeleteAccountCard({ profile, onDeleted }) {
  const [open, setOpen] = useState(false);
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const online = CLOUD.enabled && CLOUD.uid;

      setError("Enter your password to confirm.");
      return;
    }
    if (!window.confirm("This permanently deletes your account, all your logs, teams, messages and videos. It can't be undone. Delete everything?")) return;

    setError("");
    try {
      if (online) await cloudDeleteAccount(password);
      else await localDeleteAccount(profile.username);
      await deleteUserClips(profile.username);
      setBusy(false);
      window.alert("Your account and all your data have been deleted.");
      onDeleted();
    } catch (e) {
      setBusy(false);
      const code = (e && e.code) || "";
      setError(code.includes("wrong-password") || code.includes("invalid-credential") || code.includes("invalid-login") ? "Incorrect password." : cloudAuthError(e));

          <p className="hint" style={{ color: "#FCA5A5" }}>
            This deletes your login, all your logs, goals, gym and nutrition data in every sport, any teams you coach, your messages to us, and videos on this phone. It can't be undone.

            <label className="field">

        setStatus("Couldn't load your messages — check your connection.");

        const m = await safeGet("help:messages");

}

// The stats a position's analysis really uses: its headline cards, its chart,
// and any rings it can fill. Everything else is "more stats".
const QUICK_EXTRA_KEYS = ["minutesPlayed", "par", "fours", "sixes", "catches", "maidens", "goals", "tries", "assists"];
function quickStatKeys(fields, cards, chart, metrics) {
  const keys = new Set((fields || []).map((f) => f.key));
  const want = new Set();
  const add = (k) => {
    if (keys.has(k)) want.add(k);
  };
  const metricKeys = (m) => [m.num, ...(m.den || [])];
  (cards || []).forEach((c) => {
    if (c.key) add(c.key);
    if (c.metric) {
      const m = (metrics || []).find((x) => x.label === c.metric);
      if (m && metricKeys(m).every((k) => keys.has(k))) metricKeys(m).forEach(add);
    }
  });
  if (chart) {
    add(chart.countKey);
    add(chart.numKey);
    (chart.denKeys || []).forEach(add);
  }
  QUICK_EXTRA_KEYS.forEach(add);
  if (want.size < 3) (fields || []).slice(0, 6).forEach((f) => want.add(f.key));
  return [...want];
}

function emptyAreaRatings(areas) {

function GameRatings({ areas, value, onChange }) {

        </div>

function areaAverages(items, areas) {
  const rated = (items || []).filter((e) => e.areaRatings);
  if (!rated.length) return null;
  const rows = (areas || [])
    .map((a) => {
      const vals = rated.map((e) => e.areaRatings[a.key]).filter((v) => typeof v === "number");
      if (!vals.length) return null;
      const last = vals[vals.length - 1];
      const avg = vals.reduce((x, y) => x + y, 0) / vals.length;
      return { ...a, avg, last, n: vals.length };
    })
    .filter(Boolean);
  return rows.length ? { rows, count: rated.length } : null;
}

function AreaRatingsCard({ items, areas }) {
  const res = areaAverages(items, areas);
  if (!res) return null;
  const sorted = res.rows.slice().sort((a, b) => b.avg - a.avg);
  const best = sorted[0];
  const worst = sorted[sorted.length - 1];
  return (
    <div className="card">
      <h2>Your Game Ratings</h2>
      <p className="hint">
        From {res.count} rated {res.count === 1 ? "log" : "logs"}. {sorted.length > 1 && best.avg - worst.avg >= 0.5
          ? `Strongest: ${best.label} (${fmtNum(best.avg)}). Needs work: ${worst.label} (${fmtNum(worst.avg)}).`
          : "Keep rating your games to see where you're strongest."}
      </p>
      {sorted.map((r) => (
        <div key={r.key} style={{ marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#EFE9DD", marginBottom: 4 }}>
            <span>{r.label}</span>
            <span style={{ color: "#9FB3A4" }}>
              {fmtNum(r.avg)}/10{r.n > 1 ? ` · last ${r.last}` : ""}
            </span>
          </div>
          <div style={{ height: 8, background: "#0F1F17", borderRadius: 4, overflow: "hidden" }}>
            <div style={{ width: `${r.avg * 10}%`, height: "100%", background: r.avg >= 7 ? "#5FB37A" : r.avg >= 5 ? "#E0B34A" : "#D9694A" }} />
          </div>
        </div>
      ))}
    </div>
  );
}

// Drills & Tips for the parts of the game rated lowest (under 6.5 on average).
function areaTipCards(sport, items, areas) {
  const res = areaAverages(items, areas);
  if (!res) return [];
  return res.rows
    .filter((r) => r.avg < 6.5)
    .sort((a, b) => a.avg - b.avg)
    .slice(0, 3)
    .map((r) => ({
      kind: "fix",
      title: `Lift your ${r.label.toLowerCase()}`,
      reason: `You've rated your ${r.label.toLowerCase()} ${fmtNum(r.avg)}/10 on average, one of the lowest parts of your game right now.`,
      drills: (DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][r.drillHint]) || drillsForItem(sport, r.label),
    }));
}

function logSummary(meta, e) {
  if (e && e.logStyle === "rate") {
    const vals = Object.values(e.areaRatings || {}).filter((v) => typeof v === "number");
    return vals.length ? `⭐ Rated ${fmtNum(vals.reduce((x, y) => x + y, 0) / vals.length)}/10 across ${vals.length} areas` : "⭐ Rated";
  }
  return meta ? meta.summary(e) : "";
}

// While a live tally, scorecard or guided timer is on screen, hide the bottom
// bar so a stray tap can't lose what you're in the middle of.
function useFocusMode() {
  useEffect(() => {
    document.body.classList.add("focus-mode");
    return () => document.body.classList.remove("focus-mode");
  }, []);
}

function LiveMatchTally({ roleFields, moreFields, initial, onChange, onFinish, onCancel, onCallOff }) {
  useFocusMode();
  const main = (roleFields || []).filter((f) => !LIVE_TALLY_EXCLUDED_KEYS.includes(f.key));
  const extra = (moreFields || []).filter((f) => !LIVE_TALLY_EXCLUDED_KEYS.includes(f.key));
  const [showMore, setShowMore] = useState(false);
  const fields = showMore ? [...main, ...extra] : main;
  const [entry, setEntry] = useState(() => {
    const e = {};
    [...main, ...extra].forEach((f) => (e[f.key] = Number((initial || {})[f.key]) || 0));
    return e;
  });
  const [history, setHistory] = useState([]);

  // Keep the screen on while tapping, where the phone allows it.
  useEffect(() => {
    let lock = null;
    let gone = false;
    try {
      if (navigator.wakeLock) {
        navigator.wakeLock
          .request("screen")
          .then((l) => (gone ? l.release() : (lock = l)))
          .catch(() => {});
      }
    } catch (e) {
      // not supported
    }
    return () => {
      gone = true;
      try {
        if (lock) lock.release();
      } catch (e) {
        // already released
      }
    };
  }, []);

  function bump(key, by) {
    setEntry((e) => {
      const next = { ...e, [key]: Math.max(0, (e[key] || 0) + by) };
      if (onChange) onChange(next);
      return next;
    });
  }
  function tap(key) {
    setHistory((h) => [...h, key]);
    bump(key, 1);
  }
  function undo() {
    if (history.length === 0) return;
    bump(history[history.length - 1], -1);
    setHistory((h) => h.slice(0, -1));
  }

  return (
    <div className="card">
      <h2>Live Tally</h2>
      <p className="hint">Tap a button every time it happens. Minutes played and anything else go on the next screen.</p>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {fields.map((f) => (
          <button
            key={f.key}
            type="button"
            className="tally-btn"
            onClick={() => tap(f.key)}
            style={{ minHeight: 86, borderRadius: 14, border: "2px solid #2A4433", background: "#16241B", color: "#EFE9DD", cursor: "pointer", fontFamily: "inherit", padding: "8px 6px", touchAction: "manipulation" }}
          >
            <div style={{ fontSize: 30, fontWeight: 800, color: "#F5EFE2", lineHeight: 1.1 }}>{entry[f.key]}</div>
            <div style={{ fontSize: 13, color: "#9FB3A4", marginTop: 4 }}>{f.label}</div>
          </button>
        ))}
      </div>
      {extra.length > 0 && (
        <button
          type="button"
          onClick={() => setShowMore(!showMore)}
          style={{ width: "100%", marginTop: 10, background: "transparent", border: "1px dashed #2A4433", color: "#9FB3A4", borderRadius: 10, padding: "10px", cursor: "pointer", fontFamily: "inherit" }}
        >
          {showMore ? "Show just the key stats" : `＋ More stats (${extra.length})`}
        </button>
      )}
      <button type="button" onClick={undo} disabled={history.length === 0} style={{ marginTop: 12, width: "100%", padding: "12px", borderRadius: 10, cursor: "pointer", fontFamily: "inherit", background: "#16241B", border: "1px solid #2A4433", color: "#EFE9DD", opacity: history.length === 0 ? 0.5 : 1 }}>
        ↩ Undo Last Tap
      </button>
      <button className="save-btn" style={{ marginTop: 12, width: "100%" }} onClick={() => onFinish(entry)}>
        Finish &amp; Review
      </button>
      {onCallOff && (
        <button
          type="button"
          onClick={() => onCallOff(entry)}
          style={{ marginTop: 10, background: "#4C1D24", color: "#FECACA", border: "none", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
        >
          Call It — Stopped Mid-Round
        </button>
      )}
      <button
        type="button"
        onClick={onCancel}
        style={{ marginTop: 10, background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
      >
        Cancel
      </button>
    </div>
  );
}

// Card shown on the Analysis tab: turns the 1-10 self-ratings logged with each
// session into a "what's going well" vs "not as good" breakdown, a bar chart,
// and the full set of averages for more detail.
function RatingsAnalysisCard({ items }) {
  const withRatings = items.filter((i) => i.ratings);
  if (withRatings.length === 0) return null;
  const avgs = ratingAverages(items);
  const sorted = RATING_DIMENSIONS.map((d) => ({ ...d, avg: avgs[d.key] })).sort((a, b) => b.avg - a.avg);
  // Strengths and weak spots never overlap; if every rating is about the
  // same there's nothing to separate, so say that instead.
  const spread = sorted.length ? sorted[0].avg - sorted[sorted.length - 1].avg : 0;
  const allSame = spread < 1;
  const strengths = sorted.filter((d) => d.avg >= 7);
  const shownStrengths = allSame ? [] : strengths.length > 0 ? strengths : sorted.slice(0, 2);
  const strongKeys = new Set(shownStrengths.map((d) => d.key));
  const weaknesses = sorted.filter((d) => d.avg <= 5 && !strongKeys.has(d.key)).sort((a, b) => a.avg - b.avg);
  const shownWeaknesses = allSame ? [] : weaknesses.length > 0 ? weaknesses : sorted.filter((d) => !strongKeys.has(d.key)).slice(-2).reverse();

  return (
    <div className="card">
      <h2>Self-Ratings</h2>
      <p className="hint">
        Based on {withRatings.length} logged {withRatings.length === 1 ? "session" : "sessions"} where you rated yourself.
      </p>

      <SimpleBarChart data={sorted.map((d) => ({ label: d.label.slice(0, 4), value: Number(d.avg.toFixed(1)) }))} suffix="" />

      {allSame && (
        <p className="hint" style={{ marginTop: 12 }}>
          You've rated everything about the same (around {sorted[0].avg.toFixed(1)}/10). Rate each area honestly after every session and your strengths and weak spots will show up here.
        </p>
      )}
      {!allSame && <h3 style={{ marginTop: 12, marginBottom: 6 }}>What's going well</h3>}
      {shownStrengths.map((d) => (
        <div key={d.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#B7E4C1", marginBottom: 4 }}>
          <span>{d.label}</span>
          <span>{d.avg.toFixed(1)}/10</span>
        </div>
      ))}

      {!allSame && <h3 style={{ marginTop: 14, marginBottom: 6 }}>Not as good — worth working on</h3>}
      {shownWeaknesses.map((d) => (
        <div key={d.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#FCA5A5", marginBottom: 4 }}>
          <span>{d.label}</span>
          <span>{d.avg.toFixed(1)}/10</span>
        </div>
      ))}

      <h3 style={{ marginTop: 14, marginBottom: 6 }}>Full breakdown</h3>
      {sorted.map((d) => (
        <div key={d.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#9FB3A4", marginBottom: 2 }}>
          <span>{d.label}</span>
          <span>{d.avg.toFixed(1)}/10</span>
        </div>
      ))}
    </div>
  );
}

  if (!texts || texts.length === 0) return null;
  return (
    <div className="card" style={{ background: "#1E3A24", border: "1px solid #3D8A4E" }}>
      <h3 style={{ margin: 0, color: "#B7E4C1" }}>

      </h3>
      <ul style={{ margin: "8px 0 0", paddingLeft: 18, color: "#DFF3E4" }}>
        {texts.map((t, i) => (
          <li key={i}>{t}</li>
        ))}
      </ul>
      <button
        type="button"
        onClick={onDismiss}
        style={{
          marginTop: 10,
          background: "transparent",
          border: "1px solid #3D8A4E",
          color: "#DFF3E4",
          borderRadius: 10,
          padding: "6px 14px",
          cursor: "pointer",
        }}
      >
        Dismiss
      </button>
    </div>
  );
}

function emptyFieldsEntry(fields) {
  const e = { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10) };
  fields.forEach((f) => (e[f.key] = 0));
  return e;
}

// Readable one-liner for a training log: only what was filled in, with units
// where the label has them, e.g. "40 mins · 6 km · intensity 7/10".
function genericFieldsSummary(entry, fields) {
  const parts = [];
  (fields || []).forEach((f) => {
    const v = Number(entry[f.key]);
    if (!v) return;
    const unit = (f.label.match(/\(([^)]*)\)/) || [])[1] || "";
    const name = f.label.replace(/\s*\(.*\)/, "").toLowerCase();
    if (/rpe|1-10|1–10/i.test(unit)) parts.push(`${name} ${v}/10`);
    else if (/^(mins?|minutes)$/i.test(unit)) parts.push(`${v} mins`);
    else if (/^(km|m|kg|s|secs?)$/i.test(unit)) parts.push(`${v} ${unit}${name === "duration" || name === "distance" ? "" : " " + name}`);
    else parts.push(`${v} ${name}`);
  });
  return parts.length ? parts.join(" · ") : "Logged";
}

  );
}

const GYM_GOALS = ["Cut", "Bulk", "Maintain"];

function emptyWorkoutExercise() {
  const muscleGroup = MUSCLE_GROUPS[0];
  const muscle = MUSCLES_BY_GROUP[muscleGroup][0];
  const exercise = EXERCISES_BY_MUSCLE[muscle][0];
  return { muscleGroup, muscle, exercise, sets: 3, reps: 8, weight: 0 };
}

function estOneRM(weight, reps) {
  const w = Number(weight) || 0;
  const r = Number(reps) || 0;
  if (r <= 1) return w;
  return w * (1 + r / 30);
}

function bestForExercise(workouts, exerciseName) {
  let best = null;
  workouts.forEach((w) => {
    (w.exercises || []).forEach((ex) => {
      if (ex.exercise === exerciseName) {
        const e1rm = estOneRM(ex.weight, ex.reps);
        if (!best || e1rm > best.e1rm) {
          best = { weight: Number(ex.weight), reps: Number(ex.reps), e1rm, date: w.date, workoutName: w.name };
        }
      }
    });
  });
  return best;
}

function analyseGym(workouts, bodyweightLogs, goal) {
  if (workouts.length === 0 && bodyweightLogs.length === 0) return null;

  const totalVolume = workouts.reduce(
    (sum, w) => sum + (w.exercises || []).reduce((s, ex) => s + Number(ex.sets || 0) * Number(ex.reps || 0) * Number(ex.weight || 0), 0),
    0
  );
  const totalWorkouts = workouts.length;

  const exerciseNames = new Set();
  workouts.forEach((w) => (w.exercises || []).forEach((ex) => exerciseNames.add(ex.exercise)));
  const personalBests = Array.from(exerciseNames)
    .map((name) => ({ exercise: name, best: bestForExercise(workouts, name) }))
    .filter((x) => x.best)
    .sort((a, b) => b.best.e1rm - a.best.e1rm);

  const groupVolume = {};
  MUSCLE_GROUPS.forEach((g) => (groupVolume[g] = 0));
  workouts.forEach((w) =>
    (w.exercises || []).forEach((ex) => {
      groupVolume[ex.muscleGroup] = (groupVolume[ex.muscleGroup] || 0) + Number(ex.sets || 0) * Number(ex.reps || 0) * Number(ex.weight || 0);
    })
  );
  const trainedGroups = MUSCLE_GROUPS.filter((g) => groupVolume[g] > 0);
  const untrainedGroups = MUSCLE_GROUPS.filter((g) => groupVolume[g] === 0);
  let neglectedGroup = null;
  if (totalWorkouts >= 3 && trainedGroups.length > 0) {
    if (untrainedGroups.length > 0) {
      neglectedGroup = untrainedGroups[0];
    } else {
      const maxVol = Math.max(...MUSCLE_GROUPS.map((g) => groupVolume[g]));
      const minEntry = MUSCLE_GROUPS.reduce((min, g) => (groupVolume[g] < groupVolume[min] ? g : min), MUSCLE_GROUPS[0]);
      if (maxVol > 0 && groupVolume[minEntry] > 0 && maxVol / groupVolume[minEntry] >= 3) neglectedGroup = minEntry;
    }
  }

  const sortedBW = [...bodyweightLogs].sort((a, b) => new Date(a.date) - new Date(b.date));
  const latestWeight = sortedBW.length ? Number(sortedBW[sortedBW.length - 1].weight) : null;
  const firstWeight = sortedBW.length ? Number(sortedBW[0].weight) : null;
  const weightChange = latestWeight !== null && firstWeight !== null ? Number((latestWeight - firstWeight).toFixed(1)) : null;

  const good = [];
  const bad = [];
  let goalCutNotWorking = false;
  let goalBulkNotWorking = false;

  if (weightChange !== null && sortedBW.length >= 2) {
    if (goal === "Cut") {
      if (weightChange < 0) good.push(`Body weight is down ${Math.abs(weightChange)} since your first log — tracking with your cut.`);
      else {
        bad.push(`You're aiming to cut but body weight is ${weightChange > 0 ? "up" : "flat"} ${Math.abs(weightChange)} since your first log — worth rechecking your deficit.`);
        goalCutNotWorking = true;
      }
    } else if (goal === "Bulk") {
      if (weightChange > 0) good.push(`Body weight is up ${weightChange} since your first log — the bulk is working.`);
      else {
        bad.push(`You're aiming to bulk but body weight is ${weightChange < 0 ? "down" : "flat"} ${Math.abs(weightChange)} since your first log — you may not be in a real surplus.`);
        goalBulkNotWorking = true;
      }
    } else if (goal === "Maintain") {
      if (Math.abs(weightChange) <= 1) good.push(`Body weight has stayed within ${Math.abs(weightChange)} of your starting point — right where a maintain goal wants it.`);
      else bad.push(`Body weight has moved ${Math.abs(weightChange)} since your first log — a bit more than you'd expect on a maintain goal.`);
    }
  }

  if (neglectedGroup) bad.push(`${neglectedGroup} is getting little to no volume compared to the rest of your training — worth adding an exercise for it.`);
  if (personalBests.length >= 3) good.push(`Tracking personal bests across ${personalBests.length} exercises — good foundation for spotting progressive overload.`);

  return {
    totalVolume,
    totalWorkouts,
    personalBests,
    groupVolume,
    neglectedGroup,
    latestWeight,
    weightChange,
    goalCutNotWorking,
    goalBulkNotWorking,
    statCards: [
      { label: "Workouts Logged", value: totalWorkouts },
      { label: "Total Volume (kg)", value: Math.round(totalVolume) },
      { label: "Body Weight", value: latestWeight !== null ? latestWeight : "-" },
      { label: "Goal", value: goal },
    ],
    good,
    bad,
  };
}

// Sets per muscle group across the last 10 workouts — the basis for the
// Muscle Balance chart and the "bring up weaker areas" drills.
function computeMuscleBalance(workouts) {
  const recent = workouts.slice(-10);
  const sets = {};
  MUSCLE_GROUPS.forEach((g) => (sets[g] = 0));
  recent.forEach((w) =>
    (w.exercises || []).forEach((ex) => {
      if (sets[ex.muscleGroup] !== undefined) sets[ex.muscleGroup] += Number(ex.sets) || 0;
    })
  );
  const max = Math.max(0, ...Object.values(sets));
  const rows = MUSCLE_GROUPS.map((g) => {
    const ratio = max ? sets[g] / max : 0;
    const status = ratio >= 0.5 ? "good" : ratio >= 0.2 ? "ok" : "bad";
    return { group: g, sets: sets[g], ratio, status };
  });
  return { rows, max, neglected: rows.filter((r) => r.status === "bad").map((r) => r.group), count: recent.length };
}

function GymMuscleBalanceCard({ workouts }) {
  if (!workouts.length) return null;
  const { rows, max, count } = computeMuscleBalance(workouts);
  if (!max) return null;
  const colors = { good: "#5FBF7F", ok: "#E0B34A", bad: "#D9694A" };
  const words = { good: "Well trained", ok: "Could do more", bad: "Neglected" };
  return (
    <div className="card">
      <h2>Muscle Balance</h2>
      <p className="hint">Total sets per body part over your last {count} workout{count === 1 ? "" : "s"}.</p>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: "#9FB3A4", marginBottom: 12, flexWrap: "wrap" }}>
        <span><span style={{ color: colors.good }}>●</span> Well trained</span>
        <span><span style={{ color: colors.ok }}>●</span> Could do more</span>
        <span><span style={{ color: colors.bad }}>●</span> Neglected</span>
      </div>
      {rows.map((r) => (
        <div key={r.group} style={{ marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#EFE9DD", marginBottom: 3 }}>
            <span>{r.group}</span>
            <span style={{ color: colors[r.status] }}>
              {r.sets} sets · {words[r.status]}
            </span>
          </div>
          <div style={{ height: 8, background: "#1F3527", borderRadius: 4 }}>
            <div style={{ width: `${Math.max(r.ratio * 100, r.sets ? 3 : 0)}%`, height: "100%", background: colors[r.status], borderRadius: 4 }} />
          </div>
        </div>
      ))}
    </div>
  );
}

wn)", "how": "3 × 10"}, {"name": "Lateral Lunges", "how": "3 × 8 each side"}, {"name": "90/90 Hip Mobility", "how": "2 × 60s each side"}, {"name": "Reaction Ball Drops", "how": "3 × 10"}, {"name": "Dead Bug", "how": "3 × 10 each side"}]}};
function estimateEnergy({ weight, height, age, sex }) {
  if (!weight || !height || !age) return null;
  const base = 10 * weight + 6.25 * height - 5 * age;
  const bmr = sex === "male" ? base + 5 : sex === "female" ? base - 161 : base - 78;
  return Math.round((bmr * 1.65) / 50) * 50; // active athlete training most days
}
function gymSuggestions({ weight, height, targetWeight, age, sex, goal, workouts, mainPosition }) {
  const cards = [];
  const teen = age && age < 18;
  const maintain = estimateEnergy({ weight, height, age, sex });
  if (weight && targetWeight) {
    const diff = Number((targetWeight - weight).toFixed(1));
    if (Math.abs(diff) < 0.5) {
      cards.push({ title: "You're at your target weight", lines: ["Nice — switch your goal to Maintain and keep training and eating as you are."] });
    } else if (diff < 0) {
      const lines = [`${Math.abs(diff)}kg above your target of ${targetWeight}kg.`];
      if (teen) {
        lines.push("You're still growing, so don't diet hard — fuel every session, cut back on sugary snacks and drinks, and let training do the work.");
        lines.push("Have a chat with a coach, parent or GP before trying to lose weight.");
      } else {
        const weeks = Math.ceil(Math.abs(diff) / 0.5);
        lines.push(`A safe pace is up to about 0.5kg a week, so roughly ${weeks} week${weeks === 1 ? "" : "s"}.`);
        if (maintain) lines.push(`Eat around ${maintain - 400} kcal a day (about 400 under your ~${maintain} kcal maintenance) and keep protein high to hold on to muscle.`);
      }
      if (goal !== "Cut" && !teen) lines.push("Your gym goal is set to " + goal + " — switch it to Cut to match.");
      cards.push({ title: "Getting to your target weight", lines, switchTo: !teen && goal !== "Cut" ? "Cut" : null });
    } else {
      const weeks = Math.ceil(diff / 0.25);
      const lines = [`${diff}kg below your target of ${targetWeight}kg.`, `Aim to gain about 0.25kg a week — roughly ${weeks} week${weeks === 1 ? "" : "s"} — so it's mostly muscle, not fat.`];
      if (maintain) lines.push(`Eat around ${maintain + 300} kcal a day (about 300 over your ~${maintain} kcal maintenance), with a protein-rich meal or snack every 3–4 hours.`);
      lines.push("Lift heavy on the big movements 3 times a week and add a little weight or a rep most sessions.");
      if (goal !== "Bulk") lines.push("Your gym goal is set to " + goal + " — switch it to Bulk to match.");
      cards.push({ title: "Getting to your target weight", lines, switchTo: goal !== "Bulk" ? "Bulk" : null });
    }
  }
  if (maintain) {
    const protein = weight ? `${Math.round(weight * (teen ? 1.4 : 1.6))}–${Math.round(weight * (teen ? 1.8 : 2))}g` : null;
    cards.push({
      title: "Your daily fuel",
      lines: [
        `About ${maintain} kcal a day keeps your weight steady on training days (estimated from your height, weight, age and sex).`,
        protein ? `Protein: ${protein} a day, spread over 4–5 meals and snacks.` : "",
        "Eat more on heavy training and match days, a little less on rest days.",
      ].filter(Boolean),
    });
  }
  // training frequency
  const recent = (workouts || []).filter((w) => w.date && Date.now() - new Date(w.date).getTime() < 28 * 864e5).length;
  const perWeek = recent / 4;
  if ((workouts || []).length && perWeek < 2) {
    cards.push({ title: "Train a little more often", lines: [`About ${perWeek.toFixed(1)} gym sessions a week over the last month — 2–3 a week alongside your sport is the sweet spot for getting stronger.`] });
  } else if (perWeek > 4.5) {
    cards.push({ title: "Leave room to recover", lines: [`About ${perWeek.toFixed(1)} gym sessions a week — with matches and training on top, make sure you get at least 1–2 full rest days.`] });
  }
  // strength vs bodyweight (adults)
  if (weight && !teen) {
    const best = (re) => {
      let top = null;
      (workouts || []).forEach((w) => (w.exercises || []).forEach((ex) => {
        if (!re.test(ex.exercise || "")) return;
        const e = estOneRM(ex.weight, ex.reps);
        if (!top || e > top) top = e;
      }));
      return top;
    };
    const lines = [];
    const sq = best(/squat/i), bp = best(/bench/i), dl = best(/deadlift/i);
    if (sq) lines.push(`Squat: about ${(sq / weight).toFixed(1)}× bodyweight${sq / weight < 1.5 ? " — 1.5× is a strong target for field sports." : " — strong."}`);
    if (bp) lines.push(`Bench: about ${(bp / weight).toFixed(1)}× bodyweight${bp / weight < 1.2 ? " — 1.2× is a good target." : " — strong."}`);
    if (dl) lines.push(`Deadlift: about ${(dl / weight).toFixed(1)}× bodyweight${dl / weight < 1.8 ? " — 1.8× is a strong target." : " — strong."}`);
    if (lines.length) cards.push({ title: "Strength for your size", lines });
  }
  const focus = GYM_POSITION_FOCUS[positionGroupFor(mainPosition)] || null;
  if (focus) cards.push({ title: `For your position: ${focus.title}`, lines: [focus.why], exercises: focus.list });
  else cards.push({ title: "Pick your main position", lines: ["Choose your main position in this sport and you'll get a gym focus made for it."] });
  return cards;
}

function exerciseTutorial(drillLine) {
  const name = drillLine.split(" — ")[0];
  return EXERCISE_TUTORIALS[name] || null;
}

// One exercise line that expands to show a short how-to tip when tapped.
function DrillTutorialRow({ drill }) {
  const [open, setOpen] = useState(false);
  const tutorial = exerciseTutorial(drill);
  return (
    <div style={{ marginBottom: 8 }}>
      <button
        type="button"
        onClick={() => setOpen(!open)}
        style={{ background: "transparent", border: "none", color: "#EFE9DD", fontSize: 13, textAlign: "left", padding: 0, cursor: "pointer" }}
      >
        {tutorial ? (open ? "▾ " : "▸ ") : ""}
        {drill}
      </button>
      {open && tutorial && (
        <p className="hint" style={{ margin: "4px 0 0" }}>
          {tutorial}
        </p>
      )}
    </div>
  );
}

// One drill category (e.g. "Contact & Tackling", "Kicking") that expands to
// show its specific technique drills — used to browse the same drill library
// that powers the Weekly Plan, directly from the Drills & Tips tab.
function DrillGroup({ category, drills }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ borderTop: "1px solid #2A4433", paddingTop: 10, marginTop: 10 }}>
      <button
        type="button"
        onClick={() => setOpen(!open)}
        style={{ background: "transparent", border: "none", color: "#EFE9DD", fontSize: 14, fontWeight: 700, cursor: "pointer", padding: 0 }}
      >
        {open ? "▾" : "▸"} {category}
      </button>
      {open && (
        <ul className="drills" style={{ marginTop: 8 }}>
          {drills.map((d, i) => (
            <li key={i}>{d}</li>
          ))}
        </ul>
      )}
    </div>
  );
}
