            {!needsKindChoice && analysisEntryFilter === "all" && statEntries.length > 0 && (
              <p className="hint" style={{ textAlign: "center" }}>🎥 Tap a log above to add or watch its video and get your technique analysed.</p>

            {kind === "match" && roleKey && CRICKET_ROLE_CHART_CONFIG[roleKey] && matchLogs.length > 0 && (
              <ChartCard
                title={`${CRICKET_ROLE_CHART_CONFIG[roleKey].countLabel} Per Entry`}
                note="Each bar is one entry, in the order you logged them."

                <SimpleBarChart
                  data={matchLogs.filter((e) => e.logStyle !== "rate").map((e, i) => ({ label: `#${i + 1}`, value: Number(e[CRICKET_ROLE_CHART_CONFIG[roleKey].countKey]) || 0 }))}
                />
              </ChartCard>
            )}

            {kind === "match" &&
              roleKey &&
              CRICKET_ROLE_CHART_CONFIG[roleKey] &&
              matchLogs.filter((e) => entryPct(e, CRICKET_ROLE_CHART_CONFIG[roleKey].numKey, CRICKET_ROLE_CHART_CONFIG[roleKey].denKeys) !== null).length >
                1 && (
                <ChartCard title={`${CRICKET_ROLE_CHART_CONFIG[roleKey].pctLabel} Trend`} note="Tracked across entries where it applies.">
                  <SimpleLineChart
                    data={matchLogs
                      .filter((e) => entryPct(e, CRICKET_ROLE_CHART_CONFIG[roleKey].numKey, CRICKET_ROLE_CHART_CONFIG[roleKey].denKeys) !== null)
                      .map((e, i) => ({
                        label: `#${i + 1}`,
                        value: chartScale(entryPct(e, CRICKET_ROLE_CHART_CONFIG[roleKey].numKey, CRICKET_ROLE_CHART_CONFIG[roleKey].denKeys), CRICKET_ROLE_CHART_CONFIG[roleKey]),

                    suffix={CRICKET_ROLE_CHART_CONFIG[roleKey].unit === undefined ? "%" : CRICKET_ROLE_CHART_CONFIG[roleKey].unit}

              cat={cat}
              onCat={chooseCat}

              filter={analysisEntryFilter}
              onFilter={setAnalysisEntryFilter}
              labelFor={logTabLabel}

            {!needsKindChoice && kind === "match" && roleKey && CRICKET_POSITION_DRILLS[roleKey] && (

            {!needsKindChoice && kind === "training" && cat && CRICKET_CATEGORY_FOCUS[cat] && (DRILL_LIBRARY["Cricket"] || {})[CRICKET_CATEGORY_FOCUS[cat]] && (
              <div className="card">
                <h2>Drills for Your {scopeLabel} Sessions</h2>
                <ul className="drills">
                  {DRILL_LIBRARY["Cricket"][CRICKET_CATEGORY_FOCUS[cat]].map((d, j) => (
                    <li key={j}>{d}</li>
                  ))}
                </ul>
              </div>
            )}
            {!needsKindChoice && !analysis && !statEntries.some((e) => e.areaRatings) && <EmptyState icon="🎯" text="Log a score first — drills for anything your analysis flags appear here." action="Log a score" onAction={() => setTab("track")} />}
            {!needsKindChoice && analysis && tipCards.length === 0 && (
              <EmptyState icon="✅" text="Nothing flagged in this log — everything's looking good. Keep it up." />
            )}
            {!needsKindChoice && <TipCards cards={tipCards} />}
            {!needsKindChoice && videoTipCards(focusEntry).length > 0 && (
              <div className="card">
                <h2>🎥 From Your Video</h2>
                <p className="hint">Drills for what your {focusEntry.videoAnalysis.skill.toLowerCase()} clip showed.</p>
              </div>
            )}
            {!needsKindChoice && <TipCards cards={videoTipCards(focusEntry)} />}
          </section>
        )}
      </main>
    </div>
  );

// Updates the running global stats for one event, checks for newly-earned
// trophies against the full TROPHIES list, persists any new unlocks, and
// returns the array of trophies newly unlocked by this event (usually empty).
async function trackAchievement(eventType, sport) {
  try {
    const statsRes = await safeGet("achievements:stats");
    const stats = statsRes ? JSON.parse(statsRes.value) : emptyAchievementStats();
    if (!stats.sportsLogged) stats.sportsLogged = emptyAchievementStats().sportsLogged;

    if (eventType === "match") stats.totalMatches += 1;
    if (eventType === "training") stats.totalTraining += 1;
    if (eventType === "goalCompleted") stats.totalGoalsCompleted += 1;
    if (eventType === "selfGoalAdded") stats.totalSelfGoalsAdded += 1;
    if (eventType === "coachGoalAdded") stats.totalCoachGoalsAdded += 1;
    if (eventType === "seasonCompleted") stats.totalSeasonsCompleted += 1;
    if (sport && (eventType === "match" || eventType === "training")) {
      stats.sportsLogged[sport] = (stats.sportsLogged[sport] || 0) + 1;
    }

    await window.storage.set("achievements:stats", JSON.stringify(stats));

    const unlockedRes = await safeGet("achievements:unlocked");
    const unlocked = unlockedRes ? JSON.parse(unlockedRes.value) : [];
    const unlockedIds = new Set(unlocked.map((u) => u.id));
    const newlyUnlocked = TROPHIES.filter((t) => !unlockedIds.has(t.id) && t.check(stats));

    if (newlyUnlocked.length > 0) {
      const today = new Date().toISOString().slice(0, 10);
      const nextUnlocked = [...unlocked, ...newlyUnlocked.map((t) => ({ id: t.id, date: today }))];
      await window.storage.set("achievements:unlocked", JSON.stringify(nextUnlocked));
      shareTrophiesIfOn(nextUnlocked);
    }

    return newlyUnlocked;
  } catch (e) {
    return [];
  }
}

// Flashes newly-unlocked trophies wherever it's mounted — used on every sport's
// log-entry / season screen so an unlock is visible right where it happened.
// ---- Personal bests ----
// Best single log for every stat you track (more is better), plus your best
// percentage in one log for each ring (only counted with enough attempts).
// Rated-only logs have no numbers, so they're skipped.
const PB_SKIP_KEYS = new Set(["minutesPlayed", "holesPlayed", "par", "duration", "rpe"]);
function computePersonalBests(fields, metrics, logs) {
  const usable = (logs || []).filter((e) => e.logStyle !== "rate");
  const rows = [];
  (fields || []).forEach((f) => {
    if (PB_SKIP_KEYS.has(f.key) || statDirection(f.key) !== 1) return;
    let best = null;
    usable.forEach((e) => {
      const v = Number(e[f.key]);
      if (!isFinite(v) || v <= 0) return;
      if (!best || v > best.value) best = { value: v, entry: e };
    });
    if (best) rows.push({ key: f.key, label: f.label, value: best.value, display: fmtNum(best.value), entry: best.entry });
  });
  (metrics || []).forEach((m) => {
    if (!m.num || !m.den) return;
    const keys = [m.num, ...m.den];
    if (!(fields || []).some((f) => f.key === m.num)) return;
    const minN = Math.max(m.minN || 0, 5);
    let best = null;
    usable.forEach((e) => {
      const den = m.den.reduce((t, k) => t + (Number(e[k]) || 0), 0);
      if (den < minN) return;
      const pct = ((Number(e[m.num]) || 0) / den) * 100;
      if (!best || pct > best.value) best = { value: pct, entry: e, den };
    });
    if (best && keys.every((k) => (fields || []).some((f) => f.key === k)))
      rows.push({ key: "pct:" + m.label, label: `Best ${m.label}`, value: best.value, display: `${Math.round(best.value)}%`, entry: best.entry });
  });
  return rows;
}

function PersonalBestsCard({ fields, metrics, logs, labelFor, title }) {
  const rows = computePersonalBests(fields, metrics, logs);
  if (!rows.length) return null;
  return (
    <div className="card">
      <h2>{title || "🏅 Personal Bests"}</h2>
      <p className="hint">Your best single log for everything you track.</p>
      <div className="entry-list">
        {rows.map((r) => (
          <div className="entry-row" key={r.key}>
            <span>{r.label}</span>
            <span style={{ textAlign: "right" }}>
              <strong style={{ color: "#F5D97A" }}>{r.display}</strong>
              <span className="hint" style={{ margin: 0, display: "block", fontSize: 11 }}>{labelFor ? labelFor(r.entry) : r.entry.date}</span>
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Which personal bests a new log has just beaten.
function newPersonalBests(fields, metrics, previous, entry) {
  if (!previous || !previous.length) return [];
  const before = computePersonalBests(fields, metrics, previous);
  const after = computePersonalBests(fields, metrics, [...previous, entry]);
  return after
    .filter((a) => a.entry === entry)
    .filter((a) => {
      const b = before.find((x) => x.key === a.key);
      return !b || a.value > b.value;
    })
    .map((a) => `${a.label}: ${a.display}`);
}

// The Profile page: name and nationality at the top, a mock Following list
// (Followers is display-only — there's no real backend to have people
// actually follow you yet), and a breakdown of everything logged so far.
// Lets a signed-in user update the details they gave at signup — nationality,
// age, and their main position for this sport — without having to log out
// and make a new account.
function AccountSettingsPage({ onProfileChange }) {
  const [profile, setProfile] = useState(null);
  const [nationality, setNationality] = useState("");
  const [age, setAge] = useState(0);
  const [sex, setSex] = useState("");
  const [roleDraft, setRoleDraft] = useState(null); // role being switched to, awaiting the coach password
  const [roleCode, setRoleCode] = useState("");
  const [roleError, setRoleError] = useState("");
  const [email, setEmail] = useState("");
  const [emailError, setEmailError] = useState("");
  const [mainPosition, setMainPosition] = useState("");
  const [position, setPosition] = useState(null);
  const [pickingPosition, setPickingPosition] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    async function load() {
      try {
        const p = await safeGet("profile:data");
        if (p) {
          const parsed = JSON.parse(p.value);
          setProfile(parsed);
          setNationality(parsed.nationality || "");
          setAge(parsed.age || 0);
          setSex(parsed.sex || "");
          setEmail(parsed.email || "");
          setMainPosition(parsed.mainPosition || "");
        }
      } catch (e) {
        // nothing saved yet
      }
      setLoaded(true);
    }
    load();
  }, []);

  const isCoach = profile && profile.role === "coach";

  // Coach or player — just for this sport. No password: coaches only ever see
  // players who join their team with its code and are accepted.
  async function changeRole(nextRole) {
    const next = { ...profile, role: nextRole };
    setProfile(next);
    await window.storage.set("profile:data", JSON.stringify(next)).catch(() => {});
    if (onProfileChange) onProfileChange(next);
  }

  async function save(nextMainPosition) {
    if (email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) {
      setEmailError("Enter a valid email address.");
      return;
    }
    if (Number(age) < 13) {
      setEmailError("You need to be 13 or over to use Next Level.");
      return;
    }
    setEmailError("");
    const next = { ...profile, email: email.trim(), nationality, age: Number(age), sex, mainPosition: nextMainPosition !== undefined ? nextMainPosition : mainPosition };
    setProfile(next);
    if (nextMainPosition !== undefined) setMainPosition(nextMainPosition);
    window.storage.set("profile:data", JSON.stringify(next)).catch(() => {});
    if (onProfileChange) onProfileChange(next);

    // Keep the matching account record (used for login) in sync too.
    try {
      const res = await safeGet("accounts:list");
      const accounts = res ? JSON.parse(res.value) : [];
      const updated = accounts.map((a) =>
        a.username === next.username ? { ...a, email: next.email, nationality: next.nationality, age: next.age, mainPosition: next.mainPosition } : a
      );
      window.storage.set("accounts:list", JSON.stringify(updated)).catch(() => {});
    } catch (e) {
      // best effort
    }
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  if (!loaded) {
    return (
      <div className="about-page">
        <LoadingSkeleton />
      </div>
    );
  }

  if (pickingPosition) {
    if (!position) {
      return (
        <div className="about-page">
          <h1>Change main position</h1>
          <div className="sport-grid">
            {CRICKET_POSITIONS.map((p) => (
              <button
                key={p}
                className="sport-tile"
                onClick={() => (CRICKET_SUB_POSITIONS[p] ? setPosition(p) : (save(p), setPickingPosition(false)))}
              >
                <span className="sport-name">{p}</span>
              </button>
            ))}
          </div>
          <button
            onClick={() => setPickingPosition(false)}
            style={{ marginTop: 16, background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
          >
            Cancel
          </button>
        </div>
      );
    }
    return (
      <div className="about-page">
        <h1>{position}</h1>
        <div className="sport-grid">
          {CRICKET_SUB_POSITIONS[position].map((sp) => (
            <button
              key={sp}
              className="sport-tile"
              onClick={() => {
                save(sp);
                setPickingPosition(false);

function ProfilePage() {
  const [profile, setProfile] = useState(null);

  const [followersCount, setFollowersCount] = useState(0);
  const [newFriendName, setNewFriendName] = useState("");
  const [stats, setStats] = useState(emptyAchievementStats());
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    async function load() {
      try {
        const p = await safeGet("profile:data");
        if (p) setProfile(JSON.parse(p.value));
        const f = await safeGet("profile:following");
        if (f) setFollowing(JSON.parse(f.value));
        const fc = await safeGet("profile:followersCount");
        if (fc && fc.value) setFollowersCount(Number(fc.value));
        const st = await safeGet("achievements:stats");
        if (st) setStats(JSON.parse(st.value));
      } catch (e) {
        // nothing saved yet
      }
      setLoaded(true);
    }
    load();
  }, []);

  async function persist(key, data) {
    try {
      await window.storage.set(key, typeof data === "string" ? data : JSON.stringify(data));
    } catch (e) {
      // best effort
    }
  }

  function addFriend() {
    if (!newFriendName.trim()) return;
    const next = [...following, { id: Date.now() + Math.random(), name: newFriendName.trim() }];
    setFollowing(next);
    persist("profile:following", next);
    setNewFriendName("");
  }

  function removeFriend(id) {
    const next = following.filter((f) => f.id !== id);
    setFollowing(next);
    persist("profile:following", next);
  }

  if (!loaded) {
    return (
      <div className="about-page">
        <LoadingSkeleton />
      </div>
    );
  }

  const cricketMatches = stats.totalMatches || 0;
  const cricketTraining = Math.max(0, (stats.sportsLogged.cricket || 0) - cricketMatches);
  const gymWorkouts = stats.sportsLogged.gym || 0;

    <div className="about-page">

        <div style={{ display: "flex", gap: 28, marginTop: 16 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 700, color: "#EFE9DD" }}>{followersCount}</div>
            <div className="hint" style={{ margin: 0, color: "#DCE5DE" }}>
              Followers
            </div>
          </div>
          <div>
            <div style={{ fontSize: 22, fontWeight: 700, color: "#EFE9DD" }}>{following.length}</div>
            <div className="hint" style={{ margin: 0, color: "#DCE5DE" }}>
              Following
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <h2>Following</h2>
        <p className="hint">Add people you follow — there's no real account search yet, so this is just a list you keep yourself.</p>
        <div className="new-match-row">

function WeeklyPlanner() {
  const [planMode, setPlanMode] = useState("free");
  const [selectedDays, setSelectedDays] = useState([]);
  const [selectedActivities, setSelectedActivities] = useState([]);
  const [busyDays, setBusyDays] = useState([]);
  const [busyFill, setBusyFill] = useState("simple"); // simple | detailed — how to plan the free days
  const [focusText, setFocusText] = useState("");
  const [plan, setPlan] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [planPosition, setPlanPosition] = useState("");
  const [planFor, setPlanFor] = useState("me");
  const planTeam = useMyTeam();

  function choosePlanPosition(p) {
    setPlanPosition(p);
    window.storage.set("nutrition:position", p).catch(() => {});
  }

  useEffect(() => {
    async function loadSaved() {
      try {
        const np = await safeGet("nutrition:position");
        if (np && np.value) setPlanPosition(np.value);
        else {
          const pr = await safeGet("profile:data");
          if (pr) {
            const parsed = JSON.parse(pr.value);
            if (parsed.mainPosition) setPlanPosition(parsed.mainPosition);
          }
        }
        const res = await safeGet("weeklyplan:data");
        if (res) {
          const parsed = JSON.parse(res.value);
          setPlanMode(parsed.planMode || "free");
          setSelectedDays(parsed.selectedDays || []);
          setSelectedActivities(parsed.selectedActivities || []);
          setBusyDays(parsed.busyDays || []);
          setBusyFill(parsed.busyFill || "simple");
          setFocusText(parsed.focusText || "");
          setPlan(parsed.plan || []);
          setPlanFor(parsed.planFor || "me");
        }
      } catch (e) {
        // no saved plan yet
      }
      setLoaded(true);
    }
    loadSaved();
  }, []);

  function persistState(nextPlan) {
    window.storage
      .set("weeklyplan:data", JSON.stringify({ planMode, selectedDays, selectedActivities, busyDays, busyFill, focusText, plan: nextPlan, planFor }))
      .catch(() => {});
  }

  function toggleDay(day) {
    setSelectedDays((prev) =>
      prev.includes(day) ? prev.filter((d) => d !== day) : [...prev, day].sort((a, b) => DAYS_OF_WEEK.indexOf(a) - DAYS_OF_WEEK.indexOf(b))
    );
  }

  function toggleBusyDay(day) {
    setBusyDays((prev) =>
      prev.includes(day) ? prev.filter((d) => d !== day) : [...prev, day].sort((a, b) => DAYS_OF_WEEK.indexOf(a) - DAYS_OF_WEEK.indexOf(b))
    );
  }

  function toggleActivity(activity) {
    setSelectedActivities((prev) => (prev.includes(activity) ? prev.filter((a) => a !== activity) : [...prev, activity]));
  }

  function generate() {
    let newPlan;
    if (planMode === "busy" && busyFill === "detailed") {
      const freeDays = DAYS_OF_WEEK.filter((d) => !busyDays.includes(d));
      const freePlan = buildWeeklyPlan(freeDays, selectedActivities, focusText, planPosition);
      newPlan = DAYS_OF_WEEK.map((day) =>
        busyDays.includes(day)
          ? { day, activity: ACTIVITY_OPTIONS[0], focus: "Already on your calendar", drills: [], alreadyBusy: true }
          : freePlan.find((p) => p.day === day)
      ).filter(Boolean);
    } else if (planMode === "busy") {
      newPlan = buildWeekAroundCommitments(busyDays, planPosition);
    } else {
      newPlan = buildWeeklyPlan(selectedDays, selectedActivities, focusText, planPosition);
    }
    setPlan(newPlan);
    persistState(newPlan);
    if (planFor === "team" && planTeam && planTeam.status === "member") {
      const entry = { date: new Date().toISOString().slice(0, 10), plan: newPlan, position: planPosition, focus: focusText };
      safeGet("weeklyplan:sharedHistory")
        .then((r) => (r ? JSON.parse(r.value) : []))
        .catch(() => [])
        .then((hist) => {
          const next = [...hist, entry].slice(-5);
          window.storage.set("weeklyplan:sharedHistory", JSON.stringify(next)).catch(() => {});
          shareWithCoach("plan", next);
        });
    }
  }

  function clearPlan() {
    setPlan([]);
    persistState([]);
  }

  if (!loaded) {
    return (
      <div className="about-page">
        <LoadingSkeleton />
      </div>
    );
  }

  const canGenerate =
    planMode === "busy"
      ? busyDays.length > 0 && busyDays.length < 7 && (busyFill === "simple" || selectedActivities.length > 0)
      : selectedDays.length > 0 && selectedActivities.length > 0;

  return (
    <div className="about-page">
      <h1>Weekly Plan</h1>
      <p>Two ways to build your week: tell me the days you've got free to train, or tell me the days you're already busy with {ACTIVITY_OPTIONS[0]} and I'll plan the rest of your week around that.</p>
      <PositionPicker
        value={planPosition}
        onChange={choosePlanPosition}
        hint={
          planPosition && positionPlanFocuses(planPosition).length
            ? `Your ${ACTIVITY_OPTIONS[0].toLowerCase()} sessions will focus on what a ${planPosition} needs most: ${positionPlanFocuses(planPosition).slice(0, 4).join(", ")}. Your first gym day is built for your position too. Anything you type below comes first.`
            : "Pick your position and your sessions will be built around what it needs most."
        }
      />

      <div className="card">
        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button
            type="button"
            onClick={() => setPlanMode("free")}
            style={{
              flex: 1,
              background: planMode === "free" ? "#3B82F6" : "transparent",
              color: planMode === "free" ? "#0F1F17" : "#EFE9DD",
              border: "1px solid " + (planMode === "free" ? "#3B82F6" : "#2A4433"),
              borderRadius: 10,
              padding: "10px 8px",
              fontSize: 13,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            Plan My Free Days
          </button>
          <button
            type="button"
            onClick={() => setPlanMode("busy")}
            style={{
              flex: 1,
              background: planMode === "busy" ? "#3B82F6" : "transparent",
              color: planMode === "busy" ? "#0F1F17" : "#EFE9DD",
              border: "1px solid " + (planMode === "busy" ? "#3B82F6" : "#2A4433"),
              borderRadius: 10,
              padding: "10px 8px",
              fontSize: 13,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            Build Around My Week
          </button>
        </div>

        {planMode === "free" ? (
          <>
            <h2>Days you have available</h2>
            <div>
              {DAYS_OF_WEEK.map((day) => (
                <PlanChip key={day} label={day} active={selectedDays.includes(day)} onClick={() => toggleDay(day)} />
              ))}
            </div>

            <h2 style={{ marginTop: 16 }}>What do you want a plan for?</h2>
            <div>
              {ACTIVITY_OPTIONS.map((activity) => (
                <PlanChip key={activity} label={activity} active={selectedActivities.includes(activity)} onClick={() => toggleActivity(activity)} />
              ))}
            </div>

            <label className="field" style={{ marginTop: 16 }}>
              <span>Anything specific you want to work on? (optional — this comes first)</span>
              <input
                type="text"
                placeholder={CRICKET_UI.focusExample}
                value={focusText}
                onChange={(e) => setFocusText(e.target.value)}
              />
            </label>
          </>
        ) : (
          <>
            <h2>Which days are you already busy with {ACTIVITY_OPTIONS[0]}?</h2>
            <p className="hint" style={{ marginTop: -4 }}>
              e.g. if you've got {ACTIVITY_OPTIONS[0].toLowerCase()} training Tuesday and Thursday and a match Saturday, select those — then choose how to fill the rest.
            </p>
            <div>
              {DAYS_OF_WEEK.map((day) => (
                <PlanChip key={day} label={day} active={busyDays.includes(day)} onClick={() => toggleBusyDay(day)} />
              ))}
            </div>

            {busyDays.length > 0 && busyDays.length < 7 && (
              <>
                <h2 style={{ marginTop: 16 }}>How should I fill your free days?</h2>
                <div>
                  <PlanChip label="Just build around them" active={busyFill === "simple"} onClick={() => setBusyFill("simple")} />
                  <PlanChip label="Plan them in detail" active={busyFill === "detailed"} onClick={() => setBusyFill("detailed")} />
                </div>
                <p className="hint" style={{ marginTop: 6 }}>
                  {busyFill === "simple"
                    ? "Quick option — Gym sessions and rest days slotted into the gaps, nothing else to fill in."
                    : "Pick what you want on your free days and anything you're working on, like Plan My Free Days."}
                </p>

                {busyFill === "detailed" && (
                  <>
                    <h2 style={{ marginTop: 12 }}>What do you want on your free days?</h2>
                    <div>
                      {ACTIVITY_OPTIONS.map((activity) => (
                        <PlanChip key={activity} label={activity} active={selectedActivities.includes(activity)} onClick={() => toggleActivity(activity)} />
                      ))}
                    </div>
                    <label className="field" style={{ marginTop: 16 }}>
                      <span>Anything specific you want to work on? (optional — this comes first)</span>
                      <input
                        type="text"
                        placeholder={CRICKET_UI.focusExample}
                        value={focusText}
                        onChange={(e) => setFocusText(e.target.value)}
                      />
                    </label>
                  </>
                )}
              </>
            )}
          </>
        )}

        <div style={{ marginTop: 16 }}>
          <LogForPicker title="Who is this plan for?" value={planFor} onChange={setPlanFor} team={planTeam} />
          <button className="save-btn" onClick={generate} disabled={!canGenerate} style={!canGenerate ? { opacity: 0.5, cursor: "not-allowed" } : {}}>
            Generate My Week
          </button>
          {plan.length > 0 && (
            <button
              onClick={clearPlan}
              style={{ marginLeft: 8, background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
            >
              Clear Plan
            </button>
          )}
        </div>
        {!canGenerate && planMode === "free" && (
          <p className="hint" style={{ marginTop: 8 }}>Pick at least one day and one activity to generate a plan.</p>
        )}
        {!canGenerate && planMode === "busy" && (
          <p className="hint" style={{ marginTop: 8 }}>
            {busyDays.length === 0
              ? `Pick at least one day you're already busy with ${ACTIVITY_OPTIONS[0]}.`
              : busyDays.length === 7
              ? "You're busy every day — there's no week left to plan around."
              : "Pick at least one activity for your free days."}
          </p>
        )}
      </div>

      {plan.length > 0 && (
        <div className="card">
          <h2>Your Week</h2>
          <div className="entry-list">
            {plan.map((p, i) => (
              <div className="entry-row" key={i} style={{ flexDirection: "column", alignItems: "flex-start" }}>
                <span>
                  <strong>{p.day}:</strong> {p.activity}
                  {p.focus ? ` — ${p.focus}` : ""}
                  {p.alreadyBusy && (
                    <span style={{ marginLeft: 8, fontSize: 10, color: "#9FB3A4", border: "1px solid #2A4433", borderRadius: 4, padding: "2px 6px" }}>
                      ALREADY BOOKED
                    </span>
                  )}
                </span>
                {p.drills && p.drills.length > 0 && (
                  <ul className="drills" style={{ marginTop: 6 }}>
                    {p.drills.map((d, j) => (
                      <li key={j}>{d}</li>
                    ))}
                  </ul>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function emptyMealEntry() {
  return {
    id: Date.now() + Math.random(),
    date: new Date().toISOString().slice(0, 10),
    mealType: "Breakfast",
    context: null,
    name: "",
    calories: 0,
    protein: 0,
    carbs: 0,
    fat: 0,
  };
}

function suggestedNutritionTarget(goal, weight) {
  const caloriesPerKg = goal === "Cut" ? 28 : goal === "Bulk" ? 38 : 33;
  const proteinPerKg = goal === "Cut" ? 2.2 : goal === "Bulk" ? 2.0 : 1.8;
  const calories = weight ? Math.round(weight * caloriesPerKg) : goal === "Cut" ? 1800 : goal === "Bulk" ? 2800 : 2200;
  const protein = weight ? Math.round(weight * proteinPerKg) : goal === "Cut" ? 150 : goal === "Bulk" ? 180 : 140;
  const fat = Math.round((calories * 0.27) / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat };
}

function analyseNutrition(meals, target, goal) {
  if (meals.length === 0) return null;

  const byDate = {};
  meals.forEach((m) => {
    byDate[m.date] = byDate[m.date] || { calories: 0, protein: 0, carbs: 0, fat: 0 };
    byDate[m.date].calories += Number(m.calories || 0);
    byDate[m.date].protein += Number(m.protein || 0);
    byDate[m.date].carbs += Number(m.carbs || 0);
    byDate[m.date].fat += Number(m.fat || 0);
  });
  const days = Object.keys(byDate);
  const avg = (key) => (days.length ? days.reduce((s, d) => s + byDate[d][key], 0) / days.length : 0);
  const avgCalories = avg("calories");
  const avgProtein = avg("protein");
  const avgCarbs = avg("carbs");
  const avgFat = avg("fat");

  const caloriePct = target.calories ? Math.round((avgCalories / target.calories) * 100) : null;
  const proteinPct = target.protein ? Math.round((avgProtein / target.protein) * 100) : null;
  const carbsPct = target.carbs ? Math.round((avgCarbs / target.carbs) * 100) : null;
  const fatPct = target.fat ? Math.round((avgFat / target.fat) * 100) : null;

  const good = [];
  const bad = [];

  if (proteinPct !== null) {
    if (proteinPct >= 90) good.push(`Averaging ${proteinPct}% of your protein target — good for recovery and keeping muscle.`);
    else if (proteinPct < 70) bad.push(`Averaging just ${proteinPct}% of your protein target — worth adding a protein source to a meal or two.`);
  }

  if (caloriePct !== null) {
    if (goal === "Cut") {
      if (caloriePct <= 105) good.push(`Averaging ${caloriePct}% of your calorie target — tracking with your cut.`);
      else bad.push(`Averaging ${caloriePct}% of your calorie target — a bit over where your cut needs you.`);
    } else if (goal === "Bulk") {
      if (caloriePct >= 95) good.push(`Averaging ${caloriePct}% of your calorie target — on track for the surplus your bulk needs.`);
      else bad.push(`Averaging only ${caloriePct}% of your calorie target — you may not be eating enough to actually bulk.`);
    } else {
      if (caloriePct >= 90 && caloriePct <= 110) good.push(`Averaging ${caloriePct}% of your calorie target — steady around maintenance.`);
      else bad.push(`Averaging ${caloriePct}% of your calorie target — drifting a fair bit from your maintenance goal.`);
    }
  }

  if (carbsPct !== null && carbsPct < 60) bad.push(`Carbs are averaging only ${carbsPct}% of target — you may be running low on energy for training.`);
  if (fatPct !== null && fatPct < 60) bad.push(`Fat intake is averaging only ${fatPct}% of target — some healthy fats help with hormone health and recovery.`);

  const uniqueMeals = new Set(meals.map((m) => m.name.toLowerCase().trim())).size;
  if (meals.length >= 8 && uniqueMeals <= 3) bad.push(`You've logged mostly the same ${uniqueMeals} meal${uniqueMeals !== 1 ? "s" : ""} — a bit more variety helps cover different vitamins and minerals.`);

  return {
    avgCalories: Math.round(avgCalories),
    avgProtein: Math.round(avgProtein),
    avgCarbs: Math.round(avgCarbs),
    avgFat: Math.round(avgFat),
    caloriePct,
    proteinPct,
    carbsPct,
    fatPct,
    daysLogged: days.length,
    statCards: [
      { label: "Avg Calories", value: `${Math.round(avgCalories)}${caloriePct !== null ? ` (${caloriePct}%)` : ""}` },
      { label: "Avg Protein", value: `${Math.round(avgProtein)}g${proteinPct !== null ? ` (${proteinPct}%)` : ""}` },
      { label: "Avg Carbs", value: `${Math.round(avgCarbs)}g${carbsPct !== null ? ` (${carbsPct}%)` : ""}` },
      { label: "Avg Fat", value: `${Math.round(avgFat)}g${fatPct !== null ? ` (${fatPct}%)` : ""}` },
    ],
    good,
    bad,
  };
}

// Daily targets from body details, position and goal. Returns null if we don't
// know enough (needs weight, height and age).
function positionNutritionTarget({ weight, height, age, sex, goal, position }) {
  const base = estimateEnergy({ weight, height, age, sex });
  if (!base) return null;
  const [factor, proteinPerKg, carbsPerKg] = POSITION_FUEL_FACTORS[positionGroupFor(position)] || [1, 1.8, 5];
  const teen = age < 18;
  let calories = base * factor;
  if (goal === "Cut") calories -= teen ? 0 : 400;
  if (goal === "Bulk") calories += 300;
  calories = Math.round(calories / 50) * 50;
  const protein = Math.round(weight * proteinPerKg);
  const fat = Math.round((calories * 0.25) / 9);
  const carbs = Math.max(Math.round(weight * (carbsPerKg - 1)), Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat };
}

const FOODCAM = { clf: null };
const FOOD_MODEL = "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite";
async function loadFoodClassifier() {
  if (FOODCAM.clf) return FOODCAM.clf;
  const lib = await new Function("u", "return import(u)")(`${POSE_LIB}/vision_bundle.mjs`);
  const files = await lib.FilesetResolver.forVisionTasks(`${POSE_LIB}/wasm`);
  FOODCAM.clf = await lib.ImageClassifier.createFromOptions(files, { baseOptions: { modelAssetPath: FOOD_MODEL }, maxResults: 10, scoreThreshold: 0.02 });
  return FOODCAM.clf;
}
async function guessFoodsFromImage(img) {
  const clf = await loadFoodClassifier();
  const res = clf.classify(img);
  const cats = (res && res.classifications && res.classifications[0] && res.classifications[0].categories) || [];
  const keys = [];
  cats.forEach((c) => {
    const label = String(c.categoryName || c.displayName || "").toLowerCase();
    const hit = Object.keys(FOOD_LABEL_MAP).find((l) => label === l || label.includes(l));
    const key = hit ? FOOD_LABEL_MAP[hit] : null;
    if (key && !keys.includes(key)) keys.push(key);
  });
  return keys.slice(0, 4);
}
function foodsFromText(text) {
  const t = " " + String(text || "").toLowerCase().replace(/[^a-z& ]+/g, " ") + " ";
  const found = [];
  // longest phrases first so "fish and chips" beats "chips", "chocolate milk" beats "milk"
  const phrases = [];
  FOOD_DB.forEach((f) => f.words.forEach((w) => phrases.push([w, f.key])));
  phrases.sort((a, b) => b[0].length - a[0].length);
  let rest = t;
  phrases.forEach(([w, key]) => {
    const re = new RegExp(" " + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "s? ");
    if (re.test(rest)) {
      if (!found.includes(key)) found.push(key);
      rest = rest.replace(re, " ");
    }
  });
  return found;
}
function plateTotals(items) {
  const t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
  (items || []).forEach((it) => {
    const f = FOOD_DB.find((x) => x.key === it.key);
    if (!f) return;
    const mult = (FOOD_SIZES.find((s) => s[0] === it.size) || FOOD_SIZES[1])[2] * (it.qty || 1);
    t.calories += f.m[0] * mult;
    t.protein += f.m[1] * mult;
    t.carbs += f.m[2] * mult;
    t.fat += f.m[3] * mult;
  });
  Object.keys(t).forEach((k) => (t[k] = Math.round(t[k])));
  return t;
}
function plateCheck(items, context) {
  const types = (items || []).map((it) => (FOOD_DB.find((x) => x.key === it.key) || {}).type);
  const has = (...ts) => types.some((t) => ts.includes(t));
  const tot = plateTotals(items);
  const lines = [];
  const proteinOk = tot.protein >= 20 || has("protein") || (has("meal") && tot.protein >= 15);
  lines.push(proteinOk ? { ok: true, text: `Protein: about ${tot.protein}g — good for recovery.` } : { ok: false, text: "Not much protein — add chicken, eggs, fish, Greek yoghurt or beans." });
  const carbOk = tot.carbs >= 40 || has("carb", "meal");
  lines.push(carbOk ? { ok: true, text: `Carbs: about ${tot.carbs}g — fuel for training and games.` } : { ok: false, text: "Light on carbs — fine on a rest day, but add rice, pasta, potatoes or bread before training or a match." });
  lines.push(has("veg", "fruit") ? { ok: true, text: "Fruit or veg on the plate — great for vitamins and recovery." } : { ok: false, text: "No fruit or veg — add some colour (a side salad, veg or a piece of fruit)." });
  if (has("treat", "sugary")) lines.push({ ok: null, text: "Treats and sugary drinks are fine now and then — just not with most meals." });
  if (/match/.test(context || "") && tot.fat > 30) lines.push({ ok: false, text: `About ${tot.fat}g of fat — slow to digest, so keep meals lighter in the hours before you play.` });
  const score = lines.filter((l) => l.ok === true).length;
  return { lines, score, of: 3 };
}
function shrinkPhoto(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 720 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => {
        URL.revokeObjectURL(url);
        resolve(b || file);
      }, "image/jpeg", 0.82);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      resolve(file);
    };
    img.src = url;
  });
}

  if (age && age < 18) return [8, 10];

function buildRecoveryPlan(inp) {
  const steps = [];
  const notes = [];
  const area = (k) => RECOVERY_AREAS.find((a) => a.key === k);
  if (inp.headKnock) {
    return {
      concussion: true,
      steps: [],
      notes: [
        { title: "🚨 Possible concussion — stop", lines: [
          "Don't play or train for the rest of today, even if you feel fine.",
          "See a doctor or NHS 111. Go to A&E straight away if you get: a worsening headache, being sick more than once, confusion, unusual drowsiness, a seizure, weakness or numbness, or trouble with sight or speech.",
          "Rest from hard physical and mental effort for the first 24–48 hours (keep screens short), then follow your sport's graduated return-to-play steps.",
          "Never return to play on the same day, and don't come back until you're symptom-free and cleared.",
        ] },
      ],
    };
  }
  const minutes = inp.minutes || 20;
  let budget = minutes * 60;
  const push = (title, secs, how, tag) => {
    if (secs > budget) return false;
    budget -= secs;
    steps.push({ title, secs, how, tag });
    return true;
  };
  const kit = inp.kit || [];
  const after = ["match", "training", "tournament"].includes(inp.when);
  budget -= 180; // always keep room to finish with breathing
  // 1. cool down straight after
  if (after) push("Easy cool-down", 300, "Walk or jog very easily for 3–4 minutes, then stand tall and take 5 slow breaths.", "Cool-down");
  // 2. day after / rest: flush
  const wantsFlush = inp.when === "dayafter" || inp.when === "rest";
  const flush = () => {
    if (kit.includes("pool")) return push("Pool recovery", 900, "Walk lengths in the shallow end, then 5–10 minutes of easy swimming. Keep it gentle — you should be able to talk.", "Active recovery");
    if (kit.includes("bike")) return push("Easy bike spin", 900, "15 minutes very easy — light pedalling, you can chat the whole time.", "Active recovery");
    return push("Easy walk", 900, "15–20 minutes at a relaxed pace to get blood moving through sore muscles.", "Active recovery");
  };
  if (wantsFlush && inp.when !== "before" && minutes >= 30) flush();
  // 3. sore areas (stretches then rolling)
  const sore = (inp.areas || []).slice(0, 5);
  const hot = (RECOVERY_HOTSPOTS[inp.group] || []).filter((k) => !sore.includes(k));
  const rollKit = kit.includes("roller") || kit.includes("ball");
  sore.forEach((k) => {
    const a = area(k);
    if (!a) return;
    a.stretch.forEach(([t, secs, how]) => push(t, secs, how, a.label));
  });
  if (rollKit && !inp.knock)
    sore.forEach((k) => {
      const a = area(k);
      if (a && a.roll) push(a.roll[0], a.roll[1], a.roll[2], a.label);
    });
  // 4. cold / heat
  if (!inp.knock && kit.includes("cold") && ["match", "tournament"].includes(inp.when))
    push("Cold-water soak", 600, "10 minutes in cold water (about 10–15°C) up to your waist or chest. Get out if you feel numb or dizzy. Skip it straight after gym sessions where you're trying to build muscle.", "Cold");
  if (!inp.knock && kit.includes("heat") && ["rest", "dayafter"].includes(inp.when))
    push("Warm soak or sauna", 600, "10–15 minutes of heat to ease stiffness. Drink water, and skip it if you have a fresh knock, swelling or feel unwell.", "Heat");
  // 5. position hot spots with whatever's left
  hot.forEach((k) => {
    const a = area(k);
    if (a) push(a.stretch[0][0], a.stretch[0][1], a.stretch[0][2], `${a.label} (for your position)`);
  });
  // 6. band shoulder care if they have a band and time
  if (kit.includes("band") && !sore.includes("shoulders")) push("Band pull-aparts (light)", 45, "Light band at chest height, pull apart squeezing your shoulder blades. 2 × 15.", "Shoulder care");
  // 7. easy flush if there's still lots of time (not the day before a game)
  if (!steps.some((s) => s.tag === "Active recovery") && inp.when !== "before" && budget >= 900) flush();
  // 8. breathing to finish
  budget += 180;
  push("Box breathing", 180, "Breathe in for 4, hold 4, out for 4, hold 4. Repeat for 3 minutes to switch your body into recovery mode.", "Calm");

  // Non-timed guidance
  const [lo, hi] = sleepTargetFor(inp.age);
  const sleepLine = inp.sleep && inp.sleep < lo ? `You slept ${inp.sleep}h last night — aim for ${lo}–${hi}h tonight. An earlier night is the best recovery you can get.` : `Aim for ${lo}–${hi} hours tonight.`;
  notes.push({ title: "😴 Sleep", lines: [sleepLine, "No screens for 30–60 minutes before bed, keep the room cool and dark, and go to bed at the same time each night."] });
  const fuel = {
    match: ["Within an hour: protein + carbs, e.g. chocolate milk and a chicken wrap, or a big bowl of pasta with meat sauce.", "Drink about 1.5× the fluid you think you lost — weigh yourself before and after if you can."],
    training: ["Within an hour: a protein-and-carb snack (Greek yoghurt with fruit, chocolate milk, or a tuna sandwich).", "Keep sipping water through the evening."],
    tournament: ["Between games: small, easy carbs (banana, jam sandwich, cereal bar) and fluids — little and often.", "Save the big meal for after your last game."],
    dayafter: ["Keep protein at every meal today and plenty of fruit and veg.", "Stay well hydrated — pale yellow pee is the target."],
    rest: ["Normal healthy meals with protein at each one.", "Slightly less food than a heavy training day is fine."],
    before: ["Carb-rich meals today (pasta, rice, potatoes) to top up your energy.", "Drink well through the day and avoid anything new or very greasy."],
  };
  notes.push({ title: "🍽️ Refuel", lines: fuel[inp.when] || fuel.training });
  const s = inp.soreness || 0;
  const next = [];
  if (inp.when === "before") next.push("Keep today light — short, sharp and fresh. No new hard sessions.");
  else if (s >= 8) next.push("Very sore: make tomorrow a light day — mobility, an easy walk or swim, no hard running or heavy lifting.");
  else if (s >= 5) next.push("Moderately sore: keep the next 24 hours easy and save hard work for when the soreness is a 4 or below.");
  else next.push("Feeling good: you're fine to train as normal tomorrow.");
  if ((inp.energy || 10) <= 4) next.push("Low energy — check sleep and food first. If it lasts a week, ease off and talk to your coach.");
  notes.push({ title: "📅 Next 48 hours", lines: next });
  if (inp.knock)
    notes.unshift({ title: "🩹 You've got a knock", lines: [
      "Don't stretch, roll or heat the sore spot. Protect it, ice it for 10–15 minutes every 2–3 hours, and keep it raised.",
      "See a physio or GP if it's not clearly better in 48 hours, or straight away if there's severe pain, swelling, you can't put weight on it, or it looks out of shape.",
    ] });
  return { steps, notes, used: minutes * 60 - budget };
}

function readinessScore({ sleep, soreness, energy, mood, age }) {
  const [lo] = sleepTargetFor(age);
  const sl = Math.max(0, Math.min(40, ((sleep || 0) / (lo + 1)) * 40));
  const so = ((10 - (soreness || 1)) / 9) * 30;
  const en = (((energy || 1) - 1) / 9) * 20;
  const mo = (((mood || 1) - 1) / 9) * 10;
  return Math.round(sl + so + en + mo);
}
function readinessVerdict(score) {
  if (score >= 75) return { color: "#5FB37A", label: "Good to go", text: "Train as planned — you've recovered well." };
  if (score >= 50) return { color: "#E0B34A", label: "Train smart", text: "Train, but keep the intensity down and do a 10–15 minute recovery routine after." };
  return { color: "#D9694A", label: "Recovery day", text: "Make today a recovery day — mobility, an easy walk or swim, early night." };
}

function RoutinePlayer({ routine, onClose, onDone }) {
  useFocusMode();
  const [i, setI] = useState(0);
  const [left, setLeft] = useState(routine.steps[0][1]);
  const [running, setRunning] = useState(true);
  useEffect(() => {
    if (!running) return undefined;
    const t = setInterval(() => setLeft((l) => l - 1), 1000);
    return () => clearInterval(t);
  }, [running, i]);
  useEffect(() => {
    if (left > 0) return;
    if (i < routine.steps.length - 1) {
      setI(i + 1);
      setLeft(routine.steps[i + 1][1]);
    } else {
      setRunning(false);
    }
  }, [left]);
  useEffect(() => {
    let lock = null;
    try {
      if (navigator.wakeLock) navigator.wakeLock.request("screen").then((l) => (lock = l)).catch(() => {});
    } catch (e) {
      // not supported
    }
    return () => {
      try {
        if (lock) lock.release();
      } catch (e) {
        // ignore
      }
    };
  }, []);
  const finished = !running && left <= 0 && i === routine.steps.length - 1;
  const go = (n) => {
    const k = Math.max(0, Math.min(routine.steps.length - 1, n));
    setI(k);
    setLeft(routine.steps[k][1]);
    setRunning(true);
  };
  const [name, secs, how] = routine.steps[i];
  return (
    <div className="card" style={{ border: "2px solid #3B82F6" }}>
      <p className="hint" style={{ margin: 0 }}>
        {routine.title} · step {i + 1} of {routine.steps.length}
      </p>
      {finished ? (
        <>
          <h2>✅ Done — nice work</h2>
          <button className="save-btn" style={{ width: "100%" }} onClick={onDone}>
            Mark as done
          </button>
        </>
      ) : (
        <>
          <h2 style={{ marginBottom: 4 }}>{name}</h2>
          <p className="hint">{how}</p>
          <div style={{ fontSize: 48, fontWeight: 800, textAlign: "center", color: "#F5EFE2", margin: "8px 0" }}>{fmtClock(Math.max(0, left))}</div>
          <div style={{ height: 6, background: "#0F1F17", borderRadius: 3, overflow: "hidden", marginBottom: 12 }}>
            <div style={{ width: `${(1 - Math.max(0, left) / secs) * 100}%`, height: "100%", background: "#3B82F6" }} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={() => go(i - 1)} disabled={i === 0} style={{ flex: 1, padding: 12, borderRadius: 10, background: "#16241B", border: "1px solid #2A4433", color: "#EFE9DD", cursor: "pointer" }}>
              ◀ Back
            </button>
            <button type="button" onClick={() => setRunning(!running)} style={{ flex: 1, padding: 12, borderRadius: 10, background: "#16241B", border: "1px solid #2A4433", color: "#EFE9DD", cursor: "pointer" }}>
              {running ? "⏸ Pause" : "▶ Go"}
            </button>
            <button type="button" onClick={() => (i === routine.steps.length - 1 ? (setLeft(0), setRunning(false)) : go(i + 1))} style={{ flex: 1, padding: 12, borderRadius: 10, background: "#16241B", border: "1px solid #2A4433", color: "#EFE9DD", cursor: "pointer" }}>
              Next ▶
            </button>
          </div>
        </>
      )}
      <button type="button" onClick={onClose} style={{ marginTop: 10, width: "100%", background: "transparent", border: "1px solid #2A4433", color: "#9FB3A4", borderRadius: 10, padding: 10, cursor: "pointer" }}>
        Close
      </button>
    </div>
  );
}

          </div>
          {todayCheck && (() => {
            const v = readinessVerdict(todayCheck.score);
            return (
              <div className="card" style={{ border: `2px solid ${v.color}` }}>
                <h2 style={{ color: v.color }}>
                  {todayCheck.score}/100 — {v.label}
                </h2>
                <p className="hint">{v.text}</p>
                {todayCheck.score < 75 && (
                  <button className="save-btn" style={{ width: "100%" }} onClick={() => setTab("routines")}>
                    Pick a recovery routine
                  </button>
                )}
              </div>
            );
          })()}
          {checkins.length > 1 && (
            <ChartCard title="Readiness — last 2 weeks" note="Higher is better. Look for dips after hard weeks or poor sleep.">
              <SimpleLineChart data={checkins.slice(-14).map((c) => ({ label: c.date.slice(5).split("-").reverse().join("/"), value: c.score }))} />
            </ChartCard>
          )}
        </>
      )}

      {tab === "routines" && !playing && (
        <>
          {RECOVERY_ROUTINES.map((r) => (
            <div className="card" key={r.key}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <div>
                  <h2 style={{ margin: 0 }}>{r.title}</h2>
                  <p className="hint" style={{ margin: "2px 0 0" }}>
                    {r.mins} min · {r.for}
                  </p>
                </div>
                <button className="save-btn" style={{ whiteSpace: "nowrap" }} onClick={() => setPlaying(r)}>
                  ▶ Start
                </button>
              </div>
              <button type="button" onClick={() => setOpenRoutine(openRoutine === r.key ? null : r.key)} style={{ marginTop: 8, background: "none", border: "none", color: "#8CB4FF", padding: 0, cursor: "pointer", fontFamily: "inherit", fontSize: 13 }}>
                {openRoutine === r.key ? "Hide steps" : `See the ${r.steps.length} steps`}
              </button>
              {openRoutine === r.key && (
                <ul className="drills">
                  {r.steps.map(([n, secs, how], j) => (
                    <li key={j}>
                      <strong>{n}</strong> ({fmtClock(secs)}) — {how}
                    </li>
                  ))}
                </ul>
              )}
            </div>
          ))}
          {done.length > 0 && (
            <div className="card">
              <h3>Recently done</h3>
              <div className="entry-list">
                {done
                  .slice(-8)
                  .reverse()
                  .map((d) => (
                    <div className="entry-row" key={d.id}>
                      <span>{d.title}</span>
                      <span className="hint" style={{ margin: 0 }}>
                        {d.date}
                      </span>
                    </div>
                  ))}
              </div>
            </div>
          )}
        </>
      )}

      {tab === "tips" && !playing && (
        <>
          {[
            ["😴 Sleep is number one", [`Aim for ${sleepTargetFor(age)[0]}–${sleepTargetFor(age)[1]} hours a night — it's when your body repairs muscle and locks in skills.`, "Same bedtime every night, cool dark room, no screens for the last 30–60 minutes.", "A 20-minute nap before 3pm can help after a late game — longer naps can wreck your night's sleep."]],
            ["💧 Rehydrate", ["Pale yellow pee means you're hydrated.", "After a hot or long session, add a pinch of salt or an electrolyte tab to your water.", "Weigh yourself before and after a session: drink about 1.5 litres for every 1kg lost."]],
            ["🧊 Cold or 🔥 heat?", ["Cold water (10–15°C for 10 minutes) helps you feel fresher after matches and tournaments.", "Skip cold straight after gym sessions if you're trying to build muscle — it can blunt the gains.", "Heat (warm bath, sauna) is good for stiffness on rest days, never on a fresh knock or swelling."]],
            ["🧘 Active recovery beats the sofa", ["An easy walk, swim or bike the day after a game clears soreness faster than doing nothing.", "Keep it easy — you should be able to hold a conversation the whole time."]],
            ["🩹 Knocks and pain", ["Normal soreness (DOMS) is a dull ache that peaks 24–48 hours later and eases with movement.", "Sharp pain, swelling, bruising you can't explain, or pain that gets worse with movement is an injury — protect it, ice it and see a physio or GP.", "Get urgent help for severe pain, deformity, numbness, or if you can't put weight on it."]],
            ["🚨 Head knocks", ["If in doubt, sit it out — never play on after a suspected concussion.", "See a doctor, rest for 24–48 hours, then follow your sport's graduated return-to-play.", "Go to A&E for a worsening headache, repeated vomiting, confusion, drowsiness, seizures or weakness."]],
            ["🍽️ Eat to recover", ["Protein and carbs within an hour of finishing: chocolate milk, a chicken wrap, Greek yoghurt with fruit.", "Protein at every meal through the day, and a slow protein (milk, yoghurt) before bed on heavy days.", "Fruit and veg give you the vitamins that keep you fighting off colds in a busy season."]],
            ["🧠 Switch off", ["Box breathing (4-4-4-4) for 3 minutes calms you down after a big game.", "Have one evening a week completely away from your sport.", "Feeling flat for more than a week? Tell your coach — it can be a sign you need more rest."]],
          ].map(([title, lines]) => (
            <div className="card" key={title}>
              <h2>{title}</h2>
              <ul className="drills">
                {lines.map((l, j) => (
                  <li key={j}>{l}</li>
                ))}
              </ul>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function NutritionApp() {
  const [meals, setMeals] = useState([]);
  const [target, setTarget] = useState({ calories: 2200, protein: 140, carbs: 220, fat: 70 });
  const [goal, setGoal] = useState("Maintain");
  const [gymGoalChosen, setGymGoalChosen] = useState(false);
  const [context, setContext] = useState(null);
  const [nutritionPosition, setNutritionPosition] = useState("");
  const [draft, setDraft] = useState(emptyMealEntry());
  const [tab, setTab] = useState("track");
  const [loaded, setLoaded] = useState(false);
  const [wants, setWants] = useState([]);
  const [mealPhoto, setMealPhoto] = useState(null);
  const [mealFor, setMealFor] = useState("me");
  const mealTeam = useMyTeam();
  const [wantsText, setWantsText] = useState("");
  const [body, setBody] = useState({});

  useEffect(() => {
    async function loadAll() {
      try {
        const wn = await safeGet("nutrition:wants");
        if (wn) {
          const parsed = JSON.parse(wn.value);
          setWants(parsed.wants || []);
          setWantsText(parsed.text || "");
        }
        {
          const b = {};
          const hc = await safeGet("gym:height");
          if (hc) b.height = Number(hc.value) || null;
          const bwl = await safeGet("gym:bodyweight");
          if (bwl) {
            const logs = JSON.parse(bwl.value);
            if (logs.length) b.weight = Number([...logs].sort((x, y) => new Date(x.date) - new Date(y.date))[logs.length - 1].weight) || null;
          }
          const pr = await safeGet("profile:data");
          if (pr) {
            const parsed = JSON.parse(pr.value);
            b.age = Number(parsed.age) || null;
            b.sex = parsed.sex || null;
          }
          setBody(b);
        }
        const m = await safeGet("nutrition:meals");
        if (m) setMeals(JSON.parse(m.value));

        const c = await safeGet("nutrition:context");
        if (c && c.value) setContext(c.value);

        // Position: whatever they last picked here, otherwise their main position.
        const np = await safeGet("nutrition:position");
        if (np && np.value) {
          setNutritionPosition(np.value);
        } else {
          const p = await safeGet("profile:data");
          if (p) {
            const parsed = JSON.parse(p.value);
            if (parsed.mainPosition) setNutritionPosition(parsed.mainPosition);
          }
        }

        const g = await safeGet("gym:goal");
        const goalValue = g ? g.value : "Maintain";
        setGoal(goalValue);
        setGymGoalChosen(Boolean(g));

        const t = await safeGet("nutrition:target");
        if (t) {
          setTarget(JSON.parse(t.value));
        } else {
          let weight = null;
          try {
            const bw = await safeGet("gym:bodyweight");
            if (bw) {
              const logs = JSON.parse(bw.value);
              if (logs.length > 0) {
                const sorted = [...logs].sort((a, b) => new Date(a.date) - new Date(b.date));
                weight = Number(sorted[sorted.length - 1].weight);
              }
            }
          } catch (e) {
            // no bodyweight logged yet
          }
          setTarget(suggestedNutritionTarget(goalValue, weight));
        }
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    loadAll();
  }, []);

  function persist(key, data) {
    window.storage.set(key, typeof data === "string" ? data : JSON.stringify(data)).catch(() => {});
  }

  function chooseContext(key) {
    setContext(key);
    persist("nutrition:context", key);
  }

  function saveWants(nextWants, nextText) {
    setWants(nextWants);
    setWantsText(nextText);
    persist("nutrition:wants", { wants: nextWants, text: nextText });
  }
  function toggleWant(key) {
    saveWants(wants.includes(key) ? wants.filter((w) => w !== key) : [...wants, key], wantsText);
  }
  function choosePosition(p) {
    setNutritionPosition(p);
    persist("nutrition:position", p);
  }

  function chooseGymGoal(g) {
    setGoal(g);
    setGymGoalChosen(true);
    persist("gym:goal", g);
    setTarget(suggestedNutritionTarget(g, null));
  }

  function updateTarget(field, value) {
    const next = { ...target, [field]: value };
    setTarget(next);
    persist("nutrition:target", next);
  }

  function saveMeal() {
    const plate = draft.plate || [];
    const name = draft.name.trim() || plate.map((it) => (FOOD_DB.find((f) => f.key === it.key) || {}).name).filter(Boolean).join(", ");
    if (!name) return;
    const id = Date.now() + Math.random();
    const check = plate.length ? plateCheck(plate, context) : null;
    const next = [...meals, { ...draft, name, id, date: new Date().toISOString().slice(0, 10), context, plate, plateScore: check ? check.score : null, photo: !!mealPhoto, forTeam: mealFor === "team" }];
    if (mealPhoto) putClip("meal:" + id, mealPhoto).catch(() => {});
    setMeals(next);
    persist("nutrition:meals", next);
    if (mealFor === "team") shareWithCoach("nutrition", next.filter((m) => m.forTeam).slice(-80).map(({ photo, ...m }) => m));
    setDraft(emptyMealEntry());
    setMealPhoto(null);
    nlToast("Saved ✓");
    setTab("analysis");
    window.scrollTo(0, 0);
  }

  function removeMeal(id) {
    deleteClip("meal:" + id).catch(() => {});
    const gone = meals.find((m) => m.id === id);
    const next = meals.filter((m) => m.id !== id);
    setMeals(next);
    persist("nutrition:meals", next);
    if (gone && gone.forTeam) shareWithCoach("nutrition", next.filter((m) => m.forTeam).slice(-80).map(({ photo, ...m }) => m));
  }

  const today = new Date().toISOString().slice(0, 10);
  const todaysMeals = meals.filter((m) => m.date === today);
  const todaysTotals = todaysMeals.reduce(
    (t, m) => ({
      calories: t.calories + Number(m.calories || 0),
      protein: t.protein + Number(m.protein || 0),
      carbs: t.carbs + Number(m.carbs || 0),
      fat: t.fat + Number(m.fat || 0),
    }),
    { calories: 0, protein: 0, carbs: 0, fat: 0 }
  );

  const analysis = useMemo(() => analyseNutrition(meals, target, goal), [meals, target, goal]);
  const activeTips = analysis ? NUTRITION_TIPS.filter((t) => t.match(analysis)) : [];
  const suggestions =
    context === "cricket-match" || context === "cricket-training"
      ? CRICKET_MEAL_SUGGESTIONS[context]
      : MEAL_SUGGESTIONS_BY_GOAL[goal] || MEAL_SUGGESTIONS_BY_GOAL.Maintain;
  const contextLabel = NUTRITION_CONTEXTS.find((c) => c.key === context)?.label || "";

  if (!loaded) {
    return (
      <div className="about-page">
        <LoadingSkeleton />
      </div>
    );
  }

  if (!context) {
    return (
      <div className="about-page">
        <h1>Nutrition</h1>
        <p>What are you fueling for? This decides what meal suggestions and tips you get.</p>
        <div className="card">
          <div className="sport-grid">
            {NUTRITION_CONTEXTS.map((c) => (
              <button key={c.key} type="button" className="sport-tile" onClick={() => chooseContext(c.key)}>
                <span className="sport-name">{c.label}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (context === "gym" && !gymGoalChosen) {
    return (
      <div className="about-page">
        <h1>Nutrition</h1>
        <p>What's your current gym goal? This decides your targets and meal suggestions.</p>
        <div className="card">
          <div className="sport-grid">
            {GYM_GOALS.map((g) => (
              <button key={g} type="button" className="sport-tile" onClick={() => chooseGymGoal(g)}>
                <span className="sport-name">{g}</span>
              </button>
            ))}
          </div>
          <button
            type="button"
            onClick={() => chooseContext(null)}
            style={{ marginTop: 12, background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 10, padding: "10px 18px", cursor: "pointer" }}
          >
            ← Change what you're fueling for
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="about-page">
      <h1>Nutrition</h1>
      <p>Log your meals and I'll show you how they stack up against your targets — plus a plan for what to eat next.</p>
      <p className="hint">
        Fueling for: <strong style={{ color: "#EFE9DD" }}>{contextLabel}</strong>{" "}
        <button
          type="button"
          onClick={() => chooseContext(null)}
          style={{ background: "transparent", border: "none", color: "#60A5FA", cursor: "pointer", padding: 0, fontSize: 12 }}
        >
          (change)
        </button>
      </p>

      <nav className="tabs">
        <button className={tab === "track" ? "active" : ""} onClick={() => setTab("track")}>
          Log a Meal
        </button>
        <button className={tab === "analysis" ? "active" : ""} onClick={() => setTab("analysis")}>
          Analysis &amp; Plan
        </button>
        <button className={tab === "tips" ? "active" : ""} onClick={() => setTab("tips")}>
          Tips
        </button>
      </nav>

      {tab === "track" && (
        <>
          {context && (
            <div className="card">
              <h2>Your Position</h2>
              <label className="field" style={{ maxWidth: 260 }}>
                <span>Position</span>
                <select
                  value={nutritionPosition}
                  onChange={(e) => choosePosition(e.target.value)}
                >
                  <option value="">Select your position</option>
                  {Object.keys(CRICKET_POSITION_GROUPS).map((p) => (
                    <option key={p} value={p}>
                      {p}
                    </option>
                  ))}
                </select>
              </label>
              {nutritionPosition && CRICKET_POSITION_GROUPS[nutritionPosition] && (() => {
                const g = CRICKET_POSITION_NUTRITION[CRICKET_POSITION_GROUPS[nutritionPosition]];
                return (
                  <>
                    <p className="hint" style={{ marginTop: 10 }}>
                      <strong style={{ color: "#EFE9DD" }}>{g.label}:</strong> {g.focus}
                    </p>
                    <ul className="drills">
                      {g.tips.map((t, i) => (
                        <li key={i}>{t}</li>
                      ))}
                    </ul>
                  </>
                );
              })()}
            </div>
          )}

          <div className="card">
            <h2>What do you want from your food?</h2>
            <p className="hint">Tap anything that fits, or type it in your own words — your tips and suggested day change to match.</p>
            <div>
              {FOOD_WANTS.map((w) => (
                <PlanChip key={w.key} label={w.label} active={wants.includes(w.key)} onClick={() => toggleWant(w.key)} />
              ))}
            </div>
            <label className="field" style={{ marginTop: 12 }}>
              <span>Anything specific? (optional)</span>
              <input type="text" placeholder="e.g. stop snacking at night, more energy for the second half" value={wantsText} onChange={(e) => saveWants(wants, e.target.value)} />
            </label>
          </div>

          {(() => {
            const t = positionNutritionTarget({ ...body, goal, position: nutritionPosition });
            if (!t)
              return (
                <p className="hint" style={{ margin: "0 4px 12px" }}>
                  Tip: add your height and body weight in Gym → Body Weight and we'll work out targets for your position.
                </p>
              );
            const same = Number(target.calories) === t.calories && Number(target.protein) === t.protein;
            return (
              <div className="card" style={{ border: "1px solid #3A6B4A" }}>
                <h2>💡 Suggested targets{nutritionPosition ? ` for a ${nutritionPosition}` : ""}</h2>
                <p className="hint">From your height, weight, age, sex{nutritionPosition ? ", position" : ""} and goal ({goal}).</p>
                <div className="stat-row">
                  <Stat label="Calories" value={t.calories} />
                  <Stat label="Protein" value={`${t.protein}g`} />
                  <Stat label="Carbs" value={`${t.carbs}g`} />
                  <Stat label="Fat" value={`${t.fat}g`} />
                </div>
                {same ? (
                  <p className="hint" style={{ color: "#8FD9A0" }}>✓ You're using these.</p>
                ) : (
                  <button
                    className="save-btn"
                    onClick={() => {
                      setTarget(t);
                      persist("nutrition:target", t);
                    }}
                  >
                    Use these targets
                  </button>
                )}
              </div>
            );
          })()}

          <div className="card">
            <h2>Daily Targets</h2>
            <p className="hint">
              {context === "gym"
                ? `Goal: ${goal} (change it from here or on the Gym page).`
                : "Cricket fueling day — these targets started from a rough estimate."}{" "}
              Adjust to whatever your plan actually is.
            </p>
            {(context === "cricket-match" || context === "cricket-training") && (
              <p className="hint">{CRICKET_FUELING_NOTES[context]}</p>
            )}
            <div className="grid">
              <NumberField label="Calories" value={target.calories} onChange={(v) => updateTarget("calories", v)} />
              <NumberField label="Protein (g)" value={target.protein} onChange={(v) => updateTarget("protein", v)} />
              <NumberField label="Carbs (g)" value={target.carbs} onChange={(v) => updateTarget("carbs", v)} />
              <NumberField label="Fat (g)" value={target.fat} onChange={(v) => updateTarget("fat", v)} />
            </div>
            {Number(target.calories) < 1200 && (
              <p className="hint" style={{ marginTop: 8 }}>
                That's a pretty low calorie target — worth checking in with a nutrition professional before going this low.
              </p>
            )}
          </div>

          <div className="card">
            <h2>Today So Far</h2>
            <div className="stat-row">
              <Stat label="Calories" value={`${todaysTotals.calories} / ${target.calories}`} />
              <Stat label="Protein" value={`${todaysTotals.protein}g / ${target.protein}g`} />
              <Stat label="Carbs" value={`${todaysTotals.carbs}g / ${target.carbs}g`} />
              <Stat label="Fat" value={`${todaysTotals.fat}g / ${target.fat}g`} />
            </div>
          </div>

          <div className="card">
            <h2>Log a Meal</h2>
            <div className="grid">
              <label className="field">
                <span>Meal</span>
                <select value={draft.mealType} onChange={(e) => setDraft({ ...draft, mealType: e.target.value })}>
                  {MEAL_TYPES.map((mt) => (
                    <option key={mt} value={mt}>
                      {mt}
                    </option>
                  ))}
                </select>
              </label>
              <label className="field">
                <span>What did you eat?</span>
                <input type="text" placeholder="e.g. Chicken, rice and broccoli" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} />
              </label>
            </div>
            <MealPlateHelper draft={draft} setDraft={setDraft} photo={mealPhoto} setPhoto={setMealPhoto} context={context} />
            <div className="grid">
              <NumberField label="Calories" value={draft.calories} onChange={(v) => setDraft({ ...draft, calories: v })} />
              <NumberField label="Protein (g)" value={draft.protein} onChange={(v) => setDraft({ ...draft, protein: v })} />
              <NumberField label="Carbs (g)" value={draft.carbs} onChange={(v) => setDraft({ ...draft, carbs: v })} />
              <NumberField label="Fat (g)" value={draft.fat} onChange={(v) => setDraft({ ...draft, fat: v })} />
            </div>
            <LogForPicker title="Who is this meal for?" value={mealFor} onChange={setMealFor} team={mealTeam} />
            <button className="save-btn" onClick={saveMeal}>
              Save Meal
            </button>

            {meals.length > 0 && (
              <div className="entry-list">
                <h3>Logged meals ({meals.length})</h3>
                {[...meals].reverse().map((m) => (
                  <div className="entry-row" key={m.id}>
                    {m.photo && <MealThumb id={m.id} />}
                    <span style={{ flex: 1 }}>
                      {m.date} — {m.mealType}: {m.name} ({m.calories} cal, {m.protein}g P, {m.carbs}g C, {m.fat}g F)
                      {m.context ? ` — ${NUTRITION_CONTEXTS.find((c) => c.key === m.context)?.label || ""}` : ""}
                    </span>
                    <button onClick={() => removeMeal(m.id)}>Remove</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </>
      )}

      {tab === "analysis" && (
        <>
          {!analysis && <EmptyState icon="🍽️" text="Log your first meal and your analysis appears here." action="Log a meal" onAction={() => setTab("track")} />}
          {analysis && (
            <div className="card">
              <h2>Nutrition Analysis</h2>
              <div className="stat-row">
                {analysis.statCards.map((s, i) => (
                  <Stat key={i} label={s.label} value={s.value} />
                ))}
              </div>
              <div className="verdict">
                {analysis.good.length > 0 && (
                  <div className="good">
                    <h4>What's going well</h4>
                    <ul>
                      {analysis.good.map((g, i) => (
                        <li key={i}>{g}</li>
                      ))}
                    </ul>
                  </div>
                )}
                {analysis.bad.length > 0 && (
                  <div className="bad">
                    <h4>What to work on</h4>
                    <ul>
                      {analysis.bad.map((b, i) => (
                        <li key={i}>{b}</li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="card">
            <h2>Suggested Day ({context === "gym" ? goal : contextLabel})</h2>
            <p className="hint">A simple starting template for your current goal — swap in foods you actually like that fit a similar profile.</p>
            <div className="entry-list">
              {MEAL_TYPES.map((mt) => (
                <div className="entry-row" key={mt}>
                  <span>
                    <strong>{mt}:</strong> {suggestions[mt]}
                  </span>
                </div>
              ))}
            </div>
            {(() => {
              const all = [...new Set([...wants, ...wantsFromText(wantsText)])];
              const tweaks = FOOD_WANTS.filter((w) => all.includes(w.key)).map((w) => w.tweak);
              if (!tweaks.length && !wantsText.trim()) return null;
              return (
                <>
                  <h3 style={{ marginTop: 14 }}>Tweaks for what you want</h3>
                  <ul className="drills">
                    {tweaks.map((t, i) => (
                      <li key={i}>{t}</li>
                    ))}
                    {wantsText.trim() && !wantsFromText(wantsText).length && (
                      <li>You said: “{wantsText.trim()}” — check the Tips tab for ideas, or ask the Coach Bot.</li>
                    )}
                  </ul>
                </>
              );
            })()}
          </div>
        </>
      )}

      {tab === "tips" && (
        <>

            <div className="card" key={w.key}>

// NOTE: This is simple local-device storage for a lightweight username/password
// switcher, not real secure authentication — passwords are stored as plain text
// in local storage, matching the "mock" spirit of the rest of this app (see
// PaymentGate). Don't reuse a real password here.
// ---- Signing up is per sport (and per role) ----
// One email can be signed up to several sports, and as a player and/or a coach
// in each — but every one needs its own sign-up. profile.registrations looks
// like { rugby: ["player"], football: ["player", "coach"] }.
function sportRegistrations(profile) {
  const r = profile && profile.registrations && profile.registrations.cricket;
  return Array.isArray(r) ? r.filter((x) => x === "player" || x === "coach") : [];
}
function withActiveRole(profile) {
  const regs = sportRegistrations(profile);
  if (!regs.length) return profile;
  const cur = profile.roles && profile.roles.cricket;
  const role = regs.includes(cur) ? cur : regs[0];
  return { ...profile, role, roles: { ...(profile.roles || {}), cricket: role } };
}

const TRIAL_DAYS = 31; // longest a trial can be (rules allow up to 32)
// The free trial lasts one calendar month — same date next month, like PayPal.
function trialEndFrom(ms) {
  const d = new Date(ms);
  const day = d.getDate();
  d.setMonth(d.getMonth() + 1);
  if (d.getDate() !== day) d.setDate(0); // 31 Jan → 28/29 Feb, not March
  return d.getTime();
}
const GRACE_DAYS = 3; // time to check a payment came through after the trial

  sport: { name: "Cricket only", monthly: "£4.99", yearly: "£39.99", note: "Everything in Cricket — logging, analysis, drills, video, plan, nutrition, recovery, gym." },
