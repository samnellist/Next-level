<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: #050608; color: #F2F4F7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 32px) 22px calc(env(safe-area-inset-bottom, 0px) + 32px); text-align: center; }

  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: 0.5px; }
  .pick { background: #0E1420; border: 2px solid #1E7BFF; border-radius: 14px; padding: 14px 16px; margin: 4px 0 22px; }
  .pick b { display: block; font-size: 21px; color: #FFFFFF; }
  .pick span { display: block; font-size: 13px; color: #9AA4B2; margin-top: 4px; }
  a.sport { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #F2F4F7; background: #0E1420; border: 1px solid #1E2A3D; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; font-size: 18px; font-weight: 600; }
  a.sport:hover, a.sport:active { border-color: #1E7BFF; background: #111B2C; }
  a.sport span.e { font-size: 26px; }
  a.sport span.go { margin-left: auto; color: #1E7BFF; }
  small { display: block; color: #5E6B7D; margin-top: 22px; font-size: 12px; }
</style>
