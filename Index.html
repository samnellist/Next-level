// window.storage only exists inside Claude's own artifact preview. When this file
// is hosted anywhere else (Netlify, etc.), fall back to the browser's own
// localStorage so every feature that saves data keeps working.
if (!window.storage) {
  window.storage = {
    async get(key) {
      try {
        const raw = localStorage.getItem("nl:" + key);
        if (raw === null) return null;
        return { key, value: raw };
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem("nl:" + key, value);
        return { key, value };
      } catch (e) {
        return null;
      }
    },
    async delete(key) {
      try {
        localStorage.removeItem("nl:" + key);
        return { key, deleted: true };
      } catch (e) {
        return null;
      }
    },
    async list(prefix) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("nl:")) {
            const stripped = k.slice(3);
            if (!prefix || stripped.startsWith(prefix)) keys.push(stripped);
          }
        }
        return { keys, prefix };
      } catch (e) {
        return { keys: [], prefix };
      }
    },
  };
}

window.storage = {
  get: async (key, shared) => {
    const k = shared ? "shared:" + key : key;
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("not found");
    return { key, value: v, shared: !!shared };
  },
  set: async (key, value, shared) => {
    const k = shared ? "shared:" + key : key;
    localStorage.setItem(k, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    const k = shared ? "shared:" + key : key;
    localStorage.removeItem(k);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    const p = shared ? "shared:" + (prefix || "") : (prefix || "");
    const keys = Object.keys(localStorage).filter((k) => k.startsWith(p));
    return { keys, prefix, shared: !!shared };
  },
};

function makeEmptyRoleEntry(roleKey) {
  const entry = { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), matchId: null };
  (ROLE_FIELDS[roleKey] || []).forEach((f) => {
    entry[f.key] = f.key === "minutesPlayed" ? 90 : 0;
  });
  return entry;
}

function sumRoleEntries(roleKey, entries) {
  const totals = {};
  (ROLE_FIELDS[roleKey] || []).forEach((f) => {
    totals[f.key] = 0;
  });
  entries.forEach((e) => {
    (ROLE_FIELDS[roleKey] || []).forEach((f) => {
      totals[f.key] += Number(e[f.key] || 0);
    });
  });
  return totals;
}

// ---------- Geometry for the tap-to-score field diagram ----------
function polarPoint(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function wedgePath(cx, cy, r, startAngle, endAngle) {
  const start = polarPoint(cx, cy, r, endAngle);
  const end = polarPoint(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

function FieldDiagram({ values, onAdd, onReset }) {
  const [active, setActive] = useState(null);
  const cx = 100, cy = 100, r = 92;
  const n = ZONES.length;
  const step = 360 / n;
  const max = Math.max(1, ...Object.values(values));

  return (
    <div className="field-diagram">
      <svg viewBox="0 0 200 200" className="field-svg">
        <circle cx={cx} cy={cy} r={r + 3} fill="#0F1F17" stroke="#2A4433" strokeWidth="2" />
        {ZONES.map((z, i) => {
          const startA = i * step, endA = (i + 1) * step;
          const val = Number(values[z] || 0);
          const opacity = 0.12 + 0.55 * (val / max);
          const mid = polarPoint(cx, cy, r * 0.6, (startA + endA) / 2);
          return (
            <g key={z} onClick={() => setActive(z)}>
              <path
                d={wedgePath(cx, cy, r, startA, endA)}
                fill={active === z ? "#C8531E" : `rgba(200,83,30,${opacity})`}
                stroke="#0F1F17"
                strokeWidth="2"
              />
              <text x={mid.x} y={mid.y} textAnchor="middle" dominantBaseline="middle" fontSize="11" fill="#F5EFE2">
                {val}
              </text>
            </g>
          );
        })}
      </svg>
      <p className="hint field-hint">{active || "Tap a zone, then pick the runs scored there"}</p>
      {active && (
        <div className="amount-row">
          {[1, 2, 3, 4, 6].map((n2) => (
            <button key={n2} type="button" onClick={() => onAdd(active, n2)}>
              +{n2}
            </button>
          ))}
          <button type="button" className="amount-reset" onClick={() => onReset(active)}>
            Reset
          </button>
          <button type="button" className="amount-done" onClick={() => setActive(null)}>
            Done
          </button>
        </div>
      )}
    </div>
  );
}

function TrackerCard({ tracker, entries, onLog, onDeleteEntry, onDeleteTracker }) {
  const [val, setVal] = useState("");
  const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
  const latest = sorted[0];
  return (
    <div className="card">
      <div className="tracker-head">
        <h2>{tracker.name}</h2>
        <button className="tiny-btn" onClick={onDeleteTracker}>
          Delete
        </button>
      </div>
      {latest && (
        <p className="hint">
          Latest: {latest.value} {tracker.unit} on {latest.date}
        </p>
      )}
      <div className="new-match-row">
        <input
          type="number"
          value={val}
          onChange={(e) => setVal(e.target.value)}
          placeholder={`Value (${tracker.unit || "units"})`}
        />
        <button
          type="button"
          onClick={() => {
            if (val !== "") {
              onLog(Number(val));
              setVal("");
            }
          }}
        >
          Log
        </button>
      </div>
      {sorted.length > 0 && (
        <div className="entry-list">
          {sorted.slice(0, 10).map((e) => (
            <div className="entry-row" key={e.id}>
              <span>
                {e.date}: {e.value} {tracker.unit}
              </span>
              <button onClick={() => onDeleteEntry(e.id)}>Remove</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      } catch (e) {
        // no name saved yet
      }
      await refreshMessages();
      setLoaded(true);
    }
    init();
    const poll = setInterval(refreshMessages, 5000);
    return () => clearInterval(poll);
  }, []);

  async function refreshMessages() {
    try {
      const m = await window.storage.get("helpdesk:messages", true);
      setMessages(JSON.parse(m.value));
    } catch (e) {
      setMessages([]);
    }
  }

  async function saveName() {
    if (!nameInput.trim()) return;
    setVisitorName(nameInput.trim());
    await window.storage.set("helpdesk:visitorName", nameInput.trim());
  }

  async function sendUserMessage() {
    if (!text.trim() || !visitorId) return;
    const next = [
      ...messages,
      { id: Date.now() + Math.random(), visitorId, visitorName: visitorName || "Anonymous", sender: "user", text: text.trim(), timestamp: Date.now() },
    ];
    setMessages(next);
    await window.storage.set("helpdesk:messages", JSON.stringify(next), true);
    setText("");
  }

  async function sendAdminReply(targetVisitorId) {
    const replyText = (replyDrafts[targetVisitorId] || "").trim();
    if (!replyText) return;
    const next = [...messages, { id: Date.now() + Math.random(), visitorId: targetVisitorId, sender: "admin", text: replyText, timestamp: Date.now() }];
    setMessages(next);
    await window.storage.set("helpdesk:messages", JSON.stringify(next), true);
    setReplyDrafts({ ...replyDrafts, [targetVisitorId]: "" });
  }

  function unlockAdmin() {
    if (codeInput === ADMIN_CODE) {
      setIsAdmin(true);
      setShowCodeBox(false);
      setCodeInput("");
    } else {
      alert("Incorrect code");
    }
  }

  if (!loaded) {
    return (
      <div className="help-page">
        <p className="hint">Loading…</p>
      </div>
    );
  }

  const threads = {};
  messages.forEach((m) => {
    if (!threads[m.visitorId]) threads[m.visitorId] = { visitorId: m.visitorId, visitorName: "Anonymous", messages: [] };
    threads[m.visitorId].messages.push(m);
    if (m.sender === "user" && m.visitorName) threads[m.visitorId].visitorName = m.visitorName;
  });
  const threadList = Object.values(threads).sort((a, b) => {
    const aLast = a.messages[a.messages.length - 1]?.timestamp || 0;
    const bLast = b.messages[b.messages.length - 1]?.timestamp || 0;
    return bLast - aLast;
  });

  if (isAdmin) {
    return (
      <div className="help-page">
        <div className="help-header-row">
          <h2>Help Inbox</h2>
          <button className="tiny-btn" onClick={() => setIsAdmin(false)}>
            Exit admin
          </button>
        </div>
        {!selectedThread && (
          <div className="thread-list">
            {threadList.length === 0 && <p className="hint">No questions yet.</p>}
            {threadList.map((t) => {
              const last = t.messages[t.messages.length - 1];
              return (
                <button key={t.visitorId} className="thread-row" onClick={() => setSelectedThread(t.visitorId)}>
                  <strong>{t.visitorName}</strong>
                  <span className="hint">{last ? last.text.slice(0, 50) : ""}</span>
                </button>
              );
            })}
          </div>
        )}
        {selectedThread && threads[selectedThread] && (
          <div className="thread-detail">
            <button className="tiny-btn" onClick={() => setSelectedThread(null)} style={{ marginBottom: 10 }}>
              ← All chats
            </button>
            <div className="chat-scroll">
              {[...threads[selectedThread].messages]
                .sort((a, b) => a.timestamp - b.timestamp)
                .map((m) => (
                  <div key={m.id} className={"chat-bubble " + (m.sender === "admin" ? "chat-admin" : "chat-user")}>
                    {m.text}
                  </div>
                ))}
            </div>
            <div className="new-match-row">
              <input
                type="text"
                placeholder="Type a reply..."
                value={replyDrafts[selectedThread] || ""}
                onChange={(e) => setReplyDrafts({ ...replyDrafts, [selectedThread]: e.target.value })}
              />
              <button onClick={() => sendAdminReply(selectedThread)}>Send</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  const myThread = messages.filter((m) => m.visitorId === visitorId).sort((a, b) => a.timestamp - b.timestamp);

  return (
    <div className="help-page">
      <h2>Help</h2>
      <p className="hint">Ask a question — only you and the app's creator can see this chat.</p>

      {!visitorName && (
        <div className="new-match-row">
          <input type="text" placeholder="Your name" value={nameInput} onChange={(e) => setNameInput(e.target.value)} />
          <button onClick={saveName}>Save</button>
        </div>
      )}

      <div className="chat-scroll">
        {myThread.length === 0 && <p className="hint">No messages yet — ask away!</p>}
        {myThread.map((m) => (
          <div key={m.id} className={"chat-bubble " + (m.sender === "admin" ? "chat-admin" : "chat-user")}>
            {m.text}
          </div>
        ))}
      </div>

      <div className="new-match-row">
        <input type="text" placeholder="Type your question..." value={text} onChange={(e) => setText(e.target.value)} />
        <button onClick={sendUserMessage}>Send</button>
      </div>

      {!showCodeBox ? (
        <button className="admin-link" onClick={() => setShowCodeBox(true)}>
          Admin
        </button>
      ) : (
        <div className="new-match-row">
          <input
            type="password"
            placeholder="Admin code"
            value={codeInput}
            onChange={(e) => setCodeInput(e.target.value)}
          />
          <button onClick={unlockAdmin}>Unlock</button>
        </div>
      )}
    </div>
  );
}

// ---------- Analysis logic ----------
function analyseBatting(entries) {
  if (entries.length === 0) return null;
  const t = entries.reduce(
    (a, e) => ({
      runs: a.runs + Number(e.runs),
      balls: a.balls + Number(e.ballsFaced),
      dots: a.dots + Number(e.dots),
      singles: a.singles + Number(e.singles),
      twos: a.twos + Number(e.twos),
      threes: a.threes + Number(e.threes),
      fours: a.fours + Number(e.fours),
      sixes: a.sixes + Number(e.sixes),
      dismissals: a.dismissals + (e.dismissed ? 1 : 0),
      runsVsSpin: a.runsVsSpin + Number(e.runsVsSpin || 0),
      ballsVsSpin: a.ballsVsSpin + Number(e.ballsVsSpin || 0),
      runsVsPace: a.runsVsPace + Number(e.runsVsPace || 0),
      ballsVsPace: a.ballsVsPace + Number(e.ballsVsPace || 0),
    }),
    { runs: 0, balls: 0, dots: 0, singles: 0, twos: 0, threes: 0, fours: 0, sixes: 0, dismissals: 0, runsVsSpin: 0, ballsVsSpin: 0, runsVsPace: 0, ballsVsPace: 0 }
  );

  const srVsSpin = t.ballsVsSpin ? ((t.runsVsSpin / t.ballsVsSpin) * 100).toFixed(1) : null;
  const srVsPace = t.ballsVsPace ? ((t.runsVsPace / t.ballsVsPace) * 100).toFixed(1) : null;

  const zoneTotals = Object.fromEntries(ZONES.map((z) => [z, 0]));
  entries.forEach((e) => ZONES.forEach((z) => (zoneTotals[z] += Number(e.zoneRuns[z] || 0))));
  const topZone = Object.entries(zoneTotals).sort((a, b) => b[1] - a[1])[0];
  const weakestZones = Object.entries(zoneTotals)
    .filter(([, v]) => v === 0)
    .map(([k]) => k);

  const dismissalCounts = Object.fromEntries(DISMISSAL_TYPES.map((d) => [d, 0]));
  entries.forEach((e) => {
    if (e.dismissed && e.dismissalType) dismissalCounts[e.dismissalType] = (dismissalCounts[e.dismissalType] || 0) + 1;
  });
  const dismissalEntries = Object.entries(dismissalCounts).filter(([, v]) => v > 0);
  const topDismissal = dismissalEntries.sort((a, b) => b[1] - a[1])[0];

  const strikeRate = t.balls ? ((t.runs / t.balls) * 100).toFixed(1) : "0.0";
  const dotPct = t.balls ? ((t.dots / t.balls) * 100).toFixed(1) : "0.0";
  const boundaryPct = t.balls ? (((t.fours + t.sixes) / t.balls) * 100).toFixed(1) : "0.0";
  const average = t.dismissals ? (t.runs / t.dismissals).toFixed(1) : t.runs.toFixed(1);
  const boundaryRunsShare = t.runs ? (((t.fours * 4 + t.sixes * 6) / t.runs) * 100).toFixed(0) : "0";

  const good = [];
  const bad = [];

  if (Number(strikeRate) >= 100) good.push(`Strike rate of ${strikeRate} is strong — you're scoring quickly.`);
  else if (Number(strikeRate) < 60) bad.push(`Strike rate is ${strikeRate} — that's on the slower side for most formats.`);

  if (Number(dotPct) > 45) bad.push(`${dotPct}% of your balls faced are dots — a lot of pressure is building on you between boundaries.`);
  else if (Number(dotPct) < 25) good.push(`Only ${dotPct}% dot balls — you're rotating strike well.`);

  if (Number(boundaryPct) >= 12) good.push(`${boundaryPct}% of balls faced go for a boundary — good power/timing.`);
  else if (Number(boundaryPct) < 5 && t.balls > 10) bad.push(`Only ${boundaryPct}% of balls faced are boundaries — you may be relying too much on singles to build a score.`);

  if (t.singles > 0 && t.twos === 0 && t.balls > 15) bad.push(`No 2s recorded despite facing ${t.balls} balls — look for the second run more aggressively when the ball is in the gap.`);

  if (topZone && topZone[1] > 0) good.push(`Most of your runs come through ${topZone[0]} (${topZone[1]} runs) — that's clearly a strength zone.`);
  if (weakestZones.length > 0 && weakestZones.length < ZONES.length)
    bad.push(`No runs recorded through ${weakestZones.slice(0, 3).join(", ")} — these areas aren't being used to score.`);

  if (Number(boundaryRunsShare) > 70 && t.runs > 10)
    bad.push(`${boundaryRunsShare}% of your runs come from boundaries alone — building an innings mostly through boundaries is risky if they dry up.`);

  if (topDismissal && topDismissal[1] > 1) {
    const [type, count] = topDismissal;
    if (type === "Bowled" || type === "LBW")
      bad.push(`Out ${type} ${count} times — the ball is getting past your bat onto the stumps; likely a head position or late-shot issue.`);
    else if (type === "Caught")
      bad.push(`Out Caught ${count} times — you may be hitting the ball in the air more than needed; work on keeping shots along the ground.`);
    else if (type === "Run Out")
      bad.push(`Run Out ${count} times — running between wickets needs sharper calling/backing up.`);
    else if (type === "Stumped")
      bad.push(`Stumped ${count} times — footwork against spin is dragging you out of your crease without getting to the pitch of the ball.`);
  }
  if (dismissalEntries.length >= 3)
    good.push(`No single dismissal type dominates how you're getting out — that suggests solid all-round technique rather than one clear weakness.`);

  if (srVsSpin !== null && srVsPace !== null) {
    const diff = Math.abs(Number(srVsPace) - Number(srVsSpin));
    if (diff >= 20) {
      const weaker = Number(srVsPace) < Number(srVsSpin) ? "pace" : "spin";
      const stronger = weaker === "pace" ? "spin" : "pace";
      bad.push(`Strike rate against ${weaker} (${weaker === "pace" ? srVsPace : srVsSpin}) is well below your rate against ${stronger} (${stronger === "pace" ? srVsPace : srVsSpin}) — worth extra practice facing ${weaker}.`);
    } else {
      good.push(`Similar strike rate against both pace (${srVsPace}) and spin (${srVsSpin}) — no clear weakness against either type.`);
    }
  }

  return { totals: t, strikeRate, dotPct, boundaryPct, average, zoneTotals, topZone, dismissalCounts, topDismissal, srVsSpin, srVsPace, good, bad };
}

function analyseBowling(entries) {
  if (entries.length === 0) return null;
  const t = entries.reduce(
    (a, e) => ({
      balls: a.balls + Number(e.ballsBowled),
      dots: a.dots + Number(e.dots),
      runs: a.runs + Number(e.runsConceded),
      wickets: a.wickets + totalWickets(e),
      wides: a.wides + Number(e.wides),
      noBalls: a.noBalls + Number(e.noBalls),
      fours: a.fours + Number(e.fours),
      sixes: a.sixes + Number(e.sixes),
    }),
    { balls: 0, dots: 0, runs: 0, wickets: 0, wides: 0, noBalls: 0, fours: 0, sixes: 0 }
  );

  const wicketTypeTotals = Object.fromEntries(WICKET_TYPES.map((w) => [w, 0]));
  entries.forEach((e) => {
    wicketTypeTotals["Bowled"] += Number(e.wicketsBowled || 0);
    wicketTypeTotals["LBW"] += Number(e.wicketsLBW || 0);
    wicketTypeTotals["Caught"] += Number(e.wicketsCaught || 0);
    wicketTypeTotals["Stumped"] += Number(e.wicketsStumped || 0);
    wicketTypeTotals["Run Out"] += Number(e.wicketsRunOut || 0);
  });
  const topWicketType = Object.entries(wicketTypeTotals).sort((a, b) => b[1] - a[1])[0];

  const zoneTotals = Object.fromEntries(ZONES.map((z) => [z, 0]));
  entries.forEach((e) => ZONES.forEach((z) => (zoneTotals[z] += Number((e.zoneRuns && e.zoneRuns[z]) || 0))));
  const zoneEntries = Object.entries(zoneTotals);
  const leakiestZone = zoneEntries.sort((a, b) => b[1] - a[1])[0];
  const tightestZones = zoneEntries.filter(([, v]) => v === 0).map(([k]) => k);

  const overs = (Math.floor(t.balls / 6) + (t.balls % 6) / 10).toFixed(1);
  const economy = t.balls ? (t.runs / (t.balls / 6)).toFixed(2) : "0.00";
  const dotPct = t.balls ? ((t.dots / t.balls) * 100).toFixed(1) : "0.0";
  const strikeRate = t.wickets ? (t.balls / t.wickets).toFixed(1) : "-";
  const boundaryPct = t.balls ? (((t.fours + t.sixes) / t.balls) * 100).toFixed(1) : "0.0";
  const extrasPerOver = t.balls ? (((t.wides + t.noBalls) / (t.balls / 6))).toFixed(2) : "0.00";

  const good = [];
  const bad = [];

  if (Number(economy) <= 5) good.push(`Economy of ${economy} runs/over is tight — you're controlling the scoring well.`);
  else if (Number(economy) > 8) bad.push(`Economy of ${economy} runs/over is high — batters are finding it easy to score off you.`);

  if (Number(dotPct) >= 40) good.push(`${dotPct}% dot balls — you're building real pressure over.`);
  else if (Number(dotPct) < 20) bad.push(`Only ${dotPct}% dot balls — try changing pace or length more to stop easy runs.`);

  if (Number(boundaryPct) > 10) bad.push(`${boundaryPct}% of your deliveries go for a boundary — this suggests a length or line issue worth working on.`);

  if (Number(extrasPerOver) > 0.5) bad.push(`${extrasPerOver} wides/no-balls per over is giving away free runs and extra deliveries.`);

  if (t.wickets > 0) good.push(`${t.wickets} wicket${t.wickets > 1 ? "s" : ""} taken at a strike rate of ${strikeRate} balls/wicket.`);
  else if (t.balls > 24) bad.push(`No wickets across ${overs} overs — consider mixing up length to induce mistakes, not just contain runs.`);

  if (topWicketType && topWicketType[1] > 0) {
    const [type, count] = topWicketType;
    if (type === "Bowled" || type === "LBW")
      good.push(`Most wickets (${count}) come ${type} — your line and length are hitting the stumps consistently, a real strength.`);
    else if (type === "Caught")
      good.push(`Most wickets (${count}) come Caught — you're inducing mistimed shots, likely through pace/movement variation.`);
    else if (type === "Stumped")
      good.push(`Most wickets (${count}) come Stumped — good flight and turn are drawing batters out of their crease.`);
    else if (type === "Run Out")
      good.push(`${count} Run Out${count > 1 ? "s" : ""} credited — sharp fielding pressure is creating chances.`);
  }

  if (leakiestZone && leakiestZone[1] > 0)
    bad.push(`Most runs conceded through ${leakiestZone[0]} (${leakiestZone[1]} runs) — batters are targeting this area against you.`);
  if (tightestZones.length > 0 && tightestZones.length < ZONES.length)
    good.push(`No runs conceded through ${tightestZones.slice(0, 3).join(", ")} — you're keeping it tight there.`);

  return { totals: t, overs, economy, dotPct, strikeRate, boundaryPct, extrasPerOver, wicketTypeTotals, topWicketType, zoneTotals, leakiestZone, good, bad };
}

function analyseFielding(entries) {
  if (entries.length === 0) return null;
  const t = entries.reduce(
    (a, e) => ({
      catches: a.catches + Number(e.catches || 0),
      runOuts: a.runOuts + Number(e.runOuts || 0),
      goodStops: a.goodStops + Number(e.goodStops || 0),
      dropped: a.dropped + Number(e.dropped || 0),
      misfields: a.misfields + Number(e.misfields || 0),
    }),
    { catches: 0, runOuts: 0, goodStops: 0, dropped: 0, misfields: 0 }
  );

  const posCatches = Object.fromEntries(ZONES.map((z) => [z, 0]));
  const posErrors = Object.fromEntries(ZONES.map((z) => [z, 0]));
  entries.forEach((e) => {
    posCatches[e.position] = (posCatches[e.position] || 0) + Number(e.catches || 0) + Number(e.goodStops || 0);
    posErrors[e.position] = (posErrors[e.position] || 0) + Number(e.dropped || 0) + Number(e.misfields || 0);
  });
  const bestPosition = Object.entries(posCatches).sort((a, b) => b[1] - a[1])[0];
  const leakiestPosition = Object.entries(posErrors).sort((a, b) => b[1] - a[1])[0];

  const attempts = t.catches + t.dropped;
  const catchConversion = attempts ? ((t.catches / attempts) * 100).toFixed(0) : null;

  const good = [];
  const bad = [];

  if (catchConversion !== null && Number(catchConversion) >= 80 && attempts >= 3)
    good.push(`Holding ${catchConversion}% of your catching chances (${t.catches}/${attempts}) — reliable hands.`);
  else if (catchConversion !== null && Number(catchConversion) < 50 && attempts >= 3)
    bad.push(`Only converting ${catchConversion}% of catching chances (${t.catches}/${attempts}) — worth extra catching practice.`);

  if (t.goodStops > 0) good.push(`${t.goodStops} good stop${t.goodStops > 1 ? "s" : ""} recorded — saving runs in the field.`);
  if (t.runOuts > 0) good.push(`${t.runOuts} run out${t.runOuts > 1 ? "s" : ""} credited — sharp work on the ball and at the stumps.`);

  if (bestPosition && bestPosition[1] > 0)
    good.push(`Most of your clean fielding happens at ${bestPosition[0]} (${bestPosition[1]}) — a position you clearly handle well.`);
  if (leakiestPosition && leakiestPosition[1] > 1)
    bad.push(`Most drops/misfields happen at ${leakiestPosition[0]} (${leakiestPosition[1]}) — extra reps fielding from there would help.`);

  if (t.misfields > 2) bad.push(`${t.misfields} misfields logged — ground fielding technique (getting low, hands early) is worth drilling.`);

  return { totals: t, posCatches, posErrors, bestPosition, leakiestPosition, catchConversion, good, bad };
}

function analyseKeeping(entries) {
  if (entries.length === 0) return null;
  const t = entries.reduce(
    (a, e) => ({
      catches: a.catches + Number(e.catches || 0),
      stumpings: a.stumpings + Number(e.stumpings || 0),
      runOuts: a.runOuts + Number(e.runOuts || 0),
      byesLegSide: a.byesLegSide + Number(e.byesLegSide || 0),
      byesOffSide: a.byesOffSide + Number(e.byesOffSide || 0),
      dropped: a.dropped + Number(e.dropped || 0),
    }),
    { catches: 0, stumpings: 0, runOuts: 0, byesLegSide: 0, byesOffSide: 0, dropped: 0 }
  );

  const totalByes = t.byesLegSide + t.byesOffSide;
  const totalDismissals = t.catches + t.stumpings + t.runOuts;
  const byesPerInnings = (totalByes / entries.length).toFixed(1);
  const leakSide = t.byesLegSide === t.byesOffSide ? null : t.byesLegSide > t.byesOffSide ? "Leg side" : "Off side";

  const good = [];
  const bad = [];

  if (totalDismissals > 0)
    good.push(`${totalDismissals} dismissal${totalDismissals > 1 ? "s" : ""} behind the stumps (${t.catches} caught, ${t.stumpings} stumped, ${t.runOuts} run out).`);
  if (t.stumpings > 0) good.push(`${t.stumpings} stumping${t.stumpings > 1 ? "s" : ""} — quick glovework against spin.`);

  if (Number(byesPerInnings) >= 5) bad.push(`Averaging ${byesPerInnings} byes per innings behind the stumps — worth working on watching the ball fully onto the gloves.`);
  else if (totalByes === 0 && entries.length > 1) good.push(`No byes conceded across ${entries.length} innings — tidy glovework.`);

  if (leakSide && Math.max(t.byesLegSide, t.byesOffSide) >= 3)
    bad.push(`Most byes are getting through on the ${leakSide.toLowerCase()} (${leakSide === "Leg side" ? t.byesLegSide : t.byesOffSide} vs ${leakSide === "Leg side" ? t.byesOffSide : t.byesLegSide}) — a positioning or footwork pattern worth reviewing.`);

  if (t.dropped > 0) bad.push(`${t.dropped} chance${t.dropped > 1 ? "s" : ""} put down behind the stumps.`);

  return { totals: t, totalByes, totalDismissals, byesPerInnings, leakSide, good, bad };
}

function analyseRole(roleKey, entries) {
  if (!roleKey || entries.length === 0) return null;
  const totals = sumRoleEntries(roleKey, entries);
  const derive = ROLE_DERIVE[roleKey];
  if (!derive) return null;
  return { totals, ...derive(totals, entries) };
}

const ROLE_DERIVE = {
  gk(t, entries) {
    const shotsFaced = t.saves + t.goalsConceded;
    const savePct = shotsFaced ? ((t.saves / shotsFaced) * 100).toFixed(0) : null;
    const cleanSheets = entries.filter((e) => Number(e.goalsConceded) === 0).length;
    const distTotal = t.distributionSuccess + t.distributionFailed;
    const distPct = distTotal ? ((t.distributionSuccess / distTotal) * 100).toFixed(0) : null;
    const good = [];
    const bad = [];
    if (savePct !== null && Number(savePct) >= 70) good.push(`Saving ${savePct}% of shots faced — strong shot-stopping.`);
    else if (savePct !== null && Number(savePct) < 50 && shotsFaced >= 3) bad.push(`Only saving ${savePct}% of shots faced — worth extra shot-stopping reps.`);
    if (cleanSheets > 0) good.push(`${cleanSheets} clean sheet${cleanSheets > 1 ? "s" : ""} across ${entries.length} appearances.`);
    if (distPct !== null && Number(distPct) < 70) bad.push(`Distribution accuracy is ${distPct}% — picking out a target under pressure needs work.`);
    else if (distPct !== null && Number(distPct) >= 85) good.push(`Distribution accuracy of ${distPct}% — starting attacks well from the back.`);
    if (t.penaltiesFaced > 0) good.push(`${t.penaltiesSaved}/${t.penaltiesFaced} penalties saved.`);
    return {
      savePct,
      distPct,
      statCards: [
        { label: "Saves", value: t.saves },
        { label: "Save %", value: savePct !== null ? `${savePct}%` : "-" },
        { label: "Clean Sheets", value: cleanSheets },
        { label: "Distribution %", value: distPct !== null ? `${distPct}%` : "-" },
      ],
      good,
      bad,
    };
  },

  cb(t, entries) {
    const tackleTotal = t.tacklesWon + t.tacklesLost;
    const tacklePct = tackleTotal ? ((t.tacklesWon / tackleTotal) * 100).toFixed(0) : null;
    const aerialTotal = t.aerialsWon + t.aerialsLost;
    const aerialPct = aerialTotal ? ((t.aerialsWon / aerialTotal) * 100).toFixed(0) : null;
    const passPct = t.passesAttempted ? ((t.passesCompleted / t.passesAttempted) * 100).toFixed(0) : null;
    const dribbledPastPer90 = t.minutesPlayed ? (t.dribbledPast / (t.minutesPlayed / 90)).toFixed(1) : "0.0";
    const good = [];
    const bad = [];

    if (Number(t.errorsLeadingToShot) >= 2) bad.push(`${t.errorsLeadingToShot} errors leading to a shot — worth reviewing decision-making under pressure.`);
    if (t.interceptions + t.clearances + t.blocks > 10) good.push(`${t.interceptions + t.clearances + t.blocks} combined interceptions, clearances and blocks — reading the game well.`);
    return {
      tacklePct,
      aerialPct,
      passPct,
      dribbledPastPer90,
      statCards: [
        { label: "Aerial %", value: aerialPct !== null ? `${aerialPct}%` : "-" },
        { label: "Tackle %", value: tacklePct !== null ? `${tacklePct}%` : "-" },
        { label: "Pass %", value: passPct !== null ? `${passPct}%` : "-" },
        { label: "Dribbled Past/90", value: dribbledPastPer90 },
      ],

  fb(t, entries) {
    const tackleTotal = t.tacklesWon + t.tacklesLost;
    const tacklePct = tackleTotal ? ((t.tacklesWon / tackleTotal) * 100).toFixed(0) : null;
    const crossPct = t.crossesAttempted ? ((t.crossesCompleted / t.crossesAttempted) * 100).toFixed(0) : null;
    const dribbleTotal = t.dribblesCompleted + t.dribblesFailed;
    const dribblePct = dribbleTotal ? ((t.dribblesCompleted / dribbleTotal) * 100).toFixed(0) : null;
    const dribbledPastPer90 = t.minutesPlayed ? (t.dribbledPast / (t.minutesPlayed / 90)).toFixed(1) : "0.0";
    const gA = t.goals + t.assists;
    const good = [];
    const bad = [];
    if (crossPct !== null && Number(crossPct) >= 35 && t.crossesAttempted >= 5) good.push(`Completing ${crossPct}% of crosses — a real outlet down the flank.`);
    else if (crossPct !== null && Number(crossPct) < 20 && t.crossesAttempted >= 5) bad.push(`Only ${crossPct}% of crosses find a teammate — worth working on delivery quality.`);
    if (tacklePct !== null && Number(tacklePct) < 50 && tackleTotal >= 3) bad.push(`Only winning ${tacklePct}% of tackles — timing of the challenge needs work.`);
    if (Number(dribbledPastPer90) >= 1.5) bad.push(`Getting dribbled past ${dribbledPastPer90} times per 90 — defensive recovery positioning is worth reviewing.`);
    if (gA > 0) good.push(`${t.goals} goal${t.goals !== 1 ? "s" : ""} and ${t.assists} assist${t.assists !== 1 ? "s" : ""} — a genuine attacking outlet from full back.`);
    if (dribblePct !== null && Number(dribblePct) >= 60 && dribbleTotal >= 5) good.push(`Completing ${dribblePct}% of take-ons going forward — comfortable beating a player.`);

      tacklePct,
      crossPct,
      dribblePct,
      dribbledPastPer90,
      statCards: [
        { label: "Tackle %", value: tacklePct !== null ? `${tacklePct}%` : "-" },
        { label: "Cross %", value: crossPct !== null ? `${crossPct}%` : "-" },
        { label: "Dribbled Past/90", value: dribbledPastPer90 },
        { label: "G+A", value: gA },
      ],

      bad,

  cm(t, entries) {
    const passPct = t.passesAttempted ? ((t.passesCompleted / t.passesAttempted) * 100).toFixed(0) : null;
    const goalContributions = t.goals + t.assists;
    const keyPassesPer90 = t.minutesPlayed ? (t.keyPasses / (t.minutesPlayed / 90)).toFixed(1) : "0.0";
    const good = [];
    const bad = [];
    if (passPct !== null && Number(passPct) >= 85) good.push(`Passing accuracy of ${passPct}% — very reliable in possession.`);
    else if (passPct !== null && Number(passPct) < 70) bad.push(`Passing accuracy is ${passPct}% — decision-making on pass selection is worth reviewing.`);
    if (goalContributions > 0) good.push(`${goalContributions} goal contribution${goalContributions > 1 ? "s" : ""} (${t.goals} goals, ${t.assists} assists) from midfield.`);
    if (Number(keyPassesPer90) >= 1.5) good.push(`${keyPassesPer90} key passes per 90 — creating good chances regularly.`);
    if (t.tacklesWon + t.interceptions < 2 * entries.length && entries.length >= 3) bad.push(`Defensive contribution (tackles + interceptions) is fairly low across your appearances — worth doing more defensive work off the ball.`);
    return {
      passPct,
      goalContributions,
      keyPassesPer90,
      statCards: [
        { label: "Pass %", value: passPct !== null ? `${passPct}%` : "-" },
        { label: "G+A", value: goalContributions },
        { label: "Key Passes/90", value: keyPassesPer90 },
      ],
      good,
      bad,
    };
  },

  cdm(t, entries) {
    const passPct = t.passesAttempted ? ((t.passesCompleted / t.passesAttempted) * 100).toFixed(0) : null;
    const longPassPct = t.longPassesAttempted ? ((t.longPassesCompleted / t.longPassesAttempted) * 100).toFixed(0) : null;
    const tackleTotal = t.tacklesWon + t.tacklesLost;
    const tacklePct = tackleTotal ? ((t.tacklesWon / tackleTotal) * 100).toFixed(0) : null;
    const recoveriesPer90 = t.minutesPlayed ? (t.ballsRecovered / (t.minutesPlayed / 90)).toFixed(1) : "0.0";
    const good = [];
    const bad = [];
    if (passPct !== null && Number(passPct) >= 88) good.push(`Passing accuracy of ${passPct}% — a reliable shield in front of the back line.`);
    else if (passPct !== null && Number(passPct) < 75) bad.push(`Passing accuracy is ${passPct}% — simplifying your pass selection under pressure could help.`);
    if (longPassPct !== null && Number(longPassPct) >= 70) good.push(`Completing ${longPassPct}% of long passes — switching play effectively.`);
    if (tacklePct !== null && Number(tacklePct) < 50 && tackleTotal >= 3) bad.push(`Only winning ${tacklePct}% of tackles — timing of the challenge is worth working on.`);
    if (Number(recoveriesPer90) >= 5) good.push(`${recoveriesPer90} recoveries per 90 — screening the back line well.`);
    if (t.foulsCommitted >= 3 && entries.length >= 2 && t.foulsCommitted / entries.length >= 1.5) bad.push(`Fouls are creeping up (${t.foulsCommitted} across ${entries.length} appearances) — timing the tackle rather than the lunge is worth reviewing.`);
    return {
      passPct,
      tacklePct,
      recoveriesPer90,
      longPassPct,
      statCards: [
        { label: "Pass %", value: passPct !== null ? `${passPct}%` : "-" },

      bad,

  cam(t, entries) {
    const gA = t.goals + t.assists;
    const keyPassesPer90 = t.minutesPlayed ? (t.keyPasses / (t.minutesPlayed / 90)).toFixed(1) : "0.0";
    const totalShots = t.shotsOnTarget + t.shotsOffTarget;
    const shotAccuracy = totalShots ? ((t.shotsOnTarget / totalShots) * 100).toFixed(0) : null;
    const dribbleTotal = t.dribblesCompleted + t.dribblesFailed;

    else if (Number(keyPassesPer90) < 1 && entries.length >= 3) bad.push(`Key passes per 90 is fairly low (${keyPassesPer90}) — look for more opportunities to unlock the defence.`);
    if (shotAccuracy !== null && Number(shotAccuracy) < 40 && totalShots >= 5) bad.push(`Only ${shotAccuracy}% of shots hit the target — shot selection and placement is worth working on.`);
    if (entries.length >= 2 && t.dispossessed / entries.length >= 2) bad.push(`Getting dispossessed fairly often in tight areas — an extra touch to shield the ball could help.`);
    if (dribblePct !== null && Number(dribblePct) >= 60 && dribbleTotal >= 5) good.push(`Completing ${dribblePct}% of dribbles — comfortable carrying the ball through midfield.`);
    return {
      goalContributions: gA,
      keyPassesPer90,
      shotAccuracy,
      dribblePct,
      statCards: [
        { label: "G+A", value: gA },
        { label: "Key Passes/90", value: keyPassesPer90 },

      good,
      bad,
    };
  },

  striker(t, entries) {
    const totalShots = t.shotsOnTarget + t.shotsOffTarget;
    const shotAccuracy = totalShots ? ((t.shotsOnTarget / totalShots) * 100).toFixed(0) : null;
    const conversionRate = totalShots ? ((t.goals / totalShots) * 100).toFixed(0) : null;
    const goalsPer90 = t.minutesPlayed ? (t.goals / (t.minutesPlayed / 90)).toFixed(2) : "0.00";
    const aerialTotal = t.aerialsWon + t.aerialsLost;
    const aerialPct = aerialTotal ? ((t.aerialsWon / aerialTotal) * 100).toFixed(0) : null;
    const good = [];
    const bad = [];
    if (conversionRate !== null && Number(conversionRate) >= 25) good.push(`Converting ${conversionRate}% of shots into goals — clinical finishing.`);
    else if (conversionRate !== null && Number(conversionRate) < 10 && totalShots >= 5) bad.push(`Only converting ${conversionRate}% of shots into goals — finishing under pressure is worth extra practice.`);
    if (shotAccuracy !== null && Number(shotAccuracy) < 40 && totalShots >= 5) bad.push(`Only ${shotAccuracy}% of shots hit the target — placement and technique is worth working on.`);
    if (Number(goalsPer90) >= 0.5) good.push(`Averaging ${goalsPer90} goals per 90 minutes — a genuine goal threat.`);
    if (aerialPct !== null && Number(aerialPct) >= 60 && aerialTotal >= 3) good.push(`Winning ${aerialPct}% of aerial duels — a real presence to hold up play.`);
    if (t.bigChancesMissed >= 3) bad.push(`${t.bigChancesMissed} big chances missed — composure in one-on-ones with the keeper is worth drilling.`);
    if (t.offsides >= 3) bad.push(`${t.offsides} offsides recorded — timing your runs behind the line needs work.`);
    return {
      shotAccuracy,
      conversionRate,
      goalsPer90,
      aerialPct,

        { label: "Goals", value: t.goals },
        { label: "Conversion", value: conversionRate !== null ? `${conversionRate}%` : "-" },

      good,
      bad,
    };

  winger(t, entries) {
    const gA = t.goals + t.assists;
    const dribbleTotal = t.dribblesCompleted + t.dribblesFailed;

    if (t.offsides >= 3) bad.push(`${t.offsides} offsides recorded — timing your runs in behind needs work.`);
    return {
      goalContributions: gA,
      dribblePct,
      crossPct,
      shotAccuracy,
      statCards: [
        { label: "G+A", value: gA },
        { label: "Dribble %", value: dribblePct !== null ? `${dribblePct}%` : "-" },

  },
};

function makeEmptyRugbyRoleEntry(roleKey) {
  const entry = { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), matchId: null };
  (RUGBY_ROLE_FIELDS[roleKey] || []).forEach((f) => {
    entry[f.key] = f.key === "minutesPlayed" ? 80 : 0;
  });
  return entry;
}

function sumRugbyRoleEntries(roleKey, entries) {
  const totals = {};
  (RUGBY_ROLE_FIELDS[roleKey] || []).forEach((f) => {
    totals[f.key] = 0;
  });
  entries.forEach((e) => {
    (RUGBY_ROLE_FIELDS[roleKey] || []).forEach((f) => {
      totals[f.key] += Number(e[f.key] || 0);
    });
  });
  return totals;
}

function analyseRugbyRole(roleKey, entries) {
  if (!roleKey || entries.length === 0) return null;
  const totals = sumRugbyRoleEntries(roleKey, entries);
  const derive = RUGBY_ROLE_DERIVE[roleKey];
  if (!derive) return null;
  return { totals, ...derive(totals, entries) };
}

function makeEmptyHockeyRoleEntry(roleKey) {
  const entry = { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), matchId: null };
  (HOCKEY_ROLE_FIELDS[roleKey] || []).forEach((f) => {
    entry[f.key] = f.key === "minutesPlayed" ? 70 : 0;
  });
  return entry;
}

function sumHockeyRoleEntries(roleKey, entries) {
  const totals = {};
  (HOCKEY_ROLE_FIELDS[roleKey] || []).forEach((f) => {
    totals[f.key] = 0;
  });
  entries.forEach((e) => {
    (HOCKEY_ROLE_FIELDS[roleKey] || []).forEach((f) => {
      totals[f.key] += Number(e[f.key] || 0);
    });
  });
  return totals;
}

function analyseHockeyRole(roleKey, entries) {
  if (!roleKey || entries.length === 0) return null;

  if (!derive) return null;
  return { totals, ...derive(totals, entries) };
}

function findCoachAnswer(query) {
  const q = query.toLowerCase();
  let best = null;
  let bestScore = 0;
  COACH_KB.forEach((entry) => {
    let score = 0;
    entry.keywords.forEach((k) => {
      if (q.includes(k)) score += k.split(" ").length;
    });
    if (score > bestScore) {
      bestScore = score;
      best = entry;
    }
  });
  if (best) return best.answer;
  return "I'm not sure about that one yet. Try asking about a specific stat (like \"what is strike rate\") or something like \"why is my analysis empty\" — or head to the Help page to message an admin directly.";
}

  const activeLabel = subPosition || position;
  const storageKey = activeLabel ? `football:${slugify(activeLabel)}` : null;

  useEffect(() => {
    async function loadShell() {
      try {
        const pos = await window.storage.get("football:position");
        if (pos) setPosition(pos.value);
        const subPos = await window.storage.get("football:subPosition");
        if (subPos && subPos.value) setSubPosition(subPos.value);
        const m = await window.storage.get("football:matches");
        if (m) setMatches(JSON.parse(m.value));
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    loadShell();
  }, []);

  useEffect(() => {
    let cancelled = false;
    async function loadRole() {
      if (!storageKey || !roleKey) return;
      setRoleLoaded(false);
      try {
        const res = await window.storage.get(storageKey);
        if (!cancelled) setEntries(res ? JSON.parse(res.value) : []);
      } catch (e) {
        if (!cancelled) setEntries([]);
      }
      if (!cancelled) {
        setDraft(makeEmptyRoleEntry(roleKey));
        setRoleLoaded(true);
      }
    }
    loadRole();
    return () => {
      cancelled = true;
    };
  }, [storageKey, roleKey]);

  async function persist(key, data) {
    try {
      await window.storage.set(key, JSON.stringify(data));
    } catch (e) {
      // best effort
    }
  }

  function choosePosition(p) {
    setPosition(p);
    setSubPosition(null);
    window.storage.set("football:position", p).catch(() => {});
    window.storage.set("football:subPosition", "").catch(() => {});
  }

  function chooseSubPosition(sp) {
    setSubPosition(sp);
    window.storage.set("football:subPosition", sp).catch(() => {});
  }

  function changePosition() {
    setPosition(null);
    setSubPosition(null);
    window.storage.set("football:position", "").catch(() => {});
    window.storage.set("football:subPosition", "").catch(() => {});
  }

  function createMatch() {
    if (!newOpponent.trim()) return;
    const m = { ...emptyFbMatch(), opponent: newOpponent.trim() };
    const next = [...matches, m];
    setMatches(next);
    persist("football:matches", next);
    setSelectedMatchId(m.id);
    setNewOpponent("");
  }

  function updateMatchResult(id, result) {
    const next = matches.map((m) => (m.id === id ? { ...m, result } : m));
    setMatches(next);
    persist("football:matches", next);
  }

  function matchLabel(m) {
    return `${m.opponent || "Unnamed"} — ${m.result}`;
  }

  function saveEntry() {
    if (!draft || !storageKey || !roleKey) return;
    const next = [...entries, { ...draft, matchId: selectedMatchId }];
    setEntries(next);
    persist(storageKey, next);
    setDraft(makeEmptyRoleEntry(roleKey));
  }

  function removeEntry(id) {
    const next = entries.filter((e) => e.id !== id);
    setEntries(next);
    persist(storageKey, next);
  }

  const storageKey = activeLabel ? `rugby:${slugify(activeLabel)}` : null;

  useEffect(() => {
    async function loadShell() {
      try {
        const pos = await window.storage.get("rugby:position");

        const m = await window.storage.get("rugby:matches");

        // no existing data yet
      }
      setLoaded(true);
    }
    loadShell();
  }, []);

                <option value="">No match selected</option>
                {matches.map((m) => (
                  <option key={m.id} value={m.id}>
                    {matchLabel(m)}
                  </option>
                ))}
              </select>
              {selectedMatchId && (
                <label className="field" style={{ marginTop: 10, maxWidth: 220 }}>
                  <span>Result</span>
                  <select
                    value={matches.find((m) => m.id === selectedMatchId)?.result || "In Progress"}
                    onChange={(e) => updateMatchResult(selectedMatchId, e.target.value)}
                  >
                    {RESULTS.map((r) => (
                      <option key={r} value={r}>
                        {r}
                      </option>
                    ))}
                  </select>
                </label>
              )}
              <div className="new-match-row">
                <input type="text" placeholder="New opponent name" value={newOpponent} onChange={(e) => setNewOpponent(e.target.value)} />
                <button type="button" onClick={createMatch}>
                  Start New Match
                </button>
              </div>
            </div>

            <div className="card">
              <h2>New {meta.cardLabel} Entry</h2>
              <div className="grid">
                {HOCKEY_ROLE_FIELDS[roleKey].map((f) => (
                  <NumberField key={f.key} label={f.label} value={draft[f.key]} onChange={(v) => setDraft({ ...draft, [f.key]: v })} />
                ))}
              </div>
              <button className="save-btn" onClick={saveEntry}>
                Save Entry
              </button>
              {entries.length > 0 && (
                <div className="entry-list">
                  <h3>Logged entries ({entries.length})</h3>
                  {entries.map((e) => (
                    <div className="entry-row" key={e.id}>
                      <span>{meta.summary(e)}</span>
                      <button onClick={() => removeEntry(e.id)}>Remove</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </section>
        )}

        {tab === "analysis" && (
          <section>
            {!analysis && <div className="empty">Log some stats first — analysis appears here once you have data.</div>}
            {analysis && (
              <div className="card">
                <h2>{activeLabel} Analysis</h2>
                <div className="stat-row">
                  {analysis.statCards.map((s, i) => (
                    <Stat key={i} label={s.label} value={s.value} />
                  ))}
                </div>
                <div className="verdict">
                  {analysis.good.length > 0 && (
                    <div className="good">
                      <h4>What's going well</h4>
                      <ul>
                        {analysis.good.map((g, i) => (
                          <li key={i}>{g}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {analysis.bad.length > 0 && (
                    <div className="bad">
                      <h4>What to work on</h4>
                      <ul>
                        {analysis.bad.map((b, i) => (
                          <li key={i}>{b}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </div>
            )}
          </section>
        )}

        {tab === "tips" && (
          <section>
            {activeTips.length === 0 && <div className="empty">No specific drills flagged yet — log a few entries so the analysis can spot patterns.</div>}
            {activeTips.map((tip, i) => (
              <div className="card" key={i}>
                <h2>{tip.title}</h2>
                <ul className="drills">
                  {tip.drills.map((d, j) => (
                    <li key={j}>{d}</li>
                  ))}
                </ul>
              </div>
            ))}
          </section>
        )}
      </main>
    </div>
  );
}


// ---------- Golf ----------
const DEFAULT_CLUBS = [
  "Driver",
  "3 Wood",
  "5 Wood",
  "4 Iron",
  "5 Iron",
  "6 Iron",
  "7 Iron",
  "8 Iron",
  "9 Iron",
  "Pitching Wedge",
  "Sand Wedge",
  "Putter",
];

function emptyGolfRound() {
  return {
    id: Date.now() + Math.random(),
    date: new Date().toISOString().slice(0, 10),
    course: "",
    score: 72,
    par: 72,
    holes: 18,
    totalFairways: 18,
    fairwaysHitFirstTry: 0,
    fairwaysAttempts: 0,
    totalGreens: 18,
    greensHitFirstTry: 0,
    greensAttempts: 0,
    bunkersEntered: 0,
    bunkerAttempts: 0,
  };
}

function analyseGolf(rounds, clubEntries) {
  if (rounds.length === 0 && clubEntries.length === 0) return null;

  const totalFairwaysAvailable = rounds.reduce((s, r) => s + Number(r.totalFairways || 0), 0);
  const totalFairwaysHit = rounds.reduce((s, r) => s + Number(r.fairwaysHitFirstTry || 0), 0);
  const fairwayPct = totalFairwaysAvailable ? ((totalFairwaysHit / totalFairwaysAvailable) * 100).toFixed(0) : null;
  const totalFairwayMissAttempts = rounds.reduce((s, r) => s + Number(r.fairwaysAttempts || 0), 0);
  const missedFairways = totalFairwaysAvailable - totalFairwaysHit;
  const avgFairwayRecovery = missedFairways > 0 ? (totalFairwayMissAttempts / missedFairways).toFixed(1) : null;

  const totalGreensAvailable = rounds.reduce((s, r) => s + Number(r.totalGreens || 0), 0);
  const totalGreensHit = rounds.reduce((s, r) => s + Number(r.greensHitFirstTry || 0), 0);
  const greenPct = totalGreensAvailable ? ((totalGreensHit / totalGreensAvailable) * 100).toFixed(0) : null;
  const totalGreenMissAttempts = rounds.reduce((s, r) => s + Number(r.greensAttempts || 0), 0);
  const missedGreens = totalGreensAvailable - totalGreensHit;
  const avgGreenRecovery = missedGreens > 0 ? (totalGreenMissAttempts / missedGreens).toFixed(1) : null;

  const totalBunkers = rounds.reduce((s, r) => s + Number(r.bunkersEntered || 0), 0);
  const totalBunkerAttempts = rounds.reduce((s, r) => s + Number(r.bunkerAttempts || 0), 0);
  const avgBunkerAttempts = totalBunkers ? (totalBunkerAttempts / totalBunkers).toFixed(1) : null;

  const scoredRounds = rounds.filter((r) => r.score);
  const avgScoreToPar =
    scoredRounds.length > 0
      ? (scoredRounds.reduce((s, r) => s + (Number(r.score) - Number(r.par || 0)), 0) / scoredRounds.length).toFixed(1)
      : null;
  const bestRound =
    scoredRounds.length > 0
      ? scoredRounds.reduce((best, r) => (Number(r.score) - Number(r.par || 0) < Number(best.score) - Number(best.par || 0) ? r : best))
      : null;

  const clubTrends = DEFAULT_CLUBS.map((club) => {
    const logs = clubEntries.filter((e) => e.club === club).sort((a, b) => new Date(a.date) - new Date(b.date));
    if (logs.length === 0) return null;
    const latest = logs[logs.length - 1];
    let trend = null;
    if (logs.length >= 2) {
      const prev = logs[logs.length - 2];
      trend = latest.distance > prev.distance ? "up" : latest.distance < prev.distance ? "down" : "same";
    }
    return { club, distance: latest.distance, trend };
  }).filter(Boolean);

  const good = [];
  const bad = [];
  if (fairwayPct !== null) {
    if (Number(fairwayPct) >= 60) good.push(`Hitting ${fairwayPct}% of fairways — reliable off the tee.`);
    else if (Number(fairwayPct) < 40) bad.push(`Only hitting ${fairwayPct}% of fairways — tee shot accuracy is worth working on.`);
  }
  if (avgFairwayRecovery !== null && Number(avgFairwayRecovery) >= 2) {
    bad.push(`Taking ${avgFairwayRecovery} shots on average to find the missed fairways — course management off the tee is worth reviewing.`);
  }
  if (greenPct !== null) {
    if (Number(greenPct) >= 50) good.push(`Hitting ${greenPct}% of greens in regulation — solid approach play.`);
    else if (Number(greenPct) < 30) bad.push(`Only hitting ${greenPct}% of greens in regulation — approach shot distance control is worth working on.`);
  }
  if (avgGreenRecovery !== null && Number(avgGreenRecovery) >= 2) {
    bad.push(`Taking ${avgGreenRecovery} shots on average to find the missed greens — short game around the green is worth extra practice.`);
  }
  if (avgBunkerAttempts !== null) {
    if (Number(avgBunkerAttempts) <= 1.3) good.push(`Averaging ${avgBunkerAttempts} shots to escape bunkers — strong sand play.`);
    else if (Number(avgBunkerAttempts) >= 2) bad.push(`Averaging ${avgBunkerAttempts} shots to escape bunkers — worth extra bunker practice.`);
  }
  if (avgScoreToPar !== null) {
    const label = Number(avgScoreToPar) > 0 ? `+${avgScoreToPar}` : avgScoreToPar;
    if (Number(avgScoreToPar) <= 5) good.push(`Averaging ${label} to par across ${scoredRounds.length} round${scoredRounds.length > 1 ? "s" : ""} — scoring well overall.`);
    else if (Number(avgScoreToPar) >= 15) bad.push(`Averaging ${label} to par — bringing the overall score down is the big lever right now.`);
    if (bestRound) {
      const bestLabel = Number(bestRound.score) - Number(bestRound.par || 0) > 0 ? `+${Number(bestRound.score) - Number(bestRound.par || 0)}` : Number(bestRound.score) - Number(bestRound.par || 0);
      good.push(`Best round so far: ${bestRound.score} (${bestLabel}) at ${bestRound.course || "an unnamed course"}.`);
    }
  }
  clubTrends.forEach((c) => {
    if (c.trend === "up") good.push(`${c.club} distance is trending up — now averaging ${c.distance}.`);
    else if (c.trend === "down") bad.push(`${c.club} distance has dropped to an average of ${c.distance} — worth reviewing technique or tempo.`);
  });

  return {
    fairwayPct,
    avgFairwayRecovery,
    greenPct,
    avgGreenRecovery,
    avgBunkerAttempts,
    avgScoreToPar,
    clubTrends,
    statCards: [
      { label: "Avg. Score to Par", value: avgScoreToPar !== null ? (Number(avgScoreToPar) > 0 ? `+${avgScoreToPar}` : avgScoreToPar) : "-" },
      { label: "Fairways Hit", value: fairwayPct !== null ? `${fairwayPct}%` : "-" },
      { label: "Greens in Reg.", value: greenPct !== null ? `${greenPct}%` : "-" },
      { label: "Avg. Bunker Attempts", value: avgBunkerAttempts !== null ? avgBunkerAttempts : "-" },
      { label: "Rounds Logged", value: rounds.length },
    ],
    good,
    bad,
  };
}

function GolfApp({ onBack }) {
  const [tab, setTab] = useState("track");

  const [clubEntries, setClubEntries] = useState([]);
  const [draftRound, setDraftRound] = useState(emptyGolfRound());
  const [draftClub, setDraftClub] = useState({ club: DEFAULT_CLUBS[0], distance: 0 });
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    async function loadAll() {
      try {
        const r = await window.storage.get("golf:rounds");
        if (r) setRounds(JSON.parse(r.value));
        const c = await window.storage.get("golf:clubs");
        if (c) setClubEntries(JSON.parse(c.value));
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    loadAll();
  }, []);

  async function persist(key, data) {
    try {
      await window.storage.set(key, JSON.stringify(data));
    } catch (e) {
      // best effort
    }
  }

  function saveRound() {
    const next = [...rounds, { ...draftRound, id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10) }];
    setRounds(next);
    persist("golf:rounds", next);
    setDraftRound(emptyGolfRound());
  }

  function removeRound(id) {
    const next = rounds.filter((r) => r.id !== id);
    setRounds(next);
    persist("golf:rounds", next);
  }

  function saveClub() {
    const next = [...clubEntries, { ...draftClub, id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10) }];
    setClubEntries(next);
    persist("golf:clubs", next);
    setDraftClub({ club: draftClub.club, distance: 0 });
  }

  function removeClub(id) {
    const next = clubEntries.filter((c) => c.id !== id);
    setClubEntries(next);
    persist("golf:clubs", next);
  }

  const analysis = useMemo(() => analyseGolf(rounds, clubEntries), [rounds, clubEntries]);
  const activeTips = analysis ? GOLF_TIPS.filter((t) => t.match(analysis)) : [];

          Loading…

        </button>

        </button>
      </nav>

      <main className="main">
        {tab === "track" && (
          <section>
            <div className="card">
              <h2>New Round</h2>
              <label className="field">
                <span>Course (optional)</span>
                <input type="text" value={draftRound.course} onChange={(e) => setDraftRound({ ...draftRound, course: e.target.value })} />
              </label>

              <h3 style={{ marginTop: 16 }}>Score</h3>
              <div className="grid">
                <NumberField label="Your score" value={draftRound.score} onChange={(v) => setDraftRound({ ...draftRound, score: v })} />
                <NumberField label="Par" value={draftRound.par} onChange={(v) => setDraftRound({ ...draftRound, par: v })} />
                <NumberField label="Holes played" value={draftRound.holes} onChange={(v) => setDraftRound({ ...draftRound, holes: v })} />
              </div>

              <h3 style={{ marginTop: 16 }}>Fairways</h3>
              <div className="grid">
                <NumberField

                  onChange={(v) => setDraftRound({ ...draftRound, fairwaysHitFirstTry: v })}
                />
                <NumberField
                  label="Out of (total fairways)"

                  onChange={(v) => setDraftRound({ ...draftRound, totalFairways: v })}
                />
                <NumberField
                  label="Attempts needed on the rest"
                  value={draftRound.fairwaysAttempts}
                  onChange={(v) => setDraftRound({ ...draftRound, fairwaysAttempts: v })}
                />
              </div>

              <h3 style={{ marginTop: 16 }}>Greens</h3>
              <div className="grid">
                <NumberField
                  label="Hit first try"
                  value={draftRound.greensHitFirstTry}
                  onChange={(v) => setDraftRound({ ...draftRound, greensHitFirstTry: v })}
                />
                <NumberField
                  label="Out of (total greens)"
                  value={draftRound.totalGreens}
                  onChange={(v) => setDraftRound({ ...draftRound, totalGreens: v })}
                />
                <NumberField
                  label="Attempts needed on the rest"

              </div>

              <h3 style={{ marginTop: 16 }}>Sand</h3>

                      </span>

        {tab === "clubs" && (

              <div className="grid">

                  <span>Club</span>
                  <select value={draftClub.club} onChange={(e) => setDraftClub({ ...draftClub, club: e.target.value })}>
                    {DEFAULT_CLUBS.map((c) => (
                      <option key={c} value={c}>
                        {c}
                      </option>
                    ))}
                  </select>
                </label>
                <NumberField label="Average distance" value={draftClub.distance} onChange={(v) => setDraftClub({ ...draftClub, distance: v })} />
              </div>
              <button className="save-btn" onClick={saveClub}>
                Save Distance
              </button>

              {clubEntries.length > 0 && (
                <div className="entry-list">
                  <h3>Logged distances ({clubEntries.length})</h3>
                  {[...clubEntries].reverse().map((c) => {
                    const clubHistory = clubEntries.filter((e) => e.club === c.club).sort((a, b) => new Date(a.date) - new Date(b.date));
                    const idx = clubHistory.findIndex((e) => e.id === c.id);
                    let trendLabel = "First log";
                    if (idx > 0) {
                      const prev = clubHistory[idx - 1];
                      if (c.distance > prev.distance) trendLabel = "Improved ▲";
                      else if (c.distance < prev.distance) trendLabel = "Down ▼";
                      else trendLabel = "Same";
                    }
                    return (
                      <div className="entry-row" key={c.id}>
                        <span>
                          {c.club}: {c.distance} ({c.date}) — {trendLabel}
                        </span>
                        <button onClick={() => removeClub(c.id)}>Remove</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>
        )}

        {tab === "analysis" && (
          <section>
            {!analysis && <div className="empty">Log a round or a club distance first — analysis appears here once you have data.</div>}
            {analysis && (
              <div className="card">
                <h2>Golf Analysis</h2>
                <div className="stat-row">
                  {analysis.statCards.map((s, i) => (
                    <Stat key={i} label={s.label} value={s.value} />
                  ))}
                </div>
                {analysis.clubTrends.length > 0 && (
                  <div style={{ marginTop: 16 }}>
                    <h3>Club Distances</h3>
                    <div className="stat-row">
                      {analysis.clubTrends.map((c, i) => (
                        <Stat key={i} label={c.club} value={`${c.distance}${c.trend === "up" ? " ▲" : c.trend === "down" ? " ▼" : ""}`} />
                      ))}
                    </div>
                  </div>
                )}
                <div className="verdict">
                  {analysis.good.length > 0 && (
                    <div className="good">
                      <h4>What's going well</h4>
                      <ul>
                        {analysis.good.map((g, i) => (
                          <li key={i}>{g}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {analysis.bad.length > 0 && (
                    <div className="bad">
                      <h4>What to work on</h4>
                      <ul>
                        {analysis.bad.map((b, i) => (
                          <li key={i}>{b}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </div>
            )}
          </section>
        )}

        {tab === "tips" && (
          <section>
            {activeTips.length === 0 && <div className="empty">No specific drills flagged yet — log a few rounds so the analysis can spot patterns.</div>}
            {activeTips.map((tip, i) => (
              <div className="card" key={i}>
                <h2>{tip.title}</h2>
                <ul className="drills">
                  {tip.drills.map((d, j) => (
                    <li key={j}>{d}</li>
                  ))}
                </ul>
              </div>
            ))}
          </section>
        )}
      </main>
    </div>
  );
}

// ---------- Tennis ----------
function emptyTennisMatch() {
  return {
    id: Date.now() + Math.random(),
    date: new Date().toISOString().slice(0, 10),
    opponent: "",
    result: "In Progress",
    setsWon: 0,
    setsLost: 0,

    firstServesIn: 0,
    firstServesAttempted: 0,
    firstServePointsWon: 0,
    firstServePointsPlayed: 0,
    secondServePointsWon: 0,
    secondServePointsPlayed: 0,
    aces: 0,
    doubleFaults: 0,
    breakPointsFaced: 0,
    breakPointsSaved: 0,

    returnPointsWon: 0,
    returnPointsPlayed: 0,
    breakPointsPlayedReturn: 0,
    breakPointsWonReturn: 0,

    forehandWinners: 0,
    forehandErrors: 0,
    backhandWinners: 0,
    backhandErrors: 0,
    netPointsWon: 0,
    netPointsPlayed: 0,

    pointsWonOnWinner: 0,
    pointsWonOnOpponentError: 0,
    pointsLostOnError: 0,
    pointsLostOnOpponentWinner: 0,
  };
}

function sumTennis(matches, key) {
  return matches.reduce((s, m) => s + Number(m[key] || 0), 0);
}

function analyseTennis(matches) {
  if (matches.length === 0) return null;

  const firstServesAttempted = sumTennis(matches, "firstServesAttempted");
  const firstServesIn = sumTennis(matches, "firstServesIn");
  const firstServePct = firstServesAttempted ? ((firstServesIn / firstServesAttempted) * 100).toFixed(0) : null;

  const firstServePointsPlayed = sumTennis(matches, "firstServePointsPlayed");
  const firstServePointsWon = sumTennis(matches, "firstServePointsWon");
  const firstServeWinPct = firstServePointsPlayed ? ((firstServePointsWon / firstServePointsPlayed) * 100).toFixed(0) : null;

  const secondServePointsPlayed = sumTennis(matches, "secondServePointsPlayed");
  const secondServePointsWon = sumTennis(matches, "secondServePointsWon");
  const secondServeWinPct = secondServePointsPlayed ? ((secondServePointsWon / secondServePointsPlayed) * 100).toFixed(0) : null;

  const breakPointsFaced = sumTennis(matches, "breakPointsFaced");
  const breakPointsSaved = sumTennis(matches, "breakPointsSaved");
  const breakPointsSavedPct = breakPointsFaced ? ((breakPointsSaved / breakPointsFaced) * 100).toFixed(0) : null;

  const returnPointsPlayed = sumTennis(matches, "returnPointsPlayed");
  const returnPointsWon = sumTennis(matches, "returnPointsWon");
  const returnPointsWonPct = returnPointsPlayed ? ((returnPointsWon / returnPointsPlayed) * 100).toFixed(0) : null;

  const breakPointsPlayedReturn = sumTennis(matches, "breakPointsPlayedReturn");
  const breakPointsWonReturn = sumTennis(matches, "breakPointsWonReturn");
  const breakPointsConvertedPct = breakPointsPlayedReturn ? ((breakPointsWonReturn / breakPointsPlayedReturn) * 100).toFixed(0) : null;

  const netPointsPlayed = sumTennis(matches, "netPointsPlayed");
  const netPointsWon = sumTennis(matches, "netPointsWon");
  const netPointsWonPct = netPointsPlayed ? ((netPointsWon / netPointsPlayed) * 100).toFixed(0) : null;

  const forehandWinners = sumTennis(matches, "forehandWinners");
  const forehandErrors = sumTennis(matches, "forehandErrors");
  const backhandWinners = sumTennis(matches, "backhandWinners");
  const backhandErrors = sumTennis(matches, "backhandErrors");
  const winnersTotal = forehandWinners + backhandWinners;
  const errorsTotal = forehandErrors + backhandErrors;
  const winnerErrorRatio = errorsTotal ? (winnersTotal / errorsTotal).toFixed(2) : null;
  const forehandNet = forehandWinners - forehandErrors;
  const backhandNet = backhandWinners - backhandErrors;

  const aces = sumTennis(matches, "aces");
  const doubleFaults = sumTennis(matches, "doubleFaults");
  const acesPerMatch = (aces / matches.length).toFixed(1);
  const doubleFaultsPerMatch = (doubleFaults / matches.length).toFixed(1);

  const pointsWonOnWinner = sumTennis(matches, "pointsWonOnWinner");
  const pointsWonOnOpponentError = sumTennis(matches, "pointsWonOnOpponentError");
  const totalPointsWon = pointsWonOnWinner + pointsWonOnOpponentError;
  const pctWonViaWinner = totalPointsWon ? ((pointsWonOnWinner / totalPointsWon) * 100).toFixed(0) : null;

  const pointsLostOnError = sumTennis(matches, "pointsLostOnError");
  const pointsLostOnOpponentWinner = sumTennis(matches, "pointsLostOnOpponentWinner");
  const totalPointsLost = pointsLostOnError + pointsLostOnOpponentWinner;
  const pctLostViaOwnError = totalPointsLost ? ((pointsLostOnError / totalPointsLost) * 100).toFixed(0) : null;
  const pctLostViaOppWinner = totalPointsLost ? ((pointsLostOnOpponentWinner / totalPointsLost) * 100).toFixed(0) : null;

  const good = [];
  const bad = [];

  if (firstServePct !== null) {
    if (Number(firstServePct) >= 65) good.push(`First serve percentage of ${firstServePct}% — getting plenty of free swings on your first ball.`);
    else if (Number(firstServePct) < 50) bad.push(`First serve percentage is only ${firstServePct}% — a small toss/rhythm tweak could get more first serves in.`);
  }
  if (firstServeWinPct !== null) {
    if (Number(firstServeWinPct) >= 75) good.push(`Winning ${firstServeWinPct}% of first-serve points — dominant when the first ball lands.`);
    else if (Number(firstServeWinPct) < 60) bad.push(`Only winning ${firstServeWinPct}% of first-serve points — worth adding more placement/depth rather than just pace.`);
  }
  if (secondServeWinPct !== null && Number(secondServeWinPct) < 45 && secondServePointsPlayed >= 5) {
    bad.push(`Winning just ${secondServeWinPct}% of second-serve points — this is where opponents are targeting you.`);
  }
  if (Number(doubleFaultsPerMatch) >= 4) bad.push(`Averaging ${doubleFaultsPerMatch} double faults per match — costing free points on your own serve.`);
  if (breakPointsSavedPct !== null) {
    if (Number(breakPointsSavedPct) >= 60 && breakPointsFaced >= 3) good.push(`Saving ${breakPointsSavedPct}% of break points faced — composed under pressure on serve.`);
    else if (Number(breakPointsSavedPct) < 40 && breakPointsFaced >= 3) bad.push(`Only saving ${breakPointsSavedPct}% of break points faced — worth a specific game plan for pressure points.`);
  }
  if (breakPointsConvertedPct !== null && Number(breakPointsConvertedPct) >= 45 && breakPointsPlayedReturn >= 3) {
    good.push(`Converting ${breakPointsConvertedPct}% of break points on return — clinical when the opportunity is there.`);
  }
  if (returnPointsWonPct !== null && Number(returnPointsWonPct) >= 40) good.push(`Winning ${returnPointsWonPct}% of return points — a genuine threat on the opponent's serve.`);
  if (netPointsWonPct !== null && Number(netPointsWonPct) >= 65 && netPointsPlayed >= 5) good.push(`Winning ${netPointsWonPct}% of net points — coming forward is paying off.`);
  if (winnerErrorRatio !== null) {
    if (Number(winnerErrorRatio) >= 1.2) good.push(`Winner-to-error ratio of ${winnerErrorRatio} — your shot-making is outweighing the risk.`);
    else if (Number(winnerErrorRatio) < 0.7 && errorsTotal >= 5) bad.push(`Winner-to-error ratio is only ${winnerErrorRatio} — dialling back risk on lower-percentage shots could help.`);
  }
  if (forehandErrors + backhandErrors >= 6) {
    if (backhandNet < forehandNet - 3) bad.push(`Backhand is netting ${backhandNet >= 0 ? "+" : ""}${backhandNet} (winners minus errors) versus ${forehandNet >= 0 ? "+" : ""}${forehandNet} on the forehand — the backhand side looks like the bigger opportunity to shore up.`);
    else if (forehandNet < backhandNet - 3) bad.push(`Forehand is netting ${forehandNet >= 0 ? "+" : ""}${forehandNet} (winners minus errors) versus ${backhandNet >= 0 ? "+" : ""}${backhandNet} on the backhand — the forehand side looks like the bigger opportunity to shore up.`);
  }
  if (pctLostViaOwnError !== null && Number(pctLostViaOwnError) >= 60 && totalPointsLost >= 5) {
    bad.push(`${pctLostViaOwnError}% of lost points come from your own errors rather than the opponent's good shots — consistency is the fastest lever to pull.`);
  } else if (pctLostViaOppWinner !== null && Number(pctLostViaOppWinner) >= 60 && totalPointsLost >= 5) {
    good.push(`${pctLostViaOppWinner}% of lost points come from the opponent's good shots rather than your own errors — your execution isn't the problem on those points.`);
  }

  return {
    firstServePct,
    firstServeWinPct,
    secondServeWinPct,
    secondServePointsPlayed,
    breakPointsSavedPct,
    breakPointsFaced,
    breakPointsConvertedPct,
    breakPointsPlayedReturn,
    returnPointsWonPct,
    netPointsWonPct,
    netPointsPlayed,
    winnerErrorRatio,
    errorsTotal,
    forehandNet,
    backhandNet,
    forehandErrors,
    backhandErrors,
    doubleFaultsPerMatch,
    acesPerMatch,
    pctWonViaWinner,
    pctLostViaOwnError,
    pctLostViaOppWinner,
    totalPointsLost,
    statCards: [
      { label: "1st Serve %", value: firstServePct !== null ? `${firstServePct}%` : "-" },
      { label: "1st Serve Win %", value: firstServeWinPct !== null ? `${firstServeWinPct}%` : "-" },
      { label: "2nd Serve Win %", value: secondServeWinPct !== null ? `${secondServeWinPct}%` : "-" },
      { label: "Break Pts Saved", value: breakPointsSavedPct !== null ? `${breakPointsSavedPct}%` : "-" },
      { label: "Return Pts Won", value: returnPointsWonPct !== null ? `${returnPointsWonPct}%` : "-" },
      { label: "Winner:Error", value: winnerErrorRatio !== null ? winnerErrorRatio : "-" },
      { label: "Aces/Match", value: acesPerMatch },
      { label: "Double Faults/Match", value: doubleFaultsPerMatch },
    ],
    good,
    bad,
  };
}

const TENNIS_TIPS = [
  {

function TennisApp({ onBack }) {
  const [tab, setTab] = useState("track");
  const [matches, setMatches] = useState([]);
  const [draft, setDraft] = useState(emptyTennisMatch());
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    async function loadAll() {
      try {
        const m = await window.storage.get("tennis:matches");
        if (m) setMatches(JSON.parse(m.value));
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    loadAll();
  }, []);

  async function persist(data) {
    try {
      await window.storage.set("tennis:matches", JSON.stringify(data));
    } catch (e) {
      // best effort
    }
  }

  function saveMatch() {
    const next = [...matches, { ...draft, id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10) }];
    setMatches(next);
    persist(next);
    setDraft(emptyTennisMatch());
  }

  function removeMatch(id) {
    const next = matches.filter((m) => m.id !== id);
    setMatches(next);
    persist(next);
  }

  const analysis = useMemo(() => analyseTennis(matches), [matches]);
  const activeTips = analysis ? TENNIS_TIPS.filter((t) => t.match(analysis)) : [];

  if (!loaded) {
    return (
      <div className="app">
        <p className="hint" style={{ padding: 20 }}>
          Loading…
        </p>
      </div>
    );
  }

  return (
    <div className="app">
      <header className="header">
        <div className="header-inner">
          <button className="back-btn" onClick={onBack}>
            ← Sports
          </button>
          <div className="crest">TN</div>
          <div>
            <h1>Tennis</h1>
            <p className="tagline">Every point tells a story.</p>
          </div>
        </div>
      </header>

      <nav className="tabs">
        <button className={tab === "track" ? "active" : ""} onClick={() => setTab("track")}>
          Log a Match
        </button>
        <button className={tab === "analysis" ? "active" : ""} onClick={() => setTab("analysis")}>
          Analysis
        </button>
        <button className={tab === "tips" ? "active" : ""} onClick={() => setTab("tips")}>
          Drills &amp; Tips
        </button>
      </nav>

      <main className="main">
        {tab === "track" && (
          <section>
            <div className="card">
              <h2>New Match</h2>
              <label className="field">
                <span>Opponent (optional)</span>
                <input type="text" value={draft.opponent} onChange={(e) => setDraft({ ...draft, opponent: e.target.value })} />
              </label>
              <div className="grid">
                <label className="field">
                  <span>Result</span>
                  <select value={draft.result} onChange={(e) => setDraft({ ...draft, result: e.target.value })}>
                    {RESULTS.map((r) => (
                      <option key={r} value={r}>
                        {r}
                      </option>
                    ))}
                  </select>
                </label>
                <NumberField label="Sets won" value={draft.setsWon} onChange={(v) => setDraft({ ...draft, setsWon: v })} />
                <NumberField label="Sets lost" value={draft.setsLost} onChange={(v) => setDraft({ ...draft, setsLost: v })} />
              </div>

              <h3 style={{ marginTop: 16 }}>Serving</h3>
              <div className="grid">
                <NumberField label="First serves in" value={draft.firstServesIn} onChange={(v) => setDraft({ ...draft, firstServesIn: v })} />
                <NumberField label="First serves attempted" value={draft.firstServesAttempted} onChange={(v) => setDraft({ ...draft, firstServesAttempted: v })} />
                <NumberField label="First serve points won" value={draft.firstServePointsWon} onChange={(v) => setDraft({ ...draft, firstServePointsWon: v })} />
                <NumberField label="First serve points played" value={draft.firstServePointsPlayed} onChange={(v) => setDraft({ ...draft, firstServePointsPlayed: v })} />
                <NumberField label="Second serve points won" value={draft.secondServePointsWon} onChange={(v) => setDraft({ ...draft, secondServePointsWon: v })} />
                <NumberField label="Second serve points played" value={draft.secondServePointsPlayed} onChange={(v) => setDraft({ ...draft, secondServePointsPlayed: v })} />
                <NumberField label="Aces" value={draft.aces} onChange={(v) => setDraft({ ...draft, aces: v })} />
                <NumberField label="Double faults" value={draft.doubleFaults} onChange={(v) => setDraft({ ...draft, doubleFaults: v })} />
                <NumberField label="Break points faced" value={draft.breakPointsFaced} onChange={(v) => setDraft({ ...draft, breakPointsFaced: v })} />
