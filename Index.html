              </div>

              <h3 style={{ marginTop: 16 }}>How Points Were Won &amp; Lost</h3>
              <div className="grid">
                <NumberField label="Points won on your winner" value={draft.pointsWonOnWinner} onChange={(v) => setDraft({ ...draft, pointsWonOnWinner: v })} />
                <NumberField label="Points won on their error" value={draft.pointsWonOnOpponentError} onChange={(v) => setDraft({ ...draft, pointsWonOnOpponentError: v })} />
                <NumberField label="Points lost on your error" value={draft.pointsLostOnError} onChange={(v) => setDraft({ ...draft, pointsLostOnError: v })} />
                <NumberField label="Points lost on their winner" value={draft.pointsLostOnOpponentWinner} onChange={(v) => setDraft({ ...draft, pointsLostOnOpponentWinner: v })} />
              </div>

              <button className="save-btn" onClick={saveMatch}>
                Save Match
              </button>

              {matches.length > 0 && (
                <div className="entry-list">
                  <h3>Logged matches ({matches.length})</h3>
                  {matches.map((m) => (
                    <div className="entry-row" key={m.id}>
                      <span>
                        {m.opponent ? `${m.opponent} — ` : ""}
                        {m.result} ({m.setsWon}-{m.setsLost} sets), {m.aces} aces, {m.doubleFaults} DFs
                      </span>
                      <button onClick={() => removeMatch(m.id)}>Remove</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </section>
        )}

        {tab === "analysis" && (
          <section>
            {!analysis && <div className="empty">Log a match first — analysis appears here once you have data.</div>}
            {analysis && (
              <div className="card">
                <h2>Tennis Analysis</h2>
                <div className="stat-row">
                  {analysis.statCards.map((s, i) => (
                    <Stat key={i} label={s.label} value={s.value} />

                <div className="verdict">
                  {analysis.good.length > 0 && (

            {activeTips.map((tip, i) => (
              <div className="card" key={i}>

      </main>
    </div>
  );
}

// ---------- Gym ----------
const MUSCLE_GROUPS = ["Chest", "Back", "Shoulders", "Arms", "Legs", "Core"];

const MUSCLES_BY_GROUP = {
  Chest: ["Upper Chest", "Mid Chest", "Lower Chest"],
  Back: ["Lats", "Upper Back", "Lower Back"],
  Shoulders: ["Front Delts", "Side Delts", "Rear Delts"],
  Arms: ["Biceps", "Triceps", "Forearms"],
  Legs: ["Quads", "Hamstrings", "Glutes", "Calves"],
  Core: ["Abs", "Obliques"],
};

const EXERCISES_BY_MUSCLE = {
  "Upper Chest": ["Incline Barbell Press", "Incline Dumbbell Press", "Incline Cable Fly"],
  "Mid Chest": ["Flat Barbell Bench Press", "Flat Dumbbell Press", "Push Ups"],
  "Lower Chest": ["Decline Bench Press", "Dips", "Low-to-High Cable Crossover"],
  Lats: ["Pull Ups", "Lat Pulldown", "Barbell Row", "Seated Cable Row"],
  "Upper Back": ["Barbell Shrugs", "Face Pulls", "Rear Delt Row"],
  "Lower Back": ["Deadlift", "Back Extension", "Good Morning"],
  "Front Delts": ["Overhead Press", "Arnold Press", "Front Raise"],
  "Side Delts": ["Lateral Raise", "Cable Lateral Raise", "Upright Row"],
  "Rear Delts": ["Rear Delt Fly", "Reverse Pec Deck", "Bent-Over Reverse Fly"],
  Biceps: ["Barbell Curl", "Dumbbell Curl", "Hammer Curl", "Preacher Curl"],
  Triceps: ["Tricep Pushdown", "Skull Crushers", "Close-Grip Bench Press", "Overhead Tricep Extension"],
  Forearms: ["Wrist Curl", "Reverse Wrist Curl", "Farmer's Carry"],
  Quads: ["Back Squat", "Leg Press", "Leg Extension", "Walking Lunges"],
  Hamstrings: ["Romanian Deadlift", "Lying Leg Curl", "Good Morning"],
  Glutes: ["Hip Thrust", "Glute Bridge", "Bulgarian Split Squat"],
  Calves: ["Standing Calf Raise", "Seated Calf Raise"],
  Abs: ["Crunches", "Hanging Leg Raise", "Cable Crunch"],
  Obliques: ["Russian Twist", "Side Plank", "Cable Woodchopper"],
};

const GYM_GOALS = ["Cut", "Bulk", "Maintain"];

function emptyWorkoutExercise() {
  const muscleGroup = MUSCLE_GROUPS[0];
  const muscle = MUSCLES_BY_GROUP[muscleGroup][0];
  const exercise = EXERCISES_BY_MUSCLE[muscle][0];
  return { muscleGroup, muscle, exercise, sets: 3, reps: 8, weight: 0 };
}

function estOneRM(weight, reps) {
  const w = Number(weight) || 0;
  const r = Number(reps) || 0;
  if (r <= 1) return w;
  return w * (1 + r / 30);
}

function bestForExercise(workouts, exerciseName) {
  let best = null;
  workouts.forEach((w) => {
    (w.exercises || []).forEach((ex) => {
      if (ex.exercise === exerciseName) {
        const e1rm = estOneRM(ex.weight, ex.reps);
        if (!best || e1rm > best.e1rm) {
          best = { weight: Number(ex.weight), reps: Number(ex.reps), e1rm, date: w.date, workoutName: w.name };
        }
      }
    });
  });
  return best;
}

function analyseGym(workouts, bodyweightLogs, goal) {
  if (workouts.length === 0 && bodyweightLogs.length === 0) return null;

  const totalVolume = workouts.reduce(
    (sum, w) => sum + (w.exercises || []).reduce((s, ex) => s + Number(ex.sets || 0) * Number(ex.reps || 0) * Number(ex.weight || 0), 0),
    0
  );
  const totalWorkouts = workouts.length;

  const exerciseNames = new Set();
  workouts.forEach((w) => (w.exercises || []).forEach((ex) => exerciseNames.add(ex.exercise)));
  const personalBests = Array.from(exerciseNames)
    .map((name) => ({ exercise: name, best: bestForExercise(workouts, name) }))
    .filter((x) => x.best)
    .sort((a, b) => b.best.e1rm - a.best.e1rm);

  const groupVolume = {};
  MUSCLE_GROUPS.forEach((g) => (groupVolume[g] = 0));
  workouts.forEach((w) =>
    (w.exercises || []).forEach((ex) => {
      groupVolume[ex.muscleGroup] = (groupVolume[ex.muscleGroup] || 0) + Number(ex.sets || 0) * Number(ex.reps || 0) * Number(ex.weight || 0);
    })
  );
  const trainedGroups = MUSCLE_GROUPS.filter((g) => groupVolume[g] > 0);
  const untrainedGroups = MUSCLE_GROUPS.filter((g) => groupVolume[g] === 0);
  let neglectedGroup = null;
  if (totalWorkouts >= 3 && trainedGroups.length > 0) {
    if (untrainedGroups.length > 0) {
      neglectedGroup = untrainedGroups[0];
    } else {
      const maxVol = Math.max(...MUSCLE_GROUPS.map((g) => groupVolume[g]));
      const minEntry = MUSCLE_GROUPS.reduce((min, g) => (groupVolume[g] < groupVolume[min] ? g : min), MUSCLE_GROUPS[0]);
      if (maxVol > 0 && groupVolume[minEntry] > 0 && maxVol / groupVolume[minEntry] >= 3) neglectedGroup = minEntry;
    }
  }

  const sortedBW = [...bodyweightLogs].sort((a, b) => new Date(a.date) - new Date(b.date));
  const latestWeight = sortedBW.length ? Number(sortedBW[sortedBW.length - 1].weight) : null;
  const firstWeight = sortedBW.length ? Number(sortedBW[0].weight) : null;
  const weightChange = latestWeight !== null && firstWeight !== null ? Number((latestWeight - firstWeight).toFixed(1)) : null;

  const good = [];
  const bad = [];
  let goalCutNotWorking = false;
  let goalBulkNotWorking = false;

  if (weightChange !== null && sortedBW.length >= 2) {
    if (goal === "Cut") {
      if (weightChange < 0) good.push(`Body weight is down ${Math.abs(weightChange)} since your first log — tracking with your cut.`);
      else {
        bad.push(`You're aiming to cut but body weight is ${weightChange > 0 ? "up" : "flat"} ${Math.abs(weightChange)} since your first log — worth rechecking your deficit.`);
        goalCutNotWorking = true;
      }
    } else if (goal === "Bulk") {
      if (weightChange > 0) good.push(`Body weight is up ${weightChange} since your first log — the bulk is working.`);
      else {
        bad.push(`You're aiming to bulk but body weight is ${weightChange < 0 ? "down" : "flat"} ${Math.abs(weightChange)} since your first log — you may not be in a real surplus.`);
        goalBulkNotWorking = true;
      }
    } else if (goal === "Maintain") {
      if (Math.abs(weightChange) <= 1) good.push(`Body weight has stayed within ${Math.abs(weightChange)} of your starting point — right where a maintain goal wants it.`);
      else bad.push(`Body weight has moved ${Math.abs(weightChange)} since your first log — a bit more than you'd expect on a maintain goal.`);
    }
  }

  if (neglectedGroup) bad.push(`${neglectedGroup} is getting little to no volume compared to the rest of your training — worth adding an exercise for it.`);
  if (personalBests.length >= 3) good.push(`Tracking personal bests across ${personalBests.length} exercises — good foundation for spotting progressive overload.`);

  return {
    totalVolume,
    totalWorkouts,
    personalBests,
    groupVolume,
    neglectedGroup,
    latestWeight,
    weightChange,
    goalCutNotWorking,
    goalBulkNotWorking,
    statCards: [
      { label: "Workouts Logged", value: totalWorkouts },
      { label: "Total Volume (kg)", value: Math.round(totalVolume) },
      { label: "Body Weight", value: latestWeight !== null ? latestWeight : "-" },
      { label: "Goal", value: goal },
    ],
    good,
    bad,
  };
}

function GymApp({ onBack }) {
  const [tab, setTab] = useState("track");
  const [goal, setGoal] = useState("Maintain");
  const [workouts, setWorkouts] = useState([]);
  const [bodyweightLogs, setBodyweightLogs] = useState([]);
  const [draftExercise, setDraftExercise] = useState(emptyWorkoutExercise());
  const [currentExercises, setCurrentExercises] = useState([]);
  const [workoutName, setWorkoutName] = useState("");
  const [draftWeight, setDraftWeight] = useState(0);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    async function loadAll() {
      try {
        const g = await window.storage.get("gym:goal");
        if (g) setGoal(g.value);
        const w = await window.storage.get("gym:workouts");
        if (w) setWorkouts(JSON.parse(w.value));
        const bw = await window.storage.get("gym:bodyweight");
        if (bw) setBodyweightLogs(JSON.parse(bw.value));
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    loadAll();
  }, []);

  async function persist(key, data) {
    try {
      await window.storage.set(key, typeof data === "string" ? data : JSON.stringify(data));
    } catch (e) {
      // best effort
    }
  }

  function updateGoal(g) {
    setGoal(g);
    persist("gym:goal", g);
  }

  function onMuscleGroupChange(group) {
    const muscle = MUSCLES_BY_GROUP[group][0];
    const exercise = EXERCISES_BY_MUSCLE[muscle][0];
    setDraftExercise({ ...draftExercise, muscleGroup: group, muscle, exercise });
  }

  function onMuscleChange(muscle) {
    const exercise = EXERCISES_BY_MUSCLE[muscle][0];
    setDraftExercise({ ...draftExercise, muscle, exercise });
  }

  function addExerciseToWorkout() {
    setCurrentExercises([...currentExercises, { ...draftExercise, id: Date.now() + Math.random() }]);
  }

  function removeCurrentExercise(id) {
    setCurrentExercises(currentExercises.filter((e) => e.id !== id));
  }

  function saveWorkout() {
    if (currentExercises.length === 0) return;
    const next = [
      ...workouts,
      { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), name: workoutName.trim() || "Untitled Workout", exercises: currentExercises },
    ];
    setWorkouts(next);
    persist("gym:workouts", next);
    setCurrentExercises([]);
    setWorkoutName("");
  }

  function removeWorkout(id) {
    const next = workouts.filter((w) => w.id !== id);
    setWorkouts(next);
    persist("gym:workouts", next);
  }

  function saveBodyWeight() {
    const next = [...bodyweightLogs, { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), weight: draftWeight }];
    setBodyweightLogs(next);
    persist("gym:bodyweight", next);
    setDraftWeight(draftWeight);
  }

  function removeBodyWeight(id) {
    const next = bodyweightLogs.filter((b) => b.id !== id);
    setBodyweightLogs(next);
    persist("gym:bodyweight", next);
  }

  const analysis = useMemo(() => analyseGym(workouts, bodyweightLogs, goal), [workouts, bodyweightLogs, goal]);
  const activeTips = analysis ? GYM_TIPS.filter((t) => t.match(analysis)) : [];
  const livePR = bestForExercise(workouts, draftExercise.exercise);

  if (!loaded) {
    return (
      <div className="app">
        <p className="hint" style={{ padding: 20 }}>
          Loading…
        </p>
      </div>
    );
  }

  return (
    <div className="app">
      <header className="header">
        <div className="header-inner">
          <button className="back-btn" onClick={onBack}>
            ← Sports
          </button>
          <div className="crest">GY</div>
          <div>
            <h1>Gym</h1>
            <p className="tagline">Every session builds on the last.</p>
          </div>
        </div>
      </header>

      <nav className="tabs">
        <button className={tab === "track" ? "active" : ""} onClick={() => setTab("track")}>
          Log a Workout
        </button>
        <button className={tab === "bodyweight" ? "active" : ""} onClick={() => setTab("bodyweight")}>
          Body Weight
        </button>
        <button className={tab === "analysis" ? "active" : ""} onClick={() => setTab("analysis")}>
          Analysis
        </button>
        <button className={tab === "tips" ? "active" : ""} onClick={() => setTab("tips")}>
          Drills &amp; Tips
        </button>
      </nav>

      <main className="main">
        {tab === "track" && (
          <section>
            <div className="card">
              <h2>Goal</h2>
              <label className="field">
                <span>What are you trying to do right now?</span>
                <select value={goal} onChange={(e) => updateGoal(e.target.value)}>
                  {GYM_GOALS.map((g) => (
                    <option key={g} value={g}>
                      {g}
                    </option>
                  ))}
                </select>
              </label>
            </div>

            <div className="card">
              <h2>Build Your Workout</h2>
              <div className="grid">
                <label className="field">
                  <span>Muscle Group</span>
                  <select value={draftExercise.muscleGroup} onChange={(e) => onMuscleGroupChange(e.target.value)}>
                    {MUSCLE_GROUPS.map((g) => (
                      <option key={g} value={g}>
                        {g}
                      </option>
                    ))}
                  </select>
                </label>
                <label className="field">
                  <span>Muscle</span>
                  <select value={draftExercise.muscle} onChange={(e) => onMuscleChange(e.target.value)}>
                    {MUSCLES_BY_GROUP[draftExercise.muscleGroup].map((m) => (
                      <option key={m} value={m}>
                        {m}
                      </option>
                    ))}
                  </select>
                </label>
                <label className="field">
                  <span>Exercise</span>
                  <select value={draftExercise.exercise} onChange={(e) => setDraftExercise({ ...draftExercise, exercise: e.target.value })}>
                    {EXERCISES_BY_MUSCLE[draftExercise.muscle].map((ex) => (
                      <option key={ex} value={ex}>
                        {ex}
                      </option>
                    ))}
                  </select>
                </label>
              </div>

              {livePR && (
                <p className="hint" style={{ marginTop: 8 }}>
                  Personal best: {livePR.weight}kg × {livePR.reps} (est. 1RM {livePR.e1rm.toFixed(1)}kg) — try to beat it!
                </p>
              )}
              {!livePR && (
                <p className="hint" style={{ marginTop: 8 }}>
                  No previous log for this exercise yet — this will set your first personal best.
                </p>
              )}

              <div className="grid">
                <NumberField label="Sets" value={draftExercise.sets} onChange={(v) => setDraftExercise({ ...draftExercise, sets: v })} min={1} />
                <NumberField label="Reps" value={draftExercise.reps} onChange={(v) => setDraftExercise({ ...draftExercise, reps: v })} min={1} />
                <NumberField label="Weight (kg)" value={draftExercise.weight} onChange={(v) => setDraftExercise({ ...draftExercise, weight: v })} />
              </div>

              <button className="save-btn" onClick={addExerciseToWorkout}>
                Add Exercise to Workout
              </button>

              {currentExercises.length > 0 && (
                <div className="entry-list">
                  <h3>This workout so far ({currentExercises.length})</h3>
                  {currentExercises.map((e) => (
                    <div className="entry-row" key={e.id}>
                      <span>
                        {e.exercise} ({e.muscle}) — {e.sets} × {e.reps} @ {e.weight}kg
                      </span>
                      <button onClick={() => removeCurrentExercise(e.id)}>Remove</button>
                    </div>
                  ))}
                </div>
              )}

              <label className="field" style={{ marginTop: 16 }}>
                <span>Name this workout</span>
                <input type="text" placeholder="e.g. Push Day" value={workoutName} onChange={(e) => setWorkoutName(e.target.value)} />
              </label>
              <button className="save-btn" onClick={saveWorkout}>
                Save Workout
              </button>

              {workouts.length > 0 && (
                <div className="entry-list">
                  <h3>Saved workouts ({workouts.length})</h3>
                  {[...workouts].reverse().map((w) => (
                    <div className="entry-row" key={w.id}>
                      <span>
                        {w.name} ({w.date}) — {w.exercises.length} exercise{w.exercises.length !== 1 ? "s" : ""}
                      </span>
                      <button onClick={() => removeWorkout(w.id)}>Remove</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </section>
        )}

        {tab === "bodyweight" && (
          <section>
            <div className="card">
              <h2>Log Body Weight</h2>
              <div className="grid">
                <NumberField label="Weight (kg)" value={draftWeight} onChange={setDraftWeight} />
              </div>
              <button className="save-btn" onClick={saveBodyWeight}>
                Save Weight
              </button>

              {bodyweightLogs.length > 0 && (
                <div className="entry-list">
                  <h3>Logged weights ({bodyweightLogs.length})</h3>
                  {[...bodyweightLogs].reverse().map((b) => {
                    const history = [...bodyweightLogs].sort((x, y) => new Date(x.date) - new Date(y.date));
                    const idx = history.findIndex((e) => e.id === b.id);
                    let trendLabel = "First log";
                    if (idx > 0) {
                      const prev = history[idx - 1];
                      if (Number(b.weight) > Number(prev.weight)) trendLabel = "Up ▲";
                      else if (Number(b.weight) < Number(prev.weight)) trendLabel = "Down ▼";
                      else trendLabel = "Same";
                    }
                    return (
                      <div className="entry-row" key={b.id}>
                        <span>
                          {b.weight}kg ({b.date}) — {trendLabel}
                        </span>
                        <button onClick={() => removeBodyWeight(b.id)}>Remove</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>
        )}

        {tab === "analysis" && (
          <section>
            {!analysis && <div className="empty">Log a workout or a body weight entry first — analysis appears here once you have data.</div>}
            {analysis && (
              <div className="card">
                <h2>Gym Analysis</h2>
                <div className="stat-row">
                  {analysis.statCards.map((s, i) => (
                    <Stat key={i} label={s.label} value={s.value} />
                  ))}
                </div>

                {analysis.personalBests.length > 0 && (
                  <div style={{ marginTop: 16 }}>
                    <h3>Personal Bests</h3>
                    <div className="entry-list">
                      {analysis.personalBests.map((pb, i) => (
                        <div className="entry-row" key={i}>
                          <span>
                            {pb.exercise}: {pb.best.weight}kg × {pb.best.reps} (est. 1RM {pb.best.e1rm.toFixed(1)}kg)
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="verdict">
                  {analysis.good.length > 0 && (
                    <div className="good">
                      <h4>What's going well</h4>
                      <ul>
                        {analysis.good.map((g, i) => (
                          <li key={i}>{g}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {analysis.bad.length > 0 && (
                    <div className="bad">
                      <h4>What to work on</h4>
                      <ul>
                        {analysis.bad.map((b, i) => (
                          <li key={i}>{b}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </div>
            )}
          </section>
        )}

        {tab === "tips" && (
          <section>
            {activeTips.length === 0 && <div className="empty">No specific drills flagged yet — log a few workouts so the analysis can spot patterns.</div>}
            {activeTips.map((tip, i) => {
              const drillList = typeof tip.drills === "function" ? tip.drills(analysis) : tip.drills;
              return (
                <div className="card" key={i}>
                  <h2>{tip.title}</h2>
                  <ul className="drills">
                    {drillList.map((d, j) => (
                      <li key={j}>{d}</li>
                    ))}
                  </ul>
                </div>
              );
            })}
          </section>
        )}
      </main>
    </div>
  );
}

const REST_DAY_SUGGESTIONS = ["Light mobility or stretching session.", "Prioritise sleep and hydration today."];

function matchedFocuses(sport, focusText) {
  const library = DRILL_LIBRARY[sport];
  if (!library) return [];
  const defaultOrder = Object.keys(library);
  if (!focusText) return defaultOrder;
  const text = focusText.toLowerCase();
  const map = FOCUS_MAPS[sport] || [];
  const hits = map.filter((m) => m.keys.some((k) => text.includes(k))).map((m) => m.focus);
  const uniqueHits = hits.filter((h, i) => hits.indexOf(h) === i && library[h]);
  return uniqueHits.length > 0 ? uniqueHits : defaultOrder;
}

function cleanFocusLabel(text) {
  let t = text.trim();
  const fillers = [
    /^i want to work on\s+/i,
    /^i want to improve\s+/i,
    /^i'd like to work on\s+/i,
    /^i'd like to improve\s+/i,
    /^i need to work on\s+/i,
    /^i need to improve\s+/i,
    /^working on\s+/i,
    /^work on\s+/i,
    /^improving\s+/i,
    /^improve\s+/i,
    /^my\s+/i,
  ];
  let changed = true;
  while (changed) {
    changed = false;
    for (const re of fillers) {
      if (re.test(t)) {
        t = t.replace(re, "");
        changed = true;
      }
    }
  }
  t = t.trim();
  return t.length > 0 ? t.charAt(0).toUpperCase() + t.slice(1) : text.trim();
}

function splitFocusItems(focusText) {
  if (!focusText) return [];
  return focusText
    .split(/,|;|&|\band\b/i)
    .map((s) => cleanFocusLabel(s))
    .filter((s) => s.length > 0);
}

function findCategoryForItem(sport, itemText) {
  const map = FOCUS_MAPS[sport] || [];
  const text = itemText.toLowerCase();
  const hit = map.find((m) => m.keys.some((k) => text.includes(k)));
  return hit ? hit.focus : null;
}

function drillsForItem(sport, itemText) {
  const category = findCategoryForItem(sport, itemText);
  if (category && DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][category]) {
    return DRILL_LIBRARY[sport][category];
  }
  return [`Dedicated focused practice on: ${itemText}.`, "Break it into short, specific reps rather than one session trying to fix everything at once."];
}

function labelAndDrillsForFocus(sport, focus) {
  if (!focus) return { label: null, drills: [] };
  if (DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][focus]) {
    return { label: focus, drills: DRILL_LIBRARY[sport][focus] };
  }
  const category = findCategoryForItem(sport, focus);
  if (category && DRILL_LIBRARY[sport] && DRILL_LIBRARY[sport][category]) {
    return { label: category, drills: DRILL_LIBRARY[sport][category] };
  }
  return { label: focus, drills: drillsForItem(sport, focus) };
}

function attributeFocusItems(selectedActivities, focusText) {
  const items = splitFocusItems(focusText);
  const bySport = {};
  selectedActivities.forEach((a) => {
    bySport[a] = [];
  });
  if (items.length === 0) return bySport;

  const realSports = selectedActivities.filter((a) => a !== "Gym");
  if (realSports.length === 1) {
    // Only one real sport picked — nothing ambiguous about who the note is for.
    bySport[realSports[0]] = items;
    return bySport;
  }

  const unmatched = [];
  items.forEach((item) => {
    const text = item.toLowerCase();
    let matchedAny = false;
    realSports.forEach((a) => {
      const map = FOCUS_MAPS[a] || [];
      if (map.some((m) => m.keys.some((k) => text.includes(k)))) {
        bySport[a].push(item);
        matchedAny = true;
      }
    });
    if (!matchedAny) unmatched.push(item);
  });

  // Nothing typed should get silently dropped — spread anything unmatched across the sports picked.
  if (unmatched.length > 0 && realSports.length > 0) {
    unmatched.forEach((item, i) => {
      bySport[realSports[i % realSports.length]].push(item);
    });
  }

  return bySport;
}

function buildWeeklyPlan(selectedDays, selectedActivities, focusText) {
  if (selectedDays.length === 0 || selectedActivities.length === 0) return [];

  const wantsRest = selectedDays.length >= 6 ? 1 : 0;
  const restIndexes = new Set();
  if (wantsRest > 0) {
    for (let r = 1; r <= wantsRest; r++) {
      let idx = Math.floor((r * selectedDays.length) / (wantsRest + 1));
      idx = Math.min(selectedDays.length - 1, Math.max(0, idx));
      restIndexes.add(idx);
    }
  }

  const trainingSlots = selectedDays.length - restIndexes.size;
  const maxRepeats = selectedActivities.length === 1 ? Math.max(1, trainingSlots) : 2;

  let queue = [];
  let round = 0;
  while (queue.length < trainingSlots && round < maxRepeats) {
    selectedActivities.forEach((a) => {
      if (queue.length < trainingSlots) queue.push(a);
    });
    round++;
  }
  while (queue.length < trainingSlots) queue.push(selectedActivities[selectedActivities.length - 1]);

  for (let i = 1; i < queue.length; i++) {
    if (queue[i] === queue[i - 1]) {
      const swapIdx = queue.findIndex((a, idx) => idx > i && a !== queue[i]);
      if (swapIdx !== -1) {
        const tmp = queue[i];
        queue[i] = queue[swapIdx];
        queue[swapIdx] = tmp;
      }
    }
  }

  const rawItemsBySport = attributeFocusItems(selectedActivities, focusText);
  const focusCounters = {};
  const focusListsBySport = {};
  selectedActivities.forEach((a) => {
    focusCounters[a] = 0;
    if (a === "Gym") {
      focusListsBySport[a] = GYM_SPLITS;
    } else {
      focusListsBySport[a] = rawItemsBySport[a] && rawItemsBySport[a].length > 0 ? rawItemsBySport[a] : matchedFocuses(a, null);
    }
  });

  let qi = 0;
  const plan = [];
  for (let d = 0; d < selectedDays.length; d++) {
    if (restIndexes.has(d)) {
      plan.push({ day: selectedDays[d], activity: "Rest & Recovery", focus: null, drills: REST_DAY_SUGGESTIONS });
    } else {
      const activity = queue[qi];
      qi++;
      if (activity === "Gym") {
        const split = GYM_SPLITS[focusCounters[activity] % GYM_SPLITS.length];
        focusCounters[activity]++;
        plan.push({ day: selectedDays[d], activity, focus: split, drills: GYM_SPLIT_DRILLS[split] || [] });
      } else {
        const focusList = focusListsBySport[activity] || [];
        const rawFocus = focusList.length > 0 ? focusList[focusCounters[activity] % focusList.length] : null;
        focusCounters[activity]++;
        const { label, drills } = labelAndDrillsForFocus(activity, rawFocus);
        plan.push({ day: selectedDays[d], activity, focus: label, drills });
      }
    }
  }
  return plan;
}

function WeeklyPlanner() {
  const [selectedDays, setSelectedDays] = useState([]);
  const [selectedActivities, setSelectedActivities] = useState([]);
  const [focusText, setFocusText] = useState("");
  const [plan, setPlan] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    async function loadSaved() {
      try {
        const res = await window.storage.get("weeklyplan:data");
        if (res) {
          const parsed = JSON.parse(res.value);
          setSelectedDays(parsed.selectedDays || []);
          setSelectedActivities(parsed.selectedActivities || []);
          setFocusText(parsed.focusText || "");
          setPlan(parsed.plan || []);
        }
      } catch (e) {
        // no saved plan yet
      }
      setLoaded(true);
    }
    loadSaved();
  }, []);

  function persistState(nextPlan) {
    window.storage
      .set("weeklyplan:data", JSON.stringify({ selectedDays, selectedActivities, focusText, plan: nextPlan }))
      .catch(() => {});
  }

  function toggleDay(day) {
    setSelectedDays((prev) =>
      prev.includes(day) ? prev.filter((d) => d !== day) : [...prev, day].sort((a, b) => DAYS_OF_WEEK.indexOf(a) - DAYS_OF_WEEK.indexOf(b))
    );
  }

  function toggleActivity(activity) {
    setSelectedActivities((prev) => (prev.includes(activity) ? prev.filter((a) => a !== activity) : [...prev, activity]));
  }

  function generate() {
    const newPlan = buildWeeklyPlan(selectedDays, selectedActivities, focusText);
    setPlan(newPlan);
    persistState(newPlan);
  }

  function clearPlan() {
    setPlan([]);
    persistState([]);
  }

  if (!loaded) {
    return (
      <div className="about-page">
        <p className="hint">Loading…</p>
      </div>
    );
  }

  const canGenerate = selectedDays.length > 0 && selectedActivities.length > 0;

  return (
    <div className="about-page">
      <h1>Weekly Plan</h1>
      <p>Tell me what days you've got free and what you want to train, and I'll lay out a week for you.</p>

      <div className="card">
        <h2>Days you have available</h2>
        <div>
          {DAYS_OF_WEEK.map((day) => (
            <PlanChip key={day} label={day} active={selectedDays.includes(day)} onClick={() => toggleDay(day)} />
          ))}
        </div>

        <h2 style={{ marginTop: 16 }}>What do you want a plan for?</h2>
        <div>
          {ACTIVITY_OPTIONS.map((activity) => (
            <PlanChip key={activity} label={activity} active={selectedActivities.includes(activity)} onClick={() => toggleActivity(activity)} />
          ))}
        </div>

        <label className="field" style={{ marginTop: 16 }}>
          <span>Anything specific you're working on? (optional)</span>
          <input
            type="text"
            placeholder="e.g. improving my serve, cutting weight"
            value={focusText}
            onChange={(e) => setFocusText(e.target.value)}
          />
        </label>

        <div style={{ marginTop: 16 }}>
          <button className="save-btn" onClick={generate} disabled={!canGenerate} style={!canGenerate ? { opacity: 0.5, cursor: "not-allowed" } : {}}>
            Generate My Week
          </button>
          {plan.length > 0 && (
            <button
              onClick={clearPlan}
              style={{ marginLeft: 8, background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 8, padding: "10px 18px", cursor: "pointer" }}
            >
              Clear Plan
            </button>
          )}
        </div>
        {!canGenerate && <p className="hint" style={{ marginTop: 8 }}>Pick at least one day and one activity to generate a plan.</p>}
      </div>

      {plan.length > 0 && (
        <div className="card">
          <h2>Your Week</h2>
          <div className="entry-list">
            {plan.map((p, i) => (
              <div className="entry-row" key={i} style={{ flexDirection: "column", alignItems: "flex-start" }}>
                <span>
                  <strong>{p.day}:</strong> {p.activity}
                  {p.focus ? ` — ${p.focus}` : ""}
                </span>
                {p.drills && p.drills.length > 0 && (
                  <ul className="drills" style={{ marginTop: 6 }}>
                    {p.drills.map((d, j) => (
                      <li key={j}>{d}</li>
                    ))}
                  </ul>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function emptyMealEntry() {
  return { id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10), mealType: "Breakfast", name: "", calories: 0, protein: 0, carbs: 0, fat: 0 };
}

function suggestedNutritionTarget(goal, weight) {
  const caloriesPerKg = goal === "Cut" ? 28 : goal === "Bulk" ? 38 : 33;
  const proteinPerKg = goal === "Cut" ? 2.2 : goal === "Bulk" ? 2.0 : 1.8;
  const calories = weight ? Math.round(weight * caloriesPerKg) : goal === "Cut" ? 1800 : goal === "Bulk" ? 2800 : 2200;
  const protein = weight ? Math.round(weight * proteinPerKg) : goal === "Cut" ? 150 : goal === "Bulk" ? 180 : 140;
  const fat = Math.round((calories * 0.27) / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat };
}

function analyseNutrition(meals, target, goal) {
  if (meals.length === 0) return null;

  const byDate = {};
  meals.forEach((m) => {
    byDate[m.date] = byDate[m.date] || { calories: 0, protein: 0, carbs: 0, fat: 0 };
    byDate[m.date].calories += Number(m.calories || 0);
    byDate[m.date].protein += Number(m.protein || 0);
    byDate[m.date].carbs += Number(m.carbs || 0);
    byDate[m.date].fat += Number(m.fat || 0);
  });
  const days = Object.keys(byDate);
  const avg = (key) => (days.length ? days.reduce((s, d) => s + byDate[d][key], 0) / days.length : 0);
  const avgCalories = avg("calories");
  const avgProtein = avg("protein");
  const avgCarbs = avg("carbs");
  const avgFat = avg("fat");

  const caloriePct = target.calories ? Math.round((avgCalories / target.calories) * 100) : null;
  const proteinPct = target.protein ? Math.round((avgProtein / target.protein) * 100) : null;
  const carbsPct = target.carbs ? Math.round((avgCarbs / target.carbs) * 100) : null;
  const fatPct = target.fat ? Math.round((avgFat / target.fat) * 100) : null;

  const good = [];
  const bad = [];

  if (proteinPct !== null) {
    if (proteinPct >= 90) good.push(`Averaging ${proteinPct}% of your protein target — good for recovery and keeping muscle.`);
    else if (proteinPct < 70) bad.push(`Averaging just ${proteinPct}% of your protein target — worth adding a protein source to a meal or two.`);
  }

  if (caloriePct !== null) {
    if (goal === "Cut") {
      if (caloriePct <= 105) good.push(`Averaging ${caloriePct}% of your calorie target — tracking with your cut.`);
      else bad.push(`Averaging ${caloriePct}% of your calorie target — a bit over where your cut needs you.`);
    } else if (goal === "Bulk") {
      if (caloriePct >= 95) good.push(`Averaging ${caloriePct}% of your calorie target — on track for the surplus your bulk needs.`);
      else bad.push(`Averaging only ${caloriePct}% of your calorie target — you may not be eating enough to actually bulk.`);
    } else {
      if (caloriePct >= 90 && caloriePct <= 110) good.push(`Averaging ${caloriePct}% of your calorie target — steady around maintenance.`);
      else bad.push(`Averaging ${caloriePct}% of your calorie target — drifting a fair bit from your maintenance goal.`);
    }
  }

  if (carbsPct !== null && carbsPct < 60) bad.push(`Carbs are averaging only ${carbsPct}% of target — you may be running low on energy for training.`);
  if (fatPct !== null && fatPct < 60) bad.push(`Fat intake is averaging only ${fatPct}% of target — some healthy fats help with hormone health and recovery.`);

  const uniqueMeals = new Set(meals.map((m) => m.name.toLowerCase().trim())).size;
  if (meals.length >= 8 && uniqueMeals <= 3) bad.push(`You've logged mostly the same ${uniqueMeals} meal${uniqueMeals !== 1 ? "s" : ""} — a bit more variety helps cover different vitamins and minerals.`);

  return {
    avgCalories: Math.round(avgCalories),
    avgProtein: Math.round(avgProtein),
    avgCarbs: Math.round(avgCarbs),
    avgFat: Math.round(avgFat),
    caloriePct,
    proteinPct,
    carbsPct,
    fatPct,
    daysLogged: days.length,
    statCards: [
      { label: "Avg Calories", value: `${Math.round(avgCalories)}${caloriePct !== null ? ` (${caloriePct}%)` : ""}` },
      { label: "Avg Protein", value: `${Math.round(avgProtein)}g${proteinPct !== null ? ` (${proteinPct}%)` : ""}` },
      { label: "Avg Carbs", value: `${Math.round(avgCarbs)}g${carbsPct !== null ? ` (${carbsPct}%)` : ""}` },
      { label: "Avg Fat", value: `${Math.round(avgFat)}g${fatPct !== null ? ` (${fatPct}%)` : ""}` },
    ],
    good,
    bad,
  };
}

        const g = await window.storage.get("gym:goal");
        const goalValue = g ? g.value : "Maintain";
        setGoal(goalValue);

    loadAll();
  }, []);

  function persist(key, data) {
    window.storage.set(key, typeof data === "string" ? data : JSON.stringify(data)).catch(() => {});
  }

  function updateTarget(field, value) {
    const next = { ...target, [field]: value };
    setTarget(next);
    persist("nutrition:target", next);
  }

  function saveMeal() {
    if (!draft.name.trim()) return;
    const next = [...meals, { ...draft, id: Date.now() + Math.random(), date: new Date().toISOString().slice(0, 10) }];
    setMeals(next);
    persist("nutrition:meals", next);
    setDraft(emptyMealEntry());
  }

  function removeMeal(id) {
    const next = meals.filter((m) => m.id !== id);
    setMeals(next);
    persist("nutrition:meals", next);
  }

  const today = new Date().toISOString().slice(0, 10);
  const todaysMeals = meals.filter((m) => m.date === today);
  const todaysTotals = todaysMeals.reduce(
    (t, m) => ({
      calories: t.calories + Number(m.calories || 0),
      protein: t.protein + Number(m.protein || 0),
      carbs: t.carbs + Number(m.carbs || 0),
      fat: t.fat + Number(m.fat || 0),
    }),
    { calories: 0, protein: 0, carbs: 0, fat: 0 }
  );

  const analysis = useMemo(() => analyseNutrition(meals, target, goal), [meals, target, goal]);
  const activeTips = analysis ? NUTRITION_TIPS.filter((t) => t.match(analysis)) : [];
  const suggestions = MEAL_SUGGESTIONS_BY_GOAL[goal] || MEAL_SUGGESTIONS_BY_GOAL.Maintain;

  if (!loaded) {
    return (
      <div className="about-page">
        <p className="hint">Loading…</p>
      </div>
    );
  }

  return (
    <div className="about-page">
      <h1>Nutrition</h1>
      <p>Log your meals and I'll show you how they stack up against your targets — plus a plan for what to eat next.</p>

      <nav className="tabs">
        <button className={tab === "track" ? "active" : ""} onClick={() => setTab("track")}>
          Log a Meal
        </button>
        <button className={tab === "analysis" ? "active" : ""} onClick={() => setTab("analysis")}>
          Analysis &amp; Plan
        </button>
        <button className={tab === "tips" ? "active" : ""} onClick={() => setTab("tips")}>
          Tips
        </button>
      </nav>

      {tab === "track" && (
        <>
          <div className="card">
            <h2>Daily Targets</h2>
            <p className="hint">
              Goal: {goal} (set on the Gym page). These started from a rough estimate — adjust to whatever your plan actually is.
            </p>
            <div className="grid">
              <NumberField label="Calories" value={target.calories} onChange={(v) => updateTarget("calories", v)} />
              <NumberField label="Protein (g)" value={target.protein} onChange={(v) => updateTarget("protein", v)} />
              <NumberField label="Carbs (g)" value={target.carbs} onChange={(v) => updateTarget("carbs", v)} />
              <NumberField label="Fat (g)" value={target.fat} onChange={(v) => updateTarget("fat", v)} />
            </div>
            {Number(target.calories) < 1200 && (
              <p className="hint" style={{ marginTop: 8 }}>
                That's a pretty low calorie target — worth checking in with a nutrition professional before going this low.
              </p>
            )}
          </div>

          <div className="card">
            <h2>Today So Far</h2>
            <div className="stat-row">
              <Stat label="Calories" value={`${todaysTotals.calories} / ${target.calories}`} />
              <Stat label="Protein" value={`${todaysTotals.protein}g / ${target.protein}g`} />
              <Stat label="Carbs" value={`${todaysTotals.carbs}g / ${target.carbs}g`} />
              <Stat label="Fat" value={`${todaysTotals.fat}g / ${target.fat}g`} />
            </div>
          </div>

          <div className="card">
            <h2>Log a Meal</h2>
            <div className="grid">
              <label className="field">
                <span>Meal</span>
                <select value={draft.mealType} onChange={(e) => setDraft({ ...draft, mealType: e.target.value })}>
                  {MEAL_TYPES.map((mt) => (
                    <option key={mt} value={mt}>
                      {mt}
                    </option>
                  ))}
                </select>
              </label>
              <label className="field">
                <span>What did you eat?</span>
                <input type="text" placeholder="e.g. Chicken and rice" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} />
              </label>
            </div>
            <div className="grid">
              <NumberField label="Calories" value={draft.calories} onChange={(v) => setDraft({ ...draft, calories: v })} />
              <NumberField label="Protein (g)" value={draft.protein} onChange={(v) => setDraft({ ...draft, protein: v })} />
              <NumberField label="Carbs (g)" value={draft.carbs} onChange={(v) => setDraft({ ...draft, carbs: v })} />
              <NumberField label="Fat (g)" value={draft.fat} onChange={(v) => setDraft({ ...draft, fat: v })} />
            </div>
            <button className="save-btn" onClick={saveMeal}>
              Save Meal
            </button>

            {meals.length > 0 && (
              <div className="entry-list">
                <h3>Logged meals ({meals.length})</h3>
                {[...meals].reverse().map((m) => (
                  <div className="entry-row" key={m.id}>
                    <span>
                      {m.date} — {m.mealType}: {m.name} ({m.calories} cal, {m.protein}g P, {m.carbs}g C, {m.fat}g F)
                    </span>
                    <button onClick={() => removeMeal(m.id)}>Remove</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </>
      )}

      {tab === "analysis" && (
        <>
          {!analysis && <div className="empty">Log a meal first — analysis appears here once you have data.</div>}
          {analysis && (
            <div className="card">
              <h2>Nutrition Analysis</h2>
              <div className="stat-row">
                {analysis.statCards.map((s, i) => (
                  <Stat key={i} label={s.label} value={s.value} />
                ))}
              </div>
              <div className="verdict">
                {analysis.good.length > 0 && (
                  <div className="good">
                    <h4>What's going well</h4>
                    <ul>
                      {analysis.good.map((g, i) => (
                        <li key={i}>{g}</li>
                      ))}
                    </ul>
                  </div>
                )}
                {analysis.bad.length > 0 && (
                  <div className="bad">
                    <h4>What to work on</h4>
                    <ul>
                      {analysis.bad.map((b, i) => (
                        <li key={i}>{b}</li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="card">
            <h2>Suggested Day ({goal})</h2>
            <p className="hint">A simple starting template for your current goal — swap in foods you actually like that fit a similar profile.</p>
            <div className="entry-list">
              {MEAL_TYPES.map((mt) => (
                <div className="entry-row" key={mt}>
                  <span>
                    <strong>{mt}:</strong> {suggestions[mt]}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {tab === "tips" && (
        <>
          {activeTips.length === 0 && <div className="empty">No specific tips flagged yet — log a few meals so the analysis can spot patterns.</div>}
          {activeTips.map((tip, i) => (
            <div className="card" key={i}>
              <h2>{tip.title}</h2>
              <ul className="drills">
                {tip.drills.map((d, j) => (
                  <li key={j}>{d}</li>
                ))}
              </ul>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function emptyProfileDraft() {
  return { email: "", firstName: "", lastName: "", age: "", weight: "" };
}

function LoginGate({ onComplete }) {
  const [step, setStep] = useState(1);
  const [draft, setDraft] = useState(emptyProfileDraft());
  const [error, setError] = useState("");

  function goToDetails() {
    if (!draft.email.trim() || !draft.email.includes("@")) {
      setError("Enter a valid email address.");
      return;
    }
    setError("");
    setStep(2);
  }

  function submit() {
    if (!draft.firstName.trim() || !draft.lastName.trim()) {
      setError("Enter your first and last name.");
      return;
    }
    if (!draft.age || Number(draft.age) <= 0) {
      setError("Enter a valid age.");
      return;
    }
    if (!draft.weight || Number(draft.weight) <= 0) {
      setError("Enter a valid weight.");
      return;
    }
    setError("");
    const profile = {
      email: draft.email.trim(),
      firstName: draft.firstName.trim(),
      lastName: draft.lastName.trim(),
      age: Number(draft.age),
      weight: Number(draft.weight),
    };
    window.storage.set("profile:data", JSON.stringify(profile)).catch(() => {});
    onComplete(profile);
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0F1F17", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <style>{css}</style>
      <div className="card" style={{ maxWidth: 420, width: "100%" }}>
        <h1 style={{ marginTop: 0 }}>Welcome to Next Level</h1>

        {step === 1 && (
          <>
            <p className="hint">First, what's your email address?</p>
            <label className="field">
              <span>Email address</span>
              <input
                type="email"
                placeholder="you@example.com"
                value={draft.email}
                onChange={(e) => setDraft({ ...draft, email: e.target.value })}
                onKeyDown={(e) => {
                  if (e.key === "Enter") goToDetails();
                }}
                autoFocus
              />
            </label>

            {error && (
              <p className="hint" style={{ color: "#C8531E" }}>
                {error}
              </p>
            )}

            <button className="save-btn" onClick={goToDetails} style={{ marginTop: 16 }}>
              Enter
            </button>
          </>
        )}

        {step === 2 && (
          <>
            <p className="hint">Now let's get a few details about you.</p>

            <div className="grid">
              <label className="field">
                <span>First name</span>
                <input type="text" value={draft.firstName} onChange={(e) => setDraft({ ...draft, firstName: e.target.value })} autoFocus />
              </label>
              <label className="field">
                <span>Last name</span>
                <input type="text" value={draft.lastName} onChange={(e) => setDraft({ ...draft, lastName: e.target.value })} />
              </label>
            </div>

            <div className="grid">
              <NumberField label="Age" value={draft.age === "" ? 0 : draft.age} onChange={(v) => setDraft({ ...draft, age: v })} min={1} />
              <NumberField label="Weight (kg)" value={draft.weight === "" ? 0 : draft.weight} onChange={(v) => setDraft({ ...draft, weight: v })} min={1} />
            </div>

            {error && (
              <p className="hint" style={{ color: "#C8531E" }}>
                {error}
              </p>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <button
                onClick={() => {
                  setError("");
                  setStep(1);
                }}
                style={{ background: "transparent", border: "1px solid #2A4433", color: "#EFE9DD", borderRadius: 8, padding: "10px 18px", cursor: "pointer" }}
              >
                Back
              </button>
              <button className="save-btn" onClick={submit}>
                Continue
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const PLAN_OPTIONS = [
  { id: "monthly", label: "Monthly", price: "£10", period: "/month", badge: null },
  { id: "yearly", label: "Yearly", price: "£100", period: "/year", badge: "Save ~17%" },
];

function planLabel(subscription) {
  if (!subscription) return "";
  const opt = PLAN_OPTIONS.find((p) => p.id === subscription.plan);
  return opt ? `${opt.price}${opt.period}` : subscription.plan;
}

function trialDaysLeft(subscription) {
  if (!subscription || subscription.status !== "trial") return null;
  const start = new Date(subscription.trialStart);
  const now = new Date();
  const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  return Math.max(0, 14 - diffDays);
}

function PlanCard({ option, selected, onClick }) {
  return (
    <button
      type="button"
      onClick={onClick}
      style={{
        flex: 1,
        textAlign: "left",
        background: selected ? "#C8531E" : "#0F1F17",
        color: selected ? "#0F1F17" : "#EFE9DD",
        border: `1px solid ${selected ? "#C8531E" : "#2A4433"}`,
        borderRadius: 10,
        padding: "12px 14px",
        cursor: "pointer",
      }}
    >
      <div style={{ fontWeight: 700 }}>{option.label}</div>
      <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>
        {option.price}
        <span style={{ fontSize: 12, fontWeight: 400 }}>{option.period}</span>
      </div>
      {option.badge && (
        <div style={{ fontSize: 11, marginTop: 4, color: selected ? "#0F1F17" : "#9FB3A4" }}>{option.badge}</div>
      )}
    </button>
  );
}

function PaywallScreen({ onStart }) {
  const [plan, setPlan] = useState("yearly");
  const [cardName, setCardName] = useState("");
  const [cardNumber, setCardNumber] = useState("");
  const [cardExpiry, setCardExpiry] = useState("");
  const [cardCVC, setCardCVC] = useState("");
  const [error, setError] = useState("");

  const selectedOption = PLAN_OPTIONS.find((p) => p.id === plan);

  function startTrial() {
    if (!cardName.trim()) {
      setError("Enter the name on your card.");
      return;
    }
    if (cardNumber.replace(/\s/g, "").length < 12) {
      setError("Enter a valid card number.");
      return;
    }
    if (!/^\d{2}\/\d{2}$/.test(cardExpiry.trim())) {
      setError("Enter the expiry as MM/YY.");
      return;
    }
    if (cardCVC.trim().length < 3) {
      setError("Enter a valid CVC.");
      return;
    }
    setError("");
    const last4 = cardNumber.replace(/\s/g, "").slice(-4);
    const subscription = {
      plan,
      status: "trial",
      trialStart: new Date().toISOString().slice(0, 10),
      cardLast4: last4,
    };
    window.storage.set("subscription:data", JSON.stringify(subscription)).catch(() => {});
    onStart(subscription);
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0F1F17", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <style>{css}</style>
      <div className="card" style={{ maxWidth: 460, width: "100%" }}>
        <h1 style={{ marginTop: 0 }}>Start your free trial</h1>
        <p className="hint">
          14 days free, then {selectedOption.price}
          {selectedOption.period}. Cancel anytime during your trial from Billing and you won't be charged.
        </p>

        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          {PLAN_OPTIONS.map((opt) => (
            <PlanCard key={opt.id} option={opt} selected={plan === opt.id} onClick={() => setPlan(opt.id)} />
          ))}
        </div>

        <label className="field">
          <span>Name on card</span>
          <input type="text" value={cardName} onChange={(e) => setCardName(e.target.value)} />
        </label>
        <label className="field">
          <span>Card number</span>
          <input type="text" placeholder="1234 5678 9012 3456" value={cardNumber} onChange={(e) => setCardNumber(e.target.value)} />
        </label>
        <div className="grid">
          <label className="field">
            <span>Expiry (MM/YY)</span>
            <input type="text" placeholder="MM/YY" value={cardExpiry} onChange={(e) => setCardExpiry(e.target.value)} />
          </label>
          <label className="field">
            <span>CVC</span>
            <input type="text" placeholder="123" value={cardCVC} onChange={(e) => setCardCVC(e.target.value)} />
          </label>
        </div>

        {error && (
          <p className="hint" style={{ color: "#C8531E" }}>
            {error}
          </p>
        )}

        <button className="save-btn" onClick={startTrial} style={{ marginTop: 8 }}>
          Start 14-Day Free Trial
        </button>
        <p className="hint" style={{ marginTop: 8 }}>
          Payment details are required to start your trial, but you won't be charged until day 15 — cancel anytime before then.
        </p>
      </div>
    </div>
  );
}

function BillingPage({ subscription, onUpdate }) {
  const daysLeft = trialDaysLeft(subscription);

  function cancel() {
    const next = { ...subscription, status: "cancelled" };
    window.storage.set("subscription:data", JSON.stringify(next)).catch(() => {});
    onUpdate(next);
  }

  function switchPlan(planId) {
    const next = { ...subscription, plan: planId };
    window.storage.set("subscription:data", JSON.stringify(next)).catch(() => {});
    onUpdate(next);
  }

  return (
    <div className="about-page">
      <h1>Billing</h1>
      <div className="card">
        <h2>Current Plan</h2>
        <p className="hint">
          {subscription.status === "trial" ? `Free trial — ${daysLeft} day${daysLeft === 1 ? "" : "s"} left` : "Active subscription"}
        </p>
        <div className="stat-row">
          <Stat label="Plan" value={planLabel(subscription)} />
          <Stat label="Status" value={subscription.status === "trial" ? "Trial" : "Active"} />
          <Stat label="Card" value={`•••• ${subscription.cardLast4}`} />
        </div>

        <h3 style={{ marginTop: 16 }}>Switch Plan</h3>
        <div style={{ display: "flex", gap: 10 }}>
          {PLAN_OPTIONS.map((opt) => (
            <PlanCard key={opt.id} option={opt} selected={subscription.plan === opt.id} onClick={() => switchPlan(opt.id)} />
          ))}
        </div>

        <button
          onClick={cancel}
          style={{ marginTop: 16, background: "transparent", border: "1px solid #C8531E", color: "#C8531E", borderRadius: 8, padding: "10px 18px", cursor: "pointer" }}
        >
          Cancel Subscription
        </button>
      </div>
    </div>
  );
}

  const [page, setPage] = useState("home");

  const [profileLoaded, setProfileLoaded] = useState(false);
  const [subscription, setSubscription] = useState(null);
  const [subscriptionLoaded, setSubscriptionLoaded] = useState(false);

  useEffect(() => {
    async function loadProfile() {
      try {
        const res = await window.storage.get("profile:data");
        if (res) setProfile(JSON.parse(res.value));
      } catch (e) {
        // no profile saved yet
      }
      setProfileLoaded(true);
    }
    loadProfile();
  }, []);

  useEffect(() => {
    async function loadSubscription() {
      try {
        const res = await window.storage.get("subscription:data");
        if (res) {
          let sub = JSON.parse(res.value);
          if (sub.status === "trial" && trialDaysLeft(sub) <= 0) {
            sub = { ...sub, status: "active" };
            window.storage.set("subscription:data", JSON.stringify(sub)).catch(() => {});
          }
          setSubscription(sub);
        }
      } catch (e) {
        // no subscription saved yet
      }
      setSubscriptionLoaded(true);
    }
    loadSubscription();
  }, []);

        <CoachBot />
      </>

      {subscription.status === "trial" && (
