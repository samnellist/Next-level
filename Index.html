            justifyContent: "space-between",
            alignItems: "center",
          }}
        >
          <span>
            {trialDaysLeft(subscription)} day{trialDaysLeft(subscription) === 1 ? "" : "s"} left in your free trial
          </span>
          <button
            onClick={() => setPage("billing")}
            style={{ background: "transparent", border: "1px solid #2A4433", color: "#9FB3A4", borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 12 }}
          >
            Manage
          </button>
        </div>
      )}
      {page === "home" && <SportHome onSelect={setSport} />}
      {page === "about" && <AboutUs />}
      {page === "plan" && <WeeklyPlanner />}
      {page === "nutrition" && <NutritionApp />}
      {page === "help" && <HelpPage />}
      {page === "billing" && <BillingPage subscription={subscription} onUpdate={setSubscription} />}
      <CoachBot />
    </div>
  );
}

function CricketApp({ onBack }) {
  const [tab, setTab] = useState("track");
  const [subTab, setSubTab] = useState("batting");
  const [battingEntries, setBattingEntries] = useState([]);
  const [bowlingEntries, setBowlingEntries] = useState([]);
  const [fieldingEntries, setFieldingEntries] = useState([]);
  const [keepingEntries, setKeepingEntries] = useState([]);
  const [matches, setMatches] = useState([]);
  const [selectedMatchId, setSelectedMatchId] = useState(null);
  const [newOpponent, setNewOpponent] = useState("");
  const [draftBat, setDraftBat] = useState(emptyBatEntry());
  const [draftBowl, setDraftBowl] = useState(emptyBowlEntry());
  const [draftField, setDraftField] = useState(emptyFieldEntry());
  const [draftKeep, setDraftKeep] = useState(emptyKeepEntry());
  const [goals, setGoals] = useState([]);
  const [draftGoal, setDraftGoal] = useState(emptyGoal());
  const [trackers, setTrackers] = useState([]);
  const [trackerEntries, setTrackerEntries] = useState([]);
  const [newTrackerName, setNewTrackerName] = useState("");
  const [newTrackerUnit, setNewTrackerUnit] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");

  useEffect(() => {
    async function load() {
      try {
        const bat = await window.storage.get("cricket:batting");
        const bowl = await window.storage.get("cricket:bowling");
        const field = await window.storage.get("cricket:fielding");
        const keep = await window.storage.get("cricket:keeping");
        const m = await window.storage.get("cricket:matches");
        const g = await window.storage.get("cricket:goals");
        const tr = await window.storage.get("cricket:trackers");
        const te = await window.storage.get("cricket:trackerEntries");
        if (bat) setBattingEntries(JSON.parse(bat.value));
        if (bowl) setBowlingEntries(JSON.parse(bowl.value));
        if (field) setFieldingEntries(JSON.parse(field.value));
        if (keep) setKeepingEntries(JSON.parse(keep.value));
        if (m) setMatches(JSON.parse(m.value));
        if (g) setGoals(JSON.parse(g.value));
        if (tr) setTrackers(JSON.parse(tr.value));
        if (te) setTrackerEntries(JSON.parse(te.value));
      } catch (e) {
        // no existing data yet
      }
      setLoaded(true);
    }
    load();
  }, []);

  async function persist(key, data) {
    try {
      await window.storage.set(key, JSON.stringify(data));
    } catch (e) {
      setSaveMsg("Could not save — your data is only kept for this session.");
      setTimeout(() => setSaveMsg(""), 4000);
    }
  }

  function saveBatEntry() {
    const next = [...battingEntries, { ...draftBat, matchId: selectedMatchId }];
    setBattingEntries(next);
    persist("cricket:batting", next);
    setDraftBat(emptyBatEntry());
  }

  function saveBowlEntry() {
    const next = [...bowlingEntries, { ...draftBowl, matchId: selectedMatchId }];
    setBowlingEntries(next);
    persist("cricket:bowling", next);
    setDraftBowl(emptyBowlEntry());
  }

  function saveFieldEntry() {
    const next = [...fieldingEntries, { ...draftField, matchId: selectedMatchId }];
    setFieldingEntries(next);
    persist("cricket:fielding", next);
    setDraftField(emptyFieldEntry());
  }

  function saveKeepEntry() {
    const next = [...keepingEntries, { ...draftKeep, matchId: selectedMatchId }];
    setKeepingEntries(next);
    persist("cricket:keeping", next);
    setDraftKeep(emptyKeepEntry());
  }

  function deleteBat(id) {
    const next = battingEntries.filter((e) => e.id !== id);
    setBattingEntries(next);
    persist("cricket:batting", next);
  }

  function deleteBowl(id) {
    const next = bowlingEntries.filter((e) => e.id !== id);
    setBowlingEntries(next);
    persist("cricket:bowling", next);
  }

  function deleteField(id) {
    const next = fieldingEntries.filter((e) => e.id !== id);
    setFieldingEntries(next);
    persist("cricket:fielding", next);
  }

  function deleteKeep(id) {
    const next = keepingEntries.filter((e) => e.id !== id);
    setKeepingEntries(next);
    persist("cricket:keeping", next);
  }

  function createMatch() {
    if (!newOpponent.trim()) return;
    const m = { ...emptyMatch(), opponent: newOpponent.trim() };
    const next = [...matches, m];
    setMatches(next);
    persist("cricket:matches", next);
    setSelectedMatchId(m.id);
    setNewOpponent("");
  }

  function updateMatchResult(id, result) {
    const next = matches.map((m) => (m.id === id ? { ...m, result } : m));
    setMatches(next);
    persist("cricket:matches", next);
  }

  function matchLabel(m) {
    return `${m.opponent || "Unnamed"} — ${m.result}`;
  }

  function opponentFor(matchId) {
    const m = matches.find((x) => x.id === matchId);
    return m && m.opponent ? m.opponent : null;
  }

  function addGoal() {
    const next = [...goals, { ...draftGoal, id: Date.now() + Math.random() }];
    setGoals(next);
    persist("cricket:goals", next);
    setDraftGoal(emptyGoal());
  }

  function deleteGoal(id) {
    const next = goals.filter((g) => g.id !== id);
    setGoals(next);
    persist("cricket:goals", next);
  }

  function createTracker() {
    if (!newTrackerName.trim()) return;
    const next = [...trackers, { id: Date.now() + Math.random(), name: newTrackerName.trim(), unit: newTrackerUnit.trim() }];
    setTrackers(next);
    persist("cricket:trackers", next);
    setNewTrackerName("");
    setNewTrackerUnit("");
  }

  function deleteTracker(id) {
    const nextTrackers = trackers.filter((t) => t.id !== id);
    const nextEntries = trackerEntries.filter((e) => e.trackerId !== id);
    setTrackers(nextTrackers);
    setTrackerEntries(nextEntries);
    persist("cricket:trackers", nextTrackers);
    persist("cricket:trackerEntries", nextEntries);
  }

  function logTrackerEntry(trackerId, value) {
    const next = [...trackerEntries, { id: Date.now() + Math.random(), trackerId, date: new Date().toISOString().slice(0, 10), value }];
    setTrackerEntries(next);
    persist("cricket:trackerEntries", next);
  }

  function deleteTrackerEntry(id) {
    const next = trackerEntries.filter((e) => e.id !== id);
    setTrackerEntries(next);
    persist("cricket:trackerEntries", next);
  }

  function addZoneRun(draft, setDraft, zone, amount) {
    setDraft({ ...draft, zoneRuns: { ...draft.zoneRuns, [zone]: Math.max(0, Number(draft.zoneRuns[zone] || 0) + amount) } });
  }

  function resetZoneRun(draft, setDraft, zone) {
    setDraft({ ...draft, zoneRuns: { ...draft.zoneRuns, [zone]: 0 } });
  }

  const battingAnalysis = useMemo(() => analyseBatting(battingEntries), [battingEntries]);
  const bowlingAnalysis = useMemo(() => analyseBowling(bowlingEntries), [bowlingEntries]);
  const fieldingAnalysis = useMemo(() => analyseFielding(fieldingEntries), [fieldingEntries]);
  const keepingAnalysis = useMemo(() => analyseKeeping(keepingEntries), [keepingEntries]);
  if (battingAnalysis) {
    battingAnalysis.weakZoneFlag =
      Object.values(battingAnalysis.zoneTotals).filter((v) => v === 0).length > 0 &&
      Object.values(battingAnalysis.zoneTotals).filter((v) => v === 0).length < ZONES.length;
  }

  const activeTips = Object.values(TIP_LIBRARY).filter(
    (t) => t.match(battingAnalysis) || t.match(bowlingAnalysis) || t.match(fieldingAnalysis) || t.match(keepingAnalysis)
  );

  const analysisByCategory = {
    Batting: battingAnalysis,
    Bowling: bowlingAnalysis,
    Fielding: fieldingAnalysis,
    Keeping: keepingAnalysis,
  };

  const zoneMax = battingAnalysis ? Math.max(1, ...Object.values(battingAnalysis.zoneTotals)) : 1;
  const bowlZoneMax = bowlingAnalysis ? Math.max(1, ...Object.values(bowlingAnalysis.zoneTotals)) : 1;

  return (
    <div className="app">
      <header className="header">
        <div className="header-inner">
          <button className="back-btn" onClick={onBack}>
            ← Sports
          </button>
          <div className="crest">CS</div>
          <div>
            <h1>Crease &amp; Seam</h1>
            <p className="tagline">Track every ball. Find every edge.</p>
          </div>
        </div>
      </header>

      <nav className="tabs">
        <button className={tab === "track" ? "active" : ""} onClick={() => setTab("track")}>
          Log a Score
        </button>
        <button className={tab === "analysis" ? "active" : ""} onClick={() => setTab("analysis")}>
          Analysis
        </button>
        <button className={tab === "goals" ? "active" : ""} onClick={() => setTab("goals")}>
          Goals
        </button>
        <button className={tab === "tips" ? "active" : ""} onClick={() => setTab("tips")}>
          Drills &amp; Tips
        </button>
      </nav>

      {saveMsg && <div className="save-banner">{saveMsg}</div>}

      <main className="main">
        {tab === "track" && (
          <section>
            <div className="card match-bar">
              <h3>Match</h3>
              <select
                className="match-select"
                value={selectedMatchId || ""}
                onChange={(e) => setSelectedMatchId(e.target.value ? Number(e.target.value) : null)}
              >
                <option value="">No match selected</option>
                {matches.map((m) => (
                  <option key={m.id} value={m.id}>
                    {matchLabel(m)}
                  </option>
                ))}
              </select>

              {selectedMatchId && (
                <label className="field" style={{ marginTop: 10, maxWidth: 220 }}>
                  <span>Result</span>
                  <select
                    value={matches.find((m) => m.id === selectedMatchId)?.result || "In Progress"}
                    onChange={(e) => updateMatchResult(selectedMatchId, e.target.value)}
                  >
                    {RESULTS.map((r) => (
                      <option key={r} value={r}>
                        {r}
                      </option>
                    ))}
                  </select>
                </label>
              )}

              <div className="new-match-row">
                <input
                  type="text"
                  placeholder="New opponent name"
                  value={newOpponent}
                  onChange={(e) => setNewOpponent(e.target.value)}
                />
                <button type="button" onClick={createMatch}>
                  Start New Match
                </button>
              </div>
              <p className="hint">Everything you log below will be linked to the selected match.</p>
            </div>

            <div className="subtabs">
              <button className={subTab === "batting" ? "active" : ""} onClick={() => setSubTab("batting")}>
                Batting
              </button>
              <button className={subTab === "bowling" ? "active" : ""} onClick={() => setSubTab("bowling")}>
                Bowling
              </button>
              <button className={subTab === "fielding" ? "active" : ""} onClick={() => setSubTab("fielding")}>
                Fielding
              </button>
              <button className={subTab === "keeping" ? "active" : ""} onClick={() => setSubTab("keeping")}>
                Keeping
              </button>
            </div>

            {subTab === "batting" && (
              <div className="card">
                <h2>New Batting Innings</h2>
                <div className="grid">
                  <NumberField label="Runs" value={draftBat.runs} onChange={(v) => setDraftBat({ ...draftBat, runs: v })} />
                  <NumberField label="Balls faced" value={draftBat.ballsFaced} onChange={(v) => setDraftBat({ ...draftBat, ballsFaced: v })} />
                  <NumberField label="Dot balls" value={draftBat.dots} onChange={(v) => setDraftBat({ ...draftBat, dots: v })} />
                  <NumberField label="1s" value={draftBat.singles} onChange={(v) => setDraftBat({ ...draftBat, singles: v })} />
                  <NumberField label="2s" value={draftBat.twos} onChange={(v) => setDraftBat({ ...draftBat, twos: v })} />
                  <NumberField label="3s" value={draftBat.threes} onChange={(v) => setDraftBat({ ...draftBat, threes: v })} />
                  <NumberField label="4s" value={draftBat.fours} onChange={(v) => setDraftBat({ ...draftBat, fours: v })} />
                  <NumberField label="6s" value={draftBat.sixes} onChange={(v) => setDraftBat({ ...draftBat, sixes: v })} />
                </div>

                <label className="checkbox-row">
                  <input
                    type="checkbox"
                    checked={draftBat.dismissed}
                    onChange={(e) => setDraftBat({ ...draftBat, dismissed: e.target.checked })}
                  />
                  <span>Got out this innings</span>
                </label>

                {draftBat.dismissed && (
                  <label className="field" style={{ marginTop: 12, maxWidth: 220 }}>
                    <span>How out</span>
                    <select
                      value={draftBat.dismissalType}
                      onChange={(e) => setDraftBat({ ...draftBat, dismissalType: e.target.value })}
                    >
                      {DISMISSAL_TYPES.map((d) => (
                        <option key={d} value={d}>
                          {d}
                        </option>
                      ))}
                    </select>
                  </label>
                )}

                <h3>Runs vs bowling type</h3>
                <div className="grid">
                  <NumberField label="Runs vs Spin" value={draftBat.runsVsSpin} onChange={(v) => setDraftBat({ ...draftBat, runsVsSpin: v })} />
                  <NumberField label="Balls vs Spin" value={draftBat.ballsVsSpin} onChange={(v) => setDraftBat({ ...draftBat, ballsVsSpin: v })} />
                  <NumberField label="Runs vs Pace" value={draftBat.runsVsPace} onChange={(v) => setDraftBat({ ...draftBat, runsVsPace: v })} />
                  <NumberField label="Balls vs Pace" value={draftBat.ballsVsPace} onChange={(v) => setDraftBat({ ...draftBat, ballsVsPace: v })} />
                </div>

                <h3>Where did your runs come from?</h3>
                <FieldDiagram
                  values={draftBat.zoneRuns}
                  onAdd={(zone, amt) => addZoneRun(draftBat, setDraftBat, zone, amt)}
                  onReset={(zone) => resetZoneRun(draftBat, setDraftBat, zone)}
                />

                <button className="save-btn" onClick={saveBatEntry}>
                  Save Innings
                </button>

                {battingEntries.length > 0 && (
                  <div className="entry-list">
                    <h3>Logged innings ({battingEntries.length})</h3>
                    {battingEntries.map((e) => (
                      <div className="entry-row" key={e.id}>
                        <span>
                          {e.runs} runs ({e.ballsFaced} balls){e.dismissed ? "" : " *"}
                          {opponentFor(e.matchId) && ` vs ${opponentFor(e.matchId)}`}
                        </span>
                        <button onClick={() => deleteBat(e.id)}>Remove</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {subTab === "bowling" && (
              <div className="card">
                <h2>New Bowling Spell</h2>
                <div className="grid">
                  <NumberField label="Balls bowled" value={draftBowl.ballsBowled} onChange={(v) => setDraftBowl({ ...draftBowl, ballsBowled: v })} />
                  <NumberField label="Dot balls" value={draftBowl.dots} onChange={(v) => setDraftBowl({ ...draftBowl, dots: v })} />
                  <NumberField label="Runs conceded" value={draftBowl.runsConceded} onChange={(v) => setDraftBowl({ ...draftBowl, runsConceded: v })} />
                  <NumberField label="Wides" value={draftBowl.wides} onChange={(v) => setDraftBowl({ ...draftBowl, wides: v })} />
                  <NumberField label="No balls" value={draftBowl.noBalls} onChange={(v) => setDraftBowl({ ...draftBowl, noBalls: v })} />
                  <NumberField label="4s conceded" value={draftBowl.fours} onChange={(v) => setDraftBowl({ ...draftBowl, fours: v })} />
                  <NumberField label="6s conceded" value={draftBowl.sixes} onChange={(v) => setDraftBowl({ ...draftBowl, sixes: v })} />
                </div>

                <h3>Wickets (how out)</h3>
                <div className="grid">
                  <NumberField label="Bowled" value={draftBowl.wicketsBowled} onChange={(v) => setDraftBowl({ ...draftBowl, wicketsBowled: v })} />
                  <NumberField label="LBW" value={draftBowl.wicketsLBW} onChange={(v) => setDraftBowl({ ...draftBowl, wicketsLBW: v })} />
                  <NumberField label="Caught" value={draftBowl.wicketsCaught} onChange={(v) => setDraftBowl({ ...draftBowl, wicketsCaught: v })} />
                  <NumberField label="Stumped" value={draftBowl.wicketsStumped} onChange={(v) => setDraftBowl({ ...draftBowl, wicketsStumped: v })} />
                  <NumberField label="Run Out" value={draftBowl.wicketsRunOut} onChange={(v) => setDraftBowl({ ...draftBowl, wicketsRunOut: v })} />
                </div>

                <h3>Where were runs scored off you?</h3>
                <FieldDiagram
                  values={draftBowl.zoneRuns}
                  onAdd={(zone, amt) => addZoneRun(draftBowl, setDraftBowl, zone, amt)}
                  onReset={(zone) => resetZoneRun(draftBowl, setDraftBowl, zone)}
                />

                <button className="save-btn" onClick={saveBowlEntry}>
                  Save Spell
                </button>

                {bowlingEntries.length > 0 && (
                  <div className="entry-list">
                    <h3>Logged spells ({bowlingEntries.length})</h3>
                    {bowlingEntries.map((e) => (
                      <div className="entry-row" key={e.id}>
                        <span>
                          {totalWickets(e)}/{e.runsConceded} ({Math.floor(e.ballsBowled / 6)}.{e.ballsBowled % 6} ov)
                          {opponentFor(e.matchId) && ` vs ${opponentFor(e.matchId)}`}
                        </span>
                        <button onClick={() => deleteBowl(e.id)}>Remove</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {subTab === "fielding" && (
              <div className="card">
                <h2>New Fielding Entry</h2>
                <FieldPositionPicker value={draftField.position} onChange={(p) => setDraftField({ ...draftField, position: p })} />
                <div className="grid" style={{ marginTop: 14 }}>
                  <NumberField label="Catches" value={draftField.catches} onChange={(v) => setDraftField({ ...draftField, catches: v })} />
                  <NumberField label="Dropped" value={draftField.dropped} onChange={(v) => setDraftField({ ...draftField, dropped: v })} />
                  <NumberField label="Run outs" value={draftField.runOuts} onChange={(v) => setDraftField({ ...draftField, runOuts: v })} />
                  <NumberField label="Good stops" value={draftField.goodStops} onChange={(v) => setDraftField({ ...draftField, goodStops: v })} />
                  <NumberField label="Misfields" value={draftField.misfields} onChange={(v) => setDraftField({ ...draftField, misfields: v })} />
                </div>

                <button className="save-btn" onClick={saveFieldEntry}>
                  Save Fielding Entry
                </button>

                {fieldingEntries.length > 0 && (
                  <div className="entry-list">
                    <h3>Logged entries ({fieldingEntries.length})</h3>
                    {fieldingEntries.map((e) => (
                      <div className="entry-row" key={e.id}>
                        <span>
                          {e.position}: {e.catches}c {e.dropped}dr {e.runOuts}ro
                          {opponentFor(e.matchId) && ` vs ${opponentFor(e.matchId)}`}
                        </span>
                        <button onClick={() => deleteField(e.id)}>Remove</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {subTab === "keeping" && (
              <div className="card">
                <h2>New Wicketkeeping Entry</h2>
                <div className="grid">
                  <NumberField label="Catches" value={draftKeep.catches} onChange={(v) => setDraftKeep({ ...draftKeep, catches: v })} />
                  <NumberField label="Stumpings" value={draftKeep.stumpings} onChange={(v) => setDraftKeep({ ...draftKeep, stumpings: v })} />
                  <NumberField label="Run outs" value={draftKeep.runOuts} onChange={(v) => setDraftKeep({ ...draftKeep, runOuts: v })} />
                  <NumberField label="Dropped" value={draftKeep.dropped} onChange={(v) => setDraftKeep({ ...draftKeep, dropped: v })} />
                  <NumberField label="Byes (leg side)" value={draftKeep.byesLegSide} onChange={(v) => setDraftKeep({ ...draftKeep, byesLegSide: v })} />
                  <NumberField label="Byes (off side)" value={draftKeep.byesOffSide} onChange={(v) => setDraftKeep({ ...draftKeep, byesOffSide: v })} />
                </div>

                <button className="save-btn" onClick={saveKeepEntry}>
                  Save Keeping Entry
                </button>

                {keepingEntries.length > 0 && (
                  <div className="entry-list">
                    <h3>Logged entries ({keepingEntries.length})</h3>
                    {keepingEntries.map((e) => (
                      <div className="entry-row" key={e.id}>
                        <span>
                          {e.catches}c {e.stumpings}st, {e.byesLegSide + e.byesOffSide} byes
                          {opponentFor(e.matchId) && ` vs ${opponentFor(e.matchId)}`}
                        </span>
                        <button onClick={() => deleteKeep(e.id)}>Remove</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </section>
        )}

        {tab === "analysis" && (
          <section>
            {!battingAnalysis && !bowlingAnalysis && !fieldingAnalysis && !keepingAnalysis && (
              <div className="empty">Log some stats first — analysis appears here once you have data.</div>
            )}

            {matches.length > 0 && (
              <div className="card">
                <h2>Matches</h2>
                {matches.map((m) => {
                  const bats = battingEntries.filter((e) => e.matchId === m.id);
                  const bowls = bowlingEntries.filter((e) => e.matchId === m.id);
                  const fields = fieldingEntries.filter((e) => e.matchId === m.id);
                  const keeps = keepingEntries.filter((e) => e.matchId === m.id);
                  const runs = bats.reduce((s, e) => s + Number(e.runs), 0);
                  const wkts = bowls.reduce((s, e) => s + totalWickets(e), 0);
                  const catches = fields.reduce((s, e) => s + Number(e.catches || 0), 0) + keeps.reduce((s, e) => s + Number(e.catches || 0), 0);
                  return (
                    <div className="match-row" key={m.id}>
                      <div>
                        <strong>{m.opponent || "Unnamed"}</strong>
                        <span className="match-result"> — {m.result}</span>
                      </div>
                      <div className="hint">
                        {runs} runs · {wkts} wickets · {catches} catches
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {battingAnalysis && (
              <div className="card">
                <h2>Batting Analysis</h2>
                <div className="stat-row">
                  <Stat label="Runs" value={battingAnalysis.totals.runs} />
                  <Stat label="Average" value={battingAnalysis.average} />
                  <Stat label="Strike Rate" value={battingAnalysis.strikeRate} />
                  <Stat label="Dot %" value={`${battingAnalysis.dotPct}%`} />
                  <Stat label="Boundary %" value={`${battingAnalysis.boundaryPct}%`} />
                </div>
                {(battingAnalysis.srVsSpin !== null || battingAnalysis.srVsPace !== null) && (
                  <div className="stat-row" style={{ gridTemplateColumns: "repeat(2, 1fr)" }}>
                    <Stat label="SR vs Spin" value={battingAnalysis.srVsSpin ?? "-"} />
                    <Stat label="SR vs Pace" value={battingAnalysis.srVsPace ?? "-"} />
                  </div>
                )}

                <h3>Runs by zone</h3>
                <div className="bar-chart">
                  {ZONES.map((z) => (
                    <div className="bar-row" key={z}>
                      <span className="bar-label">{z}</span>
                      <div className="bar-track">
                        <div
                          className="bar-fill"
                          style={{ width: `${(battingAnalysis.zoneTotals[z] / zoneMax) * 100}%` }}
                        />
                      </div>
                      <span className="bar-value">{battingAnalysis.zoneTotals[z]}</span>
                    </div>
                  ))}
                </div>

                <div className="verdict">
                  {battingAnalysis.good.length > 0 && (
                    <div className="good">
                      <h4>What's going well</h4>
                      <ul>
                        {battingAnalysis.good.map((g, i) => (
                          <li key={i}>{g}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {battingAnalysis.bad.length > 0 && (
                    <div className="bad">
                      <h4>What to work on</h4>
                      <ul>
                        {battingAnalysis.bad.map((b, i) => (
                          <li key={i}>{b}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </div>
            )}

            {bowlingAnalysis && (
              <div className="card">
                <h2>Bowling Analysis</h2>
                <div className="stat-row">
                  <Stat label="Wickets" value={bowlingAnalysis.totals.wickets} />
                  <Stat label="Overs" value={bowlingAnalysis.overs} />
                  <Stat label="Economy" value={bowlingAnalysis.economy} />
                  <Stat label="Dot %" value={`${bowlingAnalysis.dotPct}%`} />
                  <Stat label="Strike Rate" value={bowlingAnalysis.strikeRate} />
                </div>

                <h3>Runs conceded by zone</h3>
                <div className="bar-chart">
                  {ZONES.map((z) => (
                    <div className="bar-row" key={z}>
                      <span className="bar-label">{z}</span>
                      <div className="bar-track">
                        <div
                          className="bar-fill"
                          style={{ width: `${(bowlingAnalysis.zoneTotals[z] / bowlZoneMax) * 100}%` }}
                        />
                      </div>
                      <span className="bar-value">{bowlingAnalysis.zoneTotals[z]}</span>
                    </div>
                  ))}
                </div>

                <div className="verdict">
                  {bowlingAnalysis.good.length > 0 && (
                    <div className="good">
                      <h4>What's going well</h4>
                      <ul>
                        {bowlingAnalysis.good.map((g, i) => (
                          <li key={i}>{g}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {bowlingAnalysis.bad.length > 0 && (
                    <div className="bad">
                      <h4>What to work on</h4>
                      <ul>
                        {bowlingAnalysis.bad.map((b, i) => (
                          <li key={i}>{b}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </div>
            )}

            {fieldingAnalysis && (
              <div className="card">
                <h2>Fielding Analysis</h2>
                <div className="stat-row">
                  <Stat label="Catches" value={fieldingAnalysis.totals.catches} />
                  <Stat label="Dropped" value={fieldingAnalysis.totals.dropped} />
                  <Stat label="Run Outs" value={fieldingAnalysis.totals.runOuts} />
                  <Stat label="Good Stops" value={fieldingAnalysis.totals.goodStops} />
                  <Stat label="Catch %" value={fieldingAnalysis.catchConversion !== null ? `${fieldingAnalysis.catchConversion}%` : "-"} />
                </div>
                <div className="verdict">
                  {fieldingAnalysis.good.length > 0 && (
                    <div className="good">
                      <h4>What's going well</h4>
                      <ul>
                        {fieldingAnalysis.good.map((g, i) => (
                          <li key={i}>{g}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {fieldingAnalysis.bad.length > 0 && (
                    <div className="bad">
                      <h4>What to work on</h4>
                      <ul>
                        {fieldingAnalysis.bad.map((b, i) => (
                          <li key={i}>{b}</li>
                        ))}

              </div>
            )}

                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </div>
            )}
          </section>
        )}

        {tab === "goals" && (
          <section>
            <div className="card">
              <h2>Set a Goal</h2>
              <div className="grid">
                <label className="field">
                  <span>Category</span>
                  <select
                    value={draftGoal.category}
                    onChange={(e) => {
                      const cat = e.target.value;
                      setDraftGoal({ ...draftGoal, category: cat, metric: GOAL_CONFIG[cat][0].key });
                    }}
                  >
                    {Object.keys(GOAL_CONFIG).map((c) => (
                      <option key={c} value={c}>
                        {c}
                      </option>
                    ))}
                  </select>
                </label>
                <label className="field">
                  <span>Metric</span>
                  <select value={draftGoal.metric} onChange={(e) => setDraftGoal({ ...draftGoal, metric: e.target.value })}>
                    {GOAL_CONFIG[draftGoal.category].map((m) => (
                      <option key={m.key} value={m.key}>
                        {m.label}
                      </option>
                    ))}
                  </select>
                </label>
                <label className="field">
                  <span>Direction</span>
                  <select value={draftGoal.direction} onChange={(e) => setDraftGoal({ ...draftGoal, direction: e.target.value })}>
                    <option value="above">Reach or go above</option>
                    <option value="below">Reach or go below</option>
                  </select>
                </label>
                <NumberField label="Target value" value={draftGoal.target} onChange={(v) => setDraftGoal({ ...draftGoal, target: v })} />
              </div>
              <button className="save-btn" onClick={addGoal}>
                Add Goal
              </button>

              {goals.length > 0 && (
                <div className="entry-list">
                  <h3>Your Goals</h3>
                  {goals.map((g) => {
                    const config = GOAL_CONFIG[g.category].find((m) => m.key === g.metric);
                    const current = config ? config.get(analysisByCategory[g.category]) : null;
                    const met = current !== null ? (g.direction === "above" ? current >= g.target : current <= g.target) : null;
                    return (
                      <div className="entry-row goal-row" key={g.id}>
                        <span>
                          {g.category} — {config ? config.label : g.metric} {g.direction === "above" ? "≥" : "≤"} {g.target}
                          <br />
                          <span className={met === null ? "hint" : met ? "goal-met" : "goal-not-met"}>
                            {current === null ? "No data yet" : `Current: ${current} ${met ? "— Goal met!" : "— Not there yet"}`}
                          </span>
                        </span>
                        <button onClick={() => deleteGoal(g.id)}>Remove</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div className="card">
              <h2>Personal Trackers</h2>
              <p className="hint">Track anything — fitness times, gym sessions, throw distance, whatever you want.</p>
              <div className="new-match-row">
                <input type="text" placeholder="Tracker name" value={newTrackerName} onChange={(e) => setNewTrackerName(e.target.value)} />
                <input
                  type="text"
                  placeholder="Unit (optional)"
                  value={newTrackerUnit}
                  onChange={(e) => setNewTrackerUnit(e.target.value)}
                  style={{ maxWidth: 90 }}
                />
                <button type="button" onClick={createTracker}>
                  Add Tracker
                </button>
              </div>
            </div>

            {trackers.map((t) => (
              <TrackerCard
                key={t.id}
                tracker={t}
                entries={trackerEntries.filter((e) => e.trackerId === t.id)}
                onLog={(value) => logTrackerEntry(t.id, value)}
                onDeleteEntry={deleteTrackerEntry}
                onDeleteTracker={() => deleteTracker(t.id)}
              />
            ))}
          </section>
        )}

        {tab === "tips" && (
          <section>
            {activeTips.length === 0 && (
              <div className="empty">
                No specific drills flagged yet — log a few innings or spells so the analysis can spot patterns to work on.
              </div>
            )}
            {activeTips.map((tip, i) => (
              <div className="card" key={i}>
                <h2>{tip.title}</h2>
                <ul className="drills">
                  {tip.drills.map((d, j) => (
                    <li key={j}>{d}</li>
                  ))}
                </ul>
              </div>
            ))}
          </section>
        )}
      </main>
    </div>
  );
}
